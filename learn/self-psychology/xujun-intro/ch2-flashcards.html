<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>徐钧《自体心理学入门》· 第二章 知识闪卡</title>
<style>
  :root{
    --bg:#f6f5f1; --ink:#2c2c2a; --muted:#888780; --line:#e3e1d8; --card:#fff;
    --blue:#3b6ea5; --amber:#b07b23; --red:#b4493f; --green:#2f7d6b; --brown:#9a6b3f;
    --shadow:0 2px 16px rgba(0,0,0,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{min-height:58px;padding:8px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:#fff;flex-wrap:wrap}
  header h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
  header .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:430px}
  header .right{margin-left:auto;display:flex;gap:6px;align-items:center}
  button.b{font-size:12px;padding:6px 11px;border:1px solid #d6d4ca;background:#fff;border-radius:7px;cursor:pointer;color:var(--ink);white-space:nowrap}
  button.b:hover{background:#f0eee6}
  button.b.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .fbar{padding:9px 16px;border-bottom:1px solid var(--line);background:#fbfaf7;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .fbar label{font-size:12px;color:var(--muted)}
  select{font-size:12px;padding:6px 8px;border:1px solid #d6d4ca;border-radius:7px;background:#fff;color:var(--ink)}
  .chk{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;background:#fff;border:1px solid #d6d4ca;border-radius:7px;padding:6px 9px;white-space:nowrap}
  .chk input{margin:0}
  .chips{display:flex;gap:5px;padding:8px 16px 2px;flex-wrap:wrap;max-height:74px;overflow:auto}
  .chip{font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:#b9b5a7}
  .chip.on{color:#fff;border-color:transparent;font-weight:600}
  .chip i{font-style:normal;opacity:.75;margin-left:4px}
  .stats{padding:8px 18px 2px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .track{flex:1;min-width:120px;height:7px;border-radius:5px;background:#e7e5dc;overflow:hidden}
  .track i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
  .cardArea{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 18px 4px;min-height:0}
  .card{width:100%;max-width:780px;height:100%;max-height:440px;min-height:280px;perspective:1400px;cursor:pointer}
  .inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:20px 26px;display:flex;flex-direction:column;overflow:auto}
  .face.back{transform:rotateY(180deg)}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{font-size:11px;padding:4px 10px;border-radius:20px;color:#fff;background:var(--cc,#3b6ea5);letter-spacing:.3px}
  .idx{font-size:11px;color:var(--muted);margin-left:auto}
  .q{font-size:19px;line-height:1.65;font-weight:600;margin:18px 0 8px;white-space:pre-wrap}
  .q.big{font-size:16px;font-weight:500;line-height:1.8}
  .ctx{font-size:11.5px;line-height:1.6;color:#7a5a34;background:#f8f2e7;border:1px solid #ecdfc6;border-radius:7px;padding:5px 10px;margin:14px 0 -4px}
  .introBody{background:#faf8f2;border:1px solid #eae5d7;border-radius:10px;padding:12px 16px;margin:10px 0 8px;font-size:14px;line-height:1.85;overflow:auto;max-height:230px}
  .introBody p{margin:0 0 8px}
  .introBody p:last-child{margin-bottom:0}
  .introHint{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:4px}
  .badge.introBadge{background:#8a6a3e}
  .src{font-size:11px;color:var(--muted);margin-top:auto;padding-top:12px;border-top:1px dashed var(--line)}
  textarea{width:100%;min-height:96px;flex:1;border:1px dashed #cfccc1;border-radius:9px;background:#fbfaf7;padding:11px 13px;font-size:14px;line-height:1.7;font-family:inherit;color:var(--ink);resize:none;outline:none}
  textarea:focus{border-color:var(--blue);background:#fff}
  .aList{font-size:14.5px;line-height:1.85;margin:12px 0 4px;padding-left:0;list-style:none;white-space:pre-wrap}
  .aList li{margin-bottom:8px;padding-left:16px;position:relative}
  .aList li:before{content:"";position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--cc,#3b6ea5)}
  .mine{background:#f7f5ef;border:1px dashed #d6d4ca;border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;margin-top:8px;max-height:110px;overflow:auto}
  .mine b{color:var(--muted);font-weight:500;font-size:11px;display:block;margin-bottom:4px}
  .hit{font-size:12px;color:var(--green);margin-top:6px}
  .kw{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.6}
  .kw span{display:inline-block;background:#f1efe8;border-radius:5px;padding:1px 7px;margin:2px 4px 0 0}
  .controls{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px 12px;flex-wrap:wrap}
  .controls .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
  .controls .rate{font-size:12px;padding:7px 13px;border-radius:8px;border:1px solid #d6d4ca;background:#fff;cursor:pointer;color:var(--ink)}
  .controls .rate:hover{background:#f0eee6}
  .controls .rate.r1{border-color:#e2b6b1;color:var(--red)}
  .controls .rate.r2{border-color:#e1cf9f;color:var(--amber)}
  .controls .rate.r3{border-color:#aed3c8;color:var(--green)}
  .foot{font-size:11px;color:var(--muted);text-align:center;padding:0 16px 9px}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}
  #printArea{display:none}
  @media print{
    html,body{height:auto;overflow:visible;background:#fff}
    body>*:not(#printArea){display:none !important}
    #printArea{display:block !important;padding:0}
    #printArea h2{font-size:16px;margin:0 0 6px}
    #printArea .meta{font-size:11px;color:#666;margin-bottom:14px}
    #printArea .item{border-bottom:1px solid #ddd;padding:8px 0;page-break-inside:avoid}
    #printArea .item .qq{font-size:13px;font-weight:600}
    #printArea .item .aa{font-size:12px;line-height:1.6;color:#333;margin-top:3px}
    #printArea .item .ss{font-size:10px;color:#888;margin-top:3px}
  }
  @media (max-width:640px){
    header .sub{display:none}
    .q{font-size:17px}
    .face{padding:16px 18px}
    .card{max-height:none}
  }

/* === 个人学习分站 · 顶部返回条（部署时注入，打印时隐藏） === */
.xjLearnBar{background:#115e59;color:#fff;padding:7px 16px;display:flex;gap:7px;
  flex-wrap:wrap;align-items:center;font:12.5px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  position:relative;z-index:99}
.xjLearnBar a{color:#d9f4ee;text-decoration:none;white-space:nowrap}
.xjLearnBar a:hover{text-decoration:underline}
.xjLearnBar .xjSep{opacity:.55}
.xjLearnBar .xjHere{opacity:.8;white-space:nowrap}
@media print{.xjLearnBar{display:none!important}}

</style>

const CATS = [{"k":"def","label":"概念定义","color":"#3b6ea5","note":"原书明确给出的术语界定"},{"k":"s1","label":"§1 精神现实与体验过程","color":"#9a6b3f","note":"科胡特对精神分析临床的贡献"},{"k":"s2","label":"§2 共情是什么","color":"#7356a3","note":"译名、源流、巴施案例、定义"},{"k":"s3","label":"§3 共情的争议","color":"#b4493f","note":"与罗杰斯的分野、疗效、中性"},{"k":"s4","label":"§4 收集资料","color":"#b07b23","note":"资料的性质与方法的两面性"},{"k":"s5","label":"§5 心理功能的发展","color":"#2f7d6b","note":"替代性内省、自体客体经验、自体感"},{"k":"s6","label":"§6 以攻击形式为例","color":"#3b6ea5","note":"形式≠内涵、经验贴近→远离、高频低频"},{"k":"case","label":"案例速查","color":"#7356a3","note":"由案例反查其所说明的概念"},{"k":"disc","label":"关键辨析","color":"#b4493f","note":"易混说法与原文界定"},{"k":"term","label":"术语英中","color":"#2f7d6b","note":"英中对照（含反向；学习辅助，英文写法据通用译名，非原书逐字给出）"},{"k":"cloze","label":"背诵填空","color":"#b07b23","note":"原文金句填空"}];
const CARDS = [{"id":"k001","sid":"88e3d162dc","cat":"def","q":"「精神现实（心理现实）」在原文中如何界定？","a":["来访者是带着他独有的经验和精神体验来咨询的，这些经验和体验正是他在咨询中想要阐述的。","咨询师尽管自身持有日常的、普遍的现实标准，但在倾听来访者陈述时，不能抛开来访者的精神现实体验来理解其所叙述的事情；否则陈述的内容就会被误解。"],"k":["独有的经验","不能抛开","主观"],"src":"§1 精神现实","refs":[]},{"id":"k002","sid":"00dfc7315c","cat":"def","q":"「成熟的道德主义」的定义是什么？","a":["成人或心理咨询师依据自身所秉持的一般现实标准，对儿童或来访者形成过于主观且缺乏共情的看法。"],"k":["一般现实标准","过于主观","缺乏共情"],"src":"§1 定义段","refs":[]},{"id":"k003","sid":"7ce13f7347","cat":"def","q":"「成熟的道德主义」这一概念的提出标志着什么？","a":["标志着科胡特在精神分析临床中强调重视来访者的主观现实和精神现实的重要开端。"],"k":["重要开端","主观现实"],"src":"§1 定义段","refs":[]},{"id":"k004","sid":"a8497cc556","cat":"def","q":"「共情（empathy）」在不同语境中有哪些译名？","a":["一般译作「共情」；也被译为「共感」「同理」或「同理心」。","在教育学中有时被译为「移情」；在中国台湾地区出版的自体心理学著作中则会译为「神入」。","科胡特所说的共情和一般心理咨询中的共情有很大的差别。"],"k":["共感","同理心","神入","移情"],"src":"§2 共情是什么","refs":[]},{"id":"k005","sid":"d2ae3122b8","cat":"def","q":"「内省-共情」的原文定义是什么？","a":["分析家或者咨询师在倾听来访者的时候，其内心出现的视觉性、感受性等多种状态。","即咨询师把来访者主观陈述的内容，在自己的精神世界中加以呈现。","或者如科胡特所说：咨询师让自己「浸泡」在来访者的精神现实体验中，使来访者所陈述的精神现实同样在自己的内心过程中展开。"],"k":["视觉性","感受性","浸泡"],"src":"§2 定义段","refs":[]},{"id":"k006","sid":"ed35d9ae18","cat":"def","q":"「共情-反馈技术／共情性技术」指什么？","a":["受卡尔·罗杰斯影响的训练方式：来访者说一句，咨询师回应一句，把来访者的感受再表达一遍；这种回馈方式被称为共情性技术。","在当代自体心理学中，把这种回馈方式称为共情-反馈技术。"],"k":["罗杰斯","说一句回应一句","反馈"],"src":"§3 争议","refs":[]},{"id":"k007","sid":"e5b6b7ce13","cat":"def","q":"「内省性倾听」指什么？","a":["「内省性倾听」是对「内省-共情」这一内部过程的另一种称法。","即一个人在自己的精神世界中，以一种内省的方法去倾听另一个人陈述中的主观现实。"],"k":["内部过程","内省的方法","主观现实"],"src":"§3 争议","refs":[]},{"id":"k008","sid":"08857d9370","cat":"def","q":"「替代性内省」的定义？","a":["科胡特认为共情在某种意义上具有替代性内省的功能。","所谓替代性内省，是指当我们理解另一个人的精神世界时，实际上是逐渐站在那个人的立场上，去体验他的精神世界。"],"k":["站在立场","体验精神世界"],"src":"§5 心理功能的发展","refs":[]},{"id":"k009","sid":"f88ed17e53","cat":"def","q":"「自体客体经验」指什么？","a":["被深度理解的体验。","在巴施案例中，科胡特第二句话精确说出了巴施的感觉，巴施觉得自己被深度理解了——这种体验即自体客体经验。"],"k":["被深度理解","巴施","第二句"],"src":"§5 巴施案例","ctx":"【案例五 · 巴施与科胡特的两句话】就本例情节提问","refs":[]},{"id":"k010","sid":"1f1e12b46e","cat":"def","q":"「自体感」在原文中怎样描述？","a":["自体感是一个十分重要的功能。","在巴施案例中，科胡特的回应增强了他的心理功能：获得一种自信心，一种坚持、坚定的自体感，让他觉得自己是正确的，内心受到鼓舞。","一个人经历一些事情之后，再和别人互动或发表自己的观点时会更自信，因为他的自体感增强了。"],"k":["自信心","坚持坚定","心理功能"],"src":"§5 心理功能的发展","refs":[]},{"id":"k011","sid":"4cb57736e2","cat":"def","q":"「经验贴近（体验贴近）」与「经验远离」各指什么？","a":["经验贴近／体验贴近：当一幕幕情境在我们脑海中浮现时，这种内省-共情的过程。","经验远离：把我们听到的东西概念化，形成语言并表达出来，或者形成一种对来访者情感过程的理解并表现出来。"],"k":["情境浮现","概念化","形成语言"],"src":"§6 经验贴近与远离","refs":[]},{"id":"k012","sid":"19129e5918","cat":"def","q":"「面质」是什么？面对讲创伤时带笑的来访者，为什么不宜面质？","a":["面质（confrontation）是心理咨询的一种技术。","此时不宜面质对方「为什么你在讲这么悲惨的事情时却在笑？」，而要尝试理解笑容不是真正的开心，其背后有其他内涵和意义。"],"k":["confrontation","技术","不宜面质"],"src":"§6 笑容例","ctx":"【案例十一 · 讲创伤时满面笑容】就本例情节提问","refs":[]},{"id":"案01","sid":"69168e1308","cat":"s1","q":"案例一 · 追求女同学受创伤｜先读情节","a":["来访者对咨询师说，自己在追求一位女同学的时候受到了创伤。","咨询师听完却觉得他生活中似乎并没有受创伤：他只是暗恋对方；对方是学生会干部，和所有同学关系都不错，经常鼓励大家一起参加学生会活动，对他并没有特别的关注。","是他主动表白、希望做男女朋友，对方直到大学毕业都没有接受，毕业后就离开了。女生离开后，来访者感到很绝望，觉得自己的感情被「玩弄」，认定自己受了严重创伤。","原书借这个案例提出：来访者对自己经历的切身感受，与旁人听陈述后产生的感受，往往是有区别的。"],"k":["暗恋","学生会干部","表白未被接受","被玩弄"],"src":"§1 案例一","intro":1,"case":"一","follow":"后面 3 张卡围绕本案例（旁观者看到的事实／只调认知会怎样／连锁后果）。","refs":["案01"]},{"id":"k013","sid":"f9432e0dd8","cat":"s1","q":"「追求女同学受创伤」案例：咨询师从旁观者立场看到的事实是什么？","a":["来访者只是暗恋对方，对方并没有做什么伤害他的事情。","对方是学生会干部，和所有同学关系都不错，经常鼓励大家一起参加学生会活动，对来访者并没有特别的关注。","来访者主动表白、希望做男女朋友，对方直到大学毕业都没有接受，毕业后就离开；女生离开后，来访者感到很绝望，觉得自己的感情被「玩弄」了，认为自己受到了严重的创伤。"],"k":["暗恋","学生会干部","玩弄"],"src":"§1 案例一","ctx":"【案例一 · 追求女同学受创伤】就本例情节提问","refs":["案01"]},{"id":"k014","sid":"c41f316d1e","cat":"s1","q":"在这个案例里，如果咨询师只是帮来访者调整认知观念，会怎样？","a":["来访者还是会坚持认为自己受到了严重的创伤。","这就涉及临床中一个重要问题：来访者对自己经历的切身感受，和旁人听来访者陈述后所产生的感受，往往是有区别的。"],"k":["调整认知","坚持","有区别"],"src":"§1 案例一","ctx":"【案例一 · 追求女同学受创伤】由本例引出的一般规律／论断","refs":["案01"]},{"id":"k015","sid":"71b72fbba9","cat":"s1","q":"咨询师站在「一般旁观者」位置，会引发怎样的连锁后果？","a":["可以客观地观察、体验这件事情，但以这种态度去理解来访者，显然并未关注来访者的精神现实。","自然就会觉得来访者的事情并没那么严重。","继而陷入困境——无法理解来访者为什么会这么痛苦，无法发展出理解性的咨访关系。"],"k":["未关注精神现实","没那么严重","无法理解"],"src":"§1 案例一","ctx":"【案例一 · 追求女同学受创伤】由本例引出的一般规律／论断","refs":["案01"]},{"id":"案02","sid":"0a7c9f0283","cat":"s1","q":"案例二 · 三四岁孩子说去了月球／星星｜先读情节","a":["一个三四岁的孩子对妈妈说：「妈妈，我昨天到月球上去了，我昨天晚上到星星上去玩了。」","妈妈回答：「撒谎，这么小就学会撒谎了！」","原书说这不是谁对谁错的问题，是母子「频道」不一致：妈妈说的是孩子不可能真的到星星、月亮上去，孩子说的是他在幻想的精神现实中到星星、月亮上去了。","由此引出 0～6 岁孩子不能清楚区分现实与幻想（这种混淆是很活跃、很健康的发展），以及「成熟的道德主义」这一概念。"],"k":["三四岁","撒谎","频道不一致","幻想的精神现实"],"src":"§1 案例二","intro":1,"case":"二","follow":"后面 3 张卡围绕本案例（频道不一致／0～6 岁的一般判断／被判定撒谎的体验）。","refs":["案02"]},{"id":"k016","sid":"7ce4abe8b2","cat":"s1","q":"「三四岁孩子到月球／星星上玩」的例子说明了什么？","a":["其实这不是对错的问题，是妈妈和孩子的「频道」不一致。","妈妈说孩子撒谎，意思是孩子不可能到星星、月亮上去；而孩子表达的是他在幻想的精神现实中到星星、月亮上去了。","妈妈说孩子说谎，是站在成人的角度去理解孩子的行为；这位妈妈认为孩子撒谎的看法，其实是很主观的。"],"k":["频道不一致","幻想的精神现实","成人角度"],"src":"§1 案例二","ctx":"【案例二 · 三四岁孩子说去了月球／星星】由本例引出的一般规律／论断","refs":["案02"]},{"id":"k017","sid":"5fd0026cfa","cat":"s1","q":"关于 0～6 岁孩子区分现实与幻想，原文的判断是什么？","a":["0～6 岁的孩子不能很清楚地区分现实和幻想。","这种现实和幻想混淆的体验，实际上是很活跃、很健康的一种发展。"],"k":["0～6 岁","很健康"],"src":"§1 案例二","ctx":"【案例二 · 三四岁孩子说去了月球／星星】由本例引出的一般规律／论断","refs":["案02"]},{"id":"k018","sid":"1a7c02a42b","cat":"s1","q":"被妈妈判定「撒谎」，孩子会体验到什么？","a":["会让孩子觉得很委屈，并进一步体验到「我不是一个好孩子」。"],"k":["委屈","我不是一个好孩子"],"src":"§1 案例二","ctx":"【案例二 · 三四岁孩子说去了月球／星星】就本例情节提问","refs":["案02"]},{"id":"案03","sid":"1f2bf6d793","cat":"s1","q":"案例三 · 咨询师要休假｜先读情节","a":["咨询师要去休假了，来访者说：「我不希望你去休假，你如果离开，我该怎么办？你一离开，我就觉得没有依靠了。」咨询师答：「过两周我就回来了。」","来访者追问：「那我这两周该怎么办？」咨询师说：「你可以做你感兴趣的事情。」来访者仍说：「我不知道要做什么，没有你我觉得心里面很空虚，我该怎么办？」","原书假设：如果咨询师忍不住说「休假是我的事情，和你没关系，工作时间之外我去干什么就是我的自由，你为什么要这么干扰我？」，来访者立即就会感觉很受伤。","这种回应立场就是看似现实的「成熟的道德主义」。由此引出一条一般性临床规律：来访者表达的往往不是字面意思，其暗含内容与分离焦虑、死亡焦虑或早期被抛弃等创伤经历相关。"],"k":["休假","两周怎么办","心里面很空虚","很受伤"],"src":"§1 案例三","intro":1,"case":"三","follow":"后面 3 张卡围绕本案例；其中第 2、3 张是由本例引出的一般规律，不是只针对这一次对话。","refs":["案03"]},{"id":"k019","sid":"7c5d4d70c4","cat":"s1","q":"「咨询师休假」对话中，哪一句回应属于「看似现实的成熟的道德主义」？","a":["「休假是我的事情，和你没关系，工作时间之外我去干什么就是我的自由，你为什么要这么干扰我？」","如果咨询师忍不住这样说，来访者立即就会感觉很受伤。"],"k":["休假是我的事情","自由","很受伤"],"src":"§1 案例三","ctx":"【案例三 · 咨询师要休假】就本例情节提问","refs":["案03"]},{"id":"k020","sid":"63f9c0d741","cat":"s1","q":"为什么这种看似现实的回应在临床中并不适用？","a":["因为来访者表达的往往不是字面意思。","其内心常隐藏着被压抑的、下意识的动机，而其表达则暗含一些移情性的内容。","真正需要咨询师理解的，正是这些暗含的内容。"],"k":["不是字面意思","下意识动机","移情性"],"src":"§1 案例三","ctx":"【案例三 · 咨询师要休假】由本例引出的一般规律／论断","refs":["案03"]},{"id":"k021","sid":"7a8bff50e3","cat":"s1","q":"来访者暗含的内容常与哪些主题相关？","a":["与分离焦虑、死亡焦虑相关，或者与来访者早期遭受抛弃等创伤经历相关。"],"k":["分离焦虑","死亡焦虑","抛弃"],"src":"§1 案例三","ctx":"【案例三 · 咨询师要休假】由本例引出的一般规律／论断","refs":["案03"]},{"id":"k022","sid":"43573ddbb9","cat":"s1","q":"「接纳」与「认同」的关系，原文怎么区分？","a":["这类陈述首先要被接纳，咨询才能得以继续。","接纳来访者所说的并不等同于认同来访者所说的，二者存在区别。","咨询师首先要有接纳和理解的基本态度。"],"k":["接纳","不等同于","咨询继续"],"src":"§1 收束段","refs":[]},{"id":"案04","sid":"eaabedcd60","cat":"s1","q":"案例四 · 不停攻击科胡特的来访者｜先读情节","a":["本章结尾回指第一章提到过的一位来访者：他在咨询中不停地攻击科胡特。","第二章只给了这一句回指：在对待他的方式上，科胡特选择不再拘泥于理论，而是听听他到底要讲什么。","原书用它说明「成熟的道德主义」概念的提出标志着什么——重视来访者的主观现实与精神现实，是科胡特临床工作的重要开端。"],"k":["不停攻击","不拘泥于理论","听听他要讲什么"],"src":"§1 末尾（呼应第一章）","intro":1,"case":"四","follow":"后面 1 张卡围绕本案例；完整故事在第一章，本卡只写第二章给出的这一句。","refs":["案04"]},{"id":"k023","sid":"204ee41377","cat":"s1","q":"面对第一章那位「不停攻击科胡特」的来访者，科胡特选择了什么做法？","a":["在对待他的方式上，科胡特选择不再拘泥于理论，而是听听他到底要讲什么。"],"k":["不拘泥于理论","听听他要讲什么"],"src":"§1 末尾（呼应第一章）","ctx":"【案例四 · 不停攻击科胡特的来访者】就本例情节提问","refs":["案04"]},{"id":"k024","sid":"d52cecf289","cat":"s1","q":"咨询师要用什么方法去理解来访者？落脚点在哪里？","a":["要尝试用内省-共情的方法去理解来访者。","认识到来访者所陈述的内容源自其带有主观体验的精神现实。"],"k":["内省-共情","主观体验"],"src":"§1 收束段","refs":[]},{"id":"k025","sid":"195264eaad","cat":"s2","q":"弗洛伊德对共情的界定是什么？","a":["「一条借着模仿，经由认同，通往共情的途径」。"],"k":["模仿","认同","共情"],"src":"§2 概念源流","refs":[]},{"id":"k026","sid":"5274aa863a","cat":"s2","q":"面对另一种精神生活时，原文要求以什么态度去了解？","a":["需要以能够接受任何可能性的态度去了解其内在机制。","这也可以被理解为：一个人经由对另一个人的认同，去理解他精神世界中的任何可能性。这便是弗洛伊德对共情的定义。"],"k":["接受任何可能性","内在机制","认同"],"src":"§2 文献段","refs":[]},{"id":"k027","sid":"2918b21b0e","cat":"s2","q":"科胡特在自体心理学中所指的共情，实质上是什么？","a":["实质上是内省-共情。"],"k":["内省-共情"],"src":"§2 承转段","refs":[]},{"id":"案05","sid":"d668a0152e","cat":"s2","q":"案例五 · 巴施与科胡特的两句话｜先读情节","a":["科胡特「自恋研究小组」的成员迈克尔·弗朗兹·巴施，曾在一篇论文里批评了科胡特的一个观点。当时科胡特还在世。","论文发表后，巴施非常焦虑、紧张：一方面担心科胡特对自己有看法，一方面担心接下来每个月的小组会面会尴尬。","见面时科胡特主动打招呼，感觉到他与平时不同，先说：「我看到你那篇文章了。」巴施立刻心跳加速，心想是不是闯了大祸。","科胡特接着说第二句：「你的文章所表达的观点我认真想了，这个观点虽然有待讨论，但是我知道你提出它的初衷实际上是对我的观点的关注和爱护，也是对自体心理学发展的关注，所以你的表达完全可以接受，完全可以倾听。」","巴施瞬间松了一口气。原书用这个故事引出「内省-共情」：第一句不是基于内省-共情，第二句才是。"],"k":["批评论文","焦虑紧张","我看到你那篇文章了","初衷","松了一口气"],"src":"§2 巴施案例","intro":1,"case":"五","follow":"后面 4 张卡围绕本案例情节；§5 会重访这两句话，讲它们带来的心理功能变化。","refs":["案05"]},{"id":"k028","sid":"90bbcfa614","cat":"s2","q":"论文发表后、见面之前，巴施的心情是怎样的？","a":["非常焦虑、紧张。","一方面担心科胡特对自己有看法，另一方面担心在接下来每个月的小组会面中会尴尬。"],"k":["焦虑","会面尴尬"],"src":"§2 巴施案例","ctx":"【案例五 · 巴施与科胡特的两句话】就本例情节提问","refs":["案05"]},{"id":"k029","sid":"6a4fa3d471","cat":"s2","q":"见面时科胡特的第一句话是什么？巴施反应如何？","a":["「我看到你那篇文章了。」（科胡特主动和他打招呼，感觉到巴施与平时不同。）","巴施有点儿紧张，立刻心跳加速，心想这篇文章是不是闯下了大祸。"],"k":["我看到你那篇文章了","心跳加速"],"src":"§2 巴施案例","ctx":"【案例五 · 巴施与科胡特的两句话】就本例情节提问","refs":["案05"]},{"id":"k030","sid":"965a66eea2","cat":"s2","q":"科胡特接着说的第二句话是什么？请尽量逐字复述。","a":["「你的文章所表达的观点我认真想了，这个观点虽然有待讨论，但是我知道你提出它的初衷实际上是对我的观点的关注和爱护，也是对自体心理学发展的关注，所以你的表达完全可以接受，完全可以倾听。」"],"k":["初衷","关注和爱护","完全可以倾听"],"src":"§2 巴施案例","ctx":"【案例五 · 巴施与科胡特的两句话】就本例情节提问","refs":["案05"]},{"id":"k031","sid":"8a927ed144","cat":"s2","q":"科胡特说完第二句话后，巴施的反应是什么？","a":["巴施瞬间松了一口气。"],"k":["松了一口气"],"src":"§2 巴施案例","ctx":"【案例五 · 巴施与科胡特的两句话】就本例情节提问","refs":["案05"]},{"id":"k032","sid":"f9c469b628","cat":"s2","q":"通过巴施的故事，科胡特如何引出「内省-共情」这个概念？","a":["读这个故事时向内觉察，感受头脑中是否浮现出一幕幕的画面。","这是一种以视觉性为主的内省过程，当然也可以包括听觉性和感受性成分。","科胡特把这一类心理过程称为内省-共情。"],"k":["一幕幕画面","视觉性","内省-共情"],"src":"§2 定义引出段","refs":[]},{"id":"k033","sid":"8f9e346ee1","cat":"s2","q":"「浸泡」这个比喻说明内省-共情是怎样的状态？","a":["这种状态是咨询师让自己「浸泡」在来访者的精神现实体验中，使来访者所陈述的精神现实同样在自己的内心过程中展开。"],"k":["浸泡","内心过程中展开"],"src":"§2 定义段","refs":[]},{"id":"k034","sid":"af8b410423","cat":"s3","q":"在科胡特看来，共情发生于何处？","a":["共情是发生于分析师内心的过程，并非一般心理咨询所说的共情。","科胡特说的内省-共情专指分析师心中的内部过程。"],"k":["分析师内心","内部过程"],"src":"§3 开篇","refs":[]},{"id":"案06","sid":"ecc2a897dc","cat":"s3","q":"案例六 · 罗杰斯式共情对话｜先读情节","a":["原书给出一段受卡尔·罗杰斯影响的训练式对话：来访者说「我最近觉得挺悲伤的」，咨询师回应「你最近好像经历了一些事情，我感觉你挺悲伤的」。","特点是来访者说一句、咨询师回应一句，把来访者的感受再表达一遍。","这种回馈方式被称为共情性技术；在当代自体心理学中称为共情-反馈技术。原书用它对照说明：科胡特说的共情是发生在分析师内心的过程，不是这种外显技术。"],"k":["说一句回应一句","把感受再表达一遍","共情-反馈技术"],"src":"§3 罗杰斯段","intro":1,"case":"六","follow":"后面 1 张卡要求复述这段对话示例。","refs":["案06"]},{"id":"k035","sid":"81c603118c","cat":"s3","q":"举出「共情-反馈技术」的对话示例。","a":["来访者：「我最近觉得挺悲伤的。」","咨询师：「你最近好像经历了一些事情，我感觉你挺悲伤的。」"],"k":["悲伤","回馈"],"src":"§3 罗杰斯段","ctx":"【案例六 · 罗杰斯式共情对话】就本例情节提问","refs":["案06"]},{"id":"k036","sid":"a97f82f48d","cat":"s3","q":"为什么许多人会误以为科胡特说的共情就是罗杰斯的共情？","a":["许多人没有读过科胡特关于共情的原始论述，便想当然地认为他说的共情就是罗杰斯所说的共情。","当时罗杰斯以人为中心的疗法（人本主义心理疗法）在北美地区传播得如火如荼，整个心理咨询界只要一听到共情，想到的就是罗杰斯强调的共情。"],"k":["没读过原始论述","北美","想当然"],"src":"§3 误解来源","refs":[]},{"id":"k037","sid":"29fa7975cc","cat":"s3","q":"罗杰斯与科胡特对「共情有无治疗意义」的分歧是什么？","a":["罗杰斯认为共情是有治疗意义的。","科胡特一直坚持共情是没有治疗意义的。"],"k":["有治疗意义","没有治疗意义"],"src":"§3 分歧","refs":[]},{"id":"k038","sid":"6d4fc3668c","cat":"s3","q":"科胡特所说的共情，收集的是什么资料？","a":["科胡特所指的共情，是在分析师内部所产生的精神内容，是分析师收集资料的方法。","它收集的不是客观资料，而是来访者精神现实的资料。"],"k":["收集资料","不是客观资料","精神现实"],"src":"§3 功能","refs":[]},{"id":"k039","sid":"5d4a6b317b","cat":"s3","q":"科胡特后期如何看待共情可能带来的「间接疗效」？请给出链条。","a":["分析师用内省-共情这种内部过程去理解一个人体验的世界时，因为分析师的态度发生了变化，他的非言语信息可能也会发生变化。","若这种态度与来访者产生共鸣，可能确实会有某种治疗效果。","但不像共情-反馈技术那么清晰；共情这一内部过程总体上是不会产生疗效的，即便产生疗效也是间接的。"],"k":["态度变化","非言语信息","共鸣","间接"],"src":"§3 后期研究","refs":[]},{"id":"k040","sid":"1325a752b9","cat":"s3","q":"科胡特如何评价共情在人类精神领域的地位与真正内涵？","a":["科胡特认为他所提出的共情是人类精神领域的重要发展。","其真正内涵在于一个人能够超越自身的边界，去理解另一个人的精神世界。"],"k":["重要发展","超越自身边界"],"src":"§3 地位","refs":[]},{"id":"k041","sid":"3a85ddea42","cat":"s3","q":"共情是否必然指向善意？科胡特如何界定其性质？","a":["科胡特认为，共情并不必然指向善意，它也可以被用于恶的目的。","共情虽然是一种高级的心理功能，但实际上可以用来做任何事情，甚至用来做坏事。","在科胡特的界定中，共情是中性的，它的本质在于对另一个人的主观世界进行深入理解并与之共振。"],"k":["不必然","中性","共振"],"src":"§3 中性","refs":[]},{"id":"案07","sid":"319647f383","cat":"s3","q":"案例七 · 纳粹与诈骗｜先读情节","a":["纳粹德国在占领区遭到许多地下游击队的反抗。为了镇压反抗，纳粹把抓到的游击队员吊死在村边的电线杆上，且不许收尸。原书指出：这一策略的设计和执行，正是基于对人们内心恐惧的共情理解。","同样，电信诈骗、保健品诈骗也是基于一种共情的理解：诈骗分子了解受害者内心的某些欲望、想法，并精准地捕捉其需求，所以才能得逞。","原书用这两个例子说明：共情并不必然指向善意，它是中性的，可以被用于恶的目的。"],"k":["游击队","不许收尸","恐惧","精准捕捉需求"],"src":"§3 反面例一","intro":1,"case":"七","follow":"后面 2 张卡分别问纳粹例与诈骗例说明了什么。","refs":["案07"]},{"id":"k042","sid":"a3155bc3a6","cat":"s3","q":"哪个纳粹的例子说明共情可为恶？","a":["纳粹德国在占领区遭到许多地下游击队的反抗；为了镇压这些反抗，纳粹把抓到的游击队员吊死在村边的电线杆上，且不许收尸。","这一策略的设计和执行，正是基于对人们内心恐惧的共情理解。"],"k":["游击队","不许收尸","恐惧"],"src":"§3 反面例一","ctx":"【案例七 · 纳粹与诈骗】就本例情节提问","refs":["案07"]},{"id":"k043","sid":"fec80c59de","cat":"s3","q":"哪些诈骗例子说明共情可为恶？","a":["电信诈骗、保健品诈骗等也是基于一种共情的理解。","诈骗分子之所以得逞，正是因为他们了解受害者内心的某些欲望、想法，并精准地捕捉其需求。"],"k":["电信诈骗","保健品","捕捉需求"],"src":"§3 反面例二","ctx":"【案例七 · 纳粹与诈骗】就本例情节提问","refs":["案07"]},{"id":"k044","sid":"408c2c6282","cat":"s4","q":"深入理解另一个人，能收集到什么？","a":["当你以替代性或内省性的方式深入倾听其精神现实时，便能收集到关于此人精神现实的、丰富且多样的资料，进而更好地理解这个人。"],"k":["丰富且多样","精神现实资料"],"src":"§4 全节","refs":[]},{"id":"k045","sid":"1129936a4d","cat":"s4","q":"精神分析作为一种治疗方案，如何定位内省-共情？","a":["精神分析作为一种治疗方案或咨询方案，是将内省-共情和人文主义、人道主义结合在一起，作为一种治疗和帮助他人的手段。"],"k":["人文主义","人道主义"],"src":"§4 全节","refs":[]},{"id":"k046","sid":"0a19e41c4b","cat":"s4","q":"原文提醒这个方法有什么两面性？","a":["但有些居心叵测的人也可能会把它用作一种虐待或欺骗他人的手段。"],"k":["居心叵测","虐待或欺骗"],"src":"§4 全节","refs":[]},{"id":"k047","sid":"ae78012356","cat":"s5","q":"替代性内省如何帮助来访者整合被压抑的内容？请按顺序复述。","a":["我们能够感受到来访者所压抑的某些东西。","进而帮助来访者把那些被压抑的东西说出来，或者围绕那些被压抑的精神内容与之产生共鸣——这对来访者而言是一种十分重要的经验。","这种经验帮助来访者重新理解自己所排斥的、压抑的某些东西。","并把它们整合到自己的精神世界和意识中，使其成为自体的重要力量。"],"k":["说出来","产生共鸣","整合","自体的重要力量"],"src":"§5 开篇","refs":[]},{"id":"案08","sid":"27e80ccc4d","cat":"s5","q":"案例五 重访 · 巴施与科胡特的两句话｜情节回顾","a":["回到 §2 的巴施案例：科胡特先说「我看到你那篇文章了」，巴施心跳加速、并未感到安全或被理解；接着说出第二句，点明巴施提出批评的初衷是对其观点与自体心理学发展的关注和爱护，巴施瞬间松了一口气、觉得自己被深度理解。","§5 用同一次会面说明另一层：第一句不是基于内省-共情，第二句才是；后者带来「自体客体经验」，并增强巴施的自体感与自我安抚功能。","本节的题卡问的是心理功能如何变化，情节仍以这两句话为线索。"],"k":["第一句不是","第二句才是","被深度理解","心理功能"],"src":"§5 巴施重访","intro":1,"case":"五","follow":"后面 6 张卡围绕本案例重访；若想重读完整情节，可切到「案例情节」视图看案例⑤。","refs":["案08"]},{"id":"k048","sid":"9c13537c7c","cat":"s5","q":"巴施案例中，科胡特哪一句话不是基于内省-共情？为什么？","a":["第一句「我看到你那篇文章了」。","当科胡特说这句话时，巴施还没有感到安全或被理解，因为科胡特的这句话并不是基于一个内省-共情的过程。"],"k":["第一句","没有感到安全"],"src":"§5 巴施重访","ctx":"【案例五 · 巴施与科胡特的两句话（重访）】就本例情节提问","refs":["案08"]},{"id":"k049","sid":"6fe6d86732","cat":"s5","q":"科胡特第二句话为什么构成内省-共情？","a":["当科胡特说出第二句话的时候，巴施觉得自己被深度理解了，而这正是基于科胡特的内省-共情的过程。","科胡特在这个时候精确地说出了他的感觉。"],"k":["第二句","深度理解","精确"],"src":"§5 巴施重访","ctx":"【案例五 · 巴施与科胡特的两句话（重访）】就本例情节提问","refs":["案08"]},{"id":"k050","sid":"d053228b50","cat":"s5","q":"科胡特精确说出的，是巴施的哪些心意？","a":["巴施希望自体心理学的发展能够被更多人理解，也希望为可能存在的缺陷提供反思。","这种被理解的体验，在自体心理学中被称为「自体客体经验」。"],"k":["更多人理解","缺陷提供反思"],"src":"§5 巴施重访","ctx":"【案例五 · 巴施与科胡特的两句话（重访）】就本例情节提问","refs":["案08"]},{"id":"k051","sid":"0c6d192b72","cat":"s5","q":"「内心被压抑的部分被同步到另一个人的内心」这一比喻之后，什么会转变？","a":["科胡特的这一内省-共情的过程，对巴施的内心来说是一种替代性内省的体验。","这就如同你内心被压抑的部分，被同步到另一个人的内心，当这个过程发生的时候，后者的心理功能就会发生转变。"],"k":["替代性内省","同步","心理功能转变"],"src":"§5 巴施重访","ctx":"【案例五 · 巴施与科胡特的两句话（重访）】就本例情节提问","refs":["案08"]},{"id":"k052","sid":"d10ff0aa94","cat":"s5","q":"科胡特的回应除理解之外，还增强了巴施的什么？","a":["不仅是一种理解，而且增强了巴施的心理功能。","巴施因此获得了一种自信心，一种坚持、坚定的自体感，这让他觉得自己是正确的，实际上他的内心受到了鼓舞。"],"k":["心理功能","自信心","鼓舞"],"src":"§5 巴施重访","ctx":"【案例五 · 巴施与科胡特的两句话（重访）】就本例情节提问","refs":["案08"]},{"id":"k053","sid":"a62bab476e","cat":"s5","q":"「心里想说的那些话被直接说出来」时，什么功能增强了？","a":["他心里想说的那些话被科胡特直接说出来了，而当这些想法被表达出来的时候，其自我安抚的功能也增强了。"],"k":["自我安抚"],"src":"§5 巴施重访","ctx":"【案例五 · 巴施与科胡特的两句话（重访）】就本例情节提问","refs":["案08"]},{"id":"k054","sid":"6f441738bb","cat":"s5","q":"为什么说基于内省-共情的回应「也是心理功能层面的回应」？","a":["尽管我们本身与其他人并无关联，但基于在内省-共情的过程中所理解的资料去回应对方，实际上不仅是一种情感性的回应，也是一种心理功能层面的回应。","这种功能能够很好地帮助对方安抚自身，而这正是自体心理学的核心工作。"],"k":["情感性回应","心理功能层面","核心工作"],"src":"§5 收束段","refs":[]},{"id":"案09","sid":"5cfa95c710","cat":"s6","q":"案例八 · 狮子的两种攻击｜先读情节","a":["一头狮子在捕捉一只瞪羚时表现出攻击行为：它最终要杀死瞪羚并把它吃掉。通常我们认为，这是因为狮子天生就具有攻击性。","原书接着设问：正当它攻击、捕捉瞪羚时，领地里突然出现另一头完全陌生的雄狮，两头狮子肯定会立即打起来——此时第一头狮子的主观世界，和它攻击瞪羚时是否相同？","答案是：两种形式都是攻击，但内在情感体验差异很大。捕瞪羚时是力量感、控制感，不会愤怒，瞪羚只是食物；领地被侵犯时是愤怒甚至暴怒。","由此说明：形式 ≠ 内涵，不能把表象或形式等同于内涵。"],"k":["瞪羚","陌生雄狮","力量感","愤怒","领地"],"src":"§6 狮子例","intro":1,"case":"八","follow":"后面 3 张卡围绕本案例（两种内在体验／由本例引出的原理论断）。","refs":["案09"]},{"id":"k055","sid":"1a9573be1f","cat":"s6","q":"狮子捕捉瞪羚时，内在的情感体验是什么？","a":["它内在所体验到的是一种力量感、一种控制感。","它不会有愤怒的感觉，因为在狮子眼中，瞪羚只是它的食物，其攻击行为的目的就是捕食。","它的内在是一种捕捉和控制的感觉，这可能与它的食欲有关。"],"k":["力量感","控制感","无愤怒","捕食"],"src":"§6 狮子例","ctx":"【案例八 · 狮子的两种攻击】就本例情节提问","refs":["案09"]},{"id":"k056","sid":"8468dd3e76","cat":"s6","q":"陌生雄狮出现在领地时，狮子的内在体验是什么？","a":["它内在体验到的是一种愤怒，甚至暴怒的感觉。","其攻击行为是一种因感觉领地被侵犯而发起的攻击。"],"k":["愤怒","暴怒","领地被侵犯"],"src":"§6 狮子例","ctx":"【案例八 · 狮子的两种攻击】就本例情节提问","refs":["案09"]},{"id":"k057","sid":"4913c27f2c","cat":"s6","q":"狮子例子要说明的原理论断是什么？","a":["虽然这两种形式都是攻击，但狮子内在的情感体验差异很大。","事物的形式与内涵是有很大区别的，我们不能将事物的表象或形式等同于事物的内涵。","特别是当我们试图理解另一个人的精神现实时，我们需要考虑其感受的内涵。"],"k":["形式","内涵","不能等同"],"src":"§6 狮子例","ctx":"【案例八 · 狮子的两种攻击】由本例引出的一般规律／论断","refs":["案09"]},{"id":"案10","sid":"8ec699cae9","cat":"s6","q":"案例九 · 航天猩猩嘴角上扬｜先读情节","a":["人类早期的一项航天计划中，一只猩猩被放进航天器内。航天器返回地球时，有人从拍摄的照片中发现，那只猩猩的嘴角是上扬的；众人认为它是因为重返地球而高兴。","后来一位动物心理学家从动物心理学视角提出另一种观点：猩猩嘴角上扬不代表高兴，而代表惊恐。当时航天器刚经过大气层摩擦即将到达地球，着陆瞬间猩猩其实非常惊恐，所以嘴角才上扬，那根本不是开心的表情。"],"k":["航天器","嘴角上扬","误读为高兴","实为惊恐"],"src":"§6 表象例一","intro":1,"case":"九","follow":"后面 1 张卡问两种解读分别是什么。","refs":["案10"]},{"id":"k058","sid":"f0ec9f839d","cat":"s6","q":"「航天猩猩嘴角上扬」的例子，两种解读分别是什么？","a":["人类早期的一项航天计划中，一只猩猩被放进航天器内；返回地球时有人从照片中发现它嘴角上扬，众人认为它是因重返地球而高兴。","后来一位动物心理学家提出：猩猩嘴角上扬不代表高兴，而代表惊恐。","当时航天器刚经过大气层摩擦即将到达地球，在着陆的瞬间猩猩实际上非常惊恐，所以嘴角才上扬，那根本不是开心的表情。"],"k":["重返地球","惊恐","不是开心"],"src":"§6 表象例一","ctx":"【案例九 · 航天猩猩嘴角上扬】就本例情节提问","refs":["案10"]},{"id":"案11","sid":"faa6cfb859","cat":"s6","q":"案例十 · 德里大学台下摇头｜先读情节","a":["作者的一位外国同事第一次去印度德里大学教书。他做了精心准备，却越讲越不自信，因为看到台下所有人都在摇头；他深感挫败，以为自己没讲好，或讲的内容不符合当地人的需求。","一小时后他不得不停下来让大家休息，问校长和请他来的教授：「是不是你们这里的人都不太喜欢我讲的内容？」对方回答：不是啊，我们很喜欢，认为你讲得太好、太棒了！","教授解释：在印度，如果讲的内容引起了我们的思考，我们就会在思考的时候摇头；摇头代表赞赏你、正在思考你讲的东西。"],"k":["德里大学","台下摇头","深感挫败","赞赏与思考"],"src":"§6 表象例二","intro":1,"case":"十","follow":"后面 1 张卡问误会如何产生、又如何澄清。","refs":["案11"]},{"id":"k059","sid":"95e2508216","cat":"s6","q":"「德里大学摇头」的例子，误会是怎么产生的、又怎么澄清？","a":["一位外国同事第一次去印度德里大学教书，虽做了精心准备却越讲越不自信，因为他看到台下所有人都在摇头，深感挫败，觉得自己没讲好或内容不符合需求。","一小时后他停下来问校长和请他来的教授，对方说很喜欢、认为讲得太好太棒了。","教授解释：在印度，如果你讲的内容引起了我们的思考，我们就会在思考的时候摇头；摇头代表赞赏你、正在思考你讲的东西。"],"k":["德里大学","摇头","赞赏与思考"],"src":"§6 表象例二","ctx":"【案例十 · 德里大学台下摇头】就本例情节提问","refs":["案11"]},{"id":"案12","sid":"f7a308c5be","cat":"s6","q":"案例十一 · 讲创伤时满面笑容｜先读情节","a":["有一些来访者，在讲自己的创伤时脸上带着笑容。面对这样的来访者，咨询师会有一种解离感，好像事情不是发生在他们身上，而是发生在其他人身上。","原书提醒：出现这种情况并不代表他们已经释然。若一位来访者讲述一段特别悲惨的经历时满面笑容，咨询师就要谨慎，因为这可能表明创伤很严重，笑容实际上是他保护自己的一种方式。","此时不宜面质「为什么你在讲这么悲惨的事情时却在笑？」，而要尝试理解笑容不是真正的开心，其背后有其他内涵和意义。"],"k":["讲创伤时带笑","解离感","并非释然","保护自己"],"src":"§6 笑容例","intro":1,"case":"十一","follow":"后面 3 张卡围绕本案例（咨询师的感受／临床判断／宜与不宜）。","refs":["案12"]},{"id":"k060","sid":"57fb3da6d8","cat":"s6","q":"面对「讲创伤时脸上带着笑容」的来访者，咨询师会有什么感受？","a":["咨询师会有一种解离感，好像事情不是发生在他们身上，而是发生在其他人身上。"],"k":["解离感"],"src":"§6 笑容例","ctx":"【案例十一 · 讲创伤时满面笑容】就本例情节提问","refs":["案12"]},{"id":"k061","sid":"c52731f4cf","cat":"s6","q":"原文对「讲创伤时满面笑容」给出的临床判断是什么？","a":["出现这种情况，并不代表他们已经释然。","如果一位来访者在讲述一段特别悲惨的经历时满面笑容，咨询师就要谨慎，因为这有可能表明他的创伤很严重，而这种笑容实际上是他保护自己的一种方式。"],"k":["并不代表释然","创伤很严重","保护自己"],"src":"§6 笑容例","ctx":"【案例十一 · 讲创伤时满面笑容】就本例情节提问","refs":["案12"]},{"id":"k062","sid":"90a0895cad","cat":"s6","q":"此时原文建议怎么做、不建议怎么做？","a":["不宜面质对方：「为什么你在讲这么悲惨的事情时却在笑？」","而是要尝试理解他的笑容不是真正的开心，其背后有其他内涵和意义。"],"k":["不宜面质","背后内涵"],"src":"§6 笑容例","ctx":"【案例十一 · 讲创伤时满面笑容】就本例情节提问","refs":["案12"]},{"id":"k063","sid":"ab0c8e2a6e","cat":"s6","q":"从经验贴近到经验远离，分析师内部经历了哪些步骤？","a":["当一幕幕情境在我们脑海中浮现的时候，这种内省-共情的过程被称为体验贴近或者经验贴近。","有时虽然心中浮现出一幕幕情境，我们却无法理解它们，不知道这些情境到底意味着什么。","然后内心会酝酿一些过程——把我们听到的东西概念化，形成语言并表达出来，或者形成一种对来访者情感过程的理解并表现出来；科胡特把这个过程称为经验远离。"],"k":["情境浮现","无法理解","概念化"],"src":"§6 经验贴近与远离","refs":[]},{"id":"k064","sid":"9c4bb17e77","cat":"s6","q":"从经验贴近到经验远离，耗时可能有多长？","a":["有时候在一瞬间就能完成；但是在实际个案中，往往并没有那么容易。","当你一步步体验到某些东西、甚至获得了一些深刻的感悟时，要把它们组织成合适的语言说出来往往需要很长的时间——可能需要几周、几个月，甚至半年、一年，才能提炼出真正包含理解和诠释的内容，然后反馈给来访者。"],"k":["一瞬间","几周几个月","半年一年"],"src":"§6 经验贴近与远离","refs":[]},{"id":"k065","sid":"6a8fdcee57","cat":"s6","q":"为什么「经验贴近→经验远离」是做出干预前十分重要的过程？","a":["咨询师对来访者的内心做出深刻的理解和诠释，能够帮助来访者真正疗愈创伤。","因此，从经验贴近到经验远离的过程，是做出干预前，分析师内部十分重要的过程。"],"k":["疗愈创伤","干预前"],"src":"§6 经验贴近与远离","refs":[]},{"id":"k066","sid":"057cc4e255","cat":"s6","q":"科胡特当时临床工作的工作条件是什么？对内省-共情有何影响？","a":["科胡特当时所进行的临床工作大部分是躺椅式的经典精神分析，且是一周 3～5 次的高频分析。","在这种分析中，分析师以内省-共情的方式一幕幕地深度感受来访者是比较容易的。"],"k":["躺椅式","3～5 次","高频"],"src":"§6 高频与低频","refs":[]},{"id":"k067","sid":"cb0ed947cf","cat":"s6","q":"当代咨询的工作条件是什么？带来什么限制？","a":["我们目前的绝大部分心理咨询工作，多是一周一次的低频分析取向心理咨询，深度感受来访者相对来说比较有难度。","咨询师所获得的关于来访者精神现实的资料，不会像在高频的躺椅式精神分析中那么充足，因为咨询师和来访者一来一往的谈话过程会影响内省-共情的过程。"],"k":["一周一次","资料不充足","一来一往"],"src":"§6 高频与低频","refs":[]},{"id":"k068","sid":"4e62c4d899","cat":"s6","q":"低频条件下，关于内省-共情方法的结论是什么？","a":["内省-共情的方法依然很重要，因为在某些内省片段浮现时，它对我们深入地理解来访者具有重要意义。","精神分析取向的心理咨询师可以尝试把内省-共情的方法整合到自己的工作中，这对理解来访者相当关键。"],"k":["依然重要","内省片段","整合"],"src":"§6 收束段","refs":[]},{"id":"k069","sid":"bc77229ec3","cat":"s6","q":"科胡特对「表象／形式」的总论断是什么？","a":["我们对表象或形式的理解未必是充分或者精确的。","特别是在进行精神分析或者做心理咨询的过程中，我们不应只从自己眼中看到的表象或形式去理解一个人。","表象只代表事物的一部分，我们还要理解事物的内涵。"],"k":["未必充分精确","表象只是一部分","内涵"],"src":"§6 表象论断","refs":[]},{"id":"k070","sid":"47e781e9d1","cat":"case","q":"案例速查：「来访者称追求女同学而受创伤」。它说明哪个概念？","a":["说明精神现实与旁观者客观标准的区分：来访者的切身感受，与旁人听陈述后的感受往往有区别。"],"k":["精神现实","旁观者"],"src":"案例速查 ①","ctx":"【案例速查 ① · 追求女同学受创伤】来访者称追求女同学受了创伤；咨询师从旁观者看只是暗恋、表白未被接受　｜　反查练习：由情节回推概念；情节详见「案例一」卡","refs":["案01"]},{"id":"k071","sid":"7e62702078","cat":"case","q":"案例速查：「三四岁孩子说昨天到月球、星星上玩，妈妈说撒谎」。它说明什么？","a":["说明「频道不一致」、幻想中的精神现实，以及「成熟的道德主义」（成人依一般现实标准形成的缺乏共情的看法）。"],"k":["频道不一致","幻想","成熟的道德主义"],"src":"案例速查 ②","ctx":"【案例速查 ② · 三四岁孩子说去了月球／星星】三四岁孩子说昨天到月球、星星上玩，妈妈说「撒谎」　｜　反查练习：由情节回推概念；情节详见「案例二」卡","refs":["案02"]},{"id":"k072","sid":"af4389eb28","cat":"case","q":"案例速查：「咨询师要休假，来访者反复问这两周怎么办」。它说明什么？","a":["说明看似现实的「成熟的道德主义」；来访者表达暗含的内容常与分离焦虑、死亡焦虑或早期被抛弃等创伤经历相关。"],"k":["休假","分离焦虑"],"src":"案例速查 ③","ctx":"【案例速查 ③ · 咨询师要休假】咨询师要去休假，来访者反复追问「这两周我该怎么办」　｜　反查练习：由情节回推概念；情节详见「案例三」卡","refs":["案03"]},{"id":"k073","sid":"510f80a16f","cat":"case","q":"案例速查：「巴施与科胡特的两句话」。它同时说明了哪三个概念？","a":["内省-共情（第二句才是）、替代性内省、自体客体经验（被深度理解的体验）。","并连带说明自体感增强与自我安抚功能增强。"],"k":["内省-共情","替代性内省","自体客体经验"],"src":"案例速查 ④","ctx":"【案例速查 ④ · 巴施与科胡特的两句话】巴施撰文批评科胡特后，两人见面时科胡特说了两句话　｜　反查练习：由情节回推概念；情节详见「案例五」卡","refs":["案05"]},{"id":"k074","sid":"a8907af561","cat":"case","q":"案例速查：「纳粹吊死游击队员不许收尸」「电信／保健品诈骗」。说明什么？","a":["说明共情并不必然指向善意，共情是中性的，可用于恶的目的。"],"k":["中性","可为恶"],"src":"案例速查 ⑤","ctx":"【案例速查 ⑤ · 纳粹与诈骗】纳粹不许为吊死的游击队员收尸；电信／保健品诈骗精准捕捉受害者需求　｜　反查练习：由情节回推概念；情节详见「案例七」卡","refs":["案07"]},{"id":"k075","sid":"f24f19a996","cat":"case","q":"案例速查：「狮子捕捉瞪羚 vs 领地出现陌生雄狮」。说明什么？","a":["说明同为攻击形式，内在情感体验与内涵可完全不同；不能把形式等同于内涵。"],"k":["形式","内涵"],"src":"案例速查 ⑥","ctx":"【案例速查 ⑥ · 狮子的两种攻击】狮子捕捉瞪羚，与领地突然出现陌生雄狮，两种攻击内涵不同　｜　反查练习：由情节回推概念；情节详见「案例八」卡","refs":["案09"]},{"id":"k076","sid":"680b2b5504","cat":"case","q":"案例速查：「航天猩猩嘴角上扬」与「德里大学台下摇头」。共同说明什么？","a":["共同说明表象 ≠ 内涵：前者把惊恐误读为高兴，后者把赞赏与思考误读为不认同（含跨文化差异）。"],"k":["表象","惊恐","摇头"],"src":"案例速查 ⑦","ctx":"【案例速查 ⑦ · 航天猩猩嘴角上扬／德里大学台下摇头】猩猩嘴角上扬实为惊恐；德里大学台下摇头实为赞赏与思考　｜　反查练习：由情节回推概念；情节详见「案例九、十」卡","refs":["案10","案11"]},{"id":"k077","sid":"4354c7f66b","cat":"case","q":"案例速查：「来访者讲创伤时满面笑容」。说明什么？","a":["说明笑容可能是创伤严重时保护自己的方式；此时不宜面质，而要理解笑容背后的内涵和意义。"],"k":["笑容","不宜面质","保护"],"src":"案例速查 ⑧","ctx":"【案例速查 ⑧ · 讲创伤时满面笑容】有来访者讲述特别悲惨的经历时脸上带着笑容　｜　反查练习：由情节回推概念；情节详见「案例十一」卡","refs":["案12"]},{"id":"k078","sid":"df777584e8","cat":"case","q":"案例速查：「不停攻击科胡特的来访者」说明什么临床态度？","a":["说明面对来访者时不再拘泥于理论、而是听听他到底要讲什么。","呼应重视来访者主观现实与精神现实的临床开端。"],"k":["不拘泥于理论","倾听"],"src":"案例速查 ⑨（跨章）","ctx":"【案例速查 ⑨ · 不停攻击科胡特的来访者】第一章提过的那位不停攻击科胡特的来访者　｜　反查练习：由情节回推概念；情节详见「案例四」卡","refs":["案04"]},{"id":"k079","sid":"0f4efc0d60","cat":"disc","q":"辨析：「科胡特的共情就是罗杰斯的共情」——原文如何反驳？","a":["不同：科胡特的共情是发生于分析师内心、收集来访者精神现实资料的过程；罗杰斯式的共情是外显的共情性技术／共情-反馈技术。","误解源于很多人没读过科胡特关于共情的原始论述。"],"k":["内部过程","反馈技术"],"src":"关键辨析 ①","refs":[]},{"id":"k080","sid":"40b1116c7e","cat":"disc","q":"辨析：「共情有治疗作用」——原文界定是什么？","a":["科胡特一直坚持共情是没有治疗意义的；从科胡特的表述看，这一内部过程总体上不会产生疗效，即便产生疗效也是间接的。","后期承认：态度变化 → 非言语信息变化 → 与来访者共鸣，可能有某种治疗效果，但不像共情-反馈技术那么清晰。"],"k":["没有治疗意义","间接","不清晰"],"src":"关键辨析 ②","refs":[]},{"id":"k081","sid":"c3b09a06da","cat":"disc","q":"辨析：「共情是善意、助人的」——原文界定是什么？","a":["共情并不必然指向善意，也可被用于恶的目的（纳粹、诈骗）。","共情是中性的高级心理功能，本质在于对另一个人的主观世界进行深入理解并与之共振。"],"k":["中性","可为恶","共振"],"src":"关键辨析 ③","refs":[]},{"id":"k082","sid":"f63ec98447","cat":"disc","q":"辨析：「接纳就等于认同」——原文怎么区分？","a":["接纳来访者所说的并不等同于认同来访者所说的，二者存在区别。","接纳是咨询得以继续的前提，咨询师首先要有接纳和理解的基本态度。"],"k":["不等同","前提"],"src":"关键辨析 ④","refs":[]},{"id":"k083","sid":"1feedbc830","cat":"disc","q":"辨析：「讲创伤时笑＝已经释然」——原文怎么纠正？","a":["出现这种情况并不代表他们已经释然；反而可能表明创伤很严重，笑容是他保护自己的一种方式。","不宜面质，要理解笑容背后的内涵和意义。"],"k":["并未释然","保护","不宜面质"],"src":"关键辨析 ⑤","refs":[]},{"id":"k084","sid":"a73ee81569","cat":"disc","q":"辨析：「攻击行为＝攻击性」——原文怎么纠正？","a":["形式相同，主观世界与情感体验可以完全不同：捕瞪羚是力量感、控制感、无愤怒；领地被侵入是愤怒甚至暴怒。","不能把表象或形式等同于内涵。"],"k":["形式同","内涵异"],"src":"关键辨析 ⑥","refs":[]},{"id":"k085","sid":"702ce660f1","cat":"disc","q":"辨析：「高频与低频对内省-共情没有差别」——原文怎么纠正？","a":["科胡特当时是躺椅式、一周 3～5 次的高频分析，深度感受较容易；当代多为一周一次低频咨询，深度感受较有难度。","低频下一来一往的谈话过程会影响内省-共情，所得精神现实资料不如高频充足。"],"k":["3～5 次","一周一次","资料较不充足"],"src":"关键辨析 ⑦","refs":[]},{"id":"k086","sid":"489184d166","cat":"disc","q":"辨析：「科胡特第一句『我看到你那篇文章了』就是共情」——对吗？","a":["不对。巴施听到第一句时还没有感到安全或被理解，因为这句话并不是基于一个内省-共情的过程。","第二句才带来「被深度理解」，即自体客体经验。"],"k":["第一句不是","第二句才是"],"src":"关键辨析 ⑧","refs":[]},{"id":"k087","sid":"ca3b868ab9","cat":"term","q":"empathy → ？","a":["共情；亦译共感／同理／同理心；教育学有时译「移情」；中国台湾地区自体心理学著作译「神入」。"],"k":["共情","神入"],"src":"术语英中 ①","refs":[]},{"id":"k088","sid":"bd59cb91ce","cat":"term","q":"introspection-empathy → ？","a":["内省-共情（科胡特在自体心理学中所指的共情，实质上即此）。"],"k":["内省-共情"],"src":"术语英中 ②","refs":[]},{"id":"k089","sid":"92392844a9","cat":"term","q":"psychic reality → ？","a":["精神现实（心理现实）。"],"k":["精神现实","心理现实"],"src":"术语英中 ③","refs":[]},{"id":"k090","sid":"2f182a49ae","cat":"term","q":"mature moralism → ？","a":["成熟的道德主义。"],"k":["成熟的道德主义"],"src":"术语英中 ④","refs":[]},{"id":"k091","sid":"0c11b7257e","cat":"term","q":"empathic feedback technique → ？","a":["共情-反馈技术（亦称共情性技术）。"],"k":["共情-反馈技术"],"src":"术语英中 ⑤","refs":[]},{"id":"k092","sid":" ":[]},{"id":"k116","sid":"2575105967","cat":"cloze","q":"填空：「表象只代表事物的________，我们还要理解事物的内涵。」","a":["一部分"],"k":["一部分"],"src":"§6 表象论断","refs":[]},{"id":"k117","sid":"f246d9a2b6","cat":"cloze","q":"填空：「弗洛伊德对共情的界定——一条借着________，经由________，通往共情的途径。」","a":["模仿","认同"],"k":["模仿","认同"],"src":"§2 概念源流","refs":[]}];
const CATMAP = {}; CATS.forEach(c=>CATMAP[c.k]=c);
const CATIDX = {}; CATS.forEach((c,i)=>CATIDX[c.k]=i);
const KEY = 'xj_ch2_knowledge_cards_v4';
/* 复习记录按卡片 sid（题干指纹）保存，与显示编号 k001… 解耦：
   以后增删卡片、重排编号都不会让自评张冠李戴。 */

/* ============ 状态 ============ */
let saved={status:{},settings:{}};
try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);saved.status=o.status||{};saved.settings=o.settings||{};}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){}}
const $=id=>document.getElementById(id);
function settings(){return {cat:$('fCat').value,order:$('fOrder').value,weak:$('fWeak').checked,recite:$('fRecite').checked,reverse:$('fReverse').checked};}
function saveSettings(){const s=settings();
  /* 「案例情节」是一次性查看，不写进默认设置：下次打开仍回到按案例穿插的正常复习流 */
  if(s.cat==='__intro__')s.cat='all';
  saved.settings=s;persist();}

let deck=[],pos=0,flipped=false,mineText='';

/* ============ 初始化控件 ============ */
CATS.forEach(c=>{
  const o=document.createElement('option');o.value=c.k;o.textContent=c.label+'（'+CARDS.filter(x=>x.cat===c.k).length+'）';
  $('fCat').appendChild(o);
});
const introOpt=document.createElement('option');
introOpt.value='__intro__';introOpt.textContent='案例情节（'+CARDS.filter(x=>x.intro).length+'）';
$('fCat').appendChild(introOpt);
const s0=saved.settings;
/* 兼容旧记录：曾保存过集中视图的，回到正常复习流 */
if(s0&&s0.cat==='__intro__'){s0.cat='all';persist();}
if(s0&&Object.keys(s0).length){
  if(s0.cat&&[...$('fCat').options].some(o=>o.value===s0.cat))$('fCat').value=s0.cat;
  if(s0.order&&[...$('fOrder').options].some(o=>o.value===s0.order))$('fOrder').value=s0.order;
  $('fWeak').checked=!!s0.weak;$('fRecite').checked=!!s0.recite;$('fReverse').checked=!!s0.reverse;
}
function renderChips(){
  const box=$('chips');box.innerHTML='';
  const all=document.createElement('span');
  all.className='chip'+($('fCat').value==='all'?' on':'');
  if($('fCat').value==='all')all.style.background='#2f4f6f';
  all.textContent='全部 '+CARDS.length;
  all.onclick=()=>{$('fCat').value='all';saveSettings();buildDeck();};
  box.appendChild(all);
  const iN=CARDS.filter(x=>x.intro).length;
  const ic=document.createElement('span');
  ic.className='chip'+($('fCat').value==='__intro__'?' on':'');
  if($('fCat').value==='__intro__')ic.style.background='#8a6a3e';
  ic.textContent='案例情节 '+iN;
  ic.title='集中浏览全部案例情节介绍卡（正常复习时介绍卡会自动插在对应案例题卡之前）';
  ic.onclick=()=>{$('fCat').value='__intro__';saveSettings();buildDeck();};
  box.appendChild(ic);
  CATS.forEach(c=>{
    const n=CARDS.filter(x=>x.cat===c.k).length;
    const el=document.createElement('span');
    el.className='chip'+($('fCat').value===c.k?' on':'');
    if($('fCat').value===c.k)el.style.background=c.color;
    el.title=c.note;
    el.innerHTML=c.label+'<i>'+n+'</i>';
    el.onclick=()=>{$('fCat').value=c.k;saveSettings();buildDeck();};
    box.appendChild(el);
  });
}

/* ============ 卡组 ============ */
function stat(v){return v===3?'✓ 记得':v===2?'· 模糊':'○ 未评';}
/* 情节卡不参与排序：在案例题卡「首次呈现」之前插入对应介绍。
   perSegment=true（原书顺序）：同一案例的题卡分成不同区段时，每段前都插一次
   （案例速查是反查练习，离原案例很远，需要重新给情节）。
   perSegment=false（弱项/随机/掌握度）：每个案例全局只插一次，避免介绍卡淹没题卡。 */
function anchorIntros(body, perSegment){
  const intros={}; CARDS.forEach(c=>{if(c.intro)intros[c.id]=c;});
  const out=[], seenKeys=new Set(), seenCards=new Set(); let last='';
  body.forEach(c=>{
    const refs=(c.refs||[]).filter(r=>intros[r]);
    const key=refs.join('|');
    const need=refs.length&&(perSegment?(key!==last):!seenKeys.has(key));
    if(need){
      if(perSegment){
        refs.forEach(r=>out.push(intros[r]));
      }else{
        /* 打散排序下按「单张情节卡」去重：案例速查⑦ 同时指向案10/案11，
           若这两个案例在别处已介绍过，就不再重复插入 */
        refs.forEach(r=>{if(!seenCards.has(r)){out.push(intros[r]);seenCards.add(r);}});
      }
      seenKeys.add(key);
    }
    last=refs.length?key:'';
    out.push(c);
  });
  return out;
}
function buildDeck(keep){
  const s=settings();
  const introOnly=(s.cat==='__intro__');
  deck=CARDS.filter(c=>{
    if(introOnly){if(!c.intro)return false;}
    else{if(c.intro)return false;if(s.cat!=='all'&&c.cat!==s.cat)return false;}
    if(s.weak&&(saved.status[c.sid]||0)>=3)return false;
    return true;
  });
  if(s.order==='seq')deck.sort((a,b)=>CATIDX[a.cat]-CATIDX[b.cat]||CARDS.indexOf(a)-CARDS.indexOf(b));
  if(s.order==='status')deck.sort((a,b)=>(saved.status[a.sid]||0)-(saved.status[b.sid]||0));
  if(s.order==='weak'){const wk=sid=>{const v=saved.status[sid]||0;return v===0?1.5:v;};deck.sort((a,b)=>wk(a.sid)-wk(b.sid)||Math.random()-.5);}
  if(s.order==='rand')deck=deck.slice().sort(()=>Math.random()-.5);
  /* 排序完成后再锚定情节卡：与所选顺序无关，保证介绍总在该案例题卡之前 */
  if(!introOnly)deck=anchorIntros(deck,s.order==='seq');
  if(keep&&pos<deck.length){}else{pos=0;}
  if(pos>=deck.length)pos=0;
  renderChips();updateStats();show();
}

function updateStats(){
  const s=settings();
  const introOnly=(s.cat==='__intro__');
  const pool=introOnly?CARDS.filter(c=>c.intro)
    :(s.cat==='all'?CARDS:CARDS.filter(c=>c.cat===s.cat)).filter(c=>!c.intro);
  const done=pool.filter(c=>(saved.status[c.sid]||0)>0).length;
  const got=pool.filter(c=>(saved.status[c.sid]||0)===3).length;
  const nIntro=deck.filter(c=>c.intro).length;
  $('statText').textContent=(introOnly?'案例情节 '+pool.length+' 张':'本模块 '+pool.length+' 张题卡')
    +' ｜ 已评 '+done+' ｜ 记得 '+got+' ｜ 当前卡组 '+deck.length+' 张'
    +(introOnly?'':'（含情节卡 '+nIntro+'）');
  $('progText').textContent=done+'/'+pool.length;
  $('bar').style.width=(pool.length?done/pool.length*100:0)+'%';
  $('countHint').textContent=deck.length?(pos+1)+' / '+deck.length:'当前筛选无卡片';
}

/* ============ 渲染 ============ */
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function show(){
  const box=$('cardArea');
  const oldEmpty=box.querySelector('.empty');if(oldEmpty)oldEmpty.remove();
  if(!deck.length){
    $('front').innerHTML='<div class="empty">当前筛选下没有卡片。<br>试着取消「只看未掌握」，或换一个模块。</div>';
    $('back').innerHTML='';$('card').classList.remove('flipped');
    updateStats();return;
  }
  const c=deck[pos],col=CATMAP[c.cat].color,st=saved.status[c.sid]||0;
  const s=settings();
  flipped=false;$('card').classList.remove('flipped');mineText='';
  $('card').style.setProperty('--cc',col);
  const badge=c.intro?'案例情节 · 先读':CATMAP[c.cat].label;
  const head='<div class="top"><span class="badge'+(c.intro?' introBadge':'')+'" style="background:'+col+'">'+badge+'　·　'+stat(st)+'</span><span class="idx">'+c.id+'　'+(pos+1)+'/'+deck.length+'</span></div>';
  const foot='<div class="src">所在小节：'+esc(c.src)+'　｜　徐钧《自体心理学入门》第二章</div>';

  /* 案例情节卡：正面直接印出情节，不用翻面就能读到背景；背面给记忆抓手。
     不进入默写／反向提问（它不是问答题）。 */
  if(c.intro){
    const body='<div class="introBody">'+c.a.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>';
    $('front').innerHTML=head+'<div class="q">'+esc(c.q)+'</div>'+body+
      '<div class="introHint">'+esc(c.follow||'')+'　·　无需翻面，读完直接进入后面的提问卡。</div>'+foot;
    $('back').innerHTML=head+'<div class="q">'+esc(c.q)+' · 记忆抓手</div>'+
      '<div class="kw">合上卡片试着自己复述情节，再核对关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>'+
      '<div class="introHint">'+esc(c.follow||'')+'</div>'+foot;
    $('flip').textContent='翻面看记忆抓手（空格）';
    updateStats();return;
  }

  let q=c.q, a=c.a;
  if(s.reverse){ q=c.a.join('　／　'); a=[c.q]; }
  const big=q.length>95?' big':'';

  const ctxHtml=c.ctx?'<div class="ctx">'+esc(c.ctx)+'</div>':'';
  if(s.recite&&!s.reverse){
    $('front').innerHTML=head+ctxHtml+'<div class="q'+big+'">'+esc(q)+'</div>'+
      '<textarea id="mine" placeholder="先在这里写下你的答案／背诵要点，再点「核对并翻面」…"></textarea>'+foot;
    const ta=$('mine');
    if(ta){ta.onclick=e=>e.stopPropagation();ta.oninput=()=>{mineText=ta.value;};ta.value='';}
  }else{
    $('front').innerHTML=head+ctxHtml+'<div class="q'+big+'">'+esc(q)+'</div>'+foot;
  }

  let back=head+(s.reverse?'':ctxHtml)+'<ul class="aList">'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(s.recite&&!s.reverse&&mineText.trim()){
    back+='<div class="mine"><b>你的默写</b>'+esc(mineText.trim())+'</div>';
    const hits=c.k.filter(w=>mineText.indexOf(w)>=0);
    back+='<div class="hit">关键词命中 '+hits.length+' / '+c.k.length+(hits.length?'：'+esc(hits.join('、')):'　— 建议对照全文再背一遍')+'</div>';
  }
  if(!s.reverse&&c.k.length){
    back+='<div class="kw">关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>';
  }
  back+=foot;
  $('back').innerHTML=back;
  $('flip').textContent=s.recite&&!s.reverse?'核对并翻面（空格）':'翻面看答案（空格）';
  updateStats();
}
function flip(){
  if(!deck.length)return;
  const s=settings();
  if(s.recite&&!s.reverse&&!flipped){const ta=$('mine');if(ta)mineText=ta.value;}
  if(!flipped&&s.recite&&!s.reverse&&!deck[pos].intro){showKeepMine();}
  flipped=!flipped;$('card').classList.toggle('flipped',flipped);
  $('flip').textContent=flipped?'返回正面（空格）':(deck[pos].intro?'翻面看记忆抓手（空格）':(s.recite&&!s.reverse?'核对并翻面（空格）':'翻面看答案（空格）'));
}
/* 翻面前把默写内容写进背面（不重置卡片状态） */
function showKeepMine(){
  const c=deck[pos],col=CATMAP[c.cat].color,st=saved.status[c.sid]||0,s=settings();
  const head='<div class="top"><span class="badge" style="background:'+col+'">'+CATMAP[c.cat].label+'　·　'+stat(st)+'</span><span class="idx">'+c.id+'　'+(pos+1)+'/'+deck.length+'</span></div>';
  const foot='<div class="src">所在小节：'+esc(c.src)+'　｜　徐钧《自体心理学入门》第二章</div>';
  let back=head+'<ul class="aList">'+c.a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(mineText.trim()){
    back+='<div class="mine"><b>你的默写</b>'+esc(mineText.trim())+'</div>';
    const hits=c.k.filter(w=>mineText.indexOf(w)>=0);
    back+='<div class="hit">关键词命中 '+hits.length+' / '+c.k.length+(hits.length?'：'+esc(hits.join('、')):'　— 建议对照全文再背一遍')+'</div>';
  }
  back+='<div class="kw">关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>'+foot;
  $('back').innerHTML=back;
}
function go(d){if(!deck.length)return;pos=(pos+d+deck.length)%deck.length;show();}
function rate(v){if(!deck.length)return;saved.status[deck[pos].sid]=v;persist();go(1);}

/* ============ 导出 ============ */
function download(name,text,type){
  const blob=new Blob(['\ufeff'+text],{type:type||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},200);
}
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}
$('btnCSV').onclick=()=>{
  const rows=[['编号','模块','语境','问题 / 情节标题','答案 / 情节正文','关键词','所在小节']];
  CARDS.forEach(c=>rows.push([c.id,c.intro?'案例情节':CATMAP[c.cat].label,c.ctx||'',c.q,c.a.join(' / '),c.k.join(' / '),c.src]));
  download('第2章_知识闪卡.csv',rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');
};
$('btnMD').onclick=()=>{
  let t='# 第二章 自体心理学的重点概念：内省-共情 · 知识闪卡\n\n> 依据：徐钧《自体心理学入门》pp.025–038 修复稿。纯知识卡，不含个人理解与口述类比。\n\n';
  CATS.forEach(c=>{
    const list=CARDS.filter(x=>x.cat===c.k);if(!list.length)return;
    t+='## '+c.label+'（'+list.length+' 张）\n\n';
    list.forEach(x=>{t+='**'+x.id+'｜'+(x.intro?'【案例情节】':'')+x.q+'**\n\n';if(x.ctx)t+='> 语境：'+x.ctx+'\n\n';x.a.forEach(a=>t+='- '+a+'\n');t+='\n> 关键词：'+x.k.join('、')+'　｜　所在小节：'+x.src+(x.intro&&x.follow?'\n> 后续：'+x.follow:'')+'\n\n';});
  });
  download('第2章_知识闪卡.md',t,'text/markdown;charset=utf-8');
};
$('btnPrint').onclick=()=>{
  let h='<h2>徐钧《自体心理学入门》· 第二章知识闪卡</h2><div class="meta">依据 pp.025–038 修复稿 ｜ 共 '+CARDS.length+' 张 ｜ 打印日期：'+new Date().toLocaleDateString('zh-CN')+'</div>';
  CATS.forEach(c=>{
    const list=CARDS.filter(x=>x.cat===c.k);if(!list.length)return;
    h+='<h3>'+c.label+'（'+list.length+' 张）</h3>';
    list.forEach(x=>{h+='<div class="item"><div class="qq">'+x.id+'　'+(x.intro?'【案例情节】':'')+esc(x.q)+'</div>'+(x.ctx?'<div class="ss">语境：'+esc(x.ctx)+'</div>':'')+'<div class="aa">'+x.a.map(esc).join('　／　')+'</div><div class="ss">所在小节：'+esc(x.src)+'</div></div>';});
  });
  $('printArea').innerHTML=h;
  setTimeout(()=>window.print(),60);
};

/* ============ 事件 ============ */
['fCat','fOrder'].forEach(id=>$(id).onchange=()=>{saveSettings();buildDeck();});
['fWeak','fRecite','fReverse'].forEach(id=>$(id).onchange=()=>{saveSettings();buildDeck();});
$('fReset').onclick=()=>{if(confirm('清除本套闪卡的全部自评记录？\n（不影响第一章、第三章闪卡的进度）')){saved.status={};persist();buildDeck();}};
$('flip').onclick=e=>{e.stopPropagation();flip();};
$('prev').onclick=()=>go(-1);
$('next').onclick=()=>go(1);
document.querySelectorAll('.rate').forEach(b=>b.onclick=()=>rate(+b.dataset.r));
$('card').onclick=e=>{if(e.target.id==='mine')return;flip();};
document.addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='TEXTAREA'||tag==='INPUT'||tag==='SELECT')return;
  const k=e.key.toLowerCase();
  if(e.code==='Space'||k===' '){e.preventDefault();flip();}
  else if(k==='arrowleft'){e.preventDefault();go(-1);}
  else if(k==='arrowright'){e.preventDefault();go(1);}
  else if(k==='1'||k==='2'||k==='3')rate(+k);
  else if(k==='r'){$('fOrder').value='rand';saveSettings();buildDeck();}
  else if(k==='m'){$('fRecite').checked=! $('fRecite').checked;saveSettings();buildDeck();}
  else if(k==='f'){$('fWeak').checked=! $('fWeak').checked;saveSettings();buildDeck();}
});

buildDeck();
</script>
</body>
