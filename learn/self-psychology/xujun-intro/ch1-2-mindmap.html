<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>徐钧《自体心理学入门》· 第一、二章 思维导图与闪卡</title>
<style>
  :root{
    --bg:#f6f5f1; --ink:#2c2c2a; --muted:#888780; --line:#e3e1d8; --card:#fff;
    --blue:#3b6ea5; --amber:#b07b23; --red:#b4493f; --green:#2f7d6b; --purple:#7356a3; --brown:#9a6b3f;
    --shadow:0 2px 16px rgba(0,0,0,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  header{height:56px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;background:#fff;position:relative;z-index:20}
  header h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
  header .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabs{margin-left:auto;display:flex;gap:4px;background:#f1efe8;padding:3px;border-radius:9px}
  .tabs button{border:0;background:transparent;padding:7px 15px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--muted)}
  .tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .view{display:none;position:absolute;top:56px;left:0;right:0;bottom:0}
  .view.on{display:flex}

  /* ---------- 思维导图 ---------- */
  #mind{flex-direction:column}
  .toolbar{display:flex;align-items:center;gap:7px;padding:9px 14px;border-bottom:1px solid var(--line);background:#fbfaf7;flex-wrap:wrap}
  .toolbar .grp{display:flex;gap:4px;align-items:center}
  .toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 5px}
  button.b{font-size:12px;padding:6px 11px;border:1px solid #d6d4ca;background:#fff;border-radius:7px;cursor:pointer;color:var(--ink)}
  button.b:hover{background:#f0eee6}
  button.b.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .hint{font-size:11px;color:var(--muted);margin-left:auto}
  .stageTag{font-size:11px;color:var(--brown);margin-top:3px;letter-spacing:.2px}
  #canvasWrap{flex:1;position:relative;overflow:hidden;cursor:grab}
  #canvasWrap.dragging{cursor:grabbing}
  #world{position:absolute;left:0;top:0;transform-origin:0 0}
  #wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  .node{position:absolute;width:196px;min-height:44px;padding:8px 11px;border-radius:9px;background:#fff;border:1px solid #dcd9cf;box-shadow:0 1px 5px rgba(0,0,0,.06);cursor:pointer;display:flex;align-items:center;font-size:12.5px;line-height:1.45;user-select:none;transition:box-shadow .15s,border-color .15s}
  .node:hover{box-shadow:var(--shadow);border-color:#b9b5a7}
  .node.sel{border-color:var(--blue);box-shadow:0 0 0 2px rgba(59,110,165,.18)}
  .node .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .node .tog{width:17px;height:17px;flex:none;border-radius:50%;border:1px solid #cfccc1;background:#f7f6f1;font-size:12px;line-height:15px;text-align:center;color:#6b6962;margin-left:6px}
  .node.d0{background:#2f4f6f;color:#fff;border-color:#2f4f6f;font-weight:600;font-size:13.5px}
  .node.d1{font-weight:600;border-left:4px solid var(--c,#3b6ea5)}
  .node.d2{background:#fdfcf9}
  .node.d3{background:#f7f5ef;font-size:12px;min-height:38px}
  #detail{position:absolute;right:14px;top:14px;width:288px;max-height:calc(100% - 28px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:15px 16px;display:none}
  #detail.show{display:block}
  #detail h3{margin:0 0 4px;font-size:14px}
  #detail .path{font-size:11px;color:var(--muted);margin-bottom:10px}
  #detail .note{font-size:12.5px;line-height:1.75;white-space:pre-wrap}
  #detail .kids{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.7}
  #detail .close{position:absolute;right:9px;top:8px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px}
  .legend{position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.85);padding:6px 10px;border-radius:7px;border:1px solid var(--line)}

  /* ---------- 闪卡 ---------- */
  #flash{flex-direction:column;align-items:center}
  .fbar{width:100%;padding:9px 14px;border-bottom:1px solid var(--line);background:#fbfaf7;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .fbar label{font-size:12px;color:var(--muted)}
  select,input[type=text]{font-size:12px;padding:6px 8px;border:1px solid #d6d4ca;border-radius:7px;background:#fff;color:var(--ink)}
  .chk{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;background:#fff;border:1px solid #d6d4ca;border-radius:7px;padding:6px 9px}
  .chk input{margin:0}
  .stats{width:100%;max-width:760px;padding:12px 4px 4px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px}
  .track{flex:1;height:7px;border-radius:5px;background:#e7e5dc;overflow:hidden}
  .track i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
  .cardArea{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:8px 16px 4px;min-height:0}
  .card{width:100%;max-width:760px;height:100%;max-height:430px;perspective:1400px;cursor:pointer}
  .inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:22px 26px;display:flex;flex-direction:column;overflow:auto}
  .face.back{transform:rotateY(180deg)}
  .badge{align-self:flex-start;font-size:11px;padding:4px 10px;border-radius:20px;color:#fff;background:var(--cc,#3b6ea5);letter-spacing:.3px}
  .q{font-size:20px;line-height:1.65;font-weight:600;margin:20px 0 8px;white-space:pre-wrap}
  .src{font-size:11px;color:var(--muted);margin-top:auto;padding-top:12px}
  .aList{font-size:15px;line-height:1.85;margin:14px 0 4px;padding-left:0;list-style:none;white-space:pre-wrap}
  .aList li{margin-bottom:9px;padding-left:16px;position:relative}
  .aList li:before{content:"";position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--cc,#3b6ea5)}
  .mine{background:#f7f5ef;border:1px dashed #d6d4ca;border-radius:9px;padding:10px 12px;font-size:13px;line-height:1.7;white-space:pre-wrap;margin-top:10px}
  .mine b{color:var(--muted);font-weight:500;font-size:11px;display:block;margin-bottom:4px}
  .hit{font-size:12px;color:var(--green);margin-top:8px}
  textarea{width:100%;min-height:88px;resize:vertical;font-size:14px;line-height:1.7;padding:11px 12px;border:1px solid #d6d4ca;border-radius:9px;font-family:inherit;color:var(--ink);background:#fcfbf7}
  .controls{width:100%;max-width:760px;padding:8px 4px 14px}
  .row1{display:flex;gap:8px;align-items:center;justify-content:center}
  .row1 button{font-size:13px;padding:9px 16px;border:1px solid #d6d4ca;background:#fff;border-radius:9px;cursor:pointer;color:var(--ink)}
  .row1 button.main{background:var(--blue);border-color:var(--blue);color:#fff;min-width:120px;font-weight:600}
  .row1 button:hover{filter:brightness(.96)}
  .row2{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .rate{font-size:12px;padding:8px 15px;border-radius:8px;border:1px solid;cursor:pointer;background:#fff}
  .rate.no{color:var(--red);border-color:#e3bdb8}
  .rate.mid{color:var(--amber);border-color:#e5d0a8}
  .rate.ok{color:var(--green);border-color:#b6d5c9}
  .rate:hover{background:#f7f6f1}
  .keys{text-align:center;font-size:11px;color:var(--muted);margin-top:9px}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:40px}
  @media(max-width:760px){header .sub{display:none}#detail{width:230px}.q{font-size:17px}.face{padding:16px 18px}}

/* === 个人学习分站 · 顶部返回条（部署时注入，打印时隐藏） === */
.xjLearnBar{background:#115e59;color:#fff;padding:7px 16px;display:flex;gap:7px;
  flex-wrap:wrap;align-items:center;font:12.5px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  position:relative;z-index:99}
.xjLearnBar a{color:#d9f4ee;text-decoration:none;white-space:nowrap}
.xjLearnBar a:hover{text-decoration:underline}
.xjLearnBar .xjSep{opacity:.55}
.xjLearnBar .xjHere{opacity:.8;white-space:nowrap}
@media print{.xjLearnBar{display:none!important}}

</style>
</head>
<body>
<div class="xjLearnBar" role="navigation"><a href="../../index.html">个人学习</a><span class="xjSep">›</span><a href="../index.html">自体心理学</a><span class="xjSep">›</span><a href="index.html">《自体心理学入门》</a><span class="xjSep">›</span><span class="xjHere">第一、二章 思维导图与闪卡</span></div>
<header>
  <h1>徐钧《自体心理学入门》· 第一、二章</h1>
  <span class="sub">思维导图 ＋ 闪卡复习 · 依据本空间修复稿与学习笔记，离线可用</span>
  <div class="tabs">
    <button id="tabMind" class="on">思维导图</button>
    <button id="tabFlash">闪卡复习</button>
  </div>
</header>

<!-- ============ 思维导图 ============ -->
<div id="mind" class="view on">
  <div class="toolbar">
    <div class="grp">
      <button class="b on" data-tree="all">两章总览</button>
      <button class="b" data-tree="c1">第一章</button>
      <button class="b" data-tree="c2">第二章</button>
      <button class="b" data-tree="oral">第二章 · 口述骨架</button>
    </div>
    <span class="sep"></span>
    <button class="b" id="expandAll">全部展开</button>
    <button class="b" id="collapseAll">收起子分支</button>
    <button class="b" id="fit">按宽度适应（阅读）</button>
    <button class="b" id="fitAll">全图概览</button>
    <button class="b" id="zoomOut">−</button>
    <button class="b" id="zoomIn">＋</button>
    <span class="hint">滚轮缩放 · 拖拽平移 · 点节点看释义 · 点 +/− 折叠分支</span>
  </div>
  <div id="canvasWrap">
    <div id="world"><svg id="wires"></svg><div id="nodes"></div></div>
    <div id="detail"><button class="close" id="detailClose">×</button><h3 id="dTitle"></h3><div class="path" id="dPath"></div><div class="note" id="dNote"></div><div class="kids" id="dKids"></div></div>
    <div class="legend">颜色＝分支主题 · 右侧面板显示完整释义 · 全部内容来自第一、二章修复稿</div>
  </div>
</div>

<!-- ============ 闪卡 ============ -->
<div id="flash" class="view">
  <div class="fbar">
    <label>范围</label>
    <select id="fCh"><option value="all">全部（第一章＋第二章）</option><option value="2">仅第二章（重点）</option><option value="1">仅第一章</option></select>
    <label>分类</label>
    <select id="fCat"><option value="all">全部分类</option></select>
    <label>顺序</label>
    <select id="fOrder"><option value="stage">按我的口述骨架（推荐）</option><option value="seq">按大纲顺序</option><option value="weak">弱项优先</option><option value="rand">随机</option></select>
    <label class="chk"><input type="checkbox" id="fWeak"> 只看未掌握</label>
    <label class="chk"><input type="checkbox" id="fRecite"> 默写／背诵模式</label>
    <button class="b" id="fReset">清除复习记录</button>
    <span class="hint">骨架蓝本：Get 笔记录音卡《自体心理学入门：内省与共情概念梳理》· 11-05 13:27 · 16 分钟</span>
  </div>
  <div class="stats">
    <span id="sPos">— / —</span>
    <div class="track"><i id="sBar"></i></div>
    <span id="sCnt">已掌握 0 · 模糊 0 · 待复习 0</span>
  </div>
  <div class="cardArea"><div class="card" id="card"><div class="inner">
    <div class="face front" id="front"></div>
    <div class="face back" id="back"></div>
  </div></div></div>
  <div class="controls">
    <div class="row1">
      <button id="prev">‹ 上一张</button>
      <button id="flip" class="main">翻面看答案（空格）</button>
      <button id="next">下一张 ›</button>
    </div>
    <div class="row2">
      <button class="rate no" data-r="1">1 · 忘了</button>
      <button class="rate mid" data-r="2">2 · 模糊</button>
      <button class="rate ok" data-r="3">3 · 记得</button>
    </div>
    <div class="keys">快捷键：空格 翻面｜← → 切换｜1/2/3 自评｜R 随机下一张　·　掌握度自动保存在本机浏览器</div>
  </div>
</div>

<script>
/* ================= 数据：思维导图 ================= */
const NODE_W=196, NODE_H=46, GAP_X=248, GAP_Y=13;
const PAL=['#3b6ea5','#2f7d6b','#b07b23','#7356a3','#b4493f','#9a6b3f','#4a708f','#7a8b3f','#a0557a'];
const CH1={id:'c1',t:'第一章 自体心理学及其发展',note:'三条线索：① 在当代精神分析中的历史位置 ② 如何发展而来（科胡特生平与临床工作） ③ 当代已有的发展。一个常见误判：自体心理学不是客体关系理论的分支，也不是脱胎于客体关系理论。',c:[
 {id:'c1a',t:'三个起源年',note:'1977：《自体的重建》正式提出「自体心理学」，最常采用的诞生年份。\n1971：《自体的分析》出版，系统思想形成。\n1959：内省-共情理论发表（1957 提出／1959 发表）。',c:[
   {id:'c1a1',t:'1977 · 诞生',note:'《自体的重建》出版，正式提出「自体心理学」；相对经典精神分析是平行的系统。遭保守派排斥。'},
   {id:'c1a2',t:'1971 · 系统思想',note:'《自体的分析》出版，自恋人格障碍治疗的系统视角；安娜·弗洛伊德致信认可。'},
   {id:'c1a3',t:'1959 · 方法起点',note:'〈内省、共情和精神分析〉发表；部分学者据此把起源定为这一年。'}]},
 {id:'c1b',t:'弗洛伊德三个核心概念',note:'无意识／因果原则／俄狄浦斯理论。',c:[
   {id:'c1b1',t:'无意识',note:'一个人的言行或心理问题，可能受到他自己意识不到的心理内容的影响。'},
   {id:'c1b2',t:'因果原则',note:'心理问题与过去生活及所遇事件相关，特别是 6 岁之前的事与成年后的困扰、问题行为相关。'},
   {id:'c1b3',t:'俄狄浦斯理论',note:'经典精神分析中十分重要，亦为弗洛伊德自己认为非常关键。',c:[
     {id:'c1b3a',t:'四概念',note:'心智结构／情境／阶段／情结。弗洛伊德未专门撰文区分，故常被误解；说「俄狄浦斯」不等于只说「俄狄浦斯情结」。'},
     {id:'c1b3b',t:'三元关系',note:'主体 ＋ 所爱的对象 ＋ 两者之间的禁止者。例：男孩三四岁想一直和妈妈在一起，爸爸成为竞争者／禁止者。'},
     {id:'c1b3c',t:'临床举例',note:'20 岁仍与母亲同床、要求父亲睡另一房间 → 父亲作为竞争者缺席 → 缺乏人际互动与情绪调节的练习 → 成年后与异性交往幼稚、被拒后一蹶不振，甚至出现焦虑、强迫症状。'}]}]},
 {id:'c1c',t:'精神分析学派谱系',note:'图 1 的 8 个分支：经典精神分析／自我心理学／客体关系·克莱因学派／客体关系·中间学派／自体心理学／关系性精神分析／主体间性精神分析／精神分析场论。',c:[
   {id:'c1c1',t:'自我心理学',note:'晚年弗洛伊德、安娜·弗洛伊德、哈特曼。适应理论；传入美国后主导北美精神分析界约 70 年，甚至影响认知疗法。'},
   {id:'c1c2',t:'克莱因学派',note:'梅兰妮·克莱因。1926 赴英；聚焦 0～3 岁尤其 0～2 岁；好客体／坏客体、偏执—分裂位到抑郁位的二阶心位理论。'},
   {id:'c1c3',t:'维也纳学派',note:'安娜·弗洛伊德。1938 随弗洛伊德流亡英国；1939 后与克莱因学派辩论。'},
   {id:'c1c4',t:'中间学派',note:'费尔贝恩、温尼科特、鲍尔比。不站队两派，结合两者发展出关注母婴关系的「狭义客体关系理论」。'},
   {id:'c1c5',t:'广义／狭义之别',note:'克莱因学派贡献被归入广义客体关系体系，但学派自身更愿视为经典精神分析的延续；严格说客体关系理论属中间学派的思想内容。'}]},
 {id:'c1d',t:'科胡特：生平与临床转折',note:'犹太人，维也纳大学医学训练（神经生理学）；1938 送母亲赴芝加哥、获医学博士、为流亡的弗洛伊德送行；1939 经拉比帮助离境抵英，入难民营患肺结核；1946–1950 芝加哥精神分析学院续训，1950 独立执业。',c:[
   {id:'c1d1',t:'关键临床转折',note:'一位无论怎样解释说明都会攻击他的来访者 → 科胡特改为不以自己的理论理解去诠释，只专注倾听，对来访者所说做复述、澄清、小结 → 来访者厘清思路、平静下来，治疗得以推进 → 之后再把理解以诠释方式传达 → 来访者不再攻击，认为被理解，且能自我接纳。',c:[
     {id:'c1d1a',t:'方法论（最应记住）',note:'分析家首先要认真倾听来访者所说的内容，理解其中蕴含的情感；分析家自己的理论应该成为后台而不是前台的东西。与第二章「精神现实／内省-共情」直接衔接。'}]},
   {id:'c1d2',t:'任职与荣誉',note:'1964 美国精神分析协会主席；1965 国际精神分析协会副主席；曾邀安娜·弗洛伊德讲学并接受其案例督导。'},
   {id:'c1d3',t:'三部著作',note:'1971《自体的分析》；1977《自体的重建》；1981 完稿、1984 出版《精神分析治愈之道》。1979 发表「Z 先生的两次分析」。'},
   {id:'c1d4',t:'晚年与去世',note:'1981 伯克利第四届国际自体心理学大会，肝腹水仍乘救护车赴会，宣读〈论共情〉后离开，当晚病危，次日去世；遗嘱要求销毁全部案例报告。'}]},
 {id:'c1e',t:'当代相关学派',note:'主体间性学派、关系性精神分析、复杂性／非线性系统理论、当代整合。',c:[
   {id:'c1e1',t:'主体间性学派',note:'史托罗楼、阿特伍德、布兰德查夫特、奥林奇。与现象学哲学密切关联；1994《体验的世界》；第一、二届大会上提出与经典自体心理学不同的观点。'},

/* --- 第二章 · 核心概念 --- */
{id:'q201',ch:2,cat:'核心概念',q:'什么是「内省-共情」？',a:['分析家／咨询师倾听来访者时内心出现的视觉性、感受性等多种状态。','把来访者主观陈述的内容，在自己的精神世界中加以呈现；「浸泡」在来访者的精神现实体验中。','科胡特在自体心理学中所指的共情，实质就是内省-共情；作者建议也可称「内省性倾听」。'],k:['内省','精神现实','呈现'],src:'第二章 · 共情是什么'},
{id:'q202',ch:2,cat:'核心概念',q:'什么是「精神现实」（心理现实）？',a:['来访者带着他独有的经验和精神体验来咨询。','咨询师不能抛开来访者的精神现实体验，去理解来访者所叙述的事情；否则其陈述内容就会被误解。'],k:['精神现实','独有','体验'],src:'第二章 · 精神现实与体验过程'},
{id:'q203',ch:2,cat:'核心概念',q:'「成熟的道德主义」指什么？',a:['成人或心理咨询师依据自身所秉持的一般现实标准，对儿童或来访者形成过于主观且缺乏共情的看法。','出处：White & Weiner, 2013。'],k:['现实标准','主观','缺乏共情'],src:'第二章 · 精神现实与体验过程'},
{id:'q204',ch:2,cat:'核心概念',q:'「共情-反馈技术／共情性技术」是什么？',a:['受罗杰斯影响的「来访者说一句、咨询师回应一句」的回馈方式。','属于咨询师对来访者的外显回应，不是科胡特所说的内省-共情。'],k:['罗杰斯','回应','外显'],src:'第二章 · 核心概念定义'},
{id:'q205',ch:2,cat:'核心概念',q:'「替代性内省」是什么？',a:['理解另一个人的精神世界时，逐渐站在那个人的立场去体验其精神世界。','共情具有替代性内省的功能。'],k:['立场','体验','精神世界'],src:'第二章 · 共情：心理功能的发展'},
{id:'q206',ch:2,cat:'核心概念',q:'「自体客体经验」是什么？',a:['被深度理解的体验。','在巴施案例中，由科胡特第二句话带来；如同「内心被压抑的部分被同步到另一个人的内心」。'],k:['被深度理解','巴施','第二句'],src:'第二章 · 共情：心理功能的发展'},
{id:'q207',ch:2,cat:'核心概念',q:'「自体感」是什么？',a:['一种重要的心理功能；被理解后获得的自信心、坚持与坚定的感觉。','巴施在科胡特回应后获得自信心、内心受到鼓舞；心里想说的话被直接说出来时，自我安抚功能也增强。'],k:['心理功能','自信心','坚定'],src:'第二章 · 共情：心理功能的发展'},
{id:'q208',ch:2,cat:'核心概念',q:'「经验贴近」与「经验远离」分别指什么？',a:['经验贴近（体验贴近）：一幕幕情境在脑海中浮现的内省-共情过程。','经验远离：把听到的东西概念化、形成语言并表达，或形成对来访者情感过程的理解。','有时一瞬间完成；实际个案中把感悟组织成合适的语言，可能需要几周、几个月，甚至半年、一年。'],k:['浮现','概念化','语言'],src:'第二章 · 以攻击形式为例'},
{id:'q209',ch:2,cat:'核心概念',q:'「面质」是什么？为什么原书说「不宜面质对方」？',a:['面质＝confrontation，是心理咨询的一种技术术语，不可拆读成「当面／质问」。','来访者讲创伤时满面笑容，不宜面质「为什么你在讲这么悲惨的事情时却在笑？」，而要尝试理解笑容背后的内涵和意义。'],k:['confrontation','技术','不宜'],src:'第二章 · 以攻击形式为例（术语辨正）'},
{id:'q210',ch:2,cat:'核心概念',q:'本章的一句话主旨是什么？',a:['内省-共情是自体心理学的基础与最基本工作方法。','科胡特所说的共情不是一般心理咨询（罗杰斯式）的共情技术，而是分析师内部用以收集来访者精神现实资料的过程——它中性、不必然有疗效，也未必指向善意。'],k:['基础','收集资料','中性'],src:'第二章 · 一句话主旨'},
/* --- 第二章 · 关键辨析 --- */
{id:'q211',ch:2,cat:'关键辨析',q:'科胡特的共情＝罗杰斯的共情吗？请从三方面说明。',a:['位置：分析师内心发生的过程 vs 咨询师对来访者的外显回应。','功能：收集来访者精神现实的资料 vs 被认为具有治疗意义的共情-反馈技术。','疗效：科胡特一直坚持共情没有治疗意义（即便有也间接、不清晰）vs 罗杰斯认为有治疗意义。'],k:['内心','外显','收集资料','没有治疗意义'],src:'第二章 · 科胡特关于共情的争议'},
{id:'q212',ch:2,cat:'关键辨析',q:'共情有治疗作用吗？科胡特与后期研究各怎么说？',a:['科胡特：一直坚持共情没有治疗意义；即便有也间接、不清晰。','〈论共情〉「有人认为共情是有疗效的，那么我们暂且认为它是有疗效的」，作者倾向视为科胡特的无奈表达。','后期研究：分析师用内省-共情理解来访者时，态度变化 → 非言语信息可能变化 → 若与来访者产生共鸣，可能确有某种治疗效果，但不像共情-反馈技术那么清晰。'],k:['没有治疗意义','无奈','非言语'],src:'第二章 · 科胡特关于共情的争议'},
{id:'q213',ch:2,cat:'关键辨析',q:'共情必然是善意、助人的吗？举出原文两类反例。',a:['不是。共情是中性的，本质是对另一个人的主观世界进行深入理解并与之共振。','反例一：纳粹把游击队员吊死在村边电线杆且不许收尸，基于对人们内心恐惧的共情理解。','反例二：电信诈骗、保健品诈骗，精准捕捉受害者内心的欲望与需求。'],k:['中性','纳粹','诈骗'],src:'第二章 · 科胡特关于共情的争议'},
{id:'q214',ch:2,cat:'关键辨析',q:'「接纳」等于「认同」吗？',a:['不等于。','这类陈述首先要被接纳，咨询才能继续；咨询师首先要有接纳和理解的基本态度。','接纳是咨询得以继续的前提，而不是对来访者叙述内容的客观认可。'],k:['不等于','前提','态度'],src:'第二章 · 精神现实与体验过程'},
{id:'q215',ch:2,cat:'关键辨析',q:'来访者讲创伤时满面笑容，说明他已经释然了吗？',a:['不说明。「并不代表他们已经释然」，反而可能表明创伤很严重。','笑容是保护自己的一种方式；咨询师会有解离感。','此时不宜面质，要尝试理解笑容背后的内涵和意义。'],k:['不代表','保护','不宜面质'],src:'第二章 · 以攻击形式为例'},
{id:'q216',ch:2,cat:'关键辨析',q:'「攻击」就等于「攻击性」吗？',a:['不等于。事物的形式与内涵有很大区别，不能把表象或形式等同于内涵；表象只代表事物的一部分。','同样是攻击，主观世界可以完全不同。'],k:['形式','内涵','主观世界'],src:'第二章 · 以攻击形式为例'},
{id:'q217',ch:2,cat:'关键辨析',q:'高频分析与低频咨询，对内省-共情有何不同影响？',a:['科胡特当时多为躺椅式经典精神分析、一周 3～5 次，深度感受较容易。','现在绝大多数是一周一次的低频分析取向咨询，一来一往的谈话会影响内省-共情过程，所得资料不如高频充足。','但方法依然重要：某些内省片段浮现时，对深入理解来访者意义重大。'],k:['3～5 次','一周一次','资料'],src:'第二章 · 以攻击形式为例'},
{id:'q218',ch:2,cat:'关键辨析',q:'「自体心理学是客体关系理论的分支」对吗？（跨章衔接）',a:['错误。','自体心理学也不是脱胎于客体关系理论；其基础更偏向维也纳学派的经典精神分析传统，至少一开始两者是完全不同的发展方向。'],k:['错误','维也纳学派','平行'],src:'第一章 · 易混淆点辨析'},
{id:'q219',ch:2,cat:'关键辨析',q:'广义与狭义「客体关系理论」如何区分？（跨章衔接）',a:['克莱因学派的贡献被归入广义客体关系理论体系，但学派自身更愿视为经典精神分析的延续。','严格说，客体关系理论属中间学派（费尔贝恩、温尼科特、鲍尔比）关于母婴关系的思想内容。'],k:['广义','中间学派','母婴'],src:'第一章 · 精神分析学派谱系'},
/* --- 第二章 · 案例速查 --- */
{id:'q220',ch:2,cat:'案例速查',q:'「追求女同学受创伤」的来访者，说明什么？',a:['说明精神现实与旁观者客观标准的区别。','咨询师若只帮来访者调整认知观念，来访者仍会坚持自己受了严重创伤；站在一般旁观者位置，就无法关注精神现实，也无法发展出理解性的咨访关系。'],k:['精神现实','旁观者','切身感受'],src:'第二章 · 精神现实与体验过程'},
{id:'q221',ch:2,cat:'案例速查',q:'三四岁孩子说「昨天到月球／星星上玩了」，妈妈说「撒谎」，问题在哪？',a:['不是对错问题，是「频道不一致」：妈妈谈客观不可能，孩子表达的是幻想中的精神现实。','0～6 岁不能清楚区分现实和幻想；这种混淆实际上是很活跃、很健康的一种发展。'],k:['频道不一致','幻想','0～6 岁'],src:'第二章 · 精神现实与体验过程'},
{id:'q222',ch:2,cat:'案例速查',q:'「咨询师要休假」那段对话，说明什么？',a:['咨询师看似现实、合理的回应，实为「成熟的道德主义」——以一般现实标准取代对来访者精神现实的理解。','来访者反复追问「我这两周该怎么办」，背后常与分离焦虑、死亡焦虑、早期被抛弃等创伤相关。'],k:['成熟的道德主义','分离焦虑','休假'],src:'第二章 · 精神现实与体验过程'},
{id:'q223',ch:2,cat:'案例速查',q:'巴施案例中，科胡特哪一句话才是内省-共情？为什么？',a:['第一句「我看到你那篇文章了」不是：巴施仍感到焦虑、心跳加速，未感到安全或被理解。','第二句才是：科胡特说出他提出批评的初衷是对自己观点的关注和爱护、对自体心理学发展的关注，因此表达完全可以接受、完全可以倾听。','结果：巴施瞬间松了一口气，获得被深度理解的「自体客体经验」。'],k:['第二句','初衷','自体客体经验'],src:'第二章 · 共情是什么／心理功能的发展'},
{id:'q224',ch:2,cat:'案例速查',q:'读巴施的故事时，脑子里浮现一幕幕画面，科胡特称之为什么？',a:['以视觉性为主的内省过程（也可含听觉性、感受性成分）。','科胡特称此类心理过程为「内省-共情」。'],k:['视觉性','内省','内省-共情'],src:'第二章 · 共情是什么'},
{id:'q225',ch:2,cat:'案例速查',q:'纳粹吊死游击队员、电信／保健品诈骗，说明什么？',a:['共情是中性的，可用于恶的目的。','纳粹基于对人们内心恐惧的共情理解实施威慑；诈骗精准捕捉受害者内心的欲望与需求。','共情的本质是对另一个人的主观世界进行深入理解并与之共振。'],k:['中性','恐惧','欲望'],src:'第二章 · 科胡特关于共情的争议'},
{id:'q226',ch:2,cat:'案例速查',q:'早期航天计划中，猩猩返回地球时「嘴角上扬」实际代表什么？',a:['代表惊恐，而不是高兴。','众人以为它高兴，动物心理学家指出那是惊恐反应；属于「表象 ≠ 内涵」的例证。'],k:['惊恐','表象','内涵'],src:'第二章 · 以攻击形式为例'},
{id:'q227',ch:2,cat:'案例速查',q:'印度德里大学讲课时台下人人摇头，实际代表什么？',a:['代表赞赏、正在思考，而不是讲得不好。','属于文化差异造成的表象误读。'],k:['赞赏','思考','文化'],src:'第二章 · 以攻击形式为例'},
{id:'q228',ch:2,cat:'案例速查',q:'狮子捕捉瞪羚 vs 领地出现陌生雄狮，内在情感体验有何不同？',a:['捕捉瞪羚：力量感、控制感，没有愤怒；目的是捕食，与食欲有关。','领地入侵：愤怒，甚至暴怒；因感觉领地被侵犯而发起攻击。','结论：同为攻击，形式同而内涵异。'],k:['无愤怒','暴怒','领地'],src:'第二章 · 以攻击形式为例'},
/* --- 第二章 · 方法与技术 --- */
{id:'q229',ch:2,cat:'方法与技术',q:'通过内省-共情，收集的是什么资料？',a:['不是客观资料，而是来访者精神现实的资料。','以替代性或内省性方式深入倾听其精神现实，能收集到关于此人精神现实的、丰富且多样的资料，从而更好地理解这个人。'],k:['精神现实','不是客观','替代性'],src:'第二章 · 通过内省-共情收集资料'},
{id:'q230',ch:2,cat:'方法与技术',q:'科胡特 1959 年论文与弗洛伊德 1921 年的关系？',a:['论文〈内省、共情和精神分析：对观察模式和理论之关系的探讨〉。','其共情概念受弗洛伊德 1921 年界定启发：「一条借着模仿，经由认同，通往共情的途径」。','引注：（奥恩斯坦，2026，p.153–171）——年份疑为 2016，待核。'],k:['1959','1921','模仿','认同'],src:'第二章 · 共情是什么'},
{id:'q231',ch:2,cat:'方法与技术',q:'面对「另一种精神生活」，需要怎样的态度？',a:['需以能够接受任何可能性的态度，去了解其内在机制。','也可理解为：经由对另一个人的认同，去理解其精神世界中的任何可能性。'],k:['任何可能性','认同','内在机制'],src:'第二章 · 共情是什么'},
{id:'q232',ch:2,cat:'方法与技术',q:'为什么说「回应」也是一种心理功能层面的回应？',a:['不仅是一种理解，还增强了心理功能：被理解者获得自体感（自信心、坚持与坚定）、内心受到鼓舞，自我安抚功能也增强。','感受来访者压抑的东西并帮他说出来，可使其重新理解并整合被排斥、压抑的内容，使其成为自体的重要力量。','「而这正是自体心理学的核心工作」。'],k:['心理功能','自体感','自我安抚','核心工作'],src:'第二章 · 共情：心理功能的发展'},
{id:'q233',ch:2,cat:'方法与技术',q:'为什么不应急于诠释？「经验贴近→经验远离」的临床意义是什么？',a:['情境在脑海中浮现（经验贴近）之后，把感悟组织成合适的语言，可能需要几周、几个月，甚至半年、一年。','咨询师对来访者内心做出深刻的理解与诠释，能帮助真正疗愈创伤。','因此这是做出干预前，分析师内部十分重要的过程。'],k:['几周','半年','干预前'],src:'第二章 · 以攻击形式为例'},
{id:'q234',ch:2,cat:'方法与技术',q:'精神分析作为治疗方案，如何安置内省-共情？它的两面性是什么？',a:['把内省-共情与人文主义、人道主义结合在一起，作为治疗和帮助他人的手段。','但「有些居心叵测的人也可能会把它用作一种虐待或欺骗他人的手段」。'],k:['人文主义','人道主义','虐待'],src:'第二章 · 通过内省-共情收集资料'},
{id:'q235',ch:2,cat:'方法与技术',q:'「共情」有哪些中文译名？作者建议怎么称呼？',a:['共感／同理／同理心；教育学中有时译「移情」；中国台湾地区译「神入」。','作者建议称「内省性倾听」，以免与罗杰斯式共情混淆。'],k:['神入','移情','内省性倾听'],src:'第二章 · 共情是什么'},
{id:'q236',ch:2,cat:'方法与技术',q:'对科胡特共情的误解，从何而来？',a:['许多人没读过科胡特 1959 年那篇重要论文，便想当然认为他说的共情就是罗杰斯的共情。','当时人本主义疗法在北美传播正盛，「一听到共情，想到的就是罗杰斯」。','科胡特去世前宣读的〈论共情〉仍在努力澄清这个概念。'],k:['1959','罗杰斯','论共情'],src:'第二章 · 科胡特关于共情的争议'},
/* --- 第二章 · 术语英中 --- */
{id:'q237',ch:2,cat:'术语英中',q:'empathy',a:['共情／共感／同理／同理心；中国台湾地区译「神入」；教育学中有时译「移情」。'],k:['共情','同理','神入'],src:'第二章 · 术语对照'},
{id:'q238',ch:2,cat:'术语英中',q:'introspection-empathy ／ psychic reality',a:['introspection-empathy ＝ 内省-共情。','psychic reality ＝ 精神现实（心理现实）。'],k:['内省-共情','精神现实'],src:'第二章 · 术语对照'},
{id:'q239',ch:2,cat:'术语英中',q:'mature moralism ／ empathic feedback technique',a:['mature moralism ＝ 成熟的道德主义。','empathic feedback technique ＝ 共情-反馈技术。'],k:['成熟的道德主义','共情-反馈技术'],src:'第二章 · 术语对照'},

{id:'q105',ch:1,cat:'第一章要点',q:'为什么说「自体心理学脱胎于客体关系理论」是错的？',a:['错误。其基础更偏向维也纳学派的经典精神分析传统；至少一开始，两者是完全不同的发展方向。','《自体的重建》提出的自体心理学，相对经典精神分析是平行的系统。'],k:['错误','维也纳','平行'],src:'第一章 · 易混淆点辨析'},
{id:'q106',ch:1,cat:'第一章要点',q:'科胡特最关键的临床转折是什么？带来了怎样的方法论？',a:['一位无论怎样解释说明都会攻击他的来访者 → 他改为不以自己的理论去诠释，只专注倾听，做复述、澄清、小结 → 来访者平静、治疗推进 → 之后再把理解以诠释传达 → 来访者不再攻击，认为被理解。','方法论：分析家首先要认真倾听来访者所说的内容，理解其中蕴含的情感；分析家自己的理论应该成为后台而不是前台的东西。'],k:['倾听','复述','后台'],src:'第一章 · 科胡特生平及其临床工作'},
{id:'q107',ch:1,cat:'第一章要点',q:'科胡特三部主要著作及年份？',a:['1971《自体的分析》：自恋人格障碍治疗的系统视角。','1977《自体的重建》：正式提出「自体心理学」，遭保守派排斥。','1981 完稿、1984 出版《精神分析治愈之道》：晚期思考的凝结。'],k:['1971','1977','1984'],src:'第一章 · 著作与争议'},
{id:'q108',ch:1,cat:'第一章要点',q:'主体间性学派与关系性精神分析，各自的关键人物与要点？',a:['主体间性：史托罗楼、阿特伍德、布兰德查夫特、奥林奇；与现象学哲学密切关联，1994《体验的世界》。','关系性精神分析：格林伯格、米切尔、本杰明、阿伦；1982 提出「关系性」，汇聚客体关系、自体心理学、人际学派。','关系性的「关系」包含相互性，与客体关系的「关系」概念不同。'],k:['史托罗楼','米切尔','相互性'],src:'第一章 · 与自体心理学相关的学派'},
{id:'q109',ch:1,cat:'第一章要点',q:'中国「新古典」的三类拓扑学分别是什么？',a:['第一拓扑学：意识、前意识、无意识。','第二拓扑学：自我、它性（本我）、超我结构。','第三拓扑学：以场论和命运共同体为核心。'],k:['意识','超我','场论'],src:'第一章 · 中国脉络'},
{id:'q110',ch:1,cat:'第一章要点',q:'二阶心位理论是什么？',a:['克莱因学派的心位理论：偏执—分裂位 → 抑郁位。','克莱因重视从二元关系到三元关系的发展，聚焦 0～3 岁尤其 0～2 岁。'],k:['偏执—分裂位','抑郁位','克莱因'],src:'第一章 · 精神分析学派谱系'},
{id:'q111',ch:1,cat:'第一章要点',q:'第一章与第二章如何衔接？',a:['第一章末科胡特的临床转折（倾听优先、理论退居后台）正是第二章「精神现实／内省-共情」的问题起点。','第一章科胡特临终宣读的〈论共情〉，与第二章对共情概念的澄清相呼应。'],k:['倾听优先','论共情','精神现实'],src:'第一章 · 与第二章的衔接'},

{id:'q301',ch:2,cat:'口述骨架',st:0,q:'我口述复盘第二章时，依次讲了哪六段？（背下这条＝拿到整章骨架）',a:['① 精神现实与体验过程（精神现实 vs 客观现实、成熟的道德主义）。','② 共情不是共情反馈技术（研究方法／替代性内省、中性、不产生疗效但有间接效果）。','③ 共情作为心理功能的发展（重新整合被压抑内容、自体客体经验、自我安抚）。','④ 关注内涵而非形式（狮子的两种攻击、笑容与创伤）。','⑤ 经验贴近 → 经验远离（先投入、再抽离，两者缺一不可）。','⑥ 科胡特高频 3～5 次 vs 当代一周一次的落差。','开场总纲：内省-共情是科胡特所认为的精神分析的基础。'],k:['精神现实','反馈技术','心理功能','内涵','经验贴近','高频'],src:'Get 笔记录音卡 · 11-05 13:27 · 16 分钟'},
{id:'q302',ch:2,cat:'口述骨架',st:1,q:'我把「精神现实 vs 客观现实」类比成了中国文化的哪句话？我又怎么限定这个类比？',a:['类比：「论迹不论心」。','限定：他做出来的事，以及别人根据这些事形成的理解与认知，可能与他本身的切身感受和本意有所区别。'],k:['论迹不论心','本意','切身感受'],src:'Get 笔记口述 00:01:34–00:01:41'},
{id:'q303',ch:2,cat:'口述骨架',st:1,q:'关于「被这样误解」的影响，我补了原书没有展开的哪一层区分？',a:['若这个人很成熟、自体感也很强，被这样误解对他影响不大。','若自体感比较虚弱，或本身就是一个小朋友（0～6 岁现实与幻想混淆属正常），影响显著：孩子会觉得委屈，并认定「我不是一个好孩子」。'],k:['自体感','虚弱','小朋友','好孩子'],src:'Get 笔记口述 00:02:04–00:03:00（我的个人理解）'},
{id:'q304',ch:2,cat:'口述骨架',st:2,q:'我用哪两个词给科胡特的共情定位？为什么不是「技术」？',a:['「研究方法」而非「技术」；并且是「中性」的。','因为它是咨询师用来贴近来访者主观现实、站在其位置理解以收集更多信息的内部过程（也称替代性内省），而不是说一句回应一句的反馈技术。','共情可以被用于恶意：理解对方的想法与弱点后加以利用、操纵。'],k:['研究方法','中性','替代性内省','操纵'],src:'Get 笔记口述 00:04:48–00:06:21'},
{id:'q305',ch:2,cat:'口述骨架',st:2,q:'我怎么解释「共情本身不产生疗效，却仍可能带来间接疗效」？',a:['科胡特认为这个内部过程本身不产生疗效。','但如果贴得很近，深度理解会影响咨询师的态度、微表情、微动作，形成与来访者的精神共鸣。','整体姿态与氛围可能带来间接治疗效果；不同于共情反馈技术产生的那种明确效果。'],k:['不产生疗效','微表情','精神共鸣','间接'],src:'Get 笔记口述 00:06:37–00:07:19'},
{id:'q306',ch:2,cat:'口述骨架',st:3,q:'在「重新整合被压抑内容」这个过程里，我把咨询师称作什么？',a:['辅助者。','咨询师帮助来访者看到、感知到被压抑排斥的部分，并把它重新纳入回来；像重新发现一个什么、再纳入回来的经验，从而增强自体力量。'],k:['辅助者','重新纳入','自体力量'],src:'Get 笔记口述 00:08:15–00:09:01（我的说法）'},
{id:'q307',ch:2,cat:'口述骨架',st:4,q:'补全我口述里的那句金句：「咨询师重要的并不是……而是……」',a:['「咨询师重要的并不是关注来访者的表现形式，而是去理解他这个表现的内涵。」','对应狮子案例：虽然看起来都是攻击性，但相同的形式之下，内涵是全然不同的。'],k:['表现形式','内涵','全然不同'],src:'Get 笔记口述 00:11:18、00:12:28（金句）'},
{id:'q308',ch:2,cat:'口述骨架',st:5,q:'我对「经验贴近／经验远离」提出的个人理解是什么？为什么两者缺一不可？',a:['先投入进去体验，再抽离出来把它意识化、言语化地整理出来。','只贴近：双方会沉浸在那个氛围里出不来。','只远离：可能就退回「成熟的道德主义」。','所以必须先投入、再抽离，这是做出干预之前咨询师内部十分重要的过程。'],k:['先投入','再抽离','沉浸','成熟的道德主义'],src:'Get 笔记口述 00:14:44–00:15:31（我的个人理解）'},
{id:'q309',ch:2,cat:'口述骨架',st:6,q:'高频与低频的落差，我口述时给出的现实理由和结论分别是什么？',a:['现实：科胡特当时多为高频（一周 3～5 次）的经典精神分析；现在常见咨询以一周一次为主，资料没有那么多。','影响：特别深入、贴近地感受来访者比较有难度。','结论：把这个方法整合进自己的工作，对于理解来访者依然相当关键。'],k:['3～5 次','一周一次','资料','整合'],src:'Get 笔记口述 00:15:42–00:16:17'},
{id:'q310',ch:2,cat:'口述骨架',st:7,q:'这条口述笔记里，我给自己留下了一个什么小疑问？我当时怎么收束它？',a:['疑问：原书说「后者的心理功能就会发生转变」——「后者」指来访者还是咨询师？','收束：不管怎么说，被压抑的那个人被理解时，他的心理功能一定是会发生转变的。'],k:['后者','被压抑','转变'],src:'Get 笔记口述 00:10:14–00:10:43（待回到原书核对）'},

/* ================= 思维导图逻辑 ================= */
let treeKey='all', collapsed=new Set(), scale=1, panX=40, panY=40, selected=null;
const $=id=>document.getElementById(id);
const wrap=$('canvasWrap'), world=$('world'), wires=$('wires'), nodesBox=$('nodes');
function eachNode(n,fn,depth=0,parent=null){fn(n,depth,parent);(n.c||[]).forEach(k=>eachNode(k,fn,depth+1,n));}
function visibleKids(n){return collapsed.has(n.id)?[]:(n.c||[]);}
function measure(n){
  const kids=visibleKids(n); let sum=0;
  kids.forEach(k=>{sum+=measure(k)+GAP_Y;});
  if(sum>0)sum-=GAP_Y;
  n._kh=sum; n._sub=Math.max(NODE_H,sum);
  return n._sub;
}
function place(n,depth,top){
  n._x=depth*GAP_X; n._y=top+n._sub/2-NODE_H/2;
  const kids=visibleKids(n);
  let cy=top+(n._sub-n._kh)/2;
  kids.forEach(k=>{place(k,depth+1,cy);cy+=k._sub+GAP_Y;});
}
let pathMap={};
function buildPath(n,pre){pathMap[n.id]=pre;(n.c||[]).forEach(k=>buildPath(k,pre.concat([n.t])));}
function renderTree(){
  const root=TREES[treeKey];
  collapsed=new Set([...collapsed].filter(id=>{let ok=false;eachNode(root,x=>{if(x.id===id)ok=true;});return ok;}));
  measure(root); place(root,0,0);
  pathMap={}; buildPath(root,[]);
  let maxX=0,maxY=0,W=[];
  eachNode(root,n=>{if(!collapsed.has(n.id)||true){} });
  const list=[];
  function collect(n,depth){
    if(selected===n.id){}
    list.push(n);
    visibleKids(n).forEach(k=>collect(k,depth+1));
  }
  collect(root,0);
  list.forEach(n=>{maxX=Math.max(maxX,n._x+NODE_W);maxY=Math.max(maxY,n._y+NODE_H);});
  world.style.width=(maxX+40)+'px'; world.style.height=(maxY+40)+'px';
  wires.setAttribute('width',maxX+40); wires.setAttribute('height',maxY+40);
  wires.setAttribute('viewBox','0 0 '+(maxX+40)+' '+(maxY+40));
  let svg='';
  function lines(n){
    visibleKids(n).forEach(k=>{
      const x1=n._x+NODE_W,y1=n._y+NODE_H/2,x2=k._x,y2=k._y+NODE_H/2;
      const dx=(x2-x1)*.5;
      const color=depthColor(k);
      svg+='<path d="M '+x1+' '+y1+' C '+(x1+dx)+' '+y1+', '+(x2-dx)+' '+y2+', '+x2+' '+y2+'" fill="none" stroke="'+color+'" stroke-width="1.6" opacity="0.42"/>';
      lines(k);
    });
  }
  lines(root);
  wires.innerHTML=svg;
  nodesBox.innerHTML='';
  list.forEach(n=>{
    const kids=n.c||[];
    const el=document.createElement('div');
    el.className='node d'+Math.min(n._depth||0,3);
    // depth recompute via path length
    const dep=(pathMap[n.id]||[]).length;
    el.className='node d'+Math.min(dep,3);
    el.style.left=n._x+'px'; el.style.top=n._y+'px';
    el.style.setProperty('--c',depthColor(n));
    el.title=n.t+(n.note?' — 点击查看释义':'');
    el.innerHTML='<span class="txt">'+n.t+'</span>'+(kids.length?'<span class="tog">'+(collapsed.has(n.id)?'+':'−')+'</span>':'');
    el.onclick=e=>{
      if(e.target.classList.contains('tog')){
        collapsed.has(n.id)?collapsed.delete(n.id):collapsed.add(n.id);
        renderTree(); return;
      }
      selected=n.id; showDetail(n,dep);
      [...nodesBox.children].forEach(c=>c.classList.remove('sel')); el.classList.add('sel');
    };
    nodesBox.appendChild(el);
  });
  applyTransform();
}
function depthColor(n){
  const dep=(pathMap[n.id]||[]).length;
  if(dep===0)return '#2f4f6f';
  if(dep===1){let idx=0;const root=TREES[treeKey];const arr=treeKey==='all'?(root.c||[]):[root];
    // find top-level ancestor
    let cur=n, p=pathMap[n.id];
    const name=p.length?p[p.length-1]:'';
    const kids=visibleKids(root);
    idx=kids.findIndex(k=>k.id===cur.id||p.indexOf(k.t)>=0);
    if(idx<0)idx=0;
    return PAL[idx%PAL.length];
  }
  const root=TREES[treeKey];let ci=0;
  (root.c||[]).forEach((k,i)=>{if((pathMap[n.id]||[]).indexOf(k.t)>=0)ci=i;});
  return PAL[ci%PAL.length];
}
function showDetail(n,dep){
  $('detail').classList.add('show');
  $('dTitle').textContent=n.t;
  const p=pathMap[n.id]||[];
  $('dPath').textContent=p.length?p.join('  ›  '):'根节点';
  $('dNote').textContent=n.note||'（本节点为分类标题，展开子分支查看具体内容）';
  const kids=n.c||[];
  $('dKids').innerHTML=kids.length?'子分支（'+kids.length+'）：'+kids.map(k=>'· '+k.t).join('<br>'):'';
}
function applyTransform(){world.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';}
function fit(){
  const w=world.offsetWidth||800;
  const cw=wrap.clientWidth;
  scale=Math.min((cw-40)/w,1.05);
  scale=Math.max(scale,.3);
  panX=Math.max(20,(cw-w*scale)/2);
  panY=20;
  applyTransform();
}
function fitAll(){
  const w=world.offsetWidth||800,h=world.offsetHeight||600;
  const cw=wrap.clientWidth,ch=wrap.clientHeight;
  scale=Math.min((cw-40)/w,(ch-40)/h,1.05);
  scale=Math.max(scale,.15);
  panX=Math.max(20,(cw-w*scale)/2);
  panY=Math.max(20,(ch-h*scale)/2);
  applyTransform();
}
let drag=null;
wrap.addEventListener('mousedown',e=>{if(e.target.closest('.node')||e.target.closest('#detail'))return;drag={x:e.clientX,y:e.clientY,px:panX,py:panY};wrap.classList.add('dragging');});
window.addEventListener('mousemove',e=>{if(!drag)return;panX=drag.px+e.clientX-drag.x;panY=drag.py+e.clientY-drag.y;applyTransform();});
window.addEventListener('mouseup',()=>{drag=null;wrap.classList.remove('dragging');});
wrap.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY>0?.9:1.1;scale=Math.min(2.2,Math.max(.25,scale*f));applyTransform();},{passive:false});
document.querySelectorAll('[data-tree]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-tree]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  treeKey=b.dataset.tree;selected=null;$('detail').classList.remove('show');
  collapsed=new Set();
  eachNode(TREES[treeKey],(n,d)=>{if(d>=2&&(n.c||[]).length)collapsed.add(n.id);});
  renderTree();fit();
});
$('expandAll').onclick=()=>{collapsed=new Set();renderTree();};
$('collapseAll').onclick=()=>{
  const root=TREES[treeKey];collapsed=new Set();
  eachNode(root,(n,d)=>{if(d>=2&&(n.c||[]).length)collapsed.add(n.id);});
  renderTree();fit();
};
$('fit').onclick=fit;
$('fitAll').onclick=fitAll;
$('zoomIn').onclick=()=>{scale=Math.min(2.2,scale*1.15);applyTransform();};
$('zoomOut').onclick=()=>{scale=Math.max(.25,scale/1.15);applyTransform();};
$('detailClose').onclick=()=>{$('detail').classList.remove('show');selected=null;};

/* ================= 闪卡逻辑 ================= */
const KEY='xujun_ch12_flash_v1';
let saved={status:{},idx:0,settings:{}};
try{const raw=localStorage.getItem(KEY);if(raw)saved=Object.assign(saved,JSON.parse(raw));}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){}}
const fCh=$('fCh'),fCat=$('fCat'),fOrder=$('fOrder'),fWeak=$('fWeak'),fRecite=$('fRecite');
const cats=[...new Set(CARDS.map(c=>c.cat))];
cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;fCat.appendChild(o);});
if(saved.settings&&Object.keys(saved.settings).length){if(saved.settings.ch)fCh.value=saved.settings.ch;if(saved.settings.cat)fCat.value=saved.settings.cat;if(saved.settings.order&&[...fOrder.options].some(o=>o.value===saved.settings.order))fOrder.value=saved.settings.order;fWeak.checked=!!saved.settings.weak;fRecite.checked=!!saved.settings.recite;}
else{fCh.value='2';fOrder.value='stage';}
let deck=[],pos=0,flipped=false,mineText='';
function settings(){return{ch:fCh.value,cat:fCat.value,order:fOrder.value,weak:fWeak.checked,recite:fRecite.checked};}
function buildDeck(){
  const s=settings();
  deck=CARDS.filter(c=>(s.ch==='all'||String(c.ch)===s.ch)&&(s.cat==='all'||c.cat===s.cat))
    .filter(c=>!s.weak||(saved.status[c.id]||0)!==3);
  if(s.order==='stage')deck=deck.slice().sort((a,b)=>stageOf(a)-stageOf(b));
  if(s.order==='rand')deck=deck.slice().sort(()=>Math.random()-.5);
  if(s.order==='weak'){
    const w=id=>{const v=saved.status[id]||0;return v===1?0:v===2?1:v===0?2:3;};
    deck=deck.slice().sort((a,b)=>w(a.id)-w(b.id));
  }
  pos=Math.min(saved.idx||0,Math.max(0,deck.length-1));
  render();
}
function saveSettings(){saved.settings=settings();persist();}
[fCh,fCat,fOrder,fWeak,fRecite].forEach(el=>el.addEventListener('change',()=>{saved.idx=0;saveSettings();buildDeck();}));
$('fReset').onclick=()=>{if(confirm('确定清除所有卡片的掌握度记录？此操作只影响本机浏览器，不影响任何文档。')){saved.status={};saved.idx=0;persist();buildDeck();}};
function stat(v){return v===3?'记得':v===2?'模糊':v===1?'忘了':'待复习';}
function render(){
  const c=deck[pos];
  flipped=false;$('card').classList.remove('flipped');mineText='';
  $('flip').textContent=settings().recite?'核对并翻面':'翻面看答案（空格）';
  if(!c){
    $('front').innerHTML='<div class="empty">当前筛选下没有卡片。<br>试试关闭「只看未掌握」或切换范围／分类。</div>';
    $('back').innerHTML='<div class="empty">—</div>';
    $('sPos').textContent='0 / 0';$('sBar').style.width='0%';$('sCnt').textContent='';$('flip').disabled=true;return;
  }
  $('flip').disabled=false;
  const col=CC[c.cat]||'#3b6ea5';
  const s=settings();
  $('front').innerHTML='<span class="badge" style="--cc:'+col+'">'+c.cat+'　·　'+(c.ch===2?'第二章':'第一章')+'　·　'+stat(saved.status[c.id]||0)+'</span>'+
    (c.ch===2?'<div class="stageTag">口述骨架　'+STAGE_NAMES[stageOf(c)]+'</div>':'')+
    '<div class="q">'+c.q+'</div>'+
    (s.recite?'<textarea id="mine" placeholder="先在这里默写／复述答案，再点「核对并翻面」……"></textarea>':'<div style="font-size:12px;color:var(--muted);margin-top:6px">点击卡片或按空格翻面看答案</div>')+
    '<div class="src">出处：'+c.src+'　·　卡片 '+(pos+1)+' / '+deck.length+'</div>';
  $('back').innerHTML='<span class="badge" style="--cc:'+col+'">参考答案　·　'+c.cat+'</span>'+
    '<div class="q" style="font-size:15px;font-weight:500;margin:14px 0 2px;color:var(--muted)">'+c.q+'</div>'+
    '<ul class="aList" style="--cc:'+col+'">'+c.a.map(x=>'<li>'+x+'</li>').join('')+'</ul>'+
    '<div id="mineBox"></div>'+
    '<div class="src">出处：'+c.src+'　·　依据第一、二章修复稿与学习笔记整理</div>';
  const total=deck.length;
  let ok=0,mid=0,no=0;
  deck.forEach(x=>{const v=saved.status[x.id]||0;if(v===3)ok++;else if(v===2)mid++;else if(v===1)no++;});
  $('sPos').textContent=(pos+1)+' / '+total;
  $('sBar').style.width=(total?Math.round(ok/total*100):0)+'%';
  $('sCnt').textContent='已掌握 '+ok+' · 模糊 '+mid+' · 忘了 '+no+' · 未评 '+(total-ok-mid-no);
  saved.idx=pos;persist();
}
function doFlip(){
  if(!deck.length)return;
  if(flipped){flipped=false;$('card').classList.remove('flipped');return;}
  const c=deck[pos];const s=settings();
  if(s.recite){
    const ta=$('mine');mineText=ta?ta.value.trim():'';
    const box=$('mineBox');
    if(box){
      let hit='';
      if(c.k&&c.k.length&&mineText){
        const n=c.k.filter(k=>mineText.indexOf(k)>=0).length;
        hit='<div class="hit">关键词命中 '+n+' / '+c.k.length+'：'+(n===c.k.length?'很完整':'可对照下方参考答案补齐')+'</div>';
      }
      box.innerHTML='<div class="mine"><b>你的默写</b>'+(mineText||'（未填写）')+'</div>'+hit;
    }
  }
  flipped=true;$('card').classList.add('flipped');
}
function step(d){
  if(!deck.length)return;
  if(settings().order==='rand'&&d>0){pos=Math.floor(Math.random()*deck.length);}
  else{pos=(pos+d+deck.length)%deck.length;}
  render();
}
function rate(v){
  const c=deck[pos];if(!c)return;
  saved.status[c.id]=v;persist();
  step(1);
}
$('card').onclick=e=>{if(e.target.tagName==='TEXTAREA')return;doFlip();};
$('flip').onclick=doFlip;
$('prev').onclick=()=>step(-1);
$('next').onclick=()=>step(1);
document.querySelectorAll('.rate').forEach(b=>b.onclick=()=>rate(Number(b.dataset.r)));
document.addEventListener('keydown',e=>{
  if(!$('flash').classList.contains('on'))return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='textarea'||tag==='input'||tag==='select')return;
  if(e.key===' '){e.preventDefault();doFlip();}
  else if(e.key==='ArrowLeft')step(-1);
  else if(e.key==='ArrowRight')step(1);
  else if(e.key==='1'||e.key==='2'||e.key==='3')rate(Number(e.key));
  else if(e.key==='r'||e.key==='R'){pos=Math.floor(Math.random()*deck.length);render();}
});

/* ================= 视图切换 ================= */
$('tabMind').onclick=()=>{$('tabMind').classList.add('on');$('tabFlash').classList.remove('on');$('mind').classList.add('on');$('flash').classList.remove('on');};
$('tabFlash').onclick=()=>{$('tabFlash').classList.add('on');$('tabMind').classList.remove('on');$('flash').classList.add('on');$('mind').classList.remove('on');};

eachNode(TREES.all,(n,d)=>{if(d>=2&&(n.c||[]).length)collapsed.add(n.id);});
renderTree();fit();buildDeck();
</script>
