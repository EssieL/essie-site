<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>徐钧《自体心理学入门》· 第三章 知识闪卡</title>
<style>
  :root{
    --bg:#f6f5f1; --ink:#2c2c2a; --muted:#888780; --line:#e3e1d8; --card:#fff;
    --blue:#3b6ea5; --amber:#b07b23; --red:#b4493f; --green:#2f7d6b; --brown:#9a6b3f;
    --shadow:0 2px 16px rgba(0,0,0,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{min-height:58px;padding:8px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:#fff;flex-wrap:wrap}
  header h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
  header .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:430px}
  header .right{margin-left:auto;display:flex;gap:6px;align-items:center}
  button.b{font-size:12px;padding:6px 11px;border:1px solid #d6d4ca;background:#fff;border-radius:7px;cursor:pointer;color:var(--ink);white-space:nowrap}
  button.b:hover{background:#f0eee6}
  button.b.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .fbar{padding:9px 16px;border-bottom:1px solid var(--line);background:#fbfaf7;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .fbar label{font-size:12px;color:var(--muted)}
  select{font-size:12px;padding:6px 8px;border:1px solid #d6d4ca;border-radius:7px;background:#fff;color:var(--ink)}
  .chk{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;background:#fff;border:1px solid #d6d4ca;border-radius:7px;padding:6px 9px;white-space:nowrap}
  .chk input{margin:0}
  .chips{display:flex;gap:5px;padding:8px 16px 2px;flex-wrap:wrap;max-height:74px;overflow:auto}
  .chip{font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:#b9b5a7}
  .chip.on{color:#fff;border-color:transparent;font-weight:600}
  .chip i{font-style:normal;opacity:.75;margin-left:4px}
  .stats{padding:8px 18px 2px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .track{flex:1;min-width:120px;height:7px;border-radius:5px;background:#e7e5dc;overflow:hidden}
  .track i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
  .cardArea{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 18px 4px;min-height:0}
  .card{width:100%;max-width:780px;height:100%;max-height:440px;min-height:280px;perspective:1400px;cursor:pointer}
  .inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:20px 26px;display:flex;flex-direction:column;overflow:auto}
  .face.back{transform:rotateY(180deg)}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{font-size:11px;padding:4px 10px;border-radius:20px;color:#fff;background:var(--cc,#3b6ea5);letter-spacing:.3px}
  .idx{font-size:11px;color:var(--muted);margin-left:auto}
  .q{font-size:19px;line-height:1.65;font-weight:600;margin:18px 0 8px;white-space:pre-wrap}
  .q.big{font-size:16px;font-weight:500;line-height:1.8}
  .ctx{font-size:11.5px;line-height:1.6;color:#7a5a34;background:#f8f2e7;border:1px solid #ecdfc6;border-radius:7px;padding:5px 10px;margin:14px 0 -4px}
  .introBody{background:#faf8f2;border:1px solid #eae5d7;border-radius:10px;padding:12px 16px;margin:10px 0 8px;font-size:14px;line-height:1.85;overflow:auto;max-height:230px}
  .introBody p{margin:0 0 8px}
  .introBody p:last-child{margin-bottom:0}
  .introHint{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:4px}
  .badge.introBadge{background:#8a6a3e}
  .src{font-size:11px;color:var(--muted);margin-top:auto;padding-top:12px;border-top:1px dashed var(--line)}
  textarea{width:100%;min-height:96px;flex:1;border:1px dashed #cfccc1;border-radius:9px;background:#fbfaf7;padding:11px 13px;font-size:14px;line-height:1.7;font-family:inherit;color:var(--ink);resize:none;outline:none}
  textarea:focus{border-color:var(--blue);background:#fff}
  .aList{font-size:14.5px;line-height:1.85;margin:12px 0 4px;padding-left:0;list-style:none;white-space:pre-wrap}
  .aList li{margin-bottom:8px;padding-left:16px;position:relative}
  .aList li:before{content:"";position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--cc,#3b6ea5)}
  .mine{background:#f7f5ef;border:1px dashed #d6d4ca;border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;margin-top:8px;max-height:110px;overflow:auto}
  .mine b{color:var(--muted);font-weight:500;font-size:11px;display:block;margin-bottom:4px}
  .hit{font-size:12px;color:var(--green);margin-top:6px}
  .kw{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.6}
  .kw span{display:inline-block;background:#f1efe8;border-radius:5px;padding:1px 7px;margin:2px 4px 0 0}
  .controls{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px 12px;flex-wrap:wrap}
  .controls .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
  .controls .rate{font-size:12px;padding:7px 13px;border-radius:8px;border:1px solid #d6d4ca;background:#fff;cursor:pointer;color:var(--ink)}
  .controls .rate:hover{background:#f0eee6}
  .controls .rate.r1{border-color:#e2b6b1;color:var(--red)}
  .controls .rate.r2{border-color:#e1cf9f;color:var(--amber)}
  .controls .rate.r3{border-color:#aed3c8;color:var(--green)}
  .foot{font-size:11px;color:var(--muted);text-align:center;padding:0 16px 9px}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}
  #printArea{display:none}
  @media print{
    html,body{height:auto;overflow:visible;background:#fff}
    body>*:not(#printArea){display:none !important}
    #printArea{display:block !important;padding:0}
    #printArea h2{font-size:16px;margin:0 0 6px}
    #printArea .meta{font-size:11px;color:#666;margin-bottom:14px}
    #printArea .item{border-bottom:1px solid #ddd;padding:8px 0;page-break-inside:avoid}
    #printArea .item .qq{font-size:13px;font-weight:600}
    #printArea .item .aa{font-size:12px;line-height:1.6;color:#333;margin-top:3px}
    #printArea .item .ss{font-size:10px;color:#888;margin-top:3px}
  }
  @media (max-width:640px){
    header .sub{display:none}
    .q{font-size:17px}
    .face{padding:16px 18px}
    .card{max-height:none}
  }

/* === 个人学习分站 · 顶部返回条（部署时注入，打印时隐藏） === */
.xjLearnBar{background:#115e59;color:#fff;padding:7px 16px;display:flex;gap:7px;
  flex-wrap:wrap;align-items:center;font:12.5px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  position:relative;z-index:99}
.xjLearnBar a{color:#d9f4ee;text-decoration:none;white-space:nowrap}
.xjLearnBar a:hover{text-decoration:underline}
.xjLearnBar .xjSep{opacity:.55}
.xjLearnBar .xjHere{opacity:.8;white-space:nowrap}
@media print{.xjLearnBar{display:none!important}}

</style>

<script>
/* ============ 数据（单一数据源，与《第3章_知识闪卡_卡表.md》同源） ============ */
const CATS = [{"k":"ego","label":"自我与自体之辨","color":"#3b6ea5","note":"译名源流、ego 与 self 的分合、德语 das Ich、self 的词义与生物性【重点】"},{"k":"split","label":"两派分野：功能与体验","color":"#b4493f","note":"1 米／10 米桌子、防御机制、临床处理的分歧【重点】"},{"k":"turn","label":"科胡特的临床转折","color":"#7356a3","note":"安娜·弗洛伊德的全球研究、斯德哥尔摩综合征、异己的自我"},{"k":"health","label":"健康自体与中国文化","color":"#2f7d6b","note":"连续性与统整性、和谐性、地区差异与场依存性"},{"k":"sobj","label":"自体客体：概念与定名","color":"#9a6b3f","note":"selfobject 定名、1971／1977 连接号、定义与发展性需求【重点】"},{"k":"mis","label":"自体客体：误解辨正","color":"#b07b23","note":"不是人／物／客体表象，早期术语与替代术语的争议【重点】"},{"k":"exp","label":"自体客体经验与共鸣","color":"#2f4f6f","note":"功能性过程、巴施与年会案例、母亲镜映、日常生活与融合体验"},{"k":"dev","label":"共鸣能力的发展","color":"#8a6a3e","note":"马勒四阶段、斯特恩与福纳吉、与生俱来的共鸣、父母撤出"},{"k":"inner","label":"挫折与蜕变性内化","color":"#6b7a45","note":"两种挫折、一般内化、预期性环境的幻想、自由的自体感【重点】"},{"k":"lookup","label":"案例速查","color":"#a0522d","note":"由情节反查其所说明的概念（标「情节详见」）"},{"k":"term","label":"术语英中","color":"#4a6b7c","note":"原书括注的英文／德文原名与中文对照（含反向）"},{"k":"cloze","label":"背诵填空","color":"#7a5a8e","note":"原文关键句填空"}];
const CARDS = [{"id":"k001","sid":"c8b888474b","cat":"ego","q":"「ego psychology」与「self psychology」在汉译中为什么会出现转译问题？","a":["在英文术语中，ego 和 self 都是「自我」的意思。","但当前汉语精神分析中，self psychology 使用了「自体心理学」的译法。"],"k":["ego","self","译法"],"src":"§1 译名问题","refs":[]},{"id":"k002","sid":"7c58c72a70","cat":"ego","q":"「自体」一词在汉语中的来源与本义是什么？","a":["「自体」在汉语中不是常用词，但曾在唐朝玄奘大师翻译的《成唯识论》中出现过几十次。","它主要是指事物保持自身的特点，例如瓶子保持瓶子的特点，与其他事物的特点不同。"],"k":["《成唯识论》","保持自身特点"],"src":"§1 译名问题","refs":[]},{"id":"k003","sid":"618fd14c6c","cat":"ego","q":"汉语「自体心理学」这一译名是怎么形成的？","a":["为了和 ego psychology 的中文译法「自我心理学」做区分，中国台湾地区的译者将 self psychology 译为「自体心理学」。","大陆译者最早译作「自身心理学」，后来延续台湾地区译者的译法，使用「自体」这个词。"],"k":["区分","自身心理学","沿用"],"src":"§1 译名问题","refs":[]},{"id":"k004","sid":"343b0d88b7","cat":"ego","q":"谈自体心理学时，必须区分哪两组差异？","a":["一是明确 ego 和 self 到底有什么区别。","二是区分科胡特的 self 与科胡特之前的、使用英语的精神分析家所说的 self 的差异。"],"k":["ego／self","科胡特前后"],"src":"§1 译名问题","refs":[]},{"id":"k005","sid":"5f6a839d4f","cat":"ego","q":"「ego」在专业术语中指什么？","a":["指功能性自我。"],"k":["功能性自我"],"src":"§1 功能性自我","refs":[]},{"id":"k006","sid":"ee315513b1","cat":"ego","q":"「功能性自我」如何界定？","a":["当个体具备看、听的能力，或者具备与一个人建立某种关系的能力（如客体恒常性）时，这些心理功能的整合被称为功能性自我或者功能性综合体。","把个体的心理功能统合起来，以适应人类社会和环境的功能，被称为「功能性自我（ego）」。"],"k":["心理功能整合","适应环境"],"src":"§1 功能性自我","refs":[]},{"id":"k007","sid":"675b42c1d2","cat":"ego","q":"ego 这一概念是如何确立并发展起来的？","a":["为了推动精神分析在英语世界的发展，晚年的弗洛伊德在欧内斯特·琼斯等英语学者的建议下确定了这一概念。","此后詹姆斯·斯特雷奇、海因茨·哈特曼和安娜·弗洛伊德对其做了进一步发展，而琼斯在其中起到了特别重要的作用。"],"k":["英语世界","琼斯","哈特曼"],"src":"§1 功能性自我","refs":[]},{"id":"k008","sid":"53bc94ef44","cat":"ego","q":"弗洛伊德在提出人格理论时区分 ego 与 self 吗？","a":["提出自我、超我、本我的人格理论时，并没有特别区分。","发展出人格理论之后，他注意到 ego 是功能性的，而 self 是另外一个部分，才开始在使用时区分这两者。"],"k":["人格理论","功能性","另外一个部分"],"src":"§1 自体表象","refs":[]},{"id":"k009","sid":"238512426e","cat":"ego","q":"哈特曼把 self 定义为什么？","a":["「自体表象」。"],"k":["自体表象"],"src":"§1 自体表象","refs":[]},{"id":"k010","sid":"7da32b6137","cat":"ego","q":"什么是「自体表象」？请举原书的例子。","a":["当我们回忆自己小时候的某个形象时，这个形象就是自体表象（或自体影像），也可简称为「自体」。"],"k":["回忆小时候","自体影像"],"src":"§1 自体表象","refs":[]},{"id":"k011","sid":"71638c3558","cat":"ego","q":"科胡特所说的 self 与哈特曼的定义有何不同？","a":["科胡特所说的自体不仅包含自体表象，还包含自体的感受，等等。","个体的自我感受和自我的方方面面，都包含在 self 这个词里面。"],"k":["不止表象","自我感受"],"src":"§1 自体表象","refs":[]},{"id":"k012","sid":"76bb2e2a4c","cat":"ego","q":"在精神分析源起的德语中，ego 与 self 的概念是否区分？","a":["不区分。弗洛伊德在他的德语著作中保留了德语的「Ich」——意为「我」——作为一种心理结构和心理机制，同时也作为个人的、主观的、体验的自我。","在使用德语术语「我（das Ich）」时，弗洛伊德从未将功能性的自我（ego）与体验性的自体（self）分开。"],"k":["das Ich","从未分开"],"src":"§1 德语传统","refs":[]},{"id":"k013","sid":"ad82655526","cat":"ego","q":"弗洛伊德德语著作中「自体和自我明确等同」的例证是什么？","a":["《文明及其缺憾》（1930）中的陈述：「在正常情况下，没有什么比我们对自体的感觉、我们对自我的感觉更确定了。」","其德语原文为‘Normalerweise ist uns nichts gesicherter als das Gefühl unseres Selbst, unseres eigenen Ichs.’——在这里，自体和自我是明确等同的。"],"k":["《文明及其缺憾》","明确等同"],"src":"§1 德语传统","refs":[]},{"id":"k014","sid":"e2447e348d","cat":"ego","q":"精神分析文本由德语翻译成英语时，带来了什么问题？","a":["自我（ego）和自体（self）被强行区分开，导致了对自我功能和体验的分裂性使用。","这为精神分析的发展带来一定的问题，例如过于强调功能适应的理论学派的出现。"],"k":["强行区分","分裂性使用"],"src":"§1 德语传统","refs":[]},{"id":"k015","sid":"61bc5ccb56","cat":"ego","q":"科胡特晚年为什么逐步扩大 self 的范畴？","a":["科胡特的母语是德语，十分了解德语中「我（das Ich）」的概念，而英语是他在 27 岁之后才开始学习使用的语言。","当他在美国进行精神分析实践时，其实面临了这一分裂性的使用，尽管内心清楚这种差异；所以晚年的科胡特在实践中逐步扩大了英语中「自体（self）」这一概念的范畴，甚至纳入了自我的功能性范畴。"],"k":["母语德语","27 岁","纳入功能性"],"src":"§1 德语传统","refs":[]},{"id":"k016","sid":"d27e743bd7","cat":"ego","q":"回顾性研究认为，科胡特使用「self」一词的用意是什么？","a":["有理由相信，科胡特其实试图在英语精神分析中，用「自体（self）」这一术语来承接德语中「我（das Ich）」的完整意涵——既包含功能性自我（ego），也包含体验性自体（self）。"],"k":["承接完整意涵","功能＋体验"],"src":"§1 德语传统","refs":[]},{"id":"k017","sid":"8337abce14","cat":"ego","q":"有人请科胡特为 self 下定义时，他是怎么回答的？","a":["科胡特指出，英语词典中 self 一词有 12 种含义，而他所说的 self 包含其全部含义，因此无须再下定义。"],"k":["12 种含义","无须定义"],"src":"§1 self 的词义","refs":[]},{"id":"k018","sid":"d06708812b","cat":"ego","q":"self 在英语中有哪些词性与含义？","a":["既可作为名词表示自我、自己、自身、本性，也可作为形容词表示同一性的、单纯的、一样的。","在商务英语中，self 还代表本人。"],"k":["名词","形容词","本人"],"src":"§1 self 的词义","refs":[]},{"id":"k019","sid":"d01d406a95","cat":"ego","q":"self 还包含哪两种生物学含义？什么是自花授粉？","a":["还包含自体繁殖、自花授粉的含义。","自花授粉是指雌雄同蕊的花完成自体授粉的过程；有些植物同时具备产生雄配子（花粉）和产生雌配子（胚珠）的能力并实现自花授粉，这是它们自然选择的繁殖方式。"],"k":["自体繁殖","雌雄同蕊"],"src":"§1 self 的词义","refs":[]},{"id":"k020","sid":"9649882718","cat":"ego","q":"科胡特把植物学的自体繁殖纳入自体概念，隐含的意思是什么？","a":["其实表达了人类的自恋属性。","科胡特认为，当我们说自体这个词时，「自体」这两个字里充斥着一种生物性——一种自恋力比多。"],"k":["自恋属性","自恋力比多"],"src":"§1 生物性","refs":[]},{"id":"k021","sid":"79fef882c5","cat":"ego","q":"《超越快乐原则》中，自恋包括什么？生驱力又分为哪两部分？","a":["自恋包括了生驱力和死亡驱力，而其中生驱力包含了两部分：自我保存的倾向，以及追求永生的倾向。"],"k":["生驱力","死亡驱力","两部分"],"src":"§1 生物性","refs":[]},{"id":"k022","sid":"a9691f9f3c","cat":"ego","q":"什么是「自我保存的倾向」？原书举了什么例子？","a":["所有的生物都希望可以自我保存。","如果我们用某些刺激物刺激最微小的单细胞生物，例如阿米巴虫，它也会逃跑。"],"k":["自我保存","阿米巴虫"],"src":"§1 生物性","refs":[]},{"id":"k023","sid":"40a225f8e7","cat":"ego","q":"什么是「追求永生的倾向」？繁殖与之是什么关系？","a":["永生是生物的普遍追求，而繁殖是实现对永生的追求的一种方式。","单细胞生物是通过一个细胞变成两个细胞的分裂方式繁殖，多细胞生物则往往通过雌雄交配的方式进行繁殖。"],"k":["永生","繁殖方式"],"src":"§1 生物性","refs":[]},{"id":"k024","sid":"70a1895486","cat":"ego","q":"为什么说 self 里包含着生本能的含义？","a":["这种说法是从弗洛伊德开始的；科胡特选用 self 一词，对应并延续了弗洛伊德所用的德语词 das Ich 的概念。","他试图把「自体」一词的含义扩展至英语中 self 一词的所有含义，同时回归其在德语精神分析中的传统意涵。"],"k":["生本能","对应 das Ich"],"src":"§1 生物性","refs":[]},{"id":"k025","sid":"8db5e510b3","cat":"ego","q":"美国自体心理学后来为什么没有注意到科胡特的这层用心？","a":["因为英语翻译的词汇所导致的限制性。"],"k":["翻译的限制性"],"src":"§1 生物性","refs":[]},{"id":"案01","sid":"c4c798ad8a","cat":"split","q":"案例一 · 1 米与 10 米高的桌子","a":["请想象一下：如果有一张放在地上的 1 米高的桌子，那么几乎所有的人都敢站上去，而且不会觉得有什么危险。","但是，如果把这张桌子放在 10 米高的地方，再让人站上去，那么此时人站上去肯定会很紧张，或根本不敢上去，且可能会说：「啊，这只要想象一下就可以了，不用真的站上去。」"],"k":["1 米","10 米","不敢站上去"],"src":"案例：1米与10米桌子","intro":1,"case":"一","follow":"后面几张卡问：两派各自如何解释这个反应，以及由此引出的防御机制问题。","refs":["案01"]},{"id":"k026","sid":"1160792814","cat":"split","q":"在 1 米高与 10 米高处，人的自我感受有何不同？","a":["站在 1 米高的地方，我们所感受到的自我还是很稳定的。","但要站在 10 米高的地方，我们就会感觉很恐惧。"],"k":["稳定","恐惧"],"src":"案例：1米与10米桌子","ctx":"【案例一 · 1 米与 10 米高的桌子】就本例情节提问","refs":["案01"]},{"id":"k027","sid":"94331ab756","cat":"split","q":"自我心理学如何解释「不敢站上去」？","a":["自我心理学认为，这个人之所以不站上去，是因为自我功能出了问题。"],"k":["自我功能出问题"],"src":"案例：1米与10米桌子","ctx":"【案例一 · 1 米与 10 米高的桌子】就本例情节提问","refs":["案01"]},{"id":"k028","sid":"0ecba6b0ea","cat":"split","q":"科胡特的自体心理学如何解释「不敢站上去」？","a":["这个人的自我功能没有问题，平衡功能也没有损坏，而是这个人的体验出了问题。","在他的体验中有一个幻想——他站上去可能会摔下来；也就是说，他自体的感觉，或者自我的感觉出了问题。"],"k":["功能完好","体验出问题","幻想"],"src":"案例：1米与10米桌子","ctx":"【案例一 · 1 米与 10 米高的桌子】就本例情节提问","refs":["案01"]},{"id":"k029","sid":"c85898d02f","cat":"split","q":"科胡特认为，这种情况下问题真正出在哪里？","a":["不在于其功能本身，而在于其功能与体验之间的共同作用，以及自我功能和自我感受的协调关系。"],"k":["共同作用","协调关系"],"src":"案例：1米与10米桌子","ctx":"【案例一 · 1 米与 10 米高的桌子】由本例引出的一般规律／论断","refs":["案01"]},{"id":"k030","sid":"86047c4d68","cat":"split","q":"自我心理学与自体心理学的重大差异是什么？","a":["自我心理学把问题归于自我功能本身；自体心理学把问题归于功能与体验之间的共同作用、自我功能与自我感受的协调关系。"],"k":["功能","功能与体验"],"src":"案例：1米与10米桌子","ctx":"【案例一 · 1 米与 10 米高的桌子】由本例引出的一般规律／论断","refs":["案01"]},{"id":"k031","sid":"37eddbcae0","cat":"split","q":"当一个人不敢站上去时，他可能使用哪些防御机制？","a":["说「我想象一下就可以了，不需要真的站上去」，可能使用了合理化、理智化的防御机制。","说「为什么要站上去？那岂不是很危险？我摔了你负责吗？」，既有理智化，还使用了某些攻击性的防御机制。","说「你说什么我根本没听到」，表明他使用了否认的防御机制。"],"k":["合理化","理智化","否认"],"src":"案例：1米与10米桌子","ctx":"【案例一 · 1 米与 10 米高的桌子】就本例情节提问","refs":["案01"]},{"id":"k032","sid":"e925ef1f12","cat":"split","q":"科胡特认为，个体使用防御机制的原因是什么？","a":["个体使用防御机制并不是没有原因的，是其自身内部感受性的不协调，以及由此产生的一种虚弱感，引发了各种各样的防御行为。"],"k":["感受性不协调","虚弱感"],"src":"§1 防御机制","refs":[]},{"id":"k033","sid":"f58e1c6e89","cat":"split","q":"自我心理学认为临床处理中最重要的是什么？","a":["处理防御机制——让一个人用更合理的防御机制去应对事情的过程。"],"k":["处理防御机制"],"src":"§1 防御机制","refs":[]},{"id":"k034","sid":"7b68ce4cde","cat":"split","q":"自体心理学认为临床工作的首要任务是什么？","a":["处理一个人的主体感受性和功能协调的问题——内心的虚弱感，以及危险情境中的威胁感所导致的功能失调。","这些自体的问题，才是一个人使用防御机制的最重要的原因。"],"k":["主体感受性","功能协调","虚弱感"],"src":"§1 防御机制","refs":[]},{"id":"k035","sid":"9a91c8f142","cat":"split","q":"要真正理解一个人的内在，应该怎么做？","a":["尝试去理解一个人的感受，了解他的内在幻想是什么。","这就需要我们以内省-共情的方法去理解一个人的内在体验和功能失调。"],"k":["内在幻想","内省-共情"],"src":"§1 防御机制","refs":[]},{"id":"k036","sid":"aa96310702","cat":"split","q":"只向来访者说明一些防御机制，会有什么后果？","a":["之后这位来访者所使用和体验到的防御机制就会有很多不足。","或者来访者只是勉强同意了咨询师的解释——意识层面同意了，但是感受层面并不同意——这也会导致其功能失调。"],"k":["勉强同意","感受层面不同意"],"src":"§1 防御机制","refs":[]},{"id":"k037","sid":"6edec3aeb9","cat":"split","q":"为什么感受层面无法接受时，防御机制的改变不会有效？","a":["当一个人在感受层面无法接受一件事情，以及由此引发的功能失调时，他的防御机制的改变并不会那么有效。"],"k":["感受层面","功能失调"],"src":"§1 防御机制","refs":[]},{"id":"k038","sid":"854e2a335a","cat":"turn","q":"科胡特在临床研究前期处于什么位置？当时自我心理学界在做什么？","a":["科胡特在其临床研究的前期，是自我心理学领域的重要一员。","当时，在安娜·弗洛伊德的领导下，自我心理学者们正在开展一项全球性的临床研究。"],"k":["自我心理学","全球性临床研究"],"src":"§1 临床转折","refs":[]},{"id":"k039","sid":"92ea7e5659","cat":"turn","q":"当时部分分析家的操作有什么问题？","a":["有些分析家训练不足，会过早地把一些理论通过诠释直接传递给来访者。","对于来访者不接受的东西，他们会反复诠释，直到来访者表面上可以接受为止。"],"k":["过早诠释","反复诠释"],"src":"§1 临床转折","refs":[]},{"id":"k040","sid":"9009545ab6","cat":"turn","q":"数年这样的分析后，来访者出现了什么状态？","a":["表面上看似解决了问题，但是当他们结束分析、回到生活中时，却感觉和生活脱节了——所过的生活并非自己想要的，而且觉得内心很空。"],"k":["表面解决","与生活脱节","内心很空"],"src":"§1 临床转折","refs":[]},{"id":"k041","sid":"f2f44d442c","cat":"turn","q":"面对这种情况，安娜·弗洛伊德开始关注什么？","a":["来访者是否出现了精神分析中的「斯德哥尔摩综合征」。"],"k":["斯德哥尔摩综合征"],"src":"§1 临床转折","refs":[]},{"id":"案02","sid":"10c51a76df","cat":"turn","q":"案例二 · 斯德哥尔摩银行劫案","a":["斯德哥尔摩综合征起源于发生在瑞典斯德哥尔摩的一起案件：一群顾客在银行遭遇劫匪抢劫，劫匪准备离开时警察赶到并包围了银行，于是劫匪劫持现场顾客作为人质。","僵持了几天后，警察冲入银行将劫匪全部抓获，终于解救了人质。","令人诧异的是，在几个月后的审判法庭上，这些曾遭挟持的人质不仅没有指控劫匪，反而还帮劫匪说好话，说劫匪也是迫不得已的。"],"k":["银行劫案","人质","帮劫匪说好话"],"src":"案例：斯德哥尔摩劫案","intro":1,"case":"二","follow":"后面几张卡问：这一反应如何被解释，以及它在精神分析中对应什么现象。","refs":["案02"]},{"id":"k042","sid":"a7024a5ead","cat":"turn","q":"人质在法庭上的反应为什么令检察官和法官惊讶？","a":["这些人质不仅没有指控劫匪，反而帮劫匪说好话；而当时劫匪都已在押，不可能对他们造成威胁。"],"k":["已押","无威胁"],"src":"案例：斯德哥尔摩劫案","ctx":"【案例二 · 斯德哥尔摩银行劫案】就本例情节提问","refs":["案02"]},{"id":"k043","sid":"e433895839","cat":"turn","q":"心理学家如何解释斯德哥尔摩综合征？","a":["这反映了人类在进化过程中形成的一种生物策略：当个体被高度危险的人物绑架或者威胁之后，一段时间里会出现一种「与攻击者认同」的反应；这种生物策略有助于提高个体存活下来的概率。","人类一旦遇到极端危险，就可能激发出这种本能反应。"],"k":["与攻击者认同","存活概率"],"src":"案例：斯德哥尔摩劫案","ctx":"【案例二 · 斯德哥尔摩银行劫案】就本例情节提问","refs":["案02"]},{"id":"k044","sid":"cc4acc8738","cat":"turn","q":"什么是「精神分析中的斯德哥尔摩综合征」？","a":["当分析家或咨询师向来访者灌输一些主观的、基于分析学派的理论观点，却并没有真正理解来访者时，就可能出现这种情况。"],"k":["灌输理论","未真正理解"],"src":"§1 斯德哥尔摩综合征","refs":[]},{"id":"k045","sid":"6fceb7d380","cat":"turn","q":"为什么长期的分析会让来访者顺从？","a":["在心理咨询中，分析家和咨询师作为较强势的一方，对来访者会产生很大的影响。","当分析过程是长期的，比如长达两三年时，来访者会不断听到咨询师或分析家诠释某一学派的理论，就算他内心不接受，也会慢慢变得顺从。"],"k":["较强势","两三年","顺从"],"src":"§1 斯德哥尔摩综合征","refs":[]},{"id":"k046","sid":"06f45d5c85","cat":"turn","q":"来访者顺从以后，他的自我发生了什么变化？","a":["当他顺从以后，他的自我就不再属于他自己，也就是说，他所认同的不是自己的体验。","这异己的自我会让他体会不到自己内部的真实感受，转而认同一个被外在认可的「现实」。"],"k":["异己的自我","外在认可"],"src":"§1 斯德哥尔摩综合征","refs":[]},{"id":"案03","sid":"d81c3c4193","cat":"turn","q":"案例三 · 富裕家庭的来访者","a":["科胡特曾提到一些来访者：他们的父母有的是医生，有的是律师，有的甚至本身就是分析家；在北美地区，特别是在美国，这些家庭多属于富裕阶层，社会地位和经济收入高于中产阶级。","这些家庭的孩子虽然在各个方面都被培养得很好，但他们中的许多人内心并不快乐。","这些人在早年出现心理创伤后接受了精神分析治疗；治疗结束后，他们表面上似乎适应了生活——表面风光，实际上并不开心，很多人会回来再次寻求分析。"],"k":["富裕阶层","培养得很好","再次寻求分析"],"src":"案例：富裕家庭来访者","intro":1,"case":"三","follow":"后面几张卡问：这种不快乐的原因，以及科胡特由此得出的临床结论。","refs":["案03"]},{"id":"k047","sid":"7171edb13d","cat":"turn","q":"这些家庭的孩子为什么内心并不快乐？","a":["原因在于，一个过于模式化的发展路径被反复强调之后，往往会抑制个体的个性或生命力的发展。","这种抑制的过程与斯德哥尔摩综合征的形成机制有相似之处。"],"k":["模式化路径","抑制个性"],"src":"案例：富裕家庭来访者","ctx":"【案例三 · 富裕家庭的来访者】就本例情节提问","refs":["案03"]},{"id":"k048","sid":"e8bd4890c7","cat":"turn","q":"科胡特从这类分析状态中意识到了什么？","a":["正如安娜·弗洛伊德曾指出的，这些分析呈现出一种斯德哥尔摩综合征的状态；那个时期英语精神分析强调功能性而忽视体验性，或者说忽视功能与体验平衡。","这使科胡特意识到，在分析中不能过于强调功能及防御机制，而应该关注一个人的什么感受被抑制了，以及功能与感受之间的失调。"],"k":["忽视体验性","功能与感受失调"],"src":"案例：富裕家庭来访者","ctx":"【案例三 · 富裕家庭的来访者】由本例引出的一般规律／论断","refs":["案03"]},{"id":"k049","sid":"407c9f3082","cat":"turn","q":"科胡特认为分析的关键是什么？","a":["关键在于分析一个人是在何种情境下产生了虚弱感，继而又因这种虚弱感产生了怎样的防御方式，即防御机制。"],"k":["虚弱感","防御方式"],"src":"§1 临床转折","refs":[]},{"id":"k050","sid":"2b1a43b909","cat":"turn","q":"科胡特因此逐渐开始重视什么关系？","a":["一个人的主体和功能两者之间的关系：他的自体首先在功能上受到了怎样的抑制，出现了何种功能失调，或受到了怎样的侵害，才让他感觉到虚弱。"],"k":["主体与功能","侵害"],"src":"§1 临床转折","refs":[]},{"id":"k051","sid":"c1e7fe9146","cat":"turn","q":"临床工作中，处理病理性过程的正确对象是什么？","a":["处理病理性的过程并不是要直接处理症状（包括防御机制）本身，而是要去处理导致这些症状的自体病理过程。"],"k":["不直处理症状","自体病理过程"],"src":"§1 临床转折","refs":[]},{"id":"k052","sid":"0e2531886b","cat":"health","q":"科胡特对「自体」的定义强调哪两个特征？","a":["强调一个人自体体验的连续性与功能的统整性。"],"k":["连续性","统整性"],"src":"§1 健康自体","refs":[]},{"id":"k053","sid":"c5e456ae40","cat":"health","q":"什么是「连续性」？","a":["指的是自我体验具有很好的流动性；而受到创伤的来访者往往在人格流动性上存在一定的停滞。"],"k":["流动性","停滞"],"src":"§1 健康自体","refs":[]},{"id":"k054","sid":"2eb3fefea2","cat":"health","q":"什么是「统整性」？","a":["表现为内聚性，它具有功能上的稳定性，是指一个人从内部整合和协调自身各类情绪的能力。"],"k":["内聚性","整合协调情绪"],"src":"§1 健康自体","refs":[]},{"id":"k055","sid":"90cf17fa3e","cat":"health","q":"连续性与统整性是对什么的描述？","a":["是科胡特对健康自体特征的一种描述。"],"k":["健康自体"],"src":"§1 健康自体","refs":[]},{"id":"k056","sid":"42aec40a55","cat":"health","q":"「自体」在中文中相当于什么？与西方有何不同？","a":["自体在中文中的意义相当于「我」。","与西方个体化社会中的自体稍有不同，中国文化中的自体更偏向整体性和家族性。"],"k":["我","整体性与家族性"],"src":"§2 中国文化","refs":[]},{"id":"k057","sid":"ebcf7974ea","cat":"health","q":"当代中国的自体正在发生什么变化？","a":["自体正在发展：个性化和主体的发展日益受到强调，孩子的主体感和自我认同感也在不断增强；与此相关的自恋问题越来越受到关注。"],"k":["个性化","主体感","自恋问题"],"src":"§2 中国文化","refs":[]},{"id":"k058","sid":"d5d944fbcb","cat":"health","q":"国内哪些地区的「自体」多指家族或血缘关系？其表现如何？","a":["在山东、山西、河南等省份，以及潮汕地区，「自体」多指家族或者血缘关系。","其表现具有非常强的群体性，在功能性方面也体现出集体性——例如群体意识和家庭功能。"],"k":["家族血缘","群体性","集体性"],"src":"§2 中国文化","refs":[]},{"id":"k059","sid":"5d7452241e","cat":"health","q":"以山东为例，孝道与自体是什么关系？","a":["孝道构成了自体的一部分，人与人的联系也非常紧密，这其中既有功能性也有体验性。"],"k":["孝道","功能＋体验"],"src":"§2 中国文化","refs":[]},{"id":"k060","sid":"8c2fb1d813","cat":"health","q":"上海、深圳、广州等地的自体更强调什么？","a":["更强调独立性——个体的独立体验和自主功能被高度重视。"],"k":["独立性","自主功能"],"src":"§2 中国文化","refs":[]},{"id":"k061","sid":"09f408e644","cat":"health","q":"作者认为，中国文化背景下对自体特征的描述还应包括什么？","a":["除了连续性和统整性之外，还应该包括和谐性。"],"k":["和谐性"],"src":"§2 和谐性","refs":[]},{"id":"k062","sid":"ad7f425454","cat":"health","q":"什么是「和谐性」？","a":["自体在与世界的关系中，不仅重视独立性，更注重与人、与世界的联结。","这种联结有助于增强功能性和体验性的稳定性。"],"k":["联结","稳定性"],"src":"§2 和谐性","refs":[]},{"id":"案04","sid":"98f476701a","cat":"health","q":"案例四 · 戴口罩的东亚与欧美","a":["在呼吸系统疾病流行期间是否应该戴口罩这一问题上，可以窥见东亚文化与欧美文化的差异。","在东亚地区，基于集体自体和谐性，戴口罩的现象比较普遍。","而在欧美文化环境中，很多人反对戴口罩，并时不时地发起抗议，认为戴口罩侵犯了个人自由。"],"k":["东亚普遍","欧美抗议","个人自由"],"src":"案例：戴口罩","intro":1,"case":"四","follow":"后面几张卡问：这一差异与自体和谐性、场依存性的关系。","refs":["案04"]},{"id":"k063","sid":"1b3747319e","cat":"health","q":"戴口罩的例子说明了什么？","a":["东亚地区基于集体自体和谐性，戴口罩比较普遍；欧美很多人反对戴口罩并抗议，这与欧美文化和谐性基础较弱、更重视个体性有关。"],"k":["集体自体和谐性","个体性"],"src":"案例：戴口罩","ctx":"【案例四 · 戴口罩的东亚与欧美】由本例引出的一般规律／论断","refs":["案04"]},{"id":"k064","sid":"e370028692","cat":"health","q":"中西方文化在自体和谐性方面的差异，还体现在哪里？","a":["中国文化往往更重视事物之间的共同性，而西方文化更重视事物之间的差异性。"],"k":["共同性","差异性"],"src":"§2 和谐性","refs":[]},{"id":"k065","sid":"65d81b005c","cat":"health","q":"跨文化认知研究中，场依存性有何差异？","a":["中国文化的个体场依存性相对较强，而西方文化的个体场依存性相对较弱。"],"k":["场依存性"],"src":"§2 和谐性","refs":[]},{"id":"k066","sid":"ab1c8ab04c","cat":"health","q":"「我们」与「我」在不同文化中的侧重有何不同？","a":["在中国、南欧等具有悠久历史、强调社会关联的传统社会，对「我们」的重视，要比美国社会更为强烈；美国社会对「我」则更为重视。"],"k":["我们","我"],"src":"§2 和谐性","refs":[]},{"id":"k067","sid":"1d5a78362b","cat":"health","q":"为什么临床上需要注意这些文化差异？","a":["国内不同地区仍存在较大差异，要根据实际情况加以区分；在多元文化背景下，自体在临床中的表现相当复杂。"],"k":["实际情况","临床表现复杂"],"src":"§2 中国文化","refs":[]},{"id":"k068","sid":"66b25b46d3","cat":"sobj","q":"自体心理学中，比「自体（self）」更重要的概念是什么？","a":["「selfobject」，即自体客体。"],"k":["selfobject"],"src":"§3 定名","refs":[]},{"id":"k069","sid":"19fdca83bc","cat":"sobj","q":"科胡特何时正式使用「自体客体」这一术语？","a":["在 1977 年出版的《自体的重建》一书中正式使用。"],"k":["1977","《自体的重建》"],"src":"§3 定名","refs":[]},{"id":"k070","sid":"868a649e74","cat":"sobj","q":"学派创立之初，科胡特曾考虑用什么名称？","a":["曾考虑过直接用「selfobject psychology（自体客体心理学）」这一名称。"],"k":["自体客体心理学"],"src":"§3 定名","refs":[]},{"id":"k071","sid":"e2902a4463","cat":"sobj","q":"为什么最终没有采用「自体客体心理学」？","a":["科胡特的同事认为「self psychology（自体心理学）」更容易被接受，还为此劝说过科胡特。","加之 selfobject 是科胡特在临床中创造出来的新词，如果把它作为一个学派的名称，可能会引起很大的误解。","所以科胡特最终选择了「自体心理学」，自体心理学就此诞生。"],"k":["更易接受","新词易误解"],"src":"§3 定名","refs":[]},{"id":"k072","sid":"8226dcf235","cat":"sobj","q":"1971 年科胡特使用的是哪种写法？","a":["带有连接号的「self-object」，而不是 selfobject。"],"k":["1971","self-object"],"src":"§3 连接号","refs":[]},{"id":"k073","sid":"68c707c941","cat":"sobj","q":"1977 年为什么去掉了连接号？","a":["因为这个用法容易与英国客体关系理论中的「自体-客体关系单元（self-object）」发生混淆并引起误解，所以他在 1977 年的著作中去掉了中间的连接号，改为 selfobject。"],"k":["避免混淆","selfobject"],"src":"§3 连接号","refs":[]},{"id":"k074","sid":"0714ca5a8f","cat":"sobj","q":"最早使用 self-object 这一概念的是谁？","a":["弗洛伊德以及伊迪丝·雅各布森。"],"k":["弗洛伊德","雅各布森"],"src":"§3 连接号","refs":[]},{"id":"k075","sid":"ba7c11e5a6","cat":"sobj","q":"雅各布森延续弗洛伊德的什么思路？","a":["认为婴儿期的人类原始认同作用，导致婴儿无法真正区分自体与客体，而将自体和客体体验为共生的状态。","这一观点显然影响了科胡特的思考。"],"k":["原始认同","共生状态"],"src":"§3 连接号","refs":[]},{"id":"k076","sid":"66016c6497","cat":"sobj","q":"科胡特对这种共生性心理状态有何强调？","a":["这种具有原始认同的共生性心理状态可能贯穿人类的一生，而不会随着客体爱的出现而消失。"],"k":["贯穿一生","不随客体爱消失"],"src":"§3 连接号","refs":[]},{"id":"k077","sid":"6ec1f6e0a4","cat":"sobj","q":"「自体客体」如何界定？","a":["自体客体既是一种情感体验，也是一种自我共情理解的功能。","它指的是一种「自体需求得到他人理解」时所体验到的融合性经验。"],"k":["情感体验","共情理解功能","融合性经验"],"src":"§3 定义","refs":[]},{"id":"k078","sid":"e4a5b6382c","cat":"sobj","q":"科胡特使用「自体客体」时，指的是内心怎样的感受？","a":["我们内心有这样一种自我共情理解的感受——它既是感受性的，同时也是功能性的。"],"k":["感受性＋功能性"],"src":"§3 定义","refs":[]},{"id":"k079","sid":"e8d114bcf9","cat":"sobj","q":"临床上来访者未表达出来的感受有什么特点？","a":["当来访者内心有压抑的感受时，往往有其压抑的理由，或是存在某些未能言说的感受；这些感受本身也有其成因。","来访者在将感受表达出来之前，可能对此感到不安或羞耻。"],"k":["压抑的理由","不安或羞耻"],"src":"§3 定义","refs":[]},{"id":"k080","sid":"74190583ec","cat":"sobj","q":"在分析过程中，什么情况下「自体客体便出现了」？","a":["有人能理解来访者内心的需要，认同其合理性，并以一种接纳的态度帮他把模糊的意识或羞耻的感觉表达出来。","这时来访者的内心世界会感受到一种同频，好像对方和自己产生了共鸣——一直在嘴边却没办法说的东西被说出来了。","当这种被压抑、被抑制的感觉得以呈现时，自体客体便出现了。"],"k":["理解与接纳","同频共鸣","感觉得以呈现"],"src":"§3 定义","refs":[]},{"id":"k081","sid":"b4c3630364","cat":"sobj","q":"什么是「发展性自体客体需求」？","a":["婴幼儿发展所必需的自体客体功能体验需求。"],"k":["婴幼儿发展","功能体验需求"],"src":"§3 定义","refs":[]},{"id":"k082","sid":"f73f79758d","cat":"sobj","q":"婴幼儿在哪些阶段、哪些需要被满足时所获得的体验即为自体客体？","a":["婴幼儿在前语言期与语言初期，对于养育者的理解和镜映回应的需求，以及对于理想化父母的需求被满足时，所获得的体验即为自体客体。"],"k":["前语言期","镜映回应","理想化父母"],"src":"§3 定义","refs":[]},{"id":"k083","sid":"ea7d35b582","cat":"sobj","q":"科胡特所说的自体客体，本质上是什么？","a":["本质上是包含情感共鸣与发展性功能的体验，而非现实客体本身。"],"k":["体验","非现实客体"],"src":"§3 定义","refs":[]},{"id":"k084","sid":"b1c654a5ef","cat":"mis","q":"科胡特明确指出，自体客体不是什么？","a":["自体客体不是一个人，不是一个物体，而是一种情感经验。"],"k":["不是人","不是物体","情感经验"],"src":"§4 误解辨正","refs":[]},{"id":"k085","sid":"3603eadcd4","cat":"mis","q":"为什么不应引用科胡特前期的「自体-客体」说法来论证自体客体属于客体表象？","a":["在科胡特发展自体心理学的前期，他对「自体客体」这一概念的定义尚未完全清晰，并使用过「自体-客体」「古老的客体」等术语。","我们不应用这些定义尚不明确的早期观点，来论证自体客体属于客体表象的概念。"],"k":["定义未清晰","早期术语"],"src":"§4 误解辨正","refs":[]},{"id":"k086","sid":"0eb37cc11e","cat":"mis","q":"关于「记下有帮助的人的形象」的常见误解是什么？","a":["有一种常见的误解：当一个人遇到一个对他有帮助的人之后，他会将其形象记下来，当他下次再碰到问题的时候，头脑里就会浮现出那个形象，而这就是自体客体。","但这种解释是对自体心理学的误解。"],"k":["形象记下","误解"],"src":"§4 误解辨正","refs":[]},{"id":"k087","sid":"a50472a4a0","cat":"mis","q":"科胡特认为自体客体首先是什么？其次是什么？","a":["首先，自体客体是一种感受性的经验；其次，自体客体是一种功能性的过程。"],"k":["感受性经验","功能性过程"],"src":"§4 功能性过程","refs":[]},{"id":"k088","sid":"ed51fa3d7d","cat":"mis","q":"「功能性的过程」如何界定？","a":["当别人说出我们内心某些需要被理解的东西时，我们的内心会感觉到一种共鸣。","这种借助他人而实现的表达促成了一种自我理解，而这种自我理解也会使我们在人际关系中产生更自信的体验。"],"k":["共鸣","自我理解","更自信"],"src":"§4 功能性过程","refs":[]},{"id":"k089","sid":"547681f305","cat":"mis","q":"这种「自我理解并使人在关系中更自信」的体验被称为什么？","a":["自体客体的功能性作用。"],"k":["功能性作用"],"src":"§4 功能性过程","refs":[]},{"id":"k090","sid":"97d45fde68","cat":"mis","q":"史托罗楼为什么提出以「自体客体经验」来表示「自体客体」？","a":["以免把「自体客体」误解为某种客体表象。"],"k":["避免误解"],"src":"§4 术语争议","refs":[]},{"id":"k091","sid":"51962f66bf","cat":"mis","q":"关于「自体客体经验」这一表述的争议是什么？","a":["虽然有许多自体心理学家认为「自体客体经验」这一表述更清晰，但「自体客体」本身已是一种情感性经验，为什么还要附加「经验」一词呢？有关这一问题的争议一直不断。"],"k":["附加经验","争议不断"],"src":"§4 术语争议","refs":[]},{"id":"k092","sid":"74427307af","cat":"mis","q":"部分自体心理学家采用了哪些替代术语？又造成什么问题？","a":["不少自体心理学家索性放弃了「自体客体」，转而采用「情感一致性」或「情感共鸣性」等术语来代替，以尽量减少误解。","但这又造成了简化的问题。"],"k":["情感一致性","情感共鸣性","简化"],"src":"§4 术语争议","refs":[]},{"id":"k093","sid":"b2df34bff7","cat":"mis","q":"我们对自体客体经验需要保持什么反思？","a":["如果过于强调自体客体经验，容易导致对科胡特所提出的自体客体功能性的关注不足；在这一点上，我们需要格外谨慎。"],"k":["功能性关注不足","谨慎"],"src":"§4 术语争议","refs":[]},{"id":"k094","sid":"bc1d7c0b5c","cat":"mis","q":"当代理解中，自体客体的范围有什么扩展？","a":["普遍认为，自体客体不仅仅是治疗情境中分析家或咨询师对来访者的理解和诠释所引发的来访者内心的共鸣性体验，更扩展至日常生活场景。","当一个人看电影、读小说，或处于某些日常生活情境中时，也可能会经历类似自体客体的体验性过程。","自体客体不只是一个临床过程，它的范围要比临床过程更宽泛。"],"k":["日常生活","比临床更宽泛"],"src":"§4 术语争议","refs":[]},{"id":"案05","sid":"cc2de47073","cat":"exp","q":"案例五 · 年会上的父母","a":["来访者觉得父母一点儿都不理解他：他已经 30 多岁了，但父母还是把他当作小孩，不论在家还是外出，只要父母在场，就会对他的朋友和同事说「你们要关心我们家孩子」。","他是一家中型公司的中层管理者，有一次邀请父母参加公司年会。年会上，他的妈妈居然拉着他的下属说：「你们要关心、体谅我儿子啊！他年轻，有的时候说话不得当，会让你们不开心，你们一定要多担待。」","他当时感觉到强烈的羞耻感，这种羞耻感令他无法忍受。"],"k":["30 多岁","公司年会","强烈羞耻感"],"src":"案例：年会上的父母","intro":1,"case":"五","follow":"后面几张卡问：这一羞耻感的来源、咨询师的诠释，以及它说明的自体客体需求。","refs":["案05"]},{"id":"k095","sid":"0334bb1e48","cat":"exp","q":"年会事件中，来访者体验到了什么？","a":["强烈的羞耻感，这种羞耻感令他无法忍受。"],"k":["强烈羞耻感"],"src":"案例：年会上的父母","ctx":"【案例五 · 年会上的父母】就本例情节提问","refs":["案05"]},{"id":"k096","sid":"45b27f3e86","cat":"exp","q":"为什么父母「为他好」的话反而伤害了他？","a":["作为领导的自我价值感、权威感，全部破碎了；当时他就有了以后再也不见父母的念头。","父母的所谓「为他好」，实际上是对他的伤害：父母的行为贬低了他，让他有一种无地自容的感觉。"],"k":["价值感破碎","贬低","无地自容"],"src":"案例：年会上的父母","ctx":"【案例五 · 年会上的父母】就本例情节提问","refs":["案05"]},{"id":"k097","sid":"fa5cddbada","cat":"exp","q":"咨询师的诠释指出了什么？","a":["父母说的那些关心的话，他心里面并不领情；他希望父母静静地坐在那里参加聚会就好。","当母亲要求同事和下属关心他时，他感到羞耻甚至无法表达，恨不得有一个地缝可以钻进去；他希望在别人眼中就是现在的样子。","虽然对于父母来说他永远是孩子，但现实中他已经是一个独立的人，而且是一个相当有能力的人，这种理解对他来说是十分重要的。"],"k":["并不领情","希望被理解","独立成熟"],"src":"案例：年会上的父母","ctx":"【案例五 · 年会上的父母】就本例情节提问","refs":["案05"]},{"id":"k098","sid":"e59f2ee911","cat":"exp","q":"听完咨询师的回应，来访者发生了什么变化？","a":["觉得心中压抑的东西被说出来了；一方面觉得自己放松下来了，另一方面对父母的感觉也开始变得清晰。","他有些释然，并打消了「再也不见父母」的念头。"],"k":["被说出来","释然"],"src":"案例：年会上的父母","ctx":"【案例五 · 年会上的父母】就本例情节提问","refs":["案05"]},{"id":"k099","sid":"e6248a4d53","cat":"exp","q":"他在分析过程中获得的理解，正是他一直希望被父母理解的部分，是什么？","a":["他已经不是孩子了，而是一个独立成熟的人；他希望被尊重，而不是被当作小孩子对待。"],"k":["独立成熟","被尊重"],"src":"案例：年会上的父母","ctx":"【案例五 · 年会上的父母】由本例引出的一般规律／论断","refs":["案05"]},{"id":"k100","sid":"d8d3c1a6a7","cat":"exp","q":"在这个案例里，咨询师做的关键工作是什么？","a":["对这位来访者的自体客体需求进行了解释，这个过程起到了关键作用。"],"k":["解释自体客体需求"],"src":"案例：年会上的父母","ctx":"【案例五 · 年会上的父母】由本例引出的一般规律／论断","refs":["案05"]},{"id":"案06","sid":"fe4f26efc8","cat":"exp","q":"案例六 · 科胡特安慰巴施","a":["回顾第二章中巴施的例子：这个例子虽然不是一个临床过程，但是它很接近临床过程。","首先，当科胡特尝试安慰巴施并说出他内心的感受时，巴施觉得他感受到了某种共鸣。","其次，巴施压抑在心里的东西，被科胡特以一种共情理解的方式表达了出来。"],"k":["接近临床","共鸣","被表达出来"],"src":"案例：科胡特与巴施","intro":1,"case":"六","follow":"后面几张卡问：巴施由此实现的功能性作用，以及它与自体客体的关系。","refs":["案06"]},{"id":"k101","sid":"2e60dd7a40","cat":"exp","q":"巴施的例子为什么被放在这里讨论？","a":["这个例子虽然不是一个临床过程，但是它很接近临床过程。"],"k":["接近临床过程"],"src":"案例：科胡特与巴施","ctx":"【案例六 · 科胡特安慰巴施】就本例情节提问","refs":["案06"]},{"id":"k102","sid":"44fdab9a2b","cat":"exp","q":"在巴施的例子里，巴施实际上实现了什么？","a":["对自己的内心世界实现了一种自我陈述，或者一种自我理解的功能性作用——这也是自体客体所包含的作用之一。"],"k":["自我陈述","自我理解"],"src":"案例：科胡特与巴施","ctx":"【案例六 · 科胡特安慰巴施】由本例引出的一般规律／论断","refs":["案06"]},{"id":"案07","sid":"250bd22d12","cat":"exp","q":"案例七 · 母亲的镜映目光","a":["婴幼儿需要母亲的镜映：母亲能够理解孩子的需要，并体会到此刻给予孩子目光关注的意义。","在这一过程中，孩子不仅获得了自体客体的情感体验，母亲回应的关注也发挥了功能，它伴随着情感体验，成为孩子自体功能的一部分。"],"k":["镜映","目光关注","成为自体功能"],"src":"案例：母亲的镜映","intro":1,"case":"七","follow":"后面几张卡问：这一过程说明的自体客体功能性，以及共鸣能力的发展。","refs":["案07"]},{"id":"k103","sid":"dffc05d6d3","cat":"exp","q":"在母亲镜映的过程中，孩子获得了哪两样东西？","a":["不仅获得自体客体的情感体验；母亲回应的关注也发挥了功能，它伴随着情感体验，成为孩子自体功能的一部分。"],"k":["情感体验","功能"],"src":"案例：母亲的镜映","ctx":"【案例七 · 母亲的镜映目光】就本例情节提问","refs":["案07"]},{"id":"案08","sid":"cbb2927e00","cat":"exp","q":"案例八 · 读小说时被精准命名","a":["在读小说或历史著作的时候，我们有时会遇到这样的情况：某种自己曾经表达不出来的情感，或某种无以名状的感觉，竟然在书中被精准地表达和命名了。","这种发现让我们的内心产生了震动。"],"k":["表达不出来","精准命名","内心震动"],"src":"案例：读小说被命名","intro":1,"case":"八","follow":"后面几张卡问：为什么这一过程也是一种自体客体经验。","refs":["案08"]},{"id":"k104","sid":"ac97cad6a7","cat":"exp","q":"读小说或历史著作时的那种发现，为什么也是自体客体经验？","a":["某种自己曾经表达不出来的情感，或某种无以名状的感觉，在书中被精准地表达和命名，这种发现让内心产生了震动；这一过程的发生也是一种自体客体经验。"],"k":["精准命名","自体客体经验"],"src":"案例：读小说被命名","ctx":"【案例八 · 读小说时被精准命名】由本例引出的一般规律／论断","refs":["案08"]},{"id":"k105","sid":"22acea09f1","cat":"exp","q":"看电影或置身于某个特定场所时，可能突然产生什么体验？","a":["可能会突然产生一种融合的体验。"],"k":["融合体验"],"src":"§4 日常生活扩展","refs":[]},{"id":"案09","sid":"832fe68458","cat":"exp","q":"案例九 · 羊卓雍措湖边","a":["有一个朋友在去西藏的羊卓雍措之前，从来没见过西藏的湖泊。","当他身临其境，真正走在羊卓雍措湖边时，他感觉自己仿佛和羊卓雍措的碧蓝融为一体了，身体似乎变得无形，整个心灵都变得轻盈了。"],"k":["融为一体","身体无形","心灵轻盈"],"src":"案例：羊卓雍措","intro":1,"case":"九","follow":"后面几张卡问：这一体验的性质，以及依恋理论对共鸣性需要的称呼。","refs":["案09"]},{"id":"k106","sid":"0b1b3db144","cat":"exp","q":"羊卓雍措的例子中，他获得的是什么体验？","a":["某种自体客体的感受，这是一种情感共鸣性的、同频的精神体验。"],"k":["情感共鸣性","同频"],"src":"案例：羊卓雍措","ctx":"【案例九 · 羊卓雍措湖边】由本例引出的一般规律／论断","refs":["案09"]},{"id":"k107","sid":"c88b513a9e","cat":"exp","q":"依恋理论如何称呼「人一出生就有的共鸣性需要」？","a":["在依恋理论的研究中，认为人一出生就有共鸣性的需要，这一需要就是自体客体的共鸣，也可以称为「自体客体」。","但在依恋理论中，我们称之为「情感共鸣性经验」。"],"k":["共鸣性需要","情感共鸣性经验"],"src":"案例：羊卓雍措","ctx":"【案例九 · 羊卓雍措湖边】由本例引出的一般规律／论断","refs":["案09"]},{"id":"k108","sid":"3dad67aa87","cat":"dev","q":"玛格丽特·S. 马勒提出了什么理论？","a":["著名的「分离-个体化理论」。"],"k":["分离-个体化理论"],"src":"§4 发展阶段","refs":[]},{"id":"k109","sid":"a91454afa1","cat":"dev","q":"分离-个体化理论把 0～36 个月划分为哪四个阶段？","a":["0～2 个月为自闭阶段（autistic phase）；2～6 个月为共生阶段（symbiotic phase）。","6～24 个月为分离-个体化阶段（separation-individuation phase）；24～36 个月为客体恒常性阶段（object constancy phase）。"],"k":["自闭","共生","分离-个体化","客体恒常性"],"src":"§4 发展阶段","refs":[]},{"id":"k110","sid":"7a69f7709a","cat":"dev","q":"马勒的理论与本章哪一说法不同？","a":["与「人一出生就有共鸣能力」的说法不同。"],"k":["共鸣能力"],"src":"§4 发展阶段","refs":[]},{"id":"k111","sid":"37896c9953","cat":"dev","q":"丹尼尔·斯特恩的研究发现了什么？","a":["婴儿在出生后就有情感共鸣的表现，孩子会高度认同注视他的人的表情。","当注视他的人笑时，孩子也马上会笑；如果注视他的人哭丧着脸，孩子也会哭丧着脸。这是一种高度认同的共鸣性表现。"],"k":["高度认同","表情共鸣"],"src":"§4 发展阶段","refs":[]},{"id":"k112","sid":"3847d1ed6f","cat":"dev","q":"彼得·福纳吉的研究证明了什么？","a":["婴儿在出生后就已经能和母亲进行表情互动。"],"k":["表情互动"],"src":"§4 发展阶段","refs":[]},{"id":"k113","sid":"3646c50628","cat":"dev","q":"现在人们普遍怎么看人的共鸣能力？","a":["人的共鸣能力几乎是与生俱来的。"],"k":["与生俱来"],"src":"§4 发展阶段","refs":[]},{"id":"k114","sid":"b37c730990","cat":"dev","q":"有理论家如何解释孩子身体节律和表情节律的来源？","a":["孩子的身体节律和表情节律与其在母亲子宫中的早期互动有关；在这一过程中，母亲的情绪越稳定，对孩子的发展越有帮助。"],"k":["子宫中互动","情绪稳定"],"src":"§4 发展阶段","refs":[]},{"id":"k115","sid":"17e31df3ec","cat":"dev","q":"自体客体理论认为，婴儿出生后自体会发出什么？环境理解时会怎样？","a":["在婴儿出生后，自体会提出一些共鸣性需要，也就是说，自体会发出一种「自体客体需要」。","当环境理解这种需要的时候，就会产生自体客体理论所说的共鸣，而这种经验对一个人形成坚实而内聚的自体十分重要。"],"k":["自体客体需要","坚实而内聚"],"src":"§4 发展阶段","refs":[]},{"id":"k116","sid":"3665adec55","cat":"dev","q":"当孩子需要共鸣、但父母疏忽或者离开时，会怎样？","a":["孩子就会调用那些已经存在的自体客体经验的共鸣，用已经发展出的自体客体功能来自我调整，通过想象或一些次要的替代物来安抚自己。","可见，父母不在的时候，孩子的自体客体功能也会进一步发展。"],"k":["调用已有经验","替代物安抚"],"src":"§4 发展阶段","refs":[]},{"id":"k117","sid":"46f6722e0c","cat":"dev","q":"父母何时才可以逐步撤出？这一过程需要多久？","a":["婴儿刚出生时，父母需要倾注大量时间以满足其早期需要，而到了孩子两三岁以后，父母才可以逐步撤出。","孩子能够独立地、更好地发展自体客体功能，需要一个相当缓慢的过程。"],"k":["两三岁","相当缓慢"],"src":"§4 发展阶段","refs":[]},{"id":"k118","sid":"d8b7d6e229","cat":"inner","q":"父母逐步撤出的过程，是通过什么实现的？","a":["通过成千上万次「恰到好处的挫折」实现的，而不是通过创伤性的挫折实现的。"],"k":["恰到好处的挫折","成千上万次"],"src":"§4 两种挫折","refs":[]},{"id":"k119","sid":"7dbac04ab0","cat":"inner","q":"「恰到好处的挫折」与「创伤性的挫折」有何不同？","a":["创伤性的挫折会让孩子无法再调用他的自体客体功能来调整自己。","而恰到好处的挫折会促使孩子发展出更好的自体统整性。"],"k":["无法调用","更好的统整性"],"src":"§4 两种挫折","refs":[]},{"id":"k120","sid":"27018b1e92","cat":"inner","q":"统整性在科胡特理论中是什么？举例说明其丧失与保持。","a":["统整性是科胡特理论所阐述的健康自体的一个功能性特征。","一个人如果站在 10 米高的地方，自我就会感觉很虚弱，丧失了统整性功能；如果站在 1 米高的地方，自我就会觉得很踏实。"],"k":["健康自体","10 米","1 米"],"src":"§5 蜕变性内化","refs":[]},{"id":"k121","sid":"7846ef0a63","cat":"inner","q":"科胡特把父母营造的「恰到好处的挫折」所起的作用称为什么？","a":["「蜕变性内化」（或「转变性内化」）作用。","这与客体关系通常所说的内化作用不同。"],"k":["蜕变性内化","转变性内化"],"src":"§5 蜕变性内化","refs":[]},{"id":"k122","sid":"257305df8d","cat":"inner","q":"一般的内化作用指什么？原书举了什么例子？","a":["一般的内化作用是指内化某个客体表象。","比如一位对你很有帮助的咨询师离开后，你一遇到事情就想起这位咨询师，从而觉得信心百倍。"],"k":["内化客体表象","想起咨询师"],"src":"§5 蜕变性内化","refs":[]},{"id":"案10","sid":"a171441d97","cat":"inner","q":"案例十 · 咨询师离开之后","a":["一般内化作用的情形：一位对你很有帮助的咨询师离开后，你一遇到事情就想起这位咨询师，从而觉得信心百倍。","而蜕变性内化的作用好比：离开了那位对你有帮助的咨询师后，你可能不再记得他，但因为获得了自体客体经验，你发展出一种独立自主的处理事情的能力。"],"k":["想起他","不再记得他","独立自主"],"src":"案例：咨询师离开之后","intro":1,"case":"十","follow":"后面几张卡问：科胡特如何评价一般内化，以及蜕变性内化带来的自体感。","refs":["案10"]},{"id":"k123","sid":"98e43736f1","cat":"inner","q":"科胡特如何评价一般的内化过程？","a":["认为这类过程虽然有正向的效果，但并不能彻底解决问题；所以科胡特倾向于强调「蜕变性内化」。"],"k":["不能彻底解决"],"src":"案例：咨询师离开之后","ctx":"【案例十 · 咨询师离开之后】由本例引出的一般规律／论断","refs":["案10"]},{"id":"k124","sid":"aed848e50f","cat":"inner","q":"蜕变性内化的作用好比什么？","a":["离开了那位对你有帮助的咨询师后，你可能不再记得他，但因为获得了自体客体经验，你发展出一种独立自主的处理事情的能力。"],"k":["不再记得","独立自主"],"src":"案例：咨询师离开之后","ctx":"【案例十 · 咨询师离开之后】就本例情节提问","refs":["案10"]},{"id":"k125","sid":"f02aa043fa","cat":"inner","q":"蜕变性内化产生的功能作用类似于什么？","a":["类似于自体客体：当个体在主观体验中感受到自体的存在时，会产生一种自我的功能性作用。"],"k":["类似于自体客体","自我的功能性作用"],"src":"§5 蜕变性内化","refs":[]},{"id":"k126","sid":"2e0507e569","cat":"inner","q":"哈特曼的哪个概念被用来理解蜕变性内化？","a":["「预期性环境的幻想」。","预期性环境的幻想，是理解自体客体的蜕变性内化这一概念的基础；科胡特在 1979 年与同事谈话时曾提到，哈特曼的「预期性环境」其实是他之后发展自体心理学的起点。"],"k":["哈特曼","预期性环境"],"src":"§5 预期性环境","refs":[]},{"id":"k127","sid":"2240ca6f21","cat":"inner","q":"从哈特曼的自我心理学观点看，预期性环境的幻想起什么作用？","a":["当人类本能与现实环境产生冲突时，预期性环境的幻想作为中间机制发挥作用，创造出一个空间，以等待现实如预期的过程一样发生。"],"k":["中间机制","创造空间"],"src":"§5 预期性环境","refs":[]},{"id":"k128","sid":"de734db2bb","cat":"inner","q":"预期性环境的幻想缓和了什么？构成了什么？","a":["缓和了现实和本能之间的冲突，构成了一个非冲突区域。"],"k":["缓和冲突","非冲突区域"],"src":"§5 预期性环境","refs":[]},{"id":"案11","sid":"a5cdcdf4f3","cat":"inner","q":"案例十一 · 等冲奶粉的婴儿","a":["婴儿饿了要吃奶，妈妈若没有母乳，则需要些时间来冲调奶粉。","在这个过程中，妈妈会安慰孩子「马上有奶喝了」，孩子的内部就会随着这一过程产生预期性环境的幻想，即「过一会儿会有奶喝」。","之后，如果预期性环境的幻想被验证了，内部的体验空间就会变大，自体的功能也会增强，同时活动空间得以扩大。"],"k":["冲调奶粉","过一会儿会有奶喝","被验证"],"src":"案例：等冲奶粉","intro":1,"case":"十一","follow":"后面几张卡问：这一幻想如何参与蜕变性内化，以及科胡特把它放在什么位置。","refs":["案11"]},{"id":"k129","sid":"fe5b2dd730","cat":"inner","q":"在等冲奶粉的例子里，幻想被验证后发生了什么？","a":["内部的体验空间就会变大，自体的功能也会增强，同时活动空间得以扩大。"],"k":["体验空间变大","功能增强"],"src":"案例：等冲奶粉","ctx":"【案例十一 · 等冲奶粉的婴儿】就本例情节提问","refs":["案11"]},{"id":"k130","sid":"4800204aa1","cat":"inner","q":"从自体心理学视角，蜕变性内化作用是如何发生的？","a":["生命的自体客体需要发出后，需要被回应或理解，但此时如果被「恰到好处的挫折」所阻挡，预期性环境的幻想便被调动出来，以创造心理空间（从而增强情绪调整层面的统整性功能）。","待「恰到好处的挫折」被修复后，自体结构里就产生了更强大、更具韧性的预期性环境的幻想空间，这便是自体客体发生的蜕变性内化作用。"],"k":["阻挡与调动","修复","更具韧性"],"src":"§5 预期性环境","refs":[]},{"id":"k131","sid":"8417e991dd","cat":"inner","q":"与理想化、镜映、密友相关的发展过程，与蜕变性内化是什么关系？","a":["也与此类似。"],"k":["理想化","镜映","密友"],"src":"§5 预期性环境","refs":[]},{"id":"k132","sid":"cf61d3dec2","cat":"inner","q":"科胡特把什么作为发展自体心理学时的工作起点？","a":["预期性环境的幻想。"],"k":["工作起点"],"src":"§5 预期性环境","refs":[]},{"id":"案12","sid":"22c9c7a6e4","cat":"inner","q":"案例十二 · 牛排与菠菜","a":["巴施曾用这样一个例子来解释蜕变性内化的作用：吃下牛排和菠菜的时候，身体里不会有一块牛排或一些菠菜一直梗在那里。","如果一直这样梗着，就意味着你没有消化食物；真正的蜕变性内化作用如同我们吸收牛排和菠菜的营养，食物已经转化为自己的一部分。"],"k":["不会梗着","吸收营养","转化为自己"],"src":"案例：牛排与菠菜","intro":1,"case":"十二","follow":"后面几张卡问：这个过程形成什么，以及它带来的自由的自体感。","refs":["案12"]},{"id":"k133","sid":"7f2ca49677","cat":"inner","q":"牛排与菠菜的例子说明了什么过程？","a":["这个过程正是运用自体客体，经由蜕变性内化，最终形成内在力量的过程。"],"k":["内在力量"],"src":"案例：牛排与菠菜","ctx":"【案例十二 · 牛排与菠菜】由本例引出的一般规律／论断","refs":["案12"]},{"id":"k134","sid":"b2554c0a90","cat":"inner","q":"经历过蜕变性内化的人，其精神世界有什么不同？","a":["在其精神世界中不会有一个「异己的自体」持续不停地影响自己、鼓励自己，而是能够自如地，以自由的、个体化的方式去生活、去决策。","这就是蜕变性内化作用所带来的自由的自体感。"],"k":["无异己的自体","自由的自体感"],"src":"§5 蜕变性内化","refs":[]},{"id":"k135","sid":"802d0f6d0d","cat":"inner","q":"科胡特认为最理想的分析结束状态是什么？","a":["在咨询或者分析结束后，来访者对咨询师没有太多的记忆，并能以他自己的方式去生活。"],"k":["没有太多记忆","自己的方式"],"src":"§5 蜕变性内化","refs":[]},{"id":"k136","sid":"74b8847303","cat":"inner","q":"当代自体心理学对分析结束状态的看法是什么？","a":["来访者既能够独立自主地生活，也能够享受关系。"],"k":["独立自主","享受关系"],"src":"§5 蜕变性内化","refs":[]},{"id":"k137","sid":"1d7c3dc49f","cat":"lookup","q":"速查①：哪个例子用来说明自我心理学与自体心理学对同一情境的不同解释？","a":["案例一「1 米与 10 米高的桌子」：自我心理学归因于自我功能出了问题；自体心理学归因于体验出了问题，以及功能与体验之间的共同作用。"],"k":["案例一","两派解释"],"src":"速查：两派解释","refs":["案01"]},{"id":"k138","sid":"a64912ddc0","cat":"lookup","q":"速查②：哪个例子说明「与攻击者认同」这一生物策略？","a":["案例二「斯德哥尔摩银行劫案」：人质在法庭上反而帮劫匪说好话，被解释为提高存活概率的本能反应。"],"k":["案例二","与攻击者认同"],"src":"速查：攻击者认同","refs":["案02"]},{"id":"k139","sid":"e4bf5b4ab5","cat":"lookup","q":"速查③：哪个例子说明过于模式化的发展路径会抑制个性或生命力？","a":["案例三「富裕家庭的来访者」：各方面都被培养得很好，却内心并不快乐，治疗结束后回来再次寻求分析。"],"k":["案例三","抑制个性"],"src":"速查：模式化路径","refs":["案03"]},{"id":"k140","sid":"f8bddcfe89","cat":"lookup","q":"速查④：哪个例子说明自体「和谐性」的跨文化差异？","a":["案例四「戴口罩的东亚与欧美」：东亚基于集体自体和谐性普遍戴口罩，欧美因更重视个体性而反对与抗议。"],"k":["案例四","和谐性"],"src":"速查：和谐性","refs":["案04"]},{"id":"k141","sid":"51989520dd","cat":"lookup","q":"速查⑤：哪个例子说明咨询师对「自体客体需求」进行解释的关键作用？","a":["案例五「年会上的父母」：来访者因父母当众的「关心」而强烈羞耻，咨询师的诠释让压抑的东西被说出来，他因而释然。"],"k":["案例五","自体客体需求"],"src":"速查：年会父母","refs":["案05"]},{"id":"k142","sid":"ee2b2573d9","cat":"lookup","q":"速查⑥：哪个例子被用来说明「借助他人实现表达、促成自我理解」这一功能性过程？","a":["案例六「科胡特安慰巴施」：巴施感到共鸣，压抑的东西被共情地表达出来，实现了自我陈述与自我理解的功能性作用。"],"k":["案例六","功能性过程"],"src":"速查：巴施","refs":["案06"]},{"id":"k143","sid":"e597170895","cat":"lookup","q":"速查⑦：哪个例子说明母亲回应的关注会成为孩子自体功能的一部分？","a":["案例七「母亲的镜映目光」：孩子不仅获得情感体验，母亲的关注也发挥功能，伴随情感体验成为其自体功能的一部分。"],"k":["案例七","镜映"],"src":"速查：母亲镜映","refs":["案07"]},{"id":"k144","sid":"323fba1438","cat":"lookup","q":"速查⑧：哪个例子说明日常生活情境中也会发生自体客体经验？","a":["案例八「读小说时被精准命名」：无以名状的感觉在书中被精准表达，内心震动；这一过程也是一种自体客体经验。"],"k":["案例八","日常生活扩展"],"src":"速查：读小说","refs":["案08"]},{"id":"k145","sid":"084f747eea","cat":"lookup","q":"速查⑨：哪个例子说明置身特定场所可能产生的融合体验？","a":["案例九「羊卓雍措湖边」：感觉与湖的碧蓝融为一体、身体无形、心灵轻盈，是情感共鸣性的、同频的精神体验。"],"k":["案例九","融合体验"],"src":"速查：羊卓雍措","refs":["案09"]},{"id":"k146","sid":"5f8bc60f07","cat":"lookup","q":"速查⑩：哪个例子区分了「一般内化作用」与「蜕变性内化」？","a":["案例十「咨询师离开之后」：想起咨询师而信心百倍是内化客体表象；不再记得他、却发展出独立自主处理事情的能力，才是蜕变性内化。"],"k":["案例十","两种内化"],"src":"速查：咨询师离开","refs":["案10"]},{"id":"k147","sid":"52fae7b7b2","cat":"lookup","q":"速查⑪：哪个例子说明预期性环境的幻想被验证后，内部体验空间会变大？","a":["案例十一「等冲奶粉的婴儿」：妈妈安慰「马上有奶喝了」，孩子产生「过一会儿会有奶喝」的幻想；幻想被验证后体验空间变大、自体功能增强。"],"k":["案例十一","预期性环境"],"src":"速查：等冲奶粉","refs":["案11"]},{"id":"k148","sid":"b43fe17642","cat":"lookup","q":"速查⑫：哪个例子说明蜕变性内化不是「梗着没消化」，而是转化为自己的一部分？","a":["案例十二「牛排与菠菜」：真正的蜕变性内化如同吸收营养，食物已转化为自己的一部分，最终形成内在力量。"],"k":["案例十二","内在力量"],"src":"速查：牛排菠菜","refs":["案12"]},{"id":"k149","sid":"f6af19e334","cat":"term","q":"ego psychology → ？","a":["自我心理学。"],"k":["自我心理学"],"src":"§1 译名问题","refs":[]},{"id":"k150","sid":"a900b5e005","cat":"term","q":"self psychology → ？","a":["自体心理学；大陆译者最早译作「自身心理学」。"],"k":["自体心理学","自身心理学"],"src":"§1 译名问题","refs":[]},{"id":"k151","sid":"c2c188fe3c","cat":"term","q":"ego → ？","a":["功能性自我（功能性综合体）。"],"k":["功能性自我"],"src":"§1 功能性自我","refs":[]},{"id":"k152","sid":"040f808be4","cat":"term","q":"self（哈特曼的定义）→ ？","a":["自体表象（或自体影像）。"],"k" 域。」","a":["非冲突。"],"k":["非冲突区域"],"src":"§5 预期性环境","refs":[]},{"id":"k178","sid":"e5ec0b6794","cat":"cloze","q":"填空：「英语词典中 self 一词有＿＿种含义，而他所说的 self 包含其全部含义，因此无须再下定义。」","a":["12。"],"k":["12"],"src":"§1 self 的词义","refs":[]},{"id":"k179","sid":"00e385edfc","cat":"cloze","q":"填空：「弗洛伊德在他的德语著作中保留了德语的『Ich』——意为『＿＿』。」","a":["我。"],"k":["我"],"src":"§1 德语传统","refs":[]},{"id":"k180","sid":"1c2c6e0822","cat":"cloze","q":"填空：「最理想的情况就是在咨询或者分析结束后，来访者对咨询师没有太多的＿＿，并能以他自己的方式去生活。」","a":["记忆。"],"k":["记忆"],"src":"§5 蜕变性内化","refs":[]},{"id":"k181","sid":"8b7d94b797","cat":"cloze","q":"填空：「这就是蜕变性内化作用所带来的＿＿。」","a":["自由的自体感。"],"k":["自由的自体感"],"src":"§5 蜕变性内化","refs":[]}];
const CATMAP = {}; CATS.forEach(c=>CATMAP[c.k]=c);
const CATIDX = {}; CATS.forEach((c,i)=>CATIDX[c.k]=i);
const KEY = 'xj_ch3_knowledge_cards_v1';
/* 复习记录按卡片 sid（题干指纹）保存，与显示编号 k001… 解耦：
   以后增删卡片、重排编号都不会让自评张冠李戴。 */

/* ============ 状态 ============ */
let saved={status:{},settings:{}};
try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);saved.status=o.status||{};saved.settings=o.settings||{};}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){}}
const $=id=>document.getElementById(id);
function settings(){return {cat:$('fCat').value,order:$('fOrder').value,weak:$('fWeak').checked,recite:$('fRecite').checked,reverse:$('fReverse').checked};}
function saveSettings(){const s=settings();
  /* 「案例情节」是一次性查看，不写进默认设置：下次打开仍回到按案例穿插的正常复习流 */
  if(s.cat==='__intro__')s.cat='all';
  saved.settings=s;persist();}

let deck=[],pos=0,flipped=false,mineText='';

/* ============ 初始化控件 ============ */
CATS.forEach(c=>{
  const o=document.createElement('option');o.value=c.k;o.textContent=c.label+'（'+CARDS.filter(x=>x.cat===c.k).length+'）';
  $('fCat').appendChild(o);
});
const introOpt=document.createElement('option');
introOpt.value='__intro__';introOpt.textContent='案例情节（'+CARDS.filter(x=>x.intro).length+'）';
$('fCat').appendChild(introOpt);
const s0=saved.settings;
/* 兼容旧记录：曾保存过集中视图的，回到正常复习流 */
if(s0&&s0.cat==='__intro__'){s0.cat='all';persist();}
if(s0&&Object.keys(s0).length){
  if(s0.cat&&[...$('fCat').options].some(o=>o.value===s0.cat))$('fCat').value=s0.cat;
  if(s0.order&&[...$('fOrder').options].some(o=>o.value===s0.order))$('fOrder').value=s0.order;
  $('fWeak').checked=!!s0.weak;$('fRecite').checked=!!s0.recite;$('fReverse').checked=!!s0.reverse;
}
function renderChips(){
  const box=$('chips');box.innerHTML='';
  const all=document.createElement('span');
  all.className='chip'+($('fCat').value==='all'?' on':'');
  if($('fCat').value==='all')all.style.background='#2f4f6f';
  all.textContent='全部 '+CARDS.length;
  all.onclick=()=>{$('fCat').value='all';saveSettings();buildDeck();};
  box.appendChild(all);
  const iN=CARDS.filter(x=>x.intro).length;
  const ic=document.createElement('span');
  ic.className='chip'+($('fCat').value==='__intro__'?' on':'');
  if($('fCat').value==='__intro__')ic.style.background='#8a6a3e';
  ic.textContent='案例情节 '+iN;
  ic.title='集中浏览全部案例情节介绍卡（正常复习时介绍卡会自动插在对应案例题卡之前）';
  ic.onclick=()=>{$('fCat').value='__intro__';saveSettings();buildDeck();};
  box.appendChild(ic);
  CATS.forEach(c=>{
    const n=CARDS.filter(x=>x.cat===c.k).length;
    const el=document.createElement('span');
    el.className='chip'+($('fCat').value===c.k?' on':'');
    if($('fCat').value===c.k)el.style.background=c.color;
    el.title=c.note;
    el.innerHTML=c.label+'<i>'+n+'</i>';
    el.onclick=()=>{$('fCat').value=c.k;saveSettings();buildDeck();};
    box.appendChild(el);
  });
}

/* ============ 卡组 ============ */
function stat(v){return v===3?'✓ 记得':v===2?'· 模糊':'○ 未评';}
/* 情节卡不参与排序：在案例题卡「首次呈现」之前插入对应介绍。
   perSegment=true（知识模块顺序）：同一案例的题卡分成不同区段时，每段前都插一次
   （案例速查是反查练习，离原案例很远，需要重新给情节）。
   perSegment=false（弱项/随机/掌握度）：每个案例全局只插一次，避免介绍卡淹没题卡。 */
function anchorIntros(body, perSegment){
  const intros={}; CARDS.forEach(c=>{if(c.intro)intros[c.id]=c;});
  const out=[], seenKeys=new Set(), seenCards=new Set(); let last='';
  body.forEach(c=>{
    const refs=(c.refs||[]).filter(r=>intros[r]);
    const key=refs.join('|');
    const need=refs.length&&(perSegment?(key!==last):!seenKeys.has(key));
    if(need){
      if(perSegment){
        refs.forEach(r=>out.push(intros[r]));
      }else{
        /* 打散排序下按「单张情节卡」去重：案例速查⑦ 同时指向案10/案11，
           若这两个案例在别处已介绍过，就不再重复插入 */
        refs.forEach(r=>{if(!seenCards.has(r)){out.push(intros[r]);seenCards.add(r);}});
      }
      seenKeys.add(key);
    }
    last=refs.length?key:'';
    out.push(c);
  });
  return out;
}
function buildDeck(keep){
  const s=settings();
  const introOnly=(s.cat==='__intro__');
  deck=CARDS.filter(c=>{
    if(introOnly){if(!c.intro)return false;}
    else{if(c.intro)return false;if(s.cat!=='all'&&c.cat!==s.cat)return false;}
    if(s.weak&&(saved.status[c.sid]||0)>=3)return false;
    return true;
  });
  if(s.order==='seq')deck.sort((a,b)=>CATIDX[a.cat]-CATIDX[b.cat]||CARDS.indexOf(a)-CARDS.indexOf(b));
  if(s.order==='status')deck.sort((a,b)=>(saved.status[a.sid]||0)-(saved.status[b.sid]||0));
  if(s.order==='weak'){const wk=sid=>{const v=saved.status[sid]||0;return v===0?1.5:v;};deck.sort((a,b)=>wk(a.sid)-wk(b.sid)||Math.random()-.5);}
  if(s.order==='rand')deck=deck.slice().sort(()=>Math.random()-.5);
  /* 排序完成后再锚定情节卡：与所选顺序无关，保证介绍总在该案例题卡之前 */
  if(!introOnly)deck=anchorIntros(deck,s.order==='seq');
  if(keep&&pos<deck.length){}else{pos=0;}
  if(pos>=deck.length)pos=0;
  renderChips();updateStats();show();
}

function updateStats(){
  const s=settings();
  const introOnly=(s.cat==='__intro__');
  const pool=introOnly?CARDS.filter(c=>c.intro)
    :(s.cat==='all'?CARDS:CARDS.filter(c=>c.cat===s.cat)).filter(c=>!c.intro);
  const done=pool.filter(c=>(saved.status[c.sid]||0)>0).length;
  const got=pool.filter(c=>(saved.status[c.sid]||0)===3).length;
  const nIntro=deck.filter(c=>c.intro).length;
  $('statText').textContent=(introOnly?'案例情节 '+pool.length+' 张':'本模块 '+pool.length+' 张题卡')
    +' ｜ 已评 '+done+' ｜ 记得 '+got+' ｜ 当前卡组 '+deck.length+' 张'
    +(introOnly?'':'（含情节卡 '+nIntro+'）');
  $('progText').textContent=done+'/'+pool.length;
  $('bar').style.width=(pool.length?done/pool.length*100:0)+'%';
  $('countHint').textContent=deck.length?(pos+1)+' / '+deck.length:'当前筛选无卡片';
}

/* ============ 渲染 ============ */
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function show(){
  const box=$('cardArea');
  const oldEmpty=box.querySelector('.empty');if(oldEmpty)oldEmpty.remove();
  if(!deck.length){
    $('front').innerHTML='<div class="empty">当前筛选下没有卡片。<br>试着取消「只看未掌握」，或换一个模块。</div>';
    $('back').innerHTML='';$('card').classList.remove('flipped');
    updateStats();return;
  }
  const c=deck[pos],col=CATMAP[c.cat].color,st=saved.status[c.sid]||0;
  const s=settings();
  flipped=false;$('card').classList.remove('flipped');mineText='';
  $('card').style.setProperty('--cc',col);
  const badge=c.intro?'案例情节 · 先读':CATMAP[c.cat].label;
  const head='<div class="top"><span class="badge'+(c.intro?' introBadge':'')+'" style="background:'+col+'">'+badge+'　·　'+stat(st)+'</span><span class="idx">'+c.id+'　'+(pos+1)+'/'+deck.length+'</span></div>';
  const foot='<div class="src">所在小节：'+esc(c.src)+'　｜　徐钧《自体心理学入门》第三章</div>';

  /* 案例情节卡：正面直接印出情节，不用翻面就能读到背景；背面给记忆抓手。
     不进入默写／反向提问（它不是问答题）。 */
  if(c.intro){
    const body='<div class="introBody">'+c.a.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>';
    $('front').innerHTML=head+'<div class="q">'+esc(c.q)+'</div>'+body+
      '<div class="introHint">'+esc(c.follow||'')+'　·　无需翻面，读完直接进入后面的提问卡。</div>'+foot;
    $('back').innerHTML=head+'<div class="q">'+esc(c.q)+' · 记忆抓手</div>'+
      '<div class="kw">合上卡片试着自己复述情节，再核对关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>'+
      '<div class="introHint">'+esc(c.follow||'')+'</div>'+foot;
    $('flip').textContent='翻面看记忆抓手（空格）';
    updateStats();return;
  }

  let q=c.q, a=c.a;
  if(s.reverse){ q=c.a.join('　／　'); a=[c.q]; }
  const big=q.length>95?' big':'';

  const ctxHtml=c.ctx?'<div class="ctx">'+esc(c.ctx)+'</div>':'';
  if(s.recite&&!s.reverse){
    $('front').innerHTML=head+ctxHtml+'<div class="q'+big+'">'+esc(q)+'</div>'+
      '<textarea id="mine" placeholder="先在这里写下你的答案／背诵要点，再点「核对并翻面」…"></textarea>'+foot;
    const ta=$('mine');
    if(ta){ta.onclick=e=>e.stopPropagation();ta.oninput=()=>{mineText=ta.value;};ta.value='';}
  }else{
    $('front').innerHTML=head+ctxHtml+'<div class="q'+big+'">'+esc(q)+'</div>'+foot;
  }

  let back=head+(s.reverse?'':ctxHtml)+'<ul class="aList">'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(s.recite&&!s.reverse&&mineText.trim()){
    back+='<div class="mine"><b>你的默写</b>'+esc(mineText.trim())+'</div>';
    const hits=c.k.filter(w=>mineText.indexOf(w)>=0);
    back+='<div class="hit">关键词命中 '+hits.length+' / '+c.k.length+(hits.length?'：'+esc(hits.join('、')):'　— 建议对照全文再背一遍')+'</div>';
  }
  if(!s.reverse&&c.k.length){
    back+='<div class="kw">关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>';
  }
  back+=foot;
  $('back').innerHTML=back;
  $('flip').textContent=s.recite&&!s.reverse?'核对并翻面（空格）':'翻面看答案（空格）';
  updateStats();
}
function flip(){
  if(!deck.length)return;
  const s=settings();
  if(s.recite&&!s.reverse&&!flipped){const ta=$('mine');if(ta)mineText=ta.value;}
  if(!flipped&&s.recite&&!s.reverse&&!deck[pos].intro){showKeepMine();}
  flipped=!flipped;$('card').classList.toggle('flipped',flipped);
  $('flip').textContent=flipped?'返回正面（空格）':(deck[pos].intro?'翻面看记忆抓手（空格）':(s.recite&&!s.reverse?'核对并翻面（空格）':'翻面看答案（空格）'));
}
/* 翻面前把默写内容写进背面（不重置卡片状态） */
function showKeepMine(){
  const c=deck[pos],col=CATMAP[c.cat].color,st=saved.status[c.sid]||0,s=settings();
  const head='<div class="top"><span class="badge" style="background:'+col+'">'+CATMAP[c.cat].label+'　·　'+stat(st)+'</span><span class="idx">'+c.id+'　'+(pos+1)+'/'+deck.length+'</span></div>';
  const foot='<div class="src">所在小节：'+esc(c.src)+'　｜　徐钧《自体心理学入门》第三章</div>';
  let back=head+'<ul class="aList">'+c.a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(mineText.trim()){
    back+='<div class="mine"><b>你的默写</b>'+esc(mineText.trim())+'</div>';
    const hits=c.k.filter(w=>mineText.indexOf(w)>=0);
    back+='<div class="hit">关键词命中 '+hits.length+' / '+c.k.length+(hits.length?'：'+esc(hits.join('、')):'　— 建议对照全文再背一遍')+'</div>';
  }
  back+='<div class="kw">关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>'+foot;
  $('back').innerHTML=back;
}
function go(d){if(!deck.length)return;pos=(pos+d+deck.length)%deck.length;show();}
function rate(v){if(!deck.length)return;saved.status[deck[pos].sid]=v;persist();go(1);}

/* ============ 导出 ============ */
function download(name,text,type){
  const blob=new Blob(['\ufeff'+text],{type:type||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},200);
}
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}
$('btnCSV').onclick=()=>{
  const rows=[['编号','模块','语境','问题 / 情节标题','答案 / 情节正文','关键词','所在小节']];
  CARDS.forEach(c=>rows.push([c.id,c.intro?'案例情节':CATMAP[c.cat].label,c.ctx||'',c.q,c.a.join(' / '),c.k.join(' / '),c.src]));
  download('第3章_知识闪卡.csv',rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');
};
$('btnMD').onclick=()=>{
  let t='# 第三章 自体和自体客体 · 知识闪卡\n\n> 依据：徐钧《自体心理学入门》pp.041–061 修复稿。纯知识卡，重点为自我／自体之辨、自体客体与蜕变性内化。\n\n';
  CATS.forEach(c=>{
    const list=CARDS.filter(x=>x.cat===c.k);if(!list.length)return;
    t+='## '+c.label+'（'+list.length+' 张）\n\n';
    list.forEach(x=>{t+='**'+x.id+'｜'+(x.intro?'【案例情节】':'')+x.q+'**\n\n';if(x.ctx)t+='> 语境：'+x.ctx+'\n\n';x.a.forEach(a=>t+='- '+a+'\n');t+='\n> 关键词：'+x.k.join('、')+'　｜　所在小节：'+x.src+(x.intro&&x.follow?'\n> 后续：'+x.follow:'')+'\n\n';});
  });
  download('第3章_知识闪卡.md',t,'text/markdown;charset=utf-8');
};
$('btnPrint').onclick=()=>{
  let h='<h2>徐钧《自体心理学入门》· 第三章知识闪卡</h2><div class="meta">依据 pp.041–061 修复稿 ｜ 共 '+CARDS.length+' 张 ｜ 打印日期：'+new Date().toLocaleDateString('zh-CN')+'</div>';
  CATS.forEach(c=>{
    const list=CARDS.filter(x=>x.cat===c.k);if(!list.length)return;
    h+='<h3>'+c.label+'（'+list.length+' 张）</h3>';
    list.forEach(x=>{h+='<div class="item"><div class="qq">'+x.id+'　'+(x.intro?'【案例情节】':'')+esc(x.q)+'</div>'+(x.ctx?'<div class="ss">语境：'+esc(x.ctx)+'</div>':'')+'<div class="aa">'+x.a.map(esc).join('　／　')+'</div><div class="ss">所在小节：'+esc(x.src)+'</div></div>';});
  });
  $('printArea').innerHTML=h;
  setTimeout(()=>window.print(),60);
};

/* ============ 事件 ============ */
['fCat','fOrder'].forEach(id=>$(id).onchange=()=>{saveSettings();buildDeck();});
['fWeak','fRecite','fReverse'].forEach(id=>$(id).onchange=()=>{saveSettings();buildDeck();});
$('fReset').onclick=()=>{if(confirm('清除本套闪卡的全部自评记录？\n（不影响「第一二章_思维导图与闪卡.html」「第1章_知识闪卡.html」「第2章_知识闪卡.html」三套的进度）')){saved.status={};persist();buildDeck();}};
$('flip').onclick=e=>{e.stopPropagation();flip();};
$('prev').onclick=()=>go(-1);
$('next').onclick=()=>go(1);
document.querySelectorAll('.rate').forEach(b=>b.onclick=()=>rate(+b.dataset.r));
$('card').onclick=e=>{if(e.target.id==='mine')return;flip();};
document.addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='TEXTAREA'||tag==='INPUT'||tag==='SELECT')return;
  const k=e.key.toLowerCase();
  if(e.code==='Space'||k===' '){e.preventDefault();flip();}
  else if(k==='arrowleft'){e.preventDefault();go(-1);}
  else if(k==='arrowright'){e.preventDefault();go(1);}
  else if(k==='1'||k==='2'||k==='3')rate(+k);
  else if(k==='r'){$('fOrder').value='rand';saveSettings();buildDeck();}
  else if(k==='m'){$('fRecite').checked=! $('fRecite').checked;saveSettings();buildDeck();}
  else if(k==='f'){$('fWeak').checked=! $('fWeak').checked;saveSettings();buildDeck();}
});

buildDeck();
</script>
</body>
</html>
