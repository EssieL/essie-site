<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>徐钧《自体心理学入门》· 第一章 知识闪卡</title>
<style>
  :root{
    --bg:#f6f5f1; --ink:#2c2c2a; --muted:#888780; --line:#e3e1d8; --card:#fff;
    --blue:#3b6ea5; --amber:#b07b23; --red:#b4493f; --green:#2f7d6b; --brown:#9a6b3f;
    --shadow:0 2px 16px rgba(0,0,0,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{min-height:58px;padding:8px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:#fff;flex-wrap:wrap}
  header h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
  header .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:430px}
  header .right{margin-left:auto;display:flex;gap:6px;align-items:center}
  button.b{font-size:12px;padding:6px 11px;border:1px solid #d6d4ca;background:#fff;border-radius:7px;cursor:pointer;color:var(--ink);white-space:nowrap}
  button.b:hover{background:#f0eee6}
  button.b.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .fbar{padding:9px 16px;border-bottom:1px solid var(--line);background:#fbfaf7;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .fbar label{font-size:12px;color:var(--muted)}
  select{font-size:12px;padding:6px 8px;border:1px solid #d6d4ca;border-radius:7px;background:#fff;color:var(--ink)}
  .chk{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;background:#fff;border:1px solid #d6d4ca;border-radius:7px;padding:6px 9px;white-space:nowrap}
  .chk input{margin:0}
  .chips{display:flex;gap:5px;padding:8px 16px 2px;flex-wrap:wrap;max-height:74px;overflow:auto}
  .chip{font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:#b9b5a7}
  .chip.on{color:#fff;border-color:transparent;font-weight:600}
  .chip i{font-style:normal;opacity:.75;margin-left:4px}
  .stats{padding:8px 18px 2px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .track{flex:1;min-width:120px;height:7px;border-radius:5px;background:#e7e5dc;overflow:hidden}
  .track i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
  .cardArea{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 18px 4px;min-height:0}
  .card{width:100%;max-width:780px;height:100%;max-height:440px;min-height:280px;perspective:1400px;cursor:pointer}
  .inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:20px 26px;display:flex;flex-direction:column;overflow:auto}
  .face.back{transform:rotateY(180deg)}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{font-size:11px;padding:4px 10px;border-radius:20px;color:#fff;background:var(--cc,#3b6ea5);letter-spacing:.3px}
  .idx{font-size:11px;color:var(--muted);margin-left:auto}
  .q{font-size:19px;line-height:1.65;font-weight:600;margin:18px 0 8px;white-space:pre-wrap}
  .q.big{font-size:16px;font-weight:500;line-height:1.8}
  .ctx{font-size:11.5px;line-height:1.6;color:#7a5a34;background:#f8f2e7;border:1px solid #ecdfc6;border-radius:7px;padding:5px 10px;margin:14px 0 -4px}
  .introBody{background:#faf8f2;border:1px solid #eae5d7;border-radius:10px;padding:12px 16px;margin:10px 0 8px;font-size:14px;line-height:1.85;overflow:auto;max-height:230px}
  .introBody p{margin:0 0 8px}
  .introBody p:last-child{margin-bottom:0}
  .introHint{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:4px}
  .badge.introBadge{background:#8a6a3e}
  .src{font-size:11px;color:var(--muted);margin-top:auto;padding-top:12px;border-top:1px dashed var(--line)}
  textarea{width:100%;min-height:96px;flex:1;border:1px dashed #cfccc1;border-radius:9px;background:#fbfaf7;padding:11px 13px;font-size:14px;line-height:1.7;font-family:inherit;color:var(--ink);resize:none;outline:none}
  textarea:focus{border-color:var(--blue);background:#fff}
  .aList{font-size:14.5px;line-height:1.85;margin:12px 0 4px;padding-left:0;list-style:none;white-space:pre-wrap}
  .aList li{margin-bottom:8px;padding-left:16px;position:relative}
  .aList li:before{content:"";position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--cc,#3b6ea5)}
  .mine{background:#f7f5ef;border:1px dashed #d6d4ca;border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;margin-top:8px;max-height:110px;overflow:auto}
  .mine b{color:var(--muted);font-weight:500;font-size:11px;display:block;margin-bottom:4px}
  .hit{font-size:12px;color:var(--green);margin-top:6px}
  .kw{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.6}
  .kw span{display:inline-block;background:#f1efe8;border-radius:5px;padding:1px 7px;margin:2px 4px 0 0}
  .controls{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px 12px;flex-wrap:wrap}
  .controls .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
  .controls .rate{font-size:12px;padding:7px 13px;border-radius:8px;border:1px solid #d6d4ca;background:#fff;cursor:pointer;color:var(--ink)}
  .controls .rate:hover{background:#f0eee6}
  .controls .rate.r1{border-color:#e2b6b1;color:var(--red)}
  .controls .rate.r2{border-color:#e1cf9f;color:var(--amber)}
  .controls .rate.r3{border-color:#aed3c8;color:var(--green)}
  .foot{font-size:11px;color:var(--muted);text-align:center;padding:0 16px 9px}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}
  #printArea{display:none}
  @media print{
    html,body{height:auto;overflow:visible;background:#fff}
    body>*:not(#printArea){display:none !important}
    #printArea{display:block !important;padding:0}
    #printArea h2{font-size:16px;margin:0 0 6px}
    #printArea .meta{font-size:11px;color:#666;margin-bottom:14px}
    #printArea .item{border-bottom:1px solid #ddd;padding:8px 0;page-break-inside:avoid}
    #printArea .item .qq{font-size:13px;font-weight:600}
    #printArea .item .aa{font-size:12px;line-height:1.6;color:#333;margin-top:3px}
    #printArea .item .ss{font-size:10px;color:#888;margin-top:3px}
  }
  @media (max-width:640px){
    header .sub{display:none}
    .q{font-size:17px}
    .face{padding:16px 18px}
    .card{max-height:none}
  }

/* === 个人学习分站 · 顶部返回条（部署时注入，打印时隐藏） === */
.xjLearnBar{background:#115e59;color:#fff;padding:7px 16px;display:flex;gap:7px;
  flex-wrap:wrap;align-items:center;font:12.5px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  position:relative;z-index:99}
.xjLearnBar a{color:#d9f4ee;text-decoration:none;white-space:nowrap}
.xjLearnBar a:hover{text-decoration:underline}
.xjLearnBar .xjSep{opacity:.55}
.xjLearnBar .xjHere{opacity:.8;white-space:nowrap}
@media print{.xjLearnBar{display:none!important}}

</style>

const CARDS = [{"id":"k001","sid":"b09e6c7c5f","cat":"base","q":"弗洛伊德理论中三个很重要的概念是什么？","a":["无意识、因果原则、俄狄浦斯理论。","其中前两点是弗洛伊德观点中最重要的两点；第三个是经典精神分析中十分重要的「俄狄浦斯理论」，也是弗洛伊德自己认为非常关键的。"],"k":["无意识","因果原则","俄狄浦斯理论"],"src":"§1 弗洛伊德三个概念","refs":[]},{"id":"k002","sid":"d6be391ab9","cat":"base","q":"「无意识」如何界定？","a":["一个人的言行或心理问题，可能受到他自己意识不到的一些心理内容的影响。"],"k":["意识不到","心理内容"],"src":"§1 弗洛伊德三个概念","refs":[]},{"id":"k003","sid":"e6064aec48","cat":"base","q":"「因果原则」如何界定？","a":["一个人所产生的心理问题与他过去的生活和所遭遇的事件是相关的。","特别是 6 岁之前发生的事情，与他成年之后的心理问题、心理困扰和问题行为相关。"],"k":["过去","6 岁之前","成年之后"],"src":"§1 弗洛伊德三个概念","refs":[]},{"id":"k004","sid":"55ff61ad96","cat":"base","q":"在三个概念中，哪两点被指出是弗洛伊德观点中最重要的？","a":["无意识与因果原则。"],"k":["无意识","因果原则"],"src":"§1 弗洛伊德三个概念","refs":[]},{"id":"k005","sid":"4914e83c9d","cat":"base","q":"「俄狄浦斯」一词包含哪四个概念？","a":["俄狄浦斯心智结构、俄狄浦斯情境、俄狄浦斯阶段、俄狄浦斯情结。"],"k":["心智结构","情境","阶段","情结"],"src":"§1 俄狄浦斯四概念","refs":[]},{"id":"k006","sid":"f4f7305fa5","cat":"base","q":"俄狄浦斯理论为什么经常被误解？","a":["因为「俄狄浦斯」一词本身包含四个俄狄浦斯概念，而弗洛伊德并没有专门撰文区分这些概念。"],"k":["四概念","未专门撰文区分"],"src":"§1 俄狄浦斯四概念","refs":[]},{"id":"k007","sid":"bcd32249c6","cat":"base","q":"「俄狄浦斯心智结构」指什么？","a":["指人类的基本心智三元关系。","弗洛伊德认为，俄狄浦斯（结构）是一个人进入社会的基础；这个基础存在于一个人的生活中，通常体现在人际关系层面。"],"k":["三元关系","进入社会的基础","人际关系"],"src":"§1 俄狄浦斯四概念","refs":[]},{"id":"k008","sid":"bb2d83741a","cat":"base","q":"关于「俄狄浦斯阶段」和「俄狄浦斯情结」的讨论，焦点集中在哪里？","a":["集中在个体与异性的关系上。"],"k":["个体与异性"],"src":"§1 俄狄浦斯四概念","refs":[]},{"id":"k009","sid":"94997139b0","cat":"base","q":"所谓「三元关系」的三元指哪三元？","a":["主体、所爱的对象，以及这两者之间的一个禁止者。"],"k":["主体","所爱的对象","禁止者"],"src":"§1 三元关系","refs":[]},{"id":"k010","sid":"ce4288dde5","cat":"base","q":"俄狄浦斯三角结构对个体成年后有什么意义？","a":["一个人成年之后会面临融入社会、面对婚恋生活等许多任务。","例如当他在生活中爱上另一个人时，可能遇到某种社会性的阻碍或受到他人的阻碍，而这些受阻的过程就对应了俄狄浦斯的三角结构。"],"k":["融入社会","婚恋","受阻"],"src":"§1 三元关系","refs":[]},{"id":"案01","sid":"f762578a48","cat":"base","q":"案例一 · 三四岁男孩与妈妈","a":["男孩三四岁的时候，可能希望一直和妈妈在一起。","但因为爸爸和妈妈有正常的生活交流，孩子不可能完全占有妈妈。","当孩子对妈妈投注爱的时候，会感觉妈妈对他的爱被爸爸分掉了，于是孩子和爸爸之间产生了一种竞争。"],"k":["三四岁","爸爸","竞争"],"src":"§1 三元关系例","intro":1,"case":"一","follow":"后面几张卡问：爸爸在这个三角里是什么角色，以及另一种三角结构如何构成。","refs":["案01"]},{"id":"k011","sid":"c389b8dfdf","cat":"base","q":"在三四岁男孩的例子里，爸爸是什么角色？他禁止什么？","a":["爸爸实际上是一个参与者；当孩子对妈妈投注爱时，爸爸成为竞争者，也可以说是一个禁止者。","他禁止孩子完全占有妈妈。竞争的对象是妈妈。"],"k":["参与者","竞争者","禁止者"],"src":"§1 三元关系例","ctx":"【案例一 · 三四岁男孩与妈妈】就本例情节提问","refs":["案01"]},{"id":"k012","sid":"569bd1f3af","cat":"base","q":"另一种俄狄浦斯三角结构是如何构成的？","a":["也可能存在另一种情形：孩子和爸爸之间的关系很亲密，这时妈妈就作为一个竞争者参与进来。","这同样构成了一个俄狄浦斯的三角结构。"],"k":["爸爸亲密","妈妈为竞争者","同样构成"],"src":"§1 三元关系例","ctx":"【案例一 · 三四岁男孩与妈妈】就本例情节提问","refs":["案01"]},{"id":"案02","sid":"646dfe6a44","cat":"base","q":"案例二 · 二十岁仍与母亲同床","a":["一个男孩到了 20 岁还和妈妈睡在同一张床上，并要求爸爸睡在另外一个房间。","这样一来，他和妈妈的关系就过于亲密，而作为竞争者的爸爸并没有出现。"],"k":["20 岁","同床","爸爸缺席"],"src":"§1 临床举例","intro":1,"case":"二","follow":"后面一张卡问：这种早期三角关系的缺席，对成年后有什么影响。","refs":["案02"]},{"id":"k013","sid":"0af58e62a9","cat":"base","q":"「二十岁仍与母亲同床」的例子说明什么？","a":["他和妈妈的关系过于亲密，作为竞争者的爸爸缺席，并没有发挥足够的限制作用。","孩子因此缺乏必要的人际互动的练习机会，也没有一个可以练习情绪调节的环境。","后果：今后在婚恋关系中可能遇到很多问题——与异性交往显得十分幼稚、不知如何交流；被拒绝一次就不知如何调整情感状态，很可能一蹶不振，甚至出现焦虑、强迫的症状。"],"k":["竞争者缺席","情绪调节","幼稚","焦虑强迫"],"src":"§1 临床举例","ctx":"【案例二 · 二十岁仍与母亲同床】就本例情节提问","refs":["案02"]},{"id":"k014","sid":"f3df070fdf","cat":"school","q":"图 1「精神分析主要学派发展树」列出哪八个分支？","a":["经典精神分析、自我心理学、客体关系理论·克莱因学派、客体关系理论·中间学派、自体心理学、关系性精神分析、主体间性精神分析、精神分析场论。"],"k":["经典","自我心理学","克莱因","中间学派","自体心理学","关系性","主体间性","场论"],"src":"图1 学派发展树","refs":[]},{"id":"k015","sid":"fc6ec2e0ed","cat":"school","q":"发展树中「经典精神分析」与「自我心理学」的代表人物分别是谁？","a":["经典精神分析：弗洛伊德。","自我心理学：安娜·弗洛伊德、海因茨·哈特曼。"],"k":["弗洛伊德","安娜·弗洛伊德","哈特曼"],"src":"图1 学派发展树","refs":[]},{"id":"k016","sid":"d374371f2f","cat":"school","q":"发展树中两个「客体关系理论」分支的代表人物是谁？","a":["克莱因学派：梅兰妮·克莱因。","中间学派：罗纳德·费尔贝恩、唐纳德·温尼科特、迈克尔·巴林特等。"],"k":["克莱因","费尔贝恩","温尼科特","巴林特"],"src":"图1 学派发展树","refs":[]},{"id":"k017","sid":"1cd1ec1f84","cat":"school","q":"发展树中「自体心理学」及其后三个分支的代表人物是谁？","a":["自体心理学：海因茨·科胡特。","关系性精神分析：斯蒂芬·米切尔、杰伊·格林伯格等。","主体间性精神分析：罗伯特·史托罗楼。","精神分析场论：安东尼诺·费罗、朱塞佩·奇维塔雷塞、托马斯·奥格登等。"],"k":["科胡特","米切尔","史托罗楼","费罗"],"src":"图1 学派发展树","refs":[]},{"id":"k018","sid":"1fc63a9d28","cat":"school","q":"自我心理学是怎么来的？它的另一个名称是什么？","a":["晚年弗洛伊德和女儿安娜·弗洛伊德以及学生海因茨·哈特曼一起发展了适应理论。","这是弗洛伊德理论晚期的主要形态，人们习惯上称之为自我心理学（ego psychology）。"],"k":["适应理论","安娜·弗洛伊德","哈特曼","ego psychology"],"src":"§2 自我心理学","refs":[]},{"id":"k019","sid":"42b766e454","cat":"school","q":"自我心理学的发展与精神分析的翻译过程有什么关系？","a":["这一发展的出现与精神分析体系从德语被翻译为英语的过程相关。","在英译过程中，对精神分析科学性术语的强调，在很大程度上改变了精神分析的原貌。"],"k":["德语译英语","科学性术语","改变原貌"],"src":"§2 自我心理学","refs":[]},{"id":"k020","sid":"74cc031c94","cat":"school","q":"自我心理学在北美精神分析界的地位如何？","a":["自我心理学从维也纳学派晚期发展起来，传入美国后主导了北美精神分析界长达 70 年之久。","在这 70 年间，许多心理学理论的发展都受到自我心理学的影响，甚至包括认知疗法的发展；现在这一理论在北美精神分析界依然具有重要影响力。"],"k":["70 年","认知疗法","北美"],"src":"§2 自我心理学","refs":[]},{"id":"k021","sid":"36de4df94e","cat":"school","q":"克莱因的精神分析训练经历是怎样的？","a":["她最初在桑多尔·费伦齐门下学习，不久又经其推荐正式开始进行精神分析训练并接受精神分析。","之后在卡尔·亚伯拉罕那里接受分析训练，但亚伯拉罕后来突然病逝，此时对她的精神分析才进行了两年。","所以今天看来，克莱因并没有完整地完成精神分析训练。"],"k":["费伦齐","亚伯拉罕","两年","未完成"],"src":"§2 克莱因学派","refs":[]},{"id":"k022","sid":"b5e678cfae","cat":"school","q":"克莱因何时前往英国？她如何在英国形成自己的学派？","a":["1926 年，克莱因前往英国。由于英国距离当年精神分析的中心比较远，从中欧来的分析家在当时英国临床心理学家和临床医生看来十分厉害。","她在英国艰苦地发展属于自己的精神分析思考，苦练临床精神分析，带领英国的一批弟子发展出自己独特的理论，形成「克莱因学派」。"],"k":["1926","英国","一批弟子"],"src":"§2 克莱因学派","refs":[]},{"id":"k023","sid":"e1be008892","cat":"school","q":"弗洛伊德与克莱因各自重视儿童发展的哪个阶段？","a":["弗洛伊德重视的是俄狄浦斯期的 3～6 岁，甚至 3～10 岁儿童的发展。","克莱因的理论和兴趣点则聚焦在 0～3 岁这个阶段，尤其是 0～2 岁。"],"k":["3～6 岁","0～3 岁","0～2 岁"],"src":"§2 克莱因学派","refs":[]},{"id":"k024","sid":"d2da14417f","cat":"school","q":"0～2 岁与四五岁时，父母对孩子需要的回应方式有何不同？","a":["0～2 岁时，父母通常会对孩子的需要给予及时的满足和回应：孩子有需求时，父母通常先放下自己手中的事情，优先满足孩子。","到了四五岁，父母可能就会让孩子等一等，晚一些再满足孩子。"],"k":["及时满足","优先","等一等"],"src":"§2 克莱因学派","refs":[]},{"id":"k025","sid":"4fc0eccd5a","cat":"school","q":"克莱因认为很多心理问题来自哪里？","a":["孩子的很多心理问题，包括成年后的问题，可能都来自人生更早期的刺激——母婴关系互动的失败。"],"k":["更早期","母婴关系","互动失败"],"src":"§2 克莱因学派","refs":[]},{"id":"k026","sid":"beee24e680","cat":"school","q":"克莱因学派更重视哪一条发展线索？","a":["更重视从早期的二元关系到三元关系的发展。"],"k":["二元关系","三元关系"],"src":"§2 克莱因学派","refs":[]},{"id":"k027","sid":"71db692d16","cat":"school","q":"克莱因发展的母婴关系理论包含哪些内容？","a":["关于好客体、坏客体，以及从偏执—分裂位到抑郁位的二阶心位理论。","这让克莱因学派后来在英国的发展中形成了一种独立的特点。"],"k":["好客体","坏客体","偏执—分裂位","抑郁位"],"src":"§2 克莱因学派","refs":[]},{"id":"k028","sid":"65e696c889","cat":"school","q":"哪一派的发展被称为「精神分析的第二波发展」？","a":["克莱因学派。1926—1939 年，英国的精神分析已经受到了克莱因的深远影响；之后她与塔维斯托克中心及其他地方的英国学者一起发展了克莱因学派。"],"k":["克莱因学派","第二波","塔维斯托克"],"src":"§2 克莱因学派","refs":[]},{"id":"k029","sid":"adcf832f70","cat":"school","q":"1939 年之后，英国精神分析界两个学派之间发生了什么？","a":["1938 年弗洛伊德带着维也纳团队流亡英国；1939 年弗洛伊德去世后，克莱因学派随即向从中欧移民过去的、以安娜·弗洛伊德为首的维也纳学派发起挑战。","两个学派之间进行了许多辩论，这些辩论推动了英国精神分析的发展；之后两派各自保持独立。"],"k":["1939","挑战","辩论","各自独立"],"src":"§2 英国三派","refs":[]},{"id":"k030","sid":"21e401d300","cat":"school","q":"英国那时独特的精神分析训练体制是什么？","a":["两派共同商定：凡是接受克莱因学派训练的分析师，至少要有一位维也纳学派的督导师；凡是接受维也纳学派训练的分析师，至少要有一位克莱因学派的督导师。"],"k":["交叉督导","至少一位"],"src":"§2 英国三派","refs":[]},{"id":"k031","sid":"8c64728038","cat":"school","q":"中间（独立）学派是如何形成的？","a":["当时英国有一些分析家，既不愿意站在克莱因学派一边，也不认同安娜·弗洛伊德所属的维也纳学派，后来他们在英国创立了中间学派。","成员根据自己的理解和经验，同时结合克莱因学派和维也纳学派的一些理论，发展出对母婴关系特别关注的客体关系理论的多种观点。"],"k":["不站队","结合两派","母婴关系"],"src":"§2 中间学派","refs":[]},{"id":"k032","sid":"17768dc95e","cat":"school","q":"狭义客体关系理论的重要代表有哪些人？影响如何？","a":["威廉·R. D. 费尔贝恩、唐纳德·W. 温尼科特以及约翰·鲍尔比。","他们都是客体关系理论的重要代表，对全球的精神分析理论及其临床发展都产生了深远的影响。"],"k":["费尔贝恩","温尼科特","鲍尔比"],"src":"§2 中间学派","refs":[]},{"id":"k033","sid":"0b7b9fcd89","cat":"school","q":"客体关系理论严格说属于哪一派的思想内容？","a":["客体关系理论实际上属于中间学派的思想内容，形成的是狭义的客体关系理论。","克莱因学派的理论贡献虽然被认为属于广义的客体关系理论体系，但克莱因学派自身并不太愿意接受这一点。"],"k":["中间学派","狭义","广义"],"src":"§2 中间学派","refs":[]},{"id":"k034","sid":"5c4cc00a10","cat":"dev","q":"弗洛伊德何时开始发展精神分析？其理论体系是否前后一致？","a":["1895 年开始发展精神分析；但从那时起到 1939 年他去世，这一理论体系经历了多次发展，其前后观点并不完全一致。"],"k":["1895","1939","并不完全一致"],"src":"§1 弗洛伊德三个概念","refs":[]},{"id":"k035","sid":"863972b859","cat":"dev","q":"自体心理学有哪三个「起源年」？各自的依据是什么？","a":["1977 年：科胡特出版《自体的重建》并提出「自体心理学」的概念，为最常采用的诞生年份。","1971 年：《自体的分析》出版，科胡特自体心理学的系统思想形成。","1959 年：有学者认为自体心理学起源于此，理由是科胡特的内省-共情理论在 1957 年提出、1959 年发表。"],"k":["1977","1971","1959","内省-共情"],"src":"§1 三个起源年","refs":[]},{"id":"k036","sid":"038508e928","cat":"dev","q":"1977 年发生了什么，使这一年成为自体心理学的诞生年？","a":["科胡特出版了《自体的重建》，并提出了「自体心理学」的概念。","相对于经典精神分析，自体心理学是一个平行的系统。"],"k":["自体的重建","平行系统"],"src":"§3 著作与争议","refs":[]},{"id":"k037","sid":"43e5cdb551","cat":"dev","q":"1971 年出版的《自体的分析》是怎样一部著作？","a":["一部关于自恋人格障碍治疗的专著，全名为《自体的分析——一种系统化处理自恋人格障碍的精神分析治疗》。","科胡特结合自己的临床经验以及从自恋研究小组讨论中提炼的思想写成；在精神分析界引起很大反响，为自恋人格障碍的研究提供了全新的视角。"],"k":["自恋人格障碍","临床经验","小组讨论","全新视角"],"src":"§3 著作与争议","refs":[]},{"id":"k038","sid":"f1a71886c4","cat":"dev","q":"弗洛伊德曾如何判断自恋人格障碍的来访者？","a":["弗洛伊德曾经公开表示，患有自恋人格障碍的来访者依从性很差，无法产生移情，所以是无法被分析的。"],"k":["依从性差","无法产生移情","无法被分析"],"src":"§3 著作与争议","refs":[]},{"id":"k039","sid":"2aefc32ac0","cat":"dev","q":"科胡特为自恋人格障碍的治疗带来了什么改变？","a":["他提供了一个系统性的视角，使自恋人格障碍患者也可以接受精神分析。"],"k":["系统性视角","可以接受精神分析"],"src":"§3 著作与争议","refs":[]},{"id":"k040","sid":"75cfbfe2bc","cat":"dev","q":"安娜·弗洛伊德如何评价《自体的分析》？","a":["她给科胡特写信，在信中表达了对这本书的认可，认为这本书为精神分析提供了有益补充，对精神分析的发展有重要的推动作用。"],"k":["写信认可","有益补充","推动作用"],"src":"§3 著作与争议","refs":[]},{"id":"k041","sid":"7be84ac389","cat":"dev","q":"「自恋研究小组」是什么？与自体心理学是什么关系？","a":["科胡特在 20 世纪 60 年代组织的一个小组，当时有七个人，每个月都会进行讨论。","这个小组是后来的自体心理学发展的前身。"],"k":["1960 年代","七个人","每月讨论","前身"],"src":"§3 自恋研究小组","refs":[]},{"id":"k042","sid":"d01ec9e0f5","cat":"dev","q":"1975 年成立的「芝加哥小组」起了什么作用？","a":["科胡特在 1975 年成立第二个研究小组——芝加哥小组，这个小组一直延续到他去世。","「自体心理学」这个名称是在 1977 年正式提出的，芝加哥小组在其中起了很大的推动作用；自体心理学因此有了新发展，同时催生了一批重要人物。"],"k":["1975","延续到去世","推动命名"],"src":"§4 主体间性学派","refs":[]},{"id":"k043","sid":"c71580e51f","cat":"dev","q":"1977 年提出「自体心理学」后，科胡特在体制内遭遇了什么？","a":["一些保守的精神分析家并不认同，觉得科胡特开始离经叛道。","芝加哥精神分析学院直接取消了他的督导分析家和训练分析家资格，只保留分析家资格。","整个精神分析圈，特别是北美的自我心理学精神分析圈对科胡特十分排斥：凡是引用了科胡特论文的文章，均不会被发表。"],"k":["离经叛道","取消资格","拒发文章"],"src":"§3 著作与争议","refs":[]},{"id":"k044","sid":"56fd2679e1","cat":"dev","q":"《精神分析治愈之道》的完稿与出版情况如何？","a":["1981 年科胡特完成了写作，但还没等到出版就去世了。","1984 年，这本书在科胡特家人和同事的协助下终于面世；它凝结了科胡特在职业生涯晚期对精神分析的思考。"],"k":["1981 完稿","1984 出版","晚期思考"],"src":"§3 著作与争议","refs":[]},{"id":"k045","sid":"e412505efe","cat":"dev","q":"科胡特去世前的最后一场学术活动是什么？","a":["1981 年，在去世前几天，他作为国际自体心理学学会的主要领导者，前往美国加州大学伯克利分校参加第四届国际精神分析自体心理学大会。","他在讲台上宣读了论文「论共情」，读完后和大家告别就转身离开；当晚病危，第二天去世。"],"k":["伯克利","第四届","论共情"],"src":"§3 著作与争议","refs":[]},{"id":"k046","sid":"08e7568f6f","cat":"dev","q":"1982 年「关系性」概念由谁提出，引发了什么？","a":["杰伊·格林伯格和斯蒂芬·米切尔提出了关系性的概念，引起学界的广泛关注。","随后，以关系性为核心，松散地聚集了客体关系理论、自体心理学、人际学派等多种思想的北美关系性精神分析运动逐渐开展，成为精神分析发展历程中的一股新思潮。"],"k":["1982","格林伯格","米切尔","关系性"],"src":"§4 关系性精神分析","refs":[]},{"id":"k047","sid":"526b3a0f86","cat":"dev","q":"1994 年《体验的世界》关注什么？","a":["史托罗楼开始对自己的理论进行反思，并与阿特伍德及唐娜·M. 奥林奇共同撰写了《体验的世界》。","该书关注主体间性关系中体验的过程，即一个人对世界的体验过程和复杂性过程。"],"k":["1994","体验的过程","复杂性过程"],"src":"§4 主体间性学派","refs":[]},{"id":"k048","sid":"f5a9bf781e","cat":"dev","q":"1997 年「非线性动力系统」是如何提出的？","a":["史托罗楼在「动态的二元主体间系统：精神分析的一种演进范式」一文里提出「非线性动力系统」，也就是后来的复杂性系统理论。","该理论在当代由威廉·科伯恩持续发展。"],"k":["1997","非线性动力系统","复杂性系统理论","科伯恩"],"src":"§4 复杂性系统","refs":[]},{"id":"k049","sid":"671c560cb0","cat":"dev","q":"现在的自体心理学流派如何评价科胡特去世时的理论状态？","a":["认为科胡特去世前，他的理论已经开始逐步成形。","如果科胡特的寿命再长一点，精神分析自体心理学肯定会有更大、更系统的发展。"],"k":["逐步成形","未竟"],"src":"§3 著作与争议","refs":[]},{"id":"k050","sid":"16743d41f0","cat":"disc","q":"「自体心理学是客体关系理论的一个分支」——这个说法对吗？","a":["错误。在讨论自体心理学的发展时，经常有人把自体心理学误认为客体关系理论的一个分支，这个观点是错误的。"],"k":["错误","误认"],"src":"§3 自体心理学的来源","refs":[]},{"id":"k051","sid":"8cffd79668","cat":"disc","q":"「自体心理学脱胎于客体关系理论」——这个说法对吗？","a":["错误。这也是关于自体心理学来源的一个常见误判。"],"k":["错误","脱胎"],"src":"§3 自体心理学的来源","refs":[]},{"id":"k052","sid":"d128fbdedc","cat":"disc","q":"自体心理学的基础及发展更偏向哪个传统？","a":["更偏向于维也纳学派的经典精神分析传统。","至少在一开始，自体心理学和客体关系理论是两个完全不同的发展方向。"],"k":["维也纳学派","经典精神分析","完全不同"],"src":"§3 自体心理学的来源","refs":[]},{"id":"k053","sid":"ec29983322","cat":"disc","q":"「克莱因学派属于客体关系理论」——要如何分辨？","a":["克莱因学派的理论贡献虽然被认为属于广义的客体关系理论体系，但克莱因学派自身并不太愿意接受这一点，更倾向将自己视为经典精神分析的发展延续。","而代表经典精神分析的维也纳学派并不这么认为。","客体关系理论严格说属于中间学派的思想内容，即狭义的客体关系理论。"],"k":["广义","狭义","中间学派","经典延续"],"src":"§2 中间学派","refs":[]},{"id":"k054","sid":"6aa9e79b5c","cat":"disc","q":"狭义的客体关系理论指什么？","a":["中间（独立）学派的成员结合克莱因学派与维也纳学派的一些理论，发展出的对母婴关系特别关注的客体关系理论的多种观点。"],"k":["中间学派","母婴关系","多种观点"],"src":"§2 中间学派","refs":[]},{"id":"k055","sid":"0ceeaaacce","cat":"disc","q":"「俄狄浦斯」就等于「俄狄浦斯情结」吗？","a":["不等于。「俄狄浦斯」一词本身包含四个概念：心智结构、情境、阶段、情结；弗洛伊德并没有专门撰文区分它们。"],"k":["四概念","不等于"],"src":"§1 俄狄浦斯四概念","refs":[]},{"id":"k056","sid":"9c50a62854","cat":"disc","q":"关系性精神分析的「关系」与客体关系的「关系」相同吗？","a":["并不相同。前者包含着相互性。"],"k":["不相同","相互性"],"src":"§4 关系性精神分析","refs":[]},{"id":"k057","sid":"f01244454f","cat":"disc","q":"关系性精神分析如何理解「主体」？","a":["一个人的主体是关系性所构建的。","当我们感受到和另一个具有主体的人的关系时，都会感受到这种相互性关系给自己带来的一种主体体验。"],"k":["关系性所构建","相互性","主体体验"],"src":"§4 关系性精神分析","refs":[]},{"id":"k058","sid":"40639e855c","cat":"disc","q":"关系性视角侧重体验的哪些特性？临床关注点是什么？","a":["侧重体验的是过程性、流动性和复杂性。","在人际关系和临床过程中，关注这种复杂的、动态交互的体验尤为重要。"],"k":["过程性","流动性","复杂性","动态交互"],"src":"§4 关系性精神分析","refs":[]},{"id":"k059","sid":"97d4ce691b","cat":"disc","q":"主体间性学派与自体心理学是什么关系？","a":["尽管史托罗楼认为主体间性学派和自体心理学派有很大的区别，但实际上主体间性学派大部分的发展是在自体心理学内进行的。","所以一般也把主体间性学派看成广义的自体心理学思潮的一个发展分支，二者具有一定的相似性——尽管史托罗楼等对此可能有自己的不同意见。"],"k":["广义分支","相似性","史托罗楼有异议"],"src":"§4 主体间性学派","refs":[]},{"id":"k060","sid":"5766f3c4f5","cat":"disc","q":"当代北美「关系性精神分析」与「现代自体心理学」为何常被混在一起？","a":["在米切尔与主体间学派代表人物史托罗楼等人的对话过程中，不少自体心理学家也开始加入关系性精神分析的讨论与发展。","因此当代北美的关系性精神分析学派和现代自体心理学学派经常是混合在一起发出声音的；在北美，关系性精神分析很有话语权。"],"k":["对话","加入","混合发声"],"src":"§4 关系性精神分析","refs":[]},{"id":"k061","sid":"db282a6f5c","cat":"disc","q":"当代国际自体心理学大会上常被问及的身份问题是什么？","a":["参会者往往会被问及是支持科胡特模型还是史托罗楼模型。","虽然还是存在许多经典自体心理学模型的支持者，但更多的是主体间模型（史托罗楼模型）的支持者。"],"k":["科胡特模型","史托罗楼模型","主体间模型"],"src":"§4 当代整合","refs":[]},{"id":"k062","sid":"835cc41bd4","cat":"disc","q":"当代许多北美的自体心理学家和主体间性精神分析家更愿意自称什么？","a":["更愿意称自己为关系性精神分析家。","不过「关系性精神分析」这个称谓同时也被其他独立的精神分析家所使用，包括关系性精神分析的第二代、第三代学者，这也让事情变得融合和复杂。"],"k":["关系性精神分析家","融合复杂"],"src":"§4 当代整合","refs":[]},{"id":"k063","sid":"f536a94bf4","cat":"disc","q":"当代自体心理学的理论与科胡特的理论还一样吗？","a":["在当代自体心理学的发展中，许多理论和科胡特的理论已经不太一样了。"],"k":["不太一样"],"src":"§4 当代整合","refs":[]},{"id":"k064","sid":"e42709cb93","cat":"disc","q":"「自我心理学」与「自体心理学」如何分辨？","a":["自我心理学（ego psychology）：晚年弗洛伊德与安娜·弗洛伊德、哈特曼发展的适应理论，是弗洛伊德理论晚期的主要形态，传入美国后主导北美约 70 年。","自体心理学：科胡特 1977 年正式提出，相对于经典精神分析是一个平行的系统，基础更偏向维也纳学派的经典精神分析传统。","两者名称相近，但源流、代表人物与主张都不同。"],"k":["适应理论","安娜·弗洛伊德","平行系统","科胡特"],"src":"§2 自我心理学","refs":[]},{"id":"k065","sid":"64907ee8e4","cat":"disc","q":"「自体心理学」这个名称何时正式提出？谁起了推动作用？","a":["1977 年正式提出。","科胡特 1975 年成立的第二个研究小组「芝加哥小组」在其中起了很大的推动作用；该小组一直延续到他去世。"],"k":["1977","芝加哥小组","1975"],"src":"§4 主体间性学派","refs":[]},{"id":"k066","sid":"2f77b7b7c6","cat":"disc","q":"「关系性自体心理学」与「主体间自体心理学」分别整合了什么？","a":["关系性自体心理学：巴里·马吉德和埃斯特尔·沙恩等整合了米切尔的关系精神分析与科胡特的自体心理学而形成。","主体间自体心理学：国际自体心理学学会执行主席乔治·哈格曼等分析家，根据临床经验整合了科胡特的自体心理学与史托罗楼的理论而形成。"],"k":["米切尔＋科胡特","科胡特＋史托罗楼"],"src":"§4 当代整合","refs":[]},{"id":"k067","sid":"f87f578e86","cat":"disc","q":"中国「自体心理学新古典」视角是基于什么发现提出的？","a":["作者在研究和探讨科胡特思想的过程中，发现科胡特思想与弗洛伊德经典理论紧密相关。","因此在弗洛伊德和科胡特的临床思想基础上，结合荣格和比昂的临床进展，将当代精神分析场论的临床工作整合至科胡特的经典自体心理学工作中。"],"k":["紧密相关","荣格","比昂","场论"],"src":"§4 中国新古典","refs":[]},{"id":"k068","sid":"6f8e92ecc3","cat":"kohut","q":"弗洛伊德与科胡特在从事精神分析之前有什么共同的专业背景？","a":["都在维也纳大学接受过医学训练；在从事精神分析之前，两人的专业方向都是神经生理学。"],"k":["维也纳大学","神经生理学"],"src":"§3 科胡特生平","refs":[]},{"id":"k069","sid":"a8cc670f0c","cat":"kohut","q":"科胡特接受谁的分析才真正体会到精神分析的魅力？","a":["最初几位分析家的分析并不成功；直到他找到弗洛伊德的同事奥古斯特·艾克霍恩，接受了他的分析，才真正体会到精神分析的魅力。","他的抑郁症不是特别严重，更像是未能完成对父亲去世的哀悼，所以一段时间之后便获得了疗愈；约两年后，因纳粹德国吞并奥地利，这段分析被迫中止。"],"k":["艾克霍恩","未完成哀悼","中断"],"src":"§3 科胡特生平","refs":[]},{"id":"案03","sid":"471423b54a","cat":"kohut","q":"案例三 · 不停攻击科胡特的来访者","a":["科胡特曾经遇到过这样一位来访者：无论他如何解释和说明，这位来访者都会攻击他。","当时科胡特正在接受精神分析的督导，自己也在不断思考；然而对这位来访者而言，这些解释和说明并没有什么作用，他依然频繁受到攻击。","在艰难地工作了一段时间之后，科胡特尝试转变工作思路。"],"k":["解释无效","持续攻击","转变思路"],"src":"§3 临床转折","intro":1,"case":"三","follow":"后面几张卡问：思路怎么转、带来什么变化、以及由此得出的方法论。","refs":["案03"]},{"id":"k070","sid":"fd04fd27ac","cat":"kohut","q":"面对这位来访者，科胡特转变后的工作思路是什么？","a":["不以自己的理论理解去给来访者做诠释，而是专注倾听来访者想表达的内容。","具体做法：只对来访者所说的内容进行一些复述，帮她澄清一些不清晰的东西，或做一个小结。"],"k":["不以理论诠释","专注倾听","复述","澄清","小结"],"src":"§3 临床转折","ctx":"【案例三 · 不停攻击科胡特的来访者】就本例情节提问","refs":["案03"]},{"id":"k071","sid":"fbcf9db0a9","cat":"kohut","q":"这样倾听带来了什么变化？","a":["能帮助来访者厘清思路，让她平静下来，治疗也得以顺畅地向前推进。"],"k":["厘清思路","平静","治疗推进"],"src":"§3 临床转折","ctx":"【案例三 · 不停攻击科胡特的来访者】就本例情节提问","refs":["案03"]},{"id":"k072","sid":"f8ee81f497","cat":"kohut","q":"治疗推进之后科胡特又做了什么？结果如何？","a":["他开始尝试把自己对来访者的理解以诠释的方式传达给来访者。","这时来访者不再进行攻击，反而认为科胡特非常理解她，而且她也能够自我接纳。"],"k":["传达理解","不再攻击","被理解","自我接纳"],"src":"§3 临床转折","ctx":"【案例三 · 不停攻击科胡特的来访者】就本例情节提问","refs":["案03"]},{"id":"k073","sid":"8a42140b42","cat":"kohut","q":"由此得出的方法论是什么？","a":["分析家首先要做的是认真倾听来访者所说的内容，理解其中蕴含的情感。","分析家自己的理论应该成为后台而不是前台的东西。"],"k":["认真倾听","理解情感","后台","前台"],"src":"§3 临床转折","ctx":"【案例三 · 不停攻击科胡特的来访者】由本例引出的一般规律／论断","refs":["案03"]},{"id":"k074","sid":"a2a1bd279a","cat":"kohut","q":"这个个案之后，科胡特又遇到了什么？","a":["在这个个案之后，科胡特又陆续遇到了一系列类似的个案，并在其中发现了临床工作的方向。"],"k":["一系列类似个案","临床方向"],"src":"§3 临床转折","ctx":"【案例三 · 不停攻击科胡特的来访者】就本例情节提问","refs":["案03"]},{"id":"k075","sid":"49efd238c2","cat":"modern","q":"芝加哥小组催生了哪些重要人物？","a":["约瑟夫·利希滕贝格、罗伯特·D. 史托罗楼、伯纳德·布兰德查夫特和乔治·E. 阿特伍德。"],"k":["利希滕贝格","史托罗楼","布兰德查夫特","阿特伍德"],"src":"§4 主体间性学派","refs":[]},{"id":"k076","sid":"7b36202517","cat":"modern","q":"利希滕贝格在自体心理学中的贡献是什么？","a":["他是自体心理学「动机系统理论」的发展者，也是国际精神分析自体心理学协会的第一任主席。"],"k":["动机系统理论","首任主席"],"src":"§4 主体间性学派","refs":[]},{"id":"k077","sid":"8eef9bc248","cat":"modern","q":"史托罗楼是如何与科胡特结缘的？","a":["他读了《自体的分析》之后，发现科胡特的许多观点对他的临床工作帮助很大，并且他之前也思考过这些观点但并未成形。","他给科胡特写信表示想见面，科胡特回了信，两人在芝加哥见了面；第一次见面时对自体心理学的临床工作和理论做了很多讨论。","科胡特觉得，在他没有亲自教过的人中，史托罗楼是最了解他思想的人。"],"k":["自体的分析","写信","芝加哥见面","最了解"],"src":"§4 主体间性学派","refs":[]},{"id":"k078","sid":"767ca0f0e0","cat":"modern","q":"史托罗楼做过哪些与科胡特、罗杰斯相关的理论工作？","a":["曾受科胡特邀请参加国际精神分析自体心理学大会，撰写了数篇论文，聚焦于科胡特和卡尔·罗杰斯理论观点的比较。","他是一位很活跃的学者，发表了超过 100 篇论文。"],"k":["科胡特与罗杰斯","比较","100 篇"],"src":"§4 主体间性学派","refs":[]},{"id":"k079","sid":"a404f9916a","cat":"modern","q":"主体间性思想的开端是什么？","a":["史托罗楼与伯纳德合作，在第一届和第二届国际精神分析自体心理学大会上，发表了与经典自体心理学不同的观点；这个观点就是后来的主体间性思想的开端。"],"k":["第一、二届大会","不同观点","开端"],"src":"§4 主体间性学派","refs":[]},{"id":"k080","sid":"43cfc78488","cat":"modern","q":"史托罗楼认为科胡特晚期思想与什么哲学传统密切关联？","a":["他认为科胡特晚期的思想以及主体间性学派的理论与现象学哲学有着密切关联。","史托罗楼和阿特伍德的很多著作，为主体间性精神分析理论的发展做出了重要贡献。"],"k":["现象学哲学","阿特伍德"],"src":"§4 主体间性学派","refs":[]},{"id":"k081","sid":"98503e8e23","cat":"modern","q":"史托罗楼 65 岁时做了什么？","a":["在美国加州大学河滨分校取得第二个博士学位，研究现象学。","之后撰写了《主体性的结构——精神分析现象学与情境主义的探索》（第二版）。"],"k":["65 岁","第二个博士","现象学","主体性的结构"],"src":"§4 主体间性学派","refs":[]},{"id":"k082","sid":"fa4e20a438","cat":"modern","q":"关系性精神分析运动中还有哪些重要参与者？","a":["杰茜卡·本杰明、刘易斯·阿伦等人，都是其中重要的参与者。"],"k":["本杰明","阿伦"],"src":"§4 关系性精神分析","refs":[]},{"id":"k083","sid":"efff454cdc","cat":"modern","q":"复杂性系统理论在精神分析中有哪两个源头？","a":["科胡特的学生之一罗伯特·M. 加兰特泽-利维在 1978 年将混沌数学的概念引入精神分析。","史托罗楼 1997 年提出「非线性动力系统」，也就是后来的复杂性系统理论，在当代由威廉·科伯恩持续发展。"],"k":["1978 混沌数学","1997 非线性","科伯恩"],"src":"§4 复杂性系统","refs":[]},{"id":"k084","sid":"c5f2162e3e","cat":"modern","q":"复杂性视角在临床中关注什么？","a":["更重视临床过程的非线性过程，以及复杂性系统理论在精神分析中的运用。","关注临床的关系性过程中的初始敏感性和非线性特点，并以复杂性系统理论和激进的情境主义的视角来进行理解和工作。"],"k":["非线性","初始敏感性","激进的情境主义"],"src":"§4 复杂性系统","refs":[]},{"id":"k085","sid":"af6150a6c5","cat":"modern","q":"波士顿变化过程研究小组与毕比贡献了什么？","a":["由丹尼尔·斯特恩发起的「波士顿变化过程研究小组」，以及儿童发展学派的学者比特丽斯·毕比，发展了主体间的临床研究。","他们把大量的婴儿研究和依恋理论的研究加入其中，推动了北美自体心理学和关系性精神分析的同步发展。"],"k":["斯特恩","毕比","婴儿研究","依恋理论"],"src":"§4 复杂性系统","refs":[]},{"id":"k086","sid":"e061898700","cat":"modern","q":"「自体心理学新古典」提出了哪三类拓扑学？","a":["第一拓扑学、第二拓扑学、第三拓扑学，共三类拓扑学观点。","作者将以此新古典视角重新阐述精神分析及自体心理学的中国形态。"],"k":["三类拓扑学","中国形态"],"src":"§4 中国新古典","refs":[]},{"id":"k087","sid":"37e2c8c268","cat":"modern","q":"第一拓扑学是什么？","a":["意识、前意识、无意识。"],"k":["意识","前意识","无意识"],"src":"§4 中国新古典","refs":[]},{"id":"k088","sid":"64871eea62","cat":"modern","q":"第二拓扑学是什么？","a":["自我、它性（本我）、超我结构。"],"k":["自我","它性","超我"],"src":"§4 中国新古典","refs":[]},{"id":"k089","sid":"0bb21504ce","cat":"modern","q":"第三拓扑学是什么？","a":["以场论和命运共同体为核心。"],"k":["场论","命运共同体"],"src":"§4 中国新古典","refs":[]},{"id": const CATMAP = {}; CATS.forEach(c=>CATMAP[c.k]=c);
const CATIDX = {}; CATS.forEach((c,i)=>CATIDX[c.k]=i);
const KEY = 'xj_ch1_knowledge_cards_v1';
/* 复习记录按卡片 sid（题干指纹）保存，与显示编号 k001… 解耦：
   以后增删卡片、重排编号都不会让自评张冠李戴。 */

/* ============ 状态 ============ */
let saved={status:{},settings:{}};
try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);saved.status=o.status||{};saved.settings=o.settings||{};}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){}}
const $=id=>document.getElementById(id);
function settings(){return {cat:$('fCat').value,order:$('fOrder').value,weak:$('fWeak').checked,recite:$('fRecite').checked,reverse:$('fReverse').checked};}
function saveSettings(){const s=settings();
  /* 「案例情节」是一次性查看，不写进默认设置：下次打开仍回到按案例穿插的正常复习流 */
  if(s.cat==='__intro__')s.cat='all';
  saved.settings=s;persist();}

let deck=[],pos=0,flipped=false,mineText='';

/* ============ 初始化控件 ============ */
CATS.forEach(c=>{
  const o=document.createElement('option');o.value=c.k;o.textContent=c.label+'（'+CARDS.filter(x=>x.cat===c.k).length+'）';
  $('fCat').appendChild(o);
});
const introOpt=document.createElement('option');
introOpt.value='__intro__';introOpt.textContent='案例情节（'+CARDS.filter(x=>x.intro).length+'）';
$('fCat').appendChild(introOpt);
const s0=saved.settings;
/* 兼容旧记录：曾保存过集中视图的，回到正常复习流 */
if(s0&&s0.cat==='__intro__'){s0.cat='all';persist();}
if(s0&&Object.keys(s0).length){
  if(s0.cat&&[...$('fCat').options].some(o=>o.value===s0.cat))$('fCat').value=s0.cat;
  if(s0.order&&[...$('fOrder').options].some(o=>o.value===s0.order))$('fOrder').value=s0.order;
  $('fWeak').checked=!!s0.weak;$('fRecite').checked=!!s0.recite;$('fReverse').checked=!!s0.reverse;
}
function renderChips(){
  const box=$('chips');box.innerHTML='';
  const all=document.createElement('span');
  all.className='chip'+($('fCat').value==='all'?' on':'');
  if($('fCat').value==='all')all.style.background='#2f4f6f';
  all.textContent='全部 '+CARDS.length;
  all.onclick=()=>{$('fCat').value='all';saveSettings();buildDeck();};
  box.appendChild(all);
  const iN=CARDS.filter(x=>x.intro).length;
  const ic=document.createElement('span');
  ic.className='chip'+($('fCat').value==='__intro__'?' on':'');
  if($('fCat').value==='__intro__')ic.style.background='#8a6a3e';
  ic.textContent='案例情节 '+iN;
  ic.title='集中浏览全部案例情节介绍卡（正常复习时介绍卡会自动插在对应案例题卡之前）';
  ic.onclick=()=>{$('fCat').value='__intro__';saveSettings();buildDeck();};
  box.appendChild(ic);
  CATS.forEach(c=>{
    const n=CARDS.filter(x=>x.cat===c.k).length;
    const el=document.createElement('span');
    el.className='chip'+($('fCat').value===c.k?' on':'');
    if($('fCat').value===c.k)el.style.background=c.color;
    el.title=c.note;
    el.innerHTML=c.label+'<i>'+n+'</i>';
    el.onclick=()=>{$('fCat').value=c.k;saveSettings();buildDeck();};
    box.appendChild(el);
  });
}

/* ============ 卡组 ============ */
function stat(v){return v===3?'✓ 记得':v===2?'· 模糊':'○ 未评';}
/* 情节卡不参与排序：在案例题卡「首次呈现」之前插入对应介绍。
   perSegment=true（原书顺序）：同一案例的题卡分成不同区段时，每段前都插一次
   （案例速查是反查练习，离原案例很远，需要重新给情节）。
   perSegment=false（弱项/随机/掌握度）：每个案例全局只插一次，避免介绍卡淹没题卡。 */
function anchorIntros(body, perSegment){
  const intros={}; CARDS.forEach(c=>{if(c.intro)intros[c.id]=c;});
  const out=[], seenKeys=new Set(), seenCards=new Set(); let last='';
  body.forEach(c=>{
    const refs=(c.refs||[]).filter(r=>intros[r]);
    const key=refs.join('|');
    const need=refs.length&&(perSegment?(key!==last):!seenKeys.has(key));
    if(need){
      if(perSegment){
        refs.forEach(r=>out.push(intros[r]));
      }else{
        /* 打散排序下按「单张情节卡」去重：案例速查⑦ 同时指向案10/案11，
           若这两个案例在别处已介绍过，就不再重复插入 */
        refs.forEach(r=>{if(!seenCards.has(r)){out.push(intros[r]);seenCards.add(r);}});
      }
      seenKeys.add(key);
    }
    last=refs.length?key:'';
    out.push(c);
  });
  return out;
}
function buildDeck(keep){
  const s=settings();
  const introOnly=(s.cat==='__intro__');
  deck=CARDS.filter(c=>{
    if(introOnly){if(!c.intro)return false;}
    else{if(c.intro)return false;if(s.cat!=='all'&&c.cat!==s.cat)return false;}
    if(s.weak&&(saved.status[c.sid]||0)>=3)return false;
    return true;
  });
  if(s.order==='seq')deck.sort((a,b)=>CATIDX[a.cat]-CATIDX[b.cat]||CARDS.indexOf(a)-CARDS.indexOf(b));
  if(s.order==='status')deck.sort((a,b)=>(saved.status[a.sid]||0)-(saved.status[b.sid]||0));
  if(s.order==='weak'){const wk=sid=>{const v=saved.status[sid]||0;return v===0?1.5:v;};deck.sort((a,b)=>wk(a.sid)-wk(b.sid)||Math.random()-.5);}
  if(s.order==='rand')deck=deck.slice().sort(()=>Math.random()-.5);
  /* 排序完成后再锚定情节卡：与所选顺序无关，保证介绍总在该案例题卡之前 */
  if(!introOnly)deck=anchorIntros(deck,s.order==='seq');
  if(keep&&pos<deck.length){}else{pos=0;}
  if(pos>=deck.length)pos=0;
  renderChips();updateStats();show();
}

function updateStats(){
  const s=settings();
  const introOnly=(s.cat==='__intro__');
  const pool=introOnly?CARDS.filter(c=>c.intro)
    :(s.cat==='all'?CARDS:CARDS.filter(c=>c.cat===s.cat)).filter(c=>!c.intro);
  const done=pool.filter(c=>(saved.status[c.sid]||0)>0).length;
  const got=pool.filter(c=>(saved.status[c.sid]||0)===3).length;
  const nIntro=deck.filter(c=>c.intro).length;
  $('statText').textContent=(introOnly?'案例情节 '+pool.length+' 张':'本模块 '+pool.length+' 张题卡')
    +' ｜ 已评 '+done+' ｜ 记得 '+got+' ｜ 当前卡组 '+deck.length+' 张'
    +(introOnly?'':'（含情节卡 '+nIntro+'）');
  $('progText').textContent=done+'/'+pool.length;
  $('bar').style.width=(pool.length?done/pool.length*100:0)+'%';
  $('countHint').textContent=deck.length?(pos+1)+' / '+deck.length:'当前筛选无卡片';
}

/* ============ 渲染 ============ */
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function show(){
  const box=$('cardArea');
  const oldEmpty=box.querySelector('.empty');if(oldEmpty)oldEmpty.remove();
  if(!deck.length){
    $('front').innerHTML='<div class="empty">当前筛选下没有卡片。<br>试着取消「只看未掌握」，或换一个模块。</div>';
    $('back').innerHTML='';$('card').classList.remove('flipped');
    updateStats();return;
  }
  const c=deck[pos],col=CATMAP[c.cat].color,st=saved.status[c.sid]||0;
  const s=settings();
  flipped=false;$('card').classList.remove('flipped');mineText='';
  $('card').style.setProperty('--cc',col);
  const badge=c.intro?'案例情节 · 先读':CATMAP[c.cat].label;
  const head='<div class="top"><span class="badge'+(c.intro?' introBadge':'')+'" style="background:'+col+'">'+badge+'　·　'+stat(st)+'</span><span class="idx">'+c.id+'　'+(pos+1)+'/'+deck.length+'</span></div>';
  const foot='<div class="src">所在小节：'+esc(c.src)+'　｜　徐钧《自体心理学入门》第一章</div>';

  /* 案例情节卡：正面直接印出情节，不用翻面就能读到背景；背面给记忆抓手。
     不进入默写／反向提问（它不是问答题）。 */
  if(c.intro){
    const body='<div class="introBody">'+c.a.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>';
    $('front').innerHTML=head+'<div class="q">'+esc(c.q)+'</div>'+body+
      '<div class="introHint">'+esc(c.follow||'')+'　·　无需翻面，读完直接进入后面的提问卡。</div>'+foot;
    $('back').innerHTML=head+'<div class="q">'+esc(c.q)+' · 记忆抓手</div>'+
      '<div class="kw">合上卡片试着自己复述情节，再核对关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>'+
      '<div class="introHint">'+esc(c.follow||'')+'</div>'+foot;
    $('flip').textContent='翻面看记忆抓手（空格）';
    updateStats();return;
  }

  let q=c.q, a=c.a;
  if(s.reverse){ q=c.a.join('　／　'); a=[c.q]; }
  const big=q.length>95?' big':'';

  const ctxHtml=c.ctx?'<div class="ctx">'+esc(c.ctx)+'</div>':'';
  if(s.recite&&!s.reverse){
    $('front').innerHTML=head+ctxHtml+'<div class="q'+big+'">'+esc(q)+'</div>'+
      '<textarea id="mine" placeholder="先在这里写下你的答案／背诵要点，再点「核对并翻面」…"></textarea>'+foot;
    const ta=$('mine');
    if(ta){ta.onclick=e=>e.stopPropagation();ta.oninput=()=>{mineText=ta.value;};ta.value='';}
  }else{
    $('front').innerHTML=head+ctxHtml+'<div class="q'+big+'">'+esc(q)+'</div>'+foot;
  }

  let back=head+(s.reverse?'':ctxHtml)+'<ul class="aList">'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(s.recite&&!s.reverse&&mineText.trim()){
    back+='<div class="mine"><b>你的默写</b>'+esc(mineText.trim())+'</div>';
    const hits=c.k.filter(w=>mineText.indexOf(w)>=0);
    back+='<div class="hit">关键词命中 '+hits.length+' / '+c.k.length+(hits.length?'：'+esc(hits.join('、')):'　— 建议对照全文再背一遍')+'</div>';
  }
  if(!s.reverse&&c.k.length){
    back+='<div class="kw">关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>';
  }
  back+=foot;
  $('back').innerHTML=back;
  $('flip').textContent=s.recite&&!s.reverse?'核对并翻面（空格）':'翻面看答案（空格）';
  updateStats();
}
function flip(){
  if(!deck.length)return;
  const s=settings();
  if(s.recite&&!s.reverse&&!flipped){const ta=$('mine');if(ta)mineText=ta.value;}
  if(!flipped&&s.recite&&!s.reverse&&!deck[pos].intro){showKeepMine();}
  flipped=!flipped;$('card').classList.toggle('flipped',flipped);
  $('flip').textContent=flipped?'返回正面（空格）':(deck[pos].intro?'翻面看记忆抓手（空格）':(s.recite&&!s.reverse?'核对并翻面（空格）':'翻面看答案（空格）'));
}
/* 翻面前把默写内容写进背面（不重置卡片状态） */
function showKeepMine(){
  const c=deck[pos],col=CATMAP[c.cat].color,st=saved.status[c.sid]||0,s=settings();
  const head='<div class="top"><span class="badge" style="background:'+col+'">'+CATMAP[c.cat].label+'　·　'+stat(st)+'</span><span class="idx">'+c.id+'　'+(pos+1)+'/'+deck.length+'</span></div>';
  const foot='<div class="src">所在小节：'+esc(c.src)+'　｜　徐钧《自体心理学入门》第一章</div>';
  let back=head+'<ul class="aList">'+c.a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(mineText.trim()){
    back+='<div class="mine"><b>你的默写</b>'+esc(mineText.trim())+'</div>';
    const hits=c.k.filter(w=>mineText.indexOf(w)>=0);
    back+='<div class="hit">关键词命中 '+hits.length+' / '+c.k.length+(hits.length?'：'+esc(hits.join('、')):'　— 建议对照全文再背一遍')+'</div>';
  }
  back+='<div class="kw">关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>'+foot;
  $('back').innerHTML=back;
}
function go(d){if(!deck.length)return;pos=(pos+d+deck.length)%deck.length;show();}
function rate(v){if(!deck.length)return;saved.status[deck[pos].sid]=v;persist();go(1);}

/* ============ 导出 ============ */
function download(name,text,type){
  const blob=new Blob(['\ufeff'+text],{type:type||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},200);
}
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}
$('btnCSV').onclick=()=>{
  const rows=[['编号','模块','语境','问题 / 情节标题','答案 / 情节正文','关键词','所在小节']];
  CARDS.forEach(c=>rows.push([c.id,c.intro?'案例情节':CATMAP[c.cat].label,c.ctx||'',c.q,c.a.join(' / '),c.k.join(' / '),c.src]));
  download('第1章_知识闪卡.csv',rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');
};
$('btnMD').onclick=()=>{
  let t='# 第一章 自体心理学及其发展 · 知识闪卡\n\n> 依据：徐钧《自体心理学入门》pp.003–021 修复稿。纯知识卡，重点为流派发展与主体辨析。\n\n';
  CATS.forEach(c=>{
    const list=CARDS.filter(x=>x.cat===c.k);if(!list.length)return;
    t+='## '+c.label+'（'+list.length+' 张）\n\n';
    list.forEach(x=>{t+='**'+x.id+'｜'+(x.intro?'【案例情节】':'')+x.q+'**\n\n';if(x.ctx)t+='> 语境：'+x.ctx+'\n\n';x.a.forEach(a=>t+='- '+a+'\n');t+='\n> 关键词：'+x.k.join('、')+'　｜　所在小节：'+x.src+(x.intro&&x.follow?'\n> 后续：'+x.follow:'')+'\n\n';});
  });
  download('第1章_知识闪卡.md',t,'text/markdown;charset=utf-8');
};
$('btnPrint').onclick=()=>{
  let h='<h2>徐钧《自体心理学入门》· 第一章知识闪卡</h2><div class="meta">依据 pp.003–021 修复稿 ｜ 共 '+CARDS.length+' 张 ｜ 打印日期：'+new Date().toLocaleDateString('zh-CN')+'</div>';
  CATS.forEach(c=>{
    const list=CARDS.filter(x=>x.cat===c.k);if(!list.length)return;
    h+='<h3>'+c.label+'（'+list.length+' 张）</h3>';
    list.forEach(x=>{h+='<div class="item"><div class="qq">'+x.id+'　'+(x.intro?'【案例情节】':'')+esc(x.q)+'</div>'+(x.ctx?'<div class="ss">语境：'+esc(x.ctx)+'</div>':'')+'<div class="aa">'+x.a.map(esc).join('　／　')+'</div><div class="ss">所在小节：'+esc(x.src)+'</div></div>';});
  });
  $('printArea').innerHTML=h;
  setTimeout(()=>window.print(),60);
};

/* ============ 事件 ============ */
['fCat','fOrder'].forEach(id=>$(id).onchange=()=>{saveSettings();buildDeck();});
['fWeak','fRecite','fReverse'].forEach(id=>$(id).onchange=()=>{saveSettings();buildDeck();});
$('fReset').onclick=()=>{if(confirm('清除本套闪卡的全部自评记录？\n（不影响第二章、第三章闪卡的进度）')){saved.status={};persist();buildDeck();}};
$('flip').onclick=e=>{e.stopPropagation();flip();};
$('prev').onclick=()=>go(-1);
$('next').onclick=()=>go(1);
document.querySelectorAll('.rate').forEach(b=>b.onclick=()=>rate(+b.dataset.r));
$('card').onclick=e=>{if(e.target.id==='mine')return;flip();};
document.addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='TEXTAREA'||tag==='INPUT'||tag==='SELECT')return;
  const k=e.key.toLowerCase();
  if(e.code==='Space'||k===' '){e.preventDefault();flip();}
  else if(k==='arrowleft'){e.preventDefault();go(-1);}
  else if(k==='arrowright'){e.preventDefault();go(1);}
  else if(k==='1'||k==='2'||k==='3')rate(+k);
  else if(k==='r'){$('fOrder').value='rand';saveSettings();buildDeck();}
  else if(k==='m'){$('fRecite').checked=! $('fRecite').checked;saveSettings();buildDeck();}
  else if(k==='f'){$('fWeak').checked=! $('fWeak').checked;saveSettings();buildDeck();}
});

buildDeck();
</script>
