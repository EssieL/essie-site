<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>徐钧《自体心理学入门》· 第六章 知识闪卡</title>
<style>
  :root{
    --bg:#f6f5f1; --ink:#2c2c2a; --muted:#888780; --line:#e3e1d8; --card:#fff;
    --blue:#3b6ea5; --amber:#b07b23; --red:#b4493f; --green:#2f7d6b; --brown:#9a6b3f;
    --shadow:0 2px 16px rgba(0,0,0,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{min-height:58px;padding:8px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:#fff;flex-wrap:wrap}
  header h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
  header .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:430px}
  header .right{margin-left:auto;display:flex;gap:6px;align-items:center}
  button.b{font-size:12px;padding:6px 11px;border:1px solid #d6d4ca;background:#fff;border-radius:7px;cursor:pointer;color:var(--ink);white-space:nowrap}
  button.b:hover{background:#f0eee6}
  button.b.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .fbar{padding:9px 16px;border-bottom:1px solid var(--line);background:#fbfaf7;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .fbar label{font-size:12px;color:var(--muted)}
  select{font-size:12px;padding:6px 8px;border:1px solid #d6d4ca;border-radius:7px;background:#fff;color:var(--ink)}
  .chk{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;background:#fff;border:1px solid #d6d4ca;border-radius:7px;padding:6px 9px;white-space:nowrap}
  .chk input{margin:0}
  .chips{display:flex;gap:5px;padding:8px 16px 2px;flex-wrap:wrap;max-height:74px;overflow:auto}
  .chip{font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:#b9b5a7}
  .chip.on{color:#fff;border-color:transparent;font-weight:600}
  .chip i{font-style:normal;opacity:.75;margin-left:4px}
  .stats{padding:8px 18px 2px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .track{flex:1;min-width:120px;height:7px;border-radius:5px;background:#e7e5dc;overflow:hidden}
  .track i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
  .cardArea{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 18px 4px;min-height:0}
  .card{width:100%;max-width:780px;height:100%;max-height:440px;min-height:280px;perspective:1400px;cursor:pointer}
  .inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:20px 26px;display:flex;flex-direction:column;overflow:auto}
  .face.back{transform:rotateY(180deg)}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{font-size:11px;padding:4px 10px;border-radius:20px;color:#fff;background:var(--cc,#3b6ea5);letter-spacing:.3px}
  .idx{font-size:11px;color:var(--muted);margin-left:auto}
  .q{font-size:19px;line-height:1.65;font-weight:600;margin:18px 0 8px;white-space:pre-wrap}
  .q.big{font-size:16px;font-weight:500;line-height:1.8}
  .ctx{font-size:11.5px;line-height:1.6;color:#7a5a34;background:#f8f2e7;border:1px solid #ecdfc6;border-radius:7px;padding:5px 10px;margin:14px 0 -4px}
  .introBody{background:#faf8f2;border:1px solid #eae5d7;border-radius:10px;padding:12px 16px;margin:10px 0 8px;font-size:14px;line-height:1.85;overflow:auto;max-height:230px}
  .introBody p{margin:0 0 8px}
  .introBody p:last-child{margin-bottom:0}
  .introHint{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:4px}
  .badge.introBadge{background:#8a6a3e}
  .src{font-size:11px;color:var(--muted);margin-top:auto;padding-top:12px;border-top:1px dashed var(--line)}
  textarea{width:100%;min-height:96px;flex:1;border:1px dashed #cfccc1;border-radius:9px;background:#fbfaf7;padding:11px 13px;font-size:14px;line-height:1.7;font-family:inherit;color:var(--ink);resize:none;outline:none}
  textarea:focus{border-color:var(--blue);background:#fff}
  .aList{font-size:14.5px;line-height:1.85;margin:12px 0 4px;padding-left:0;list-style:none;white-space:pre-wrap}
  .aList li{margin-bottom:8px;padding-left:16px;position:relative}
  .aList li:before{content:"";position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--cc,#3b6ea5)}
  .mine{background:#f7f5ef;border:1px dashed #d6d4ca;border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;margin-top:8px;max-height:110px;overflow:auto}
  .mine b{color:var(--muted);font-weight:500;font-size:11px;display:block;margin-bottom:4px}
  .hit{font-size:12px;color:var(--green);margin-top:6px}
  .kw{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.6}
  .kw span{display:inline-block;background:#f1efe8;border-radius:5px;padding:1px 7px;margin:2px 4px 0 0}
  .controls{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px 12px;flex-wrap:wrap}
  .controls .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
  .controls .rate{font-size:12px;padding:7px 13px;border-radius:8px;border:1px solid #d6d4ca;background:#fff;cursor:pointer;color:var(--ink)}
  .controls .rate:hover{background:#f0eee6}
  .controls .rate.r1{border-color:#e2b6b1;color:var(--red)}
  .controls .rate.r2{border-color:#e1cf9f;color:var(--amber)}
  .controls .rate.r3{border-color:#aed3c8;color:var(--green)}
  .foot{font-size:11px;color:var(--muted);text-align:center;padding:0 16px 9px}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}
  #printArea{display:none}
  @media print{
    html,body{height:auto;overflow:visible;background:#fff}
    body>*:not(#printArea){display:none !important}
    #printArea{display:block !important;padding:0}
    #printArea h2{font-size:16px;margin:0 0 6px}
    #printArea .meta{font-size:11px;color:#666;margin-bottom:14px}
    #printArea .item{border-bottom:1px solid #ddd;padding:8px 0;page-break-inside:avoid}
    #printArea .item .qq{font-size:13px;font-weight:600}
    #printArea .item .aa{font-size:12px;line-height:1.6;color:#333;margin-top:3px}
    #printArea .item .ss{font-size:10px;color:#888;margin-top:3px}
  }
  @media (max-width:640px){
    header .sub{display:none}
    .q{font-size:17px}
    .face{padding:16px 18px}
    .card{max-height:none}
  }

/* === 个人学习分站 · 顶部返回条（部署时注入，打印时隐藏） === */
.xjLearnBar{background:#115e59;color:#fff;padding:7px 16px;display:flex;gap:7px;
  flex-wrap:wrap;align-items:center;font:12.5px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  position:relative;z-index:99}
.xjLearnBar a{color:#d9f4ee;text-decoration:none;white-space:nowrap}
.xjLearnBar a:hover{text-decoration:underline}
.xjLearnBar .xjSep{opacity:.55}
.xjLearnBar .xjHere{opacity:.8;white-space:nowrap}
@media print{.xjLearnBar{display:none!important}}

</style>

4dece492f5","cat":"form","q":"作者怎样看失恋后心中出现与性有关的念头？","a":["本身是一种正常的性心理发展；问题在于她过度执着于这个念头，同时又认为不应该有这样的念头。"],"k":["正常的性心理发展","过度执着","认为不该有"],"src":"案例：目光对视恐惧","refs":["案01"],"ctx":"【案例一 · 目光对视恐惧】就本例情节提问"},{"id":"k050","sid":"de5e759a17","cat":"form","q":"为什么她越不想有这个念头，念头反而越强烈？","a":["因为她不停地压抑，而被压抑的念头并未消失、都想回到意识层面；压抑本身使它持续影响前意识。"],"k":["压抑不使其消失","持续浮现","影响前意识"],"src":"案例：目光对视恐惧","refs":["案01"],"ctx":"【案例一 · 目光对视恐惧】就本例情节提问"},{"id":"k051","sid":"0584d09aac","cat":"form","q":"与同事对视、对方微笑之后，她怀疑什么？随后发生了什么替换？","a":["她怀疑自己心里的念头被人看穿了，立刻变得很紧张、担心别人怎么看她；头脑中频繁出现的性场景消失了，取而代之的是不敢和别人对视的心理。"],"k":["怀疑被看穿","紧张","性场景消失","不敢对视"],"src":"案例：目光对视恐惧","refs":["案01"],"ctx":"【案例一 · 目光对视恐惧】就本例情节提问"},{"id":"k052","sid":"03550ad322","cat":"form","q":"这种紧张怎样进一步泛化，症状又是如何定型的？","a":["羞耻感让她很紧张，紧张心理逐渐泛化到生活中——不敢和别人对视；虽然这时心里已经没有什么特别的想法了，但她还是很紧张，于是症状就形成了。"],"k":["羞耻导致紧张","泛化到生活","想法已无而紧张仍在"],"src":"案例：目光对视恐惧","refs":["案01"],"ctx":"【案例一 · 目光对视恐惧】就本例情节提问"},{"id":"k053","sid":"a57e80d383","cat":"form","q":"当她把这件事情说出来的时候，体验到什么？","a":["觉得自己松了一口气，感觉说出来的一瞬间心里压抑的东西全都消失了，连和别人对视的恐惧也消失了。"],"k":["松了一口气","压抑全消失","对视恐惧消失"],"src":"案例：目光对视恐惧","refs":["案01"],"ctx":"【案例一 · 目光对视恐惧】就本例情节提问"},{"id":"k054","sid":"95bde7374a","cat":"form","q":"这一案例被作者称为什么性质的案例？","a":["这是被压抑的移情发生置换的一种现象，也是经由精神分析的过程，最终通过将移情内容进行意识化整合而实现疗愈的案例。"],"k":["移情发生置换","意识化整合","实现疗愈"],"src":"案例：目光对视恐惧","refs":["案01"],"ctx":"【案例一 · 目光对视恐惧】就本例情节提问"},{"id":"k055","sid":"45262444e2","cat":"form","q":"由目光对视恐惧一例可见，症状形成时原本的焦虑去了哪里？","a":["因为注意力和焦虑集中到另一件事情上，面对性心理的焦虑就消失了、被置换了，焦虑改以目光对视恐惧的形式表现。"],"k":["焦虑被置换","改以症状表现"],"src":"案例：目光对视恐惧","refs":["案01"],"ctx":"【案例一 · 目光对视恐惧】由本例引出的一般规律／论断"},{"id":"k056","sid":"437c75be7f","cat":"form","q":"听网课时家人反复敲门，「你」的情绪发生了什么变化？","a":["第一次回答没时间，他便离开；过了一会儿又来敲门，你会觉得他影响了你；再次回绝后如果他再来，你就会非常愤怒，会想「你真烦人，为什么一直影响我」。"],"k":["回绝","觉得被影响","再次回绝","非常愤怒"],"src":"案例：敲门比喻","refs":["案02"],"ctx":"【案例二 · 听网课时反复敲门】就本例情节提问"},{"id":"k057","sid":"7f1a61e0fc","cat":"form","q":"比喻中「想进来的人持续不断地想找你说事情」对应什么？","a":["如同被压抑的内容一直想进入意识的过程。"],"k":["被压抑的内容","想进入意识"],"src":"案例：敲门比喻","refs":["案02"],"ctx":"【案例二 · 听网课时反复敲门】就本例情节提问"},{"id":"k058","sid":"dcc087e76f","cat":"form","q":"比喻中「不断将其拒之门外」对应什么？","a":["如同反复压抑的过程。"],"k":["拒之门外","反复压抑"],"src":"案例：敲门比喻","refs":["案02"],"ctx":"【案例二 · 听网课时反复敲门】就本例情节提问"},{"id":"k059","sid":"d5f35bea5c","cat":"form","q":"随着不停压抑，被压抑的东西会变成什么？","a":["逐渐置换成令你烦恼的事情了。"],"k":["置换成烦恼的事情"],"src":"案例：敲门比喻","refs":["案02"],"ctx":"【案例二 · 听网课时反复敲门】就本例情节提问"},{"id":"k060","sid":"4cb7d2b86f","cat":"form","q":"比喻里「看上去在听课，却不断受到打扰，听课质量大打折扣」说明什么？","a":["这一过程类似于神经症的形成过程：生活虽然还可以继续，但变得不快乐了。"],"k":["类似神经症形成","生活可继续但不快乐"],"src":"案例：敲门比喻","refs":["案02"],"ctx":"【案例二 · 听网课时反复敲门】就本例情节提问"},{"id":"k061","sid":"6d632bf94c","cat":"form","q":"为什么生活还能继续，却变得不快乐？","a":["因为要用一部分精力来抵抗这些被压抑的内容，并逐渐将其置换为一种症状，从而只能以一种不太健康的状态继续生活。"],"k":["耗用精力抵抗","置换为症状","不健康状态"],"src":"案例：敲门比喻","refs":["案02"],"ctx":"【案例二 · 听网课时反复敲门】由本例引出的一般规律／论断"},{"id":"k062","sid":"b9a60129d7","cat":"form","q":"比喻中「最终问道：你有什么事要对我说？」对应什么过程？","a":["无意识内容进入意识的过程。"],"k":["无意识内容进入意识"],"src":"案例：敲门比喻","refs":["案02"],"ctx":"【案例二 · 听网课时反复敲门】就本例情节提问"},{"id":"k063","sid":"11739d5b94","cat":"form","q":"对方只是问「盐放在哪儿」，说明了什么？","a":["你告诉了他，他的欲望得到了满足，你也就能安心听课了。"],"k":["欲望得到满足","可以安心"],"src":"案例：敲门比喻","refs":["案02"],"ctx":"【案例二 · 听网课时反复敲门】就本例情节提问"},{"id":"k064","sid":"e1367e496d","cat":"form","q":"整个敲门比喻完整说明了什么？","a":["移情如何置换为症状、又如何致病，并最终被疗愈的过程。"],"k":["置换为症状","致病","被疗愈"],"src":"案例：敲门比喻","refs":["案02"],"ctx":"【案例二 · 听网课时反复敲门】由本例引出的一般规律／论断"},{"id":"k065","sid":"c710bab818","cat":"drive","q":"被潜抑的移情内容，为什么会一而再、再而三地反复浮现？","a":["这个反复的过程实际上是由对生本能的潜抑所引起的。"],"k":["生本能的潜抑"],"src":"§2 强迫性重复","refs":[]},{"id":"k066","sid":"7aa765f9df","cat":"drive","q":"生本能被潜抑之后，为什么还要不停地浮现？","a":["它要延续自己、保持自己的完整性，所以要不停地浮现。"],"k":["延续自己","保持完整性","不停浮现"],"src":"§2 强迫性重复","refs":[]},{"id":"k067","sid":"e8ff6d4519","cat":"drive","q":"在经典精神分析里，生本能被潜抑后不停浮现的过程称为什么？","a":["强迫性重复。"],"k":["强迫性重复"],"src":"§2 强迫性重复","refs":[]},{"id":"k068","sid":"6042a26d0b","cat":"drive","q":"在「锅底之火」的比喻中，锅底之火对应什么？","a":["无意识的内容及其能量。"],"k":["无意识内容及其能量"],"src":"§ 师建立对来访者的个案概念化。"],"k":["移情评估","建立个案概念化"],"src":"§5 评估及理解","refs":[]},{"id":"k120","sid":"f8c4ca52e4","cat":"eval","q":"个案概念化的过程需要围绕什么进行评估？","a":["围绕三类移情进行评估。"],"k":["三类移情"],"src":"§5 长案例之后","refs":[]},{"id":"k121","sid":"1486badfc7","cat":"eval","q":"移情评估是自体心理学的重要评估方法，它通过对什么的理解逐步形成？","a":["通过对自体客体移情的理解逐步形成。"],"k":["重要评估方法","理解自体客体移情"],"src":"§5 长案例之后","refs":[]},{"id":"k122","sid":"d33bc1cf84","cat":"eval","q":"移情评估与症状评估或人格水平评估相比，特殊能力是什么？","a":["能够直接触及并追踪病理起源点；自体心理学进行移情评估时，正是在直接追踪病理起源点。"],"k":["直接触及","追踪病理起源点"],"src":"§5 三类移情的辨识","refs":[]},{"id":"k123","sid":"d2ba93a4bc","cat":"eval","q":"关于「通过移情追踪病理起源点」，弗洛伊德与安娜·弗洛伊德之后发生了什么？","a":["他们也有类似的观点，但后来许多精神分析教学渐渐遗忘了这一重点，而自体心理学则对这一点十分关注。"],"k":["曾有类似观点","教学渐渐遗忘","自体心理学关注"],"src":"§5 三类移情的辨识","refs":[]},{"id":"k124","sid":"e2dea080c4","cat":"eval","q":"一些当代自体心理学学者把各类自体客体移情与什么结合研究？","a":["与罗夏墨迹测验结合，利用罗夏墨迹测验对部分临床过程进行测试。"],"k":["罗夏墨迹测验","测试临床过程"],"src":"§5 长案例之后","refs":[]},{"id":"k125","sid":"195b6e787d","cat":"eval","q":"这些学者发现移情现象在罗夏墨迹测验中会怎样？","a":["会有清晰的反映。"],"k":["罗夏墨迹测验","清晰反映"],"src":"§5 长案例之后","refs":[]},{"id":"k126","sid":"d451bb1d0b","cat":"eval","q":"如果要真正进入一段自体心理学的中长程深度治疗，什么十分关键？","a":["临床移情评估十分关键。"],"k":["中长程深度治疗","临床移情评估"],"src":"§5 长案例之后","refs":[]},{"id":"k127","sid":"479ad2243b","cat":"eval","q":"临床移情评估的关键性在于与什么直接相关？","a":["与一个人的病理起源的心理动力和成长的心理动力直接相关。"],"k":["病理起源的心理动力","成长的心理动力"],"src":"§5 长案例之后","refs":[]},{"id":"k128","sid":"993be29e99","cat":"eval","q":"不同类型来访者的评估表现与评估难度有什么特点？","a":["各不相同。"],"k":["评估表现与难度各不相同"],"src":"§5 垂直分裂","refs":[]},{"id":"k129","sid":"479bd97b3f","cat":"eval","q":"这位女性来访者对我的理想化移情，强度如何？","a":["一直有某种程度的理想化移情，强度中等，不是特别强烈。"],"k":["中等强度","不是特别强烈"],"src":"案例：中等强度的理想化移情","refs":["案06"],"ctx":"【案例六 · 中等强度的理想化移情】就本例情节提问"},{"id":"k130","sid":"fd3561d0bd","cat":"eval","q":"她的人格评估与边界功能显示什么？","a":["边界各方面功能较好，人格评估显示没有太严重的症状，仅存在轻度的焦虑。"],"k":["边界功能较好","无严重症状","轻度焦虑"],"src":"案例：中等强度的理想化移情","refs":["案06"],"ctx":"【案例六 · 中等强度的理想化移情】就本例情节提问"},{"id":"k131","sid":"522ca1a61b","cat":"eval","q":"她的移情表现更接近哪一类人格水平的来访者？","a":["更接近神经症人格水平的来访者。"],"k":["神经症人格水平"],"src":"案例：中等强度的理想化移情","refs":["案06"],"ctx":"【案例六 · 中等强度的理想化移情】就本例情节提问"},{"id":"k132","sid":"91cfd3c75a","cat":"eval","q":"随着咨询推进，她的理想化移情有什么变化？","a":["有一些增强，但并没有到脱离现实的地步。"],"k":["略有增强","未脱离现实"],"src":"案例：中等强度的理想化移情","refs":["案06"],"ctx":"【案例六 · 中等强度的理想化移情】就本例情节提问"},{"id":"k133","sid":"8921d794fc","cat":"eval","q":"这位来访者的现实处境是什么？","a":["一位 30 岁的未婚女性，长期与其上司保持恋爱关系；对方是已婚人士，且认为两人不可能有未来，但关系并未结束。"],"k":["30 岁未婚","与已婚上司长期恋爱","对方认为没有未来"],"src":"案例：中等强度的理想化移情","refs":["案06"],"ctx":"【案例六 · 中等强度的理想化移情】就本例情节提问"},{"id":"k134","sid":"e7a0b452f1","cat":"eval","q":"对这段没有结果的恋爱关系，她的理智与情感呈现什么分裂？","a":["理智上虽然清楚应该结束，但情感上却做不到。"],"k":["理智清楚","情感做不到"],"src":"案例：中等强度的理想化移情","refs":["案06"],"ctx":"【案例六 · 中等强度的理想化移情】就本例情节提问"},{"id":"k135","sid":"705868f406","cat":"eval","q":"这一理智与情感的分裂，说明她在哪个位置上存在缺失？","a":["说明她在理想化早期的位置上存在某种缺失。"],"k":["理想化早期位置","存在缺失"],"src":"案例：中等强度的理想化移情","refs":["案06"],"ctx":"【案例六 · 中等强度的理想化移情】就本例情节提问"},{"id":"k136","sid":"4959e43970","cat":"eval","q":"经由她对我的理想化移情，作者开始追踪什么？","a":["开始追踪并试图理解她的理想化移情背后的病理起源学的问题。"],"k":["追踪病理起源学问题"],"src":"案例：中等强度的理想化移情","refs":["案06"],"ctx":"【案例六 · 中等强度的理想化移情】就本例情节提问"},{"id":"k137","sid":"de03d72c01","cat":"eval","q":"在这一位置上形成的初步个案概念化，能确定什么、不能确定什么？","a":["尚无法确定她早期经历的事件，仅能推测她隐藏了一个理想化失败的过程。"],"k":["无法确定早期事件","仅能推测理想化失败"],"src":"案例：中等强度的理想化移情","refs":["案06"],"ctx":"【案例六 · 中等强度的理想化移情】就本例情节提问"},{"id":"k138","sid":"0c8d49a3e6","cat":"eval","q":"由本例可见，为什么无法通过直接询问来访者来获取无意识内容？","a":["能够通过直接询问获取的都不是无意识内容，而是来访者加工好的内容；只有来访者在自由联想中自然呈现的内容，才是真正被潜抑的部分。"],"k":["直接询问得到加工好的内容","自由联想才呈现潜抑部分"],"src":"案例：中等强度的理想化移情","refs":["案06"],"ctx":"【案例六 · 中等强度的理想化移情】由本例引出的一般规律／论断"},{"id":"k139","sid":"7d432d9b6a","cat":"eval","q":"她父亲对「三个女儿」这件事抱有怎样的矛盾态度？","a":["一直希望生个儿子，但家里三个孩子都是女儿；三个女儿都上了大学，他一方面觉得很好，一方面又下意识地表现出遗憾，时常因为没有儿子而唉声叹气。"],"k":["盼儿子","三女儿都上大学","既觉好又叹气"],"src":"案例：父亲想要儿子与代偿","refs":["案07"],"ctx":"【案例七 · 父亲想要儿子与代偿】就本例情节提问"},{"id":"k140","sid":"ab1c9b5684","cat":"eval","q":"她在家中的排行与一直未能实现的愿望是什么？","a":["作为三姐妹中最小的一个，她一直希望能够得到父亲的认可，但始终未能如愿。"],"k":["三姐妹中最小","希望得到父亲认可","未能如愿"],"src":"案例：父亲想要儿子与代偿","refs":["案07"],"ctx":"【案例七 · 父亲想要儿子与代偿】就本例情节提问"},{"id":"k141","sid":"75ef6c9d9e","cat":"eval","q":"在与男性的关系中，她呈现出哪两方面的表现？","a":["一方面渴望靠近男性，另一方面对男性、特别是像父亲这样的男性，存在一种着迷般的爱，希望让对方开心。"],"k":["渴望靠近","着迷般的爱","希望让对方开心"],"src":"案例：父亲想要儿子与代偿","refs":["案07"],"ctx":"【案例七 · 父亲想要儿子与代偿】就本例情节提问"},{"id":"k142","sid":"005eadd67d","cat":"eval","q":"什么时候她觉得自己是有价值的？","a":["当对方开心的时候，她就觉得自己是有价值的，是被别人接纳的。"],"k":["对方开心","自己有价值","被接纳"],"src":"案例：父亲想要儿子与代偿","refs":["案07"],"ctx":"【案例七 · 父亲想要儿子与代偿】就本例情节提问"},{"id":"k143","sid":"e6c27bbfb8","cat":"eval","q":"这一案例的个案概念化与哪两方面有关？","a":["第一，她在对父亲的理想化过程中存在失败；第二，她在与父亲的关系中，对父亲有镜映的需要，但这一需要被忽视了，因为父亲总是因为没有儿子而觉得丢脸。"],"k":["理想化失败","镜映需要被忽视"],"src":"案例：父亲想要儿子与代偿","refs":["案07"],"ctx":"【案例七 · 父亲想要儿子与代偿】就本例情节提问"},{"id":"k144","sid":"162121c8aa","cat":"eval","q":"结合早期联想，这一案例中可以看到怎样的因果链？","a":["早期理想化的一些失败，以及镜映需要的受挫，导致其自尊水平很低；低自尊使她不断寻求好的回应和被接纳的体验，从而在生活中下意识地陷入与上司的恋情。"],"k":["理想化失败与镜映受挫","低自尊","寻求回应","陷入恋情"],"src":"案例：父亲想要儿子与代偿","refs":["案07"],"ctx":"【案例七 · 父亲想要儿子与代偿】就本例情节提问"},{"id":"k145","sid":"7ec901f7d0","cat":"eval","q":"上司为什么能够形成代偿？","a":["上司与她关系很紧密，类似父亲的角色；对方自她入职起就很关心她，给了她未能从父亲身上获得的感觉，从而形成了代偿。"],"k":["类似父亲角色","入职起很关心","形成代偿"],"src":"案例：父亲想要儿子与代偿","refs":["案07"],"ctx":"【案例七 · 父亲想要儿子与代偿】就本例情节提问"},{"id":"k146","sid":"44f8355eff","cat":"eval","q":"作者特别提醒，上司类似父亲角色「并不是」什么？","a":["并不是对其早年父女关系的简单复制。"],"k":["不是早年关系的简单复制"],"src":"案例：父亲想要儿子与代偿","refs":["案07"],"ctx":"【案例七 · 父亲想要儿子与代偿】就本例情节提问"},{"id":"k147","sid":"7928e6431d","cat":"eval","q":"这种代偿能满足她多少？","a":["只能暂时满足她渴望被父亲认可的需要。"],"k":["只能暂时满足"],"src":"案例：父亲想要儿子与代偿","refs":["案07"],"ctx":"【案例七 · 父亲想要儿子与代偿】就本例情节提问"},{"id":"k148","sid":"2de1276e85","cat":"eval","q":"她的镜映移情源于哪几方面？","a":["源于夸大自体遭受的创伤、镜映需要的潜抑以及理想化需要的受挫；这导致她在关系中一直寻求代偿性的对象，比如她的上司。"],"k":["夸大自体创伤","镜映需要潜抑","理想化需要受挫","寻求代偿对象"],"src":"案例：父亲想要儿子与代偿","refs":["案07"],"ctx":"【案例七 · 父亲想要儿子与代偿】就本例情节提问"},{"id":"k149","sid":"bc9042ebe0","cat":"eval","q":"这段代偿关系给她带来了什么？","a":["一方面让她潜抑了部分体验，另一方面也代偿了部分体验，但同时给她的现实生活带来了许多困难。"],"k":["潜抑部分体验","代偿部分体验","现实困难"],"src":"案例：父亲想要儿子与代偿","refs":["案07"],"ctx":"【案例七 · 父亲想要儿子与代偿】就本例情节提问"},{"id":"k150","sid":"09c8cb2835","cat":"eval","q":"她想找怎样的伴侣，现实困难在哪里？","a":["想找一位像父亲一样的男性作为伴侣；但在和她年龄相仿的男性中，要找到一个很成熟、各方面又都符合要求的人很困难。"],"k":["像父亲一样的伴侣","同龄男性中很难找到"],"src":"案例：父亲想要儿子与代偿","refs":["案07"],"ctx":"【案例七 · 父亲想要儿子与代偿】就本例情节提问"},{"id":"k151","sid":"297cd63048","cat":"three","q":"面对镜映移情时，可以思考哪两个问题？","a":["镜映的需要与什么相关？它又与自体的哪个面向相关？"],"k":["与什么相关","与自体哪个面向相关"],"src":"§5 镜映移情的辨识","refs":[]},{"id":"k152","sid":"c21db95a64","cat":"three","q":"镜映的需要与自体的哪个面向相关？","a":["与夸大自体的镜映需要相关。"],"k":["夸大自体","镜映需要"],"src":"§5 镜映移情的辨识","refs":[]},{"id":"k153","sid":"ded008a067","cat":"three","q":"镜映移情过程意味着来访者早期的发展可能遭遇了什么？","a":["意味着来访者早期夸大自体的发展过程可能遭遇了某种潜抑。"],"k":["早期夸大自体发展","遭遇潜抑"],"src":"§5 镜映移情的辨识","refs":[]},{"id":"k154","sid":"579abd1dcd","cat":"three","q":"面对很强烈的理想化移情过程，可以去探究什么？","a":["探究他的理想化父母双亲影像中是否存在某种被潜抑的或断裂的内容。"],"k":["理想化父母双亲影像","被潜抑或断裂"],"src":"§5 理想化移情的辨识","refs":[]},{"id":"k155","sid":"8bdd173118","cat":"three","q":"密友需要即什么移情？它在咨询中表现为何种关系？","a":["即密友移情；来访者和咨询师之间产生某种密友需要。"],"k":["密友移情","咨访之间"],"src":"§5 密友移情的辨识","refs":[]},{"id":"k156","sid":"569d2574fa","cat":"three","q":"这位来访者反复向咨询师表达什么？","a":["非常希望咨询师肯定其努力的作用，经常问「你看我现在这样做是不是很好啊？是不是有进步了？」"],"k":["肯定努力的作用","是不是有进步"],"src":"案例：「是不是有进步了」","refs":["案03"],"ctx":"【案例三 · 「是不是有进步了」】就本例情节提问"},{"id":"k157","sid":"60a126c0cf","cat":"three","q":"「求肯定」的现象在什么条件下，被看作试图得到咨询师肯定的表现？","a":["在咨询的早期和中期出现，并且一而再、再而三地发生。"],"k":["早期与中期","一而再再而三"],"src":"案例：「是不是有进步了」","refs":["案03"],"ctx":"【案例三 · 「是不是有进步了」】就本例情节提问"},{"id":"k158","sid":"daff49cbf2","cat":"three","q":"若这种表现看似与当下实际生活没什么关联，倾向于认为是什么？","a":["一种镜映移情——镜映自体客体移情。"],"k":["与实际生活无关联","镜映自体客体移情"],"src":"案例：「是不是有进步了」","refs":["案03"],"ctx":"【案例三 · 「是不是有进步了」】就本例情节提问"},{"id":"k159","sid":"cf5bf9a66f","cat":"three","q":"由求肯定一例可见，镜映需要与自体的哪个面向相关？","a":["与夸大自体的镜映需要相关；这种移情意味着来访者早期夸大自体的发展过程可能遭遇了某种潜抑。"],"k":["夸大自体","早期发展遭遇潜抑"],"src":"案例：「是不是有进步了」","refs":["案03"],"ctx":"【案例三 · 「是不是有进步了」】由本例引出的一般规律／论断"},{"id":"k160","sid":"0ed2769e87","cat":"three","q":"这位来访者用哪两句话表达了很强烈的理想化移情？","a":["「老师，你是哪所学校毕业的？你那所学校一定很好。」以及「老师，你今天戴的这副金丝边眼镜，一般人戴看起来像黑社会的，但你戴着就特别好看。」"],"k":["学校一定很好","金丝边眼镜特别好看"],"src":"案例：金丝边眼镜","refs":["案04"],"ctx":"【案例四 · 金丝边眼镜】就本例情节提问"},{"id":"k161","sid":"cc8ea75f63","cat":"three","q":"「学校一定很好」「眼镜特别好看」属于哪一类移情？","a":["很强烈的理想化移情过程。"],"k":["理想化移情"],"src":"案例：金丝边眼镜","refs":["案04"],"ctx":"【案例四 · 金丝边眼镜】就本例情节提问"},{"id":"k162","sid":"df873642f0","cat":"three","q":"由金丝边眼镜一例可见，看到理想化移情时应探究什么？","a":["探究他的理想化父母双亲影像中是否存在某种被潜抑的或断裂的内容。"],"k":["理想化父母双亲影像","被潜抑或断裂"],"src":"案例：金丝边眼镜","refs":["案04"],"ctx":"【案例四 · 金丝边眼镜】由本例引出的一般规律／论断"},{"id":"k163","sid":"1b81e3c001","cat":"three","q":"密友移情在咨询中具体表现为什么样的互动？","a":["两人就像闺密一样，聊衣服好不好看，聊读的书有没有意思，聊生活琐事等。"],"k":["像闺密","聊衣服与书","生活琐事"],"src":"案例：像闺密一样聊天","refs":["案05"],"ctx":"【案例五 · 像闺密一样聊天】就本例情节提问"},{"id":"k164","sid":"b9031d910e","cat":"three","q":"这种「像闺密一样聊天」的行为出现，往往表明什么？","a":["表明密友移情正在发生。"],"k":["密友移情正在发生"],"src":"案例：像闺密一样聊天","refs":["案05"],"ctx":"【案例五 · 像闺密一样聊天】就本例情节提问"},{"id":"k165","sid":"d84ed1c7b9","cat":"three","q":"在咨询早期出现密友移情，可能表明什么？","a":["在来访者密友自体的位置上，隐藏了某种被潜抑的东西。"],"k":["密友自体位置","隐藏被潜抑的东西"],"src":"案例：像闺密一样聊天","refs":["案05"],"ctx":"【案例五 · 像闺密一样聊天】就本例情节提问"},{"id":"k166","sid":"39eba73ad4","cat":"vert","q":"以垂直分裂的来访者为例，为什么在一开始较难观察到他的移情？","a":["因为他会把你远远地推开，但是你仍会看到他的一些特点。"],"k":["把你远远推开","仍可看到特点"],"src":"§5 垂直分裂","refs":[]},{"id":"k167","sid":"0bcb9a9af8","cat":"vert","q":"垂直分裂的来访者可能表现出什么姿态？","a":["倨傲——高高在上地俯视你，并通过这种俯视将你推开。"],"k":["倨傲","高高在上俯视","把人推开"],"src":"§5 垂直分裂","refs":[]},{"id":"k168","sid":"e21c0ca6b8","cat":"vert","q":"除倨傲之外，垂直分裂来访者还可能有哪些表现？","a":["可能会拒绝你的靠近，或只是以自圆其说的自夸强调自己如何出色。"],"k":["拒绝靠近","自圆其说的自夸"],"src":"§5 垂直分裂","refs":[]},{"id":"k169","sid":"8c87015541","cat":"vert","q":"面对一些垂直分裂的来访者，临床上可能需要怎样做？","a":["可能需要接受督导，并尝试从多个视角去观察，慢慢理解来访者所表达的内容。"],"k":["接受督导","多视角观察","慢慢理解"],"src":"§5 垂直分裂","refs":[]},{"id":"k170","sid":"61c09dab0a","cat":"vert","q":"理解一个垂直分裂的来访者，可能要花费多长时间？","a":["可能要花费一两年甚至更长的时间。"],"k":["一两年甚至更长"],"src":"§5 垂直分裂","refs":[]},{"id":"k171","sid":"b335f92c3b","cat":"vert","q":"这类来访者前来接受咨询的情况为什么相对较少？","a":["他们往往在生活遭遇混乱、面临无法处理的问题，或反复经受打击且打击严重影响其生活时，才会来接受精神分析或者心理咨询。"],"k":["生活混乱","无法处理的问题","反复打击"],"src":"§5 垂直分裂","refs":[]},{"id":"k172","sid":"11861385dc","cat":"vert","q":"也有部分垂直分裂的来访者因为什么前来咨询？","a":["因为抑郁。"],"k":["抑郁"],"src":"§5 垂直分裂","refs":[]},{"id":"k173","sid":"7d927e1962","cat":"vert","q":"这位音乐家来访者每次谈话时会做什么？","a":["都会向我汇报他的情况，告诉我他有多么优秀。"],"k":["每次汇报","有多么优秀"],"src":"案例：汇报「优秀」的音乐家","refs":["案08"],"ctx":"【案例八 · 汇报「优秀」的音乐家】就本例情节提问"},{"id":"k174","sid":"dec1d3c63d","cat":"vert","q":"咨询师在这些「优秀」之中感觉到什么？","a":["感觉不到实质的内容。"],"k":["感觉不到实质内容"],"src":"案例：汇报「优秀」的音乐家","refs":["案08"],"ctx":"【案例八 · 汇报「优秀」的音乐家】就本例情节提问"},{"id":"k175","sid":"7cd9988ecd","cat":"vert","q":"耐心等待之后，咨询师注意到哪两个特点？","a":["虽然他不断强调自己多么优秀、别人也都认可，但他很介意别人评论他的作品，并对此极为敏感；而且他实际上看不起周围的一些人，还会对他们发表一些评论。"],"k":["介意评论且极为敏感","看不起周围的人"],"src":"案例：汇报「优秀」的音乐家","refs":["案08"],"ctx":"【案例八 · 汇报「优秀」的音乐家】就本例情节提问"},{"id":"k176","sid":"53d9e96c5b","cat":"vert","q":"从这些表现中可以看出他与周围人的关系怎样？","a":["他与周围的人情感很疏离，而且习惯于贬低他人。"],"k":["情感疏离","习惯贬低他人"],"src":"案例：汇报「优秀」的音乐家","refs":["案08"],"ctx":"【案例八 · 汇报「优秀」的音乐家】就本例情节提问"},{"id":"k177","sid":"2bf1c9d01f","cat":"vert","q":"像这样的来访者属于什么结构？","a":["垂直分裂的结构。"],"k":["垂直分裂"],"src":"案例：汇报「优秀」的音乐家","refs":["案08"],"ctx":"【案例八 · 汇报「优秀」的音乐家】就本例情节提问"},{"id":"k178","sid":"267c24c6b1","cat":"vert","q":"他的移情可能与什么需要有关？为什么他把移情的部分隔离了？","a":["可能与镜映需要有关系：看似高高在上，实则很在意别人的目光，却又不表现出对别人的需求——如果把这个部分表现出来，他会觉得丢脸。"],"k":["镜映需要","在意别人目光","表现出来会丢脸"],"src":"案例：汇报「优秀」的音乐家","refs":["案08"],"ctx":"【案例八 · 汇报「优秀」的音乐家】就本例情节提问"},{"id":"k179","sid":"ac032079c9","cat":"vert","q":"由音乐家一例可见，垂直分裂的移情为什么仍「有所呈现」？","a":["他把移情的部分隔离了，但移情现象还是有所呈现；通过多视角观察仍可从倨傲、敏感与贬低中辨认出来。"],"k":["隔离移情","仍有所呈现","多视角辨认"],"src":"案例：汇报「优秀」的音乐家","refs":["案08"],"ctx":"【案例八 · 汇报「优秀」的音乐家】由本例引出的一般规律／论断"},{"id":"k180","sid":"bf984a0b13","cat":"fig","q":"图 3「移情的心理基础」中，三条水平层级线自上而下是什么？","a":["意识／前意识／无意识。"],"k":["意识","前意识","无意识"],"src":"附图 3","refs":[]},{"id":"k18 体客体移情","refs":[]},{"id":"k220","sid":"f08abf602f","cat":"cloze","q":"填空：「随着＿＿的出现，理想化的发展需要会逐步形成一些微结构，并慢慢整合到自身的内部世界中。」","a":["恰到好处的挫折。"],"k":["恰到好处的挫折","微结构"],"src":"§3 自体客体移情","refs":[]},{"id":"k221","sid":"f56b148af4","cat":"cloze","q":"填空：「如果出现创伤性的打断，这种需要就会在＿＿之前直接被压抑。」","a":["形成微结构。"],"k":["形成微结构"],"src":"§3 自体客体移情","refs":[]},{"id":"k222","sid":"5b81568279","cat":"cloze","q":"填空：「症状评估仅能发现表层的症状；人格水平评估虽能确定一个人当下的人格状态，但无从知晓其＿＿；而移情评估则能深入挖掘症状背后的意义。」","a":["问题起源所在。"],"k":["问题起源所在"],"src":"§4 第一重","refs":[]},{"id":"k223","sid":"fc97f42101","cat":"cloze","q":"填空：「移情评估直接指向＿＿问题，科胡特也将其称为＿＿评估，类似于病因学评估。」","a":["起源","起源学"],"k":["起源问题","起源学评估"],"src":"§4 第一重","refs":[]},{"id":"k224","sid":"64d7ec34d3","cat":"cloze","q":"填空：「要了解一位来访者经由分析是否可以结案，首先应该观察的不是其＿＿是否消失。」","a":["症状。"],"k":["症状是否消失"],"src":"§4 第三重","refs":[]},{"id":"k225","sid":"691fdabf6a","cat":"cloze","q":"填空：「若自体客体关系得以重建、被理解并被自我接纳，在结案的时候，你会发现来访者的移情已然＿＿，已被其意识所整合。」","a":["消失。"],"k":["移情消失","被意识整合"],"src":"§4 第三重","refs":[]},{"id":"k226","sid":"e78692a534","cat":"cloze","q":"填空：「在运用自体心理学进行个案概念化时，＿＿是个案概念化的一个重要指标。」","a":["自体客体移情。"],"k":["自体客体移情","个案概念化"],"src":"§5 评估及理解","refs":[]},{"id":"k227","sid":"27830bdd09","cat":"cloze","q":"填空：「能够通过直接询问获取的都不是无意识内容，而是来访者＿＿的内容。」","a":["加工好。"],"k":["加工好的内容"],"src":"§5 自由联想","refs":[]},{"id":"k228","sid":"8f5429e492","cat":"cloze","q":"填空：「只有来访者在＿＿中自然呈现的内容，才是真正被潜抑的部分。」","a":["自由联想。"],"k":["自由联想","被潜抑的部分"],"src":"§5 自由联想","refs":[]},{"id":"k229","sid":"464ee43e5c","cat":"cloze","q":"填空：「个案概念化的过程需要围绕＿＿进行评估。」","a":["三类移情。"],"k":["三类移情"],"src":"§5 长案例之后","refs":[]},{"id":"k230","sid":"d449361ac6","cat":"cloze","q":"填空：「临床移情评估的关键性在于，它与一个人的＿＿的心理动力和＿＿的心理动力直接相关。」","a":["病理起源","成长"],"k":["病理起源的心理动力","成长的心理动力"],"src":"§5 长案例之后","refs":[]},{"id":"案01","sid":"15cf86b156","cat":"form","q":"案例一 · 目光对视恐惧｜先读情节","a":["一位患有社交焦虑症并有目光对视恐惧的来访者，在治疗中说自己有一些不可告人的事情，问咨询师能不能开药；得知咨询师没有资格开药后，她说「要不你给我介绍一位医生？」，却并没有去看医生。这样反复了十几次之后，她才说出社交焦虑症是在与前男友分手之后出现的。","分手后她上班时总有些难过，脑海里总会突然浮现男女发生性关系的场景；场景一出现她就觉得羞耻、很不舒服，努力把念头压抑下去，但过不了多久它又浮现，她再次压抑。","有一天她在单位办公时这个念头又浮现，碰巧和同事对视了一眼，同事冲她微笑了一下，她便怀疑自己心里的念头被人看穿了，立刻变得很紧张；头脑中频繁出现的性场景消失了，取而代之的是不敢和别人对视的心理。","这种紧张逐渐泛化到生活中，症状就此形成。当她把这件事情说出来时，觉得自己松了一口气，压抑的东西全都消失了，连和别人对视的恐惧也消失了。"],"k":["反复问开药与介绍医生","分手后浮现性场景","反复压抑","同事对视微笑","念头被看穿","说出来后恐惧消失"],"src":"§2 移情的形成 · 目光对视恐惧","refs":["案01"],"intro":1,"case":"一","follow":"后面几张卡问：症状怎样由置换形成、为何说出即疗愈，以及浮现与压抑各自的动力。"},{"id":"案02","sid":"af89ec5f1e","cat":"form","q":"案例二 · 听网课时反复敲门｜先读情节","a":["假设你在听网课，家人突然过来敲门说有事要对你说；你回答没时间，他便离开了，但过了一会儿又来敲门。再次回绝后，如果他再过来敲门，你就会非常愤怒，会想「你真烦人，为什么一直影响我」。","那个想进来的人持续不断地想找你说事情，如同被压抑的内容一直想进入意识；你不断将其拒之门外，如同反复压抑的过程。你看似在听课，却不断受到打扰，最终听课质量大打折扣。","无意识内容进入意识的过程，就好像在反复被打扰后你终于问道：「你有什么事要对我说？」结果对方只是问你盐放在哪儿；你告诉了他，他的欲望得到了满足，你也就能安心听课了。"],"k":["反复敲门","非常愤怒","拒之门外＝压抑","听课质量下降","问「你有什么事」","只是问盐放在哪儿"],"src":"§2 移情的形成 · 敲门比喻","refs":["案02"],"intro":1,"case":"二","follow":"后面几张卡问：比喻中各个角色对应什么、症状为何令人不快乐，以及疗愈如何发生。"},{"id":"案03","sid":"bc03f69852","cat":"three","q":"案例三 · 「是不是有进步了」｜先读情节","a":["一位来访者在临床过程中非常希望咨询师肯定其努力的作用，他经常说：「老师，你看我现在这样做是不是很好啊？是不是有进步了？」","如果这样的现象在咨询的早期和中期出现，并且一而再、再而三地发生，便是他试图得到咨询师肯定的表现；若这种表现看似与其当下的实际生活没什么关联，便倾向于认为这是一种镜映移情——镜映自体客体移情。"],"k":["希望咨询师肯定努力","早期与中期反复出现","与实际生活没什么关联","镜映移情"],"src":"§5 镜映移情的辨识","refs":["案03"],"intro":1,"case":"三","follow":"后面几张卡问：这一需要与自体的哪个面向相关、意味着早期发展遭遇了什么。"},{"id":"案04","sid":"3f019fe879","cat":"three","q":"案例四 · 金丝边眼镜｜先读情节","a":["一位表现出很强烈理想化移情过程的来访者对咨询师说：「老师，你是哪所学校毕业的？你那所学校一定很好。」","或者说：「老师，你今天戴的这副金丝边眼镜，一般人戴看起来像黑社会的，但你戴着就特别好看。」"],"k":["哪所学校毕业","学校一定很好","金丝边眼镜","你戴着就特别好看"],"src":"§5 理想化移情的辨识","refs":["案04"],"intro":1,"case":"四","follow":"后面几张卡问：看到这种移情时应当探究什么、它指向哪一个早期位置。"},{"id":"案05","sid":"e2a8ee2818","cat":"three","q":"案例五 · 像闺密一样聊天｜先读情节","a":["在另一些例子中，来访者和咨询师之间产生了某种密友需要，即密友移情；比如两人就像闺密一样，聊衣服好不好看，聊读的书有没有意思，聊生活琐事等。","这种行为的出现，往往表明密友移情正在发生。在咨询早期，这可能表明在来访者密友自体的位置上，隐藏了某种被潜抑的东西。"],"k":["像闺密一样","聊衣服与书","聊生活琐事","密友移情正在发生"],"src":"§5 密友移情的辨识","refs":["案05"],"intro":1,"case":"五","follow":"后面几张卡问：这属于三类移情中的哪一类、对应哪一个自体位置。"},{"id":"案06","sid":"320d01bdb4","cat":"eval","q":"案例六 · 中等强度的理想化移情｜先读情节","a":["一位女性来访者一直对我有某种程度的理想化移情，强度中等，不是特别强烈。她的边界各方面功能较好，人格评估显示没有太严重的症状，仅存在轻度的焦虑；移情表现更接近神经症人格水平的来访者。","随着咨询推进，她对我的理想化移情有一些增强，但并没有到脱离现实的地步。她是一位 30 岁的未婚女性，长期与其上司保持恋爱关系；对方是已婚人士，且认为两人不可能有未来，但关系并未结束。","对于这段没有结果的恋爱关系，她理智上清楚应该结束，情感上却做不到。经由她对我的理想化移情，我初步形成个案概念化，但尚无法确定她早期经历的事件，仅能推测她隐藏了一个理想化失败的过程。"],"k":["中等强度理想化移情","人格评估接近神经症水平","与已婚上司长期恋爱","理智清楚情感做不到","推测理想化失败"],"src":"§5 个案概念化的形成","refs":["案06"],"intro":1,"case":"六","follow":"后面几张卡问：初步概念化为何只能推测、移情评估如何追踪起源点，以及后续联想如何补全因果链。"},{"id":"案07","sid":"52c62839bc","cat":"eval","q":"案例七 · 父亲想要儿子与代偿｜先读情节","a":["她父亲一直希望生个儿子，但家里的三个孩子都是女儿。三个女儿都很有出息，虽然出生在农村，但都上了大学；她父亲一方面觉得很好，一方面又下意识地表现出遗憾，时常因为没有儿子而唉声叹气。作为三姐妹中最小的一个，她一直希望能够得到父亲的认可，但始终未能如愿。","因此，在与男性的关系中，她一方面渴望靠近男性，另一方面对像父亲这样的男性存在一种着迷般的爱，希望让对方开心；当对方开心的时候，她就觉得自己是有价值的、是被别人接纳的。","上司与她关系很紧密，类似父亲的角色，自她入职起就很关心她，给了她未能从父亲身上获得的感觉，从而形成了代偿；然而这只能暂时满足她渴望被父亲认可的需要。"],"k":["父亲盼儿子而叹气","三姐妹中最小","希望得到父亲认可而未遂","让对方开心才有价值","上司类似父亲角色","形成代偿"],"src":"§5 自由联想中的早期材料","refs":["案07"],"intro":1,"case":"七","follow":"后面几张卡问：个案概念化的两条因果线、低自尊如何导向代偿性对象，以及为何这不是早年关系的简单复制。"},{"id":"案08","sid":"3b3ca91db6","cat":"vert","q":"案例八 · 汇报「优秀」的音乐家｜先读情节","a":["我曾经有一位来访者，他是一名音乐家。每次谈话时，他都会向我汇报他的情况，告诉我他有多么优秀；但在这些「优秀」之中，我感觉不到实质的内容。","耐心等待之后我注意到，虽然他不断强调自己多么优秀、别人也都认可，但他很介意别人评论他的作品，并对此极为敏感；他实际上看不起周围的一些人，还会对他们发表一些评论，与周围的人情感很疏离，而且习惯于贬低他人。","像这样的来访者属于垂直分裂的结构；他的移情可能和镜映需要有关系，看似高高在上，实则很在意别人的目光，却又不表现出对别人的需求——如果表现出来，他会觉得丢脸。"],"k":["每次汇报有多么优秀","感觉不到实质内容","介意评论且极为敏感","看不起周围的人","情感疏离","把移情隔离了"],"src":"§5 垂直分裂的移情","refs":["案08"],"intro":1,"case":"八","follow":"后面几张卡问：为什么垂直分裂的移情难以观察、倨傲与推开的机制，以及临床上该如何应对。"}];

const $=id=>document.getElementById(id);

let deck=[],pos=0,flipped=false,mineText='';

CATS.forEach(c=>{

if(s0&&Object.keys(s0).length){

}

/* ============ 卡组 ============ */
function stat(v){return v===3?'✓ 记得':v===2?'· 模糊':'○ 未评';}
/* 情节卡不参与排序：在案例题卡「首次呈现」之前插入对应介绍。
   perSegment=true（知识模块顺序）：同一案例的题卡分成不同区段时，每段前都插一次
   （案例速查是反查练习，离原案例很远，需要重新给情节）。
   perSegment=false（弱项/随机/掌握度）：每个案例全局只插一次，避免介绍卡淹没题卡。 */
function anchorIntros(body, perSegment){
  const intros={}; CARDS.forEach(c=>{if(c.intro)intros[c.id]=c;});
  const out=[], seenKeys=new Set(), seenCards=new Set(); let last='';
  body.forEach(c=>{
    const refs=(c.refs||[]).filter(r=>intros[r]);
    const key=refs.join('|');
    const need=refs.length&&(perSegment?(key!==last):!seenKeys.has(key));
    if(need){
      if(perSegment){
        refs.forEach(r=>out.push(intros[r]));
      }else{
        /* 打散排序下按「单张情节卡」去重：案例速查⑦ 同时指向案10/案11，
           若这两个案例在别处已介绍过，就不再重复插入 */
        refs.forEach(r=>{if(!seenCards.has(r)){out.push(intros[r]);seenCards.add(r);}});
      }
      seenKeys.add(key);
    }
    last=refs.length?key:'';
    out.push(c);
  });
  return out;
}
function buildDeck(keep){
  const s=settings();
  const introOnly=(s.cat==='__intro__');
  deck=CARDS.filter(c=>{
    if(introOnly){if(!c.intro)return false;}
    else{if(c.intro)return false;if(s.cat!=='all'&&c.cat!==s.cat)return false;}
    if(s.weak&&(saved.status[c.sid]||0)>=3)return false;
    return true;
  });
  if(s.order==='seq')deck.sort((a,b)=>CATIDX[a.cat]-CATIDX[b.cat]||CARDS.indexOf(a)-CARDS.indexOf(b));
  if(s.order==='status')deck.sort((a,b)=>(saved.status[a.sid]||0)-(saved.status[b.sid]||0));
  if(s.order==='weak'){const wk=sid=>{const v=saved.status[sid]||0;return v===0?1.5:v;};deck.sort((a,b)=>wk(a.sid)-wk(b.sid)||Math.random()-.5);}
  if(s.order==='rand')deck=deck.slice().sort(()=>Math.random()-.5);
  /* 排序完成后再锚定情节卡：与所选顺序无关，保证介绍总在该案例题卡之前 */
  if(!introOnly)deck=anchorIntros(deck,s.order==='seq');
  if(keep&&pos<deck.length){}else{pos=0;}
  if(pos>=deck.length)pos=0;
  renderChips();updateStats();show();
}

function updateStats(){
  const s=settings();
  const introOnly=(s.cat==='__intro__');
  const pool=introOnly?CARDS.filter(c=>c.intro)
    :(s.cat==='all'?CARDS:CARDS.filter(c=>c.cat===s.cat)).filter(c=>!c.intro);
  const done=pool.filter(c=>(saved.status[c.sid]||0)>0).length;
  const got=pool.filter(c=>(saved.status[c.sid]||0)===3).length;
  const nIntro=deck.filter(c=>c.intro).length;
  $('statText').textContent=(introOnly?'案例情节 '+pool.length+' 张':'本模块 '+pool.length+' 张题卡')
    +' ｜ 已评 '+done+' ｜ 记得 '+got+' ｜ 当前卡组 '+deck.length+' 张'
    +(introOnly?'':'（含情节卡 '+nIntro+'）');
  $('progText').textContent=done+'/'+pool.length;
  $('bar').style.width=(pool.length?done/pool.length*100:0)+'%';
  $('countHint').textContent=deck.length?(pos+1)+' / '+deck.length:'当前筛选无卡片';
}

/* ============ 渲染 ============ */
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function show(){
  const box=$('cardArea');
  const oldEmpty=box.querySelector('.empty');if(oldEmpty)oldEmpty.remove();
  if(!deck.length){
    $('front').innerHTML='<div class="empty">当前筛选下没有卡片。<br>试着取消「只看未掌握」，或换一个模块。</div>';
    $('back').innerHTML='';$('card').classList.remove('flipped');
    updateStats();return;
  }
  const c=deck[pos],col=CATMAP[c.cat].color,st=saved.status[c.sid]||0;
  const s=settings();
  flipped=false;$('card').classList.remove('flipped');mineText='';
  $('card').style.setProperty('--cc',col);
  const badge=c.intro?'案例情节 · 先读':CATMAP[c.cat].label;
  const head='<div class="top"><span class="badge'+(c.intro?' introBadge':'')+'" style="background:'+col+'">'+badge+'　·　'+stat(st)+'</span><span class="idx">'+c.id+'　'+(pos+1)+'/'+deck.length+'</span></div>';
  const foot='<div class="src">所在小节：'+esc(c.src)+'　｜　徐钧《自体心理学入门》第六章</div>';

  /* 案例情节卡：正面直接印出情节，不用翻面就能读到背景；背面给记忆抓手。
     不进入默写／反向提问（它不是问答题）。 */
  if(c.intro){
    const body='<div class="introBody">'+c.a.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>';
    $('front').innerHTML=head+'<div class="q">'+esc(c.q)+'</div>'+body+
      '<div class="introHint">'+esc(c.follow||'')+'　·　无需翻面，读完直接进入后面的提问卡。</div>'+foot;
    $('back').innerHTML=head+'<div class="q">'+esc(c.q)+' · 记忆抓手</div>'+
      '<div class="kw">合上卡片试着自己复述情节，再核对关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>'+
      '<div class="introHint">'+esc(c.follow||'')+'</div>'+foot;
    $('flip').textContent='翻面看记忆抓手（空格）';
    updateStats();return;
  }

  let q=c.q, a=c.a;
  if(s.reverse){ q=c.a.join('　／　'); a=[c.q]; }
  const big=q.length>95?' big':'';

  const ctxHtml=c.ctx?'<div class="ctx">'+esc(c.ctx)+'</div>':'';
  if(s.recite&&!s.reverse){
    $('front').innerHTML=head+ctxHtml+'<div class="q'+big+'">'+esc(q)+'</div>'+
      '<textarea id="mine" placeholder="先在这里写下你的答案／背诵要点，再点「核对并翻面」…"></textarea>'+foot;
    const ta=$('mine');
    if(ta){ta.onclick=e=>e.stopPropagation();ta.oninput=()=>{mineText=ta.value;};ta.value='';}
  }else{
    $('front').innerHTML=head+ctxHtml+'<div class="q'+big+'">'+esc(q)+'</div>'+foot;
  }

  let back=head+(s.reverse?'':ctxHtml)+'<ul class="aList">'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(s.recite&&!s.reverse&&mineText.trim()){
    back+='<div class="mine"><b>你的默写</b>'+esc(mineText.trim())+'</div>';
    const hits=c.k.filter(w=>mineText.indexOf(w)>=0);
    back+='<div class="hit">关键词命中 '+hits.length+' / '+c.k.length+(hits.length?'：'+esc(hits.join('、')):'　— 建议对照全文再背一遍')+'</div>';
  }
  if(!s.reverse&&c.k.length){
    back+='<div class="kw">关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>';
  }
  back+=foot;
  $('back').innerHTML=back;
  $('flip').textContent=s.recite&&!s.reverse?'核对并翻面（空格）':'翻面看答案（空格）';
  updateStats();
}
function flip(){
  if(!deck.length)return;
  const s=settings();
  if(s.recite&&!s.reverse&&!flipped){const ta=$('mine');if(ta)mineText=ta.value;}
  if(!flipped&&s.recite&&!s.reverse&&!deck[pos].intro){showKeepMine();}
  flipped=!flipped;$('card').classList.toggle('flipped',flipped);
  $('flip').textContent=flipped?'返回正面（空格）':(deck[pos].intro?'翻面看记忆抓手（空格）':(s.recite&&!s.reverse?'核对并翻面（空格）':'翻面看答案（空格）'));
}
/* 翻面前把默写内容写进背面（不重置卡片状态） */
function showKeepMine(){
  const c=deck[pos],col=CATMAP[c.cat].color,st=saved.status[c.sid]||0,s=settings();
  const head='<div class="top"><span class="badge" style="background:'+col+'">'+CATMAP[c.cat].label+'　·　'+stat(st)+'</span><span class="idx">'+c.id+'　'+(pos+1)+'/'+deck.length+'</span></div>';
  const foot='<div class="src">所在小节：'+esc(c.src)+'　｜　徐钧《自体心理学入门》第六章</div>';
  let back=head+'<ul class="aList">'+c.a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(mineText.trim()){
    back+='<div class="mine"><b>你的默写</b>'+esc(mineText.trim())+'</div>';
    const hits=c.k.filter(w=>mineText.indexOf(w)>=0);
    back+='<div class="hit">关键词命中 '+hits.length+' / '+c.k.length+(hits.length?'：'+esc(hits.join('、')):'　— 建议对照全文再背一遍')+'</div>';
  }
  back+='<div class="kw">关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>'+foot;
  $('back').innerHTML=back;
}
function go(d){if(!deck.length)return;pos=(pos+d+deck.length)%deck.length;show();}
function rate(v){if(!deck.length)return;saved.status[deck[pos].sid]=v;persist();go(1);}

/* ============ 导出 ============ */
function download(name,text,type){
  const blob=new Blob(['\ufeff'+text],{type:type||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},200);
}
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}
$('btnCSV').onclick=()=>{
  const rows=[['编号','模块','语境','问题 / 情节标题','答案 / 情节正文','关键词','所在小节']];
  CARDS.forEach(c=>rows.push([c.id,c.intro?'案例情节':CATMAP[c.cat].label,c.ctx||'',c.q,c.a.join(' / '),c.k.join(' / '),c.src]));
  download('第6章_知识闪卡.csv',rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');
};
$('btnMD').onclick=()=>{
  let t='# 第六章 移情评估与个案概念化 · 知识闪卡\n\n> 依据：徐钧《自体心理学入门》pp.105–119 修复稿。纯知识卡，重点为移情的定义、症状的形成与意识化整合、三重临床意义与个案概念化。\n\n';
  CATS.forEach(c=>{
    const list=CARDS.filter(x=>x.cat===c.k);if(!list.length)return;
    t+='## '+c.label+'（'+list.length+' 张）\n\n';
    list.forEach(x=>{t+='**'+x.id+'｜'+(x.intro?'【案例情节】':'')+x.q+'**\n\n';if(x.ctx)t+='> 语境：'+x.ctx+'\n\n';x.a.forEach(a=>t+='- '+a+'\n');t+='\n> 关键词：'+x.k.join('、')+'　｜　所在小节：'+x.src+(x.intro&&x.follow?'\n> 后续：'+x.follow:'')+'\n\n';});
  });
  download('第6章_知识闪卡.md',t,'text/markdown;charset=utf-8');
};
$('btnPrint').onclick=()=>{
  let h='<h2>徐钧《自体心理学入门》· 第六章知识闪卡</h2><div class="meta">依据 pp.105–119 修复稿 ｜ 共 '+CARDS.length+' 张 ｜ 打印日期：'+new Date().toLocaleDateString('zh-CN')+'</div>';
  CATS.forEach(c=>{
    const list=CARDS.filter(x=>x.cat===c.k);if(!list.length)return;
    h+='<h3>'+c.label+'（'+list.length+' 张）</h3>';
    list.forEach(x=>{h+='<div class="item"><div class="qq">'+x.id+'　'+(x.intro?'【案例情节】':'')+esc(x.q)+'</div>'+(x.ctx?'<div class="ss">语境：'+esc(x.ctx)+'</div>':'')+'<div class="aa">'+x.a.map(esc).join('　／　')+'</div><div class="ss">所在小节：'+esc(x.src)+'</div></div>';});
  });
  $('printArea').innerHTML=h;
  setTimeout(()=>window.print(),60);
};

/* ============ 事件 ============ */
['fCat','fOrder'].forEach(id=>$(id).onchange=()=>{saveSettings();buildDeck();});
['fWeak','fRecite','fReverse'].forEach(id=>$(id).onchange=()=>{saveSettings();buildDeck();});
$('fReset').onclick=()=>{if(confirm('清除本章闪卡的全部自评记录？\n（会同步到闪卡空间；不影响其它章节）')){saved.status={};persist();buildDeck();}};
$('flip').onclick=e=>{e.stopPropagation();flip();};
$('prev').onclick=()=>go(-1);
$('next').onclick=()=>go(1);
document.querySelectorAll('.rate').forEach(b=>b.onclick=()=>rate(+b.dataset.r));
$('card').onclick=e=>{if(e.target.id==='mine')return;flip();};
document.addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='TEXTAREA'||tag==='INPUT'||tag==='SELECT')return;
  const k=e.key.toLowerCase();
  if(e.code==='Space'||k===' '){e.preventDefault();flip();}
  else if(k==='arrowleft'){e.preventDefault();go(-1);}
  else if(k==='arrowright'){e.preventDefault();go(1);}
  else if(k==='1'||k==='2'||k==='3')rate(+k);
  else if(k==='r'){$('fOrder').value='rand';saveSettings();buildDeck();}
  else if(k==='m'){$('fRecite').checked=! $('fRecite').checked;saveSettings();buildDeck();}
  else if(k==='f'){$('fWeak').checked=! $('fWeak').checked;saveSettings();buildDeck();}
});

buildDeck();

/* === 跨页同步：另一标签页在闪卡空间的复习／编辑变动 === */
(function(){
  function setup(){
    var bar=document.querySelector('.xjLearnBar');
    if(bar && !bar.querySelector('.xjHubLink')){
      var sep=document.createElement('span'); sep.className='xjSep'; sep.textContent='\u203a';
      var a=document.createElement('a'); a.className='xjHubLink';
      a.href='../flashcards/'; a.textContent='\u95ea\u5361\u7a7a\u95f4 \u2197';
      bar.appendChild(sep); bar.appendChild(a);
    }
    var tip=document.createElement('div'); tip.id='hubSyncTip';
    tip.style.cssText='display:none;position:fixed;right:16px;bottom:16px;z-index:9999;background:#115e59;color:#fff;padding:10px 14px;border-radius:10px;font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.2);cursor:pointer';
    tip.textContent='\u95ea\u5361\u7a7a\u95f4\u6709\u7f16\u8f91\u53d8\u52a8\uff0c\u70b9\u6b64\u5237\u65b0\u540c\u6b65';
    tip.onclick=function(){location.reload();};
    document.body.appendChild(tip);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',setup); else setup();
  window.addEventListener('hubchange',function(){
    try{
      var o=JSON.parse(Hub.chapterLoad(HUB_CH,KEY));
      saved.status=o.status||{}; saved.settings=o.settings||{};
    }catch(e){}
    if(typeof updateStats==='function') updateStats();
    if(Hub.editVersion()!==HUB_EDIT_V){
      var t=document.getElementById('hubSyncTip'); if(t) t.style.display='block';
    }
  });
})();
</script>
