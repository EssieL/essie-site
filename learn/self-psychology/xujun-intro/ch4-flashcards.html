<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>徐钧《自体心理学入门》· 第四章 知识闪卡</title>
<style>
  :root{
    --bg:#f6f5f1; --ink:#2c2c2a; --muted:#888780; --line:#e3e1d8; --card:#fff;
    --blue:#3b6ea5; --amber:#b07b23; --red:#b4493f; --green:#2f7d6b; --brown:#9a6b3f;
    --shadow:0 2px 16px rgba(0,0,0,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{min-height:58px;padding:8px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:#fff;flex-wrap:wrap}
  header h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
  header .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:430px}
  header .right{margin-left:auto;display:flex;gap:6px;align-items:center}
  button.b{font-size:12px;padding:6px 11px;border:1px solid #d6d4ca;background:#fff;border-radius:7px;cursor:pointer;color:var(--ink);white-space:nowrap}
  button.b:hover{background:#f0eee6}
  button.b.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .fbar{padding:9px 16px;border-bottom:1px solid var(--line);background:#fbfaf7;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .fbar label{font-size:12px;color:var(--muted)}
  select{font-size:12px;padding:6px 8px;border:1px solid #d6d4ca;border-radius:7px;background:#fff;color:var(--ink)}
  .chk{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;background:#fff;border:1px solid #d6d4ca;border-radius:7px;padding:6px 9px;white-space:nowrap}
  .chk input{margin:0}
  .chips{display:flex;gap:5px;padding:8px 16px 2px;flex-wrap:wrap;max-height:74px;overflow:auto}
  .chip{font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:#b9b5a7}
  .chip.on{color:#fff;border-color:transparent;font-weight:600}
  .chip i{font-style:normal;opacity:.75;margin-left:4px}
  .stats{padding:8px 18px 2px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .track{flex:1;min-width:120px;height:7px;border-radius:5px;background:#e7e5dc;overflow:hidden}
  .track i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
  .cardArea{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 18px 4px;min-height:0}
  .card{width:100%;max-width:780px;height:100%;max-height:440px;min-height:280px;perspective:1400px;cursor:pointer}
  .inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:20px 26px;display:flex;flex-direction:column;overflow:auto}
  .face.back{transform:rotateY(180deg)}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{font-size:11px;padding:4px 10px;border-radius:20px;color:#fff;background:var(--cc,#3b6ea5);letter-spacing:.3px}
  .idx{font-size:11px;color:var(--muted);margin-left:auto}
  .q{font-size:19px;line-height:1.65;font-weight:600;margin:18px 0 8px;white-space:pre-wrap}
  .q.big{font-size:16px;font-weight:500;line-height:1.8}
  .ctx{font-size:11.5px;line-height:1.6;color:#7a5a34;background:#f8f2e7;border:1px solid #ecdfc6;border-radius:7px;padding:5px 10px;margin:14px 0 -4px}
  .introBody{background:#faf8f2;border:1px solid #eae5d7;border-radius:10px;padding:12px 16px;margin:10px 0 8px;font-size:14px;line-height:1.85;overflow:auto;max-height:230px}
  .introBody p{margin:0 0 8px}
  .introBody p:last-child{margin-bottom:0}
  .introHint{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:4px}
  .badge.introBadge{background:#8a6a3e}
  .src{font-size:11px;color:var(--muted);margin-top:auto;padding-top:12px;border-top:1px dashed var(--line)}
  textarea{width:100%;min-height:96px;flex:1;border:1px dashed #cfccc1;border-radius:9px;background:#fbfaf7;padding:11px 13px;font-size:14px;line-height:1.7;font-family:inherit;color:var(--ink);resize:none;outline:none}
  textarea:focus{border-color:var(--blue);background:#fff}
  .aList{font-size:14.5px;line-height:1.85;margin:12px 0 4px;padding-left:0;list-style:none;white-space:pre-wrap}
  .aList li{margin-bottom:8px;padding-left:16px;position:relative}
  .aList li:before{content:"";position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--cc,#3b6ea5)}
  .mine{background:#f7f5ef;border:1px dashed #d6d4ca;border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;margin-top:8px;max-height:110px;overflow:auto}
  .mine b{color:var(--muted);font-weight:500;font-size:11px;display:block;margin-bottom:4px}
  .hit{font-size:12px;color:var(--green);margin-top:6px}
  .kw{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.6}
  .kw span{display:inline-block;background:#f1efe8;border-radius:5px;padding:1px 7px;margin:2px 4px 0 0}
  .controls{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px 12px;flex-wrap:wrap}
  .controls .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
  .controls .rate{font-size:12px;padding:7px 13px;border-radius:8px;border:1px solid #d6d4ca;background:#fff;cursor:pointer;color:var(--ink)}
  .controls .rate:hover{background:#f0eee6}
  .controls .rate.r1{border-color:#e2b6b1;color:var(--red)}
  .controls .rate.r2{border-color:#e1cf9f;color:var(--amber)}
  .controls .rate.r3{border-color:#aed3c8;color:var(--green)}
  .foot{font-size:11px;color:var(--muted);text-align:center;padding:0 16px 9px}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}
  #printArea{display:none}
  @media print{
    html,body{height:auto;overflow:visible;background:#fff}
    body>*:not(#printArea){display:none !important}
    #printArea{display:block !important;padding:0}
    #printArea h2{font-size:16px;margin:0 0 6px}
    #printArea .meta{font-size:11px;color:#666;margin-bottom:14px}
    #printArea .item{border-bottom:1px solid #ddd;padding:8px 0;page-break-inside:avoid}
    #printArea .item .qq{font-size:13px;font-weight:600}
    #printArea .item .aa{font-size:12px;line-height:1.6;color:#333;margin-top:3px}
    #printArea .item .ss{font-size:10px;color:#888;margin-top:3px}
  }
  @media (max-width:640px){
    header .sub{display:none}
    .q{font-size:17px}
    .face{padding:16px 18px}
    .card{max-height:none}
  }

@media print{.xjLearnBar{display:none!important}}

</style>

sid":"d0105917e4","cat":"stern","q":"科胡特所说的核心自体大致相当于斯特恩的哪几类自体？","a":["类似于斯特恩所说的核心自体、主观自体，以及前期的叙事自体部分。"],"k":["核心自体","主观自体","前期叙事自体"],"src":"§2 三极自体与人的困扰","refs":[]},{"id":"k024","sid":"3c1e6f597c","cat":"stern","q":"科胡特所说的核心自体与斯特恩所说的核心自体有什么不同？","a":["科胡特所说的核心自体主要是指流动性好且有连续性的自体，同时还具有内聚性和统整性，属于比较健康、具备一定胜任感的自体。"],"k":["流动性","连续性","内聚性统整性","健康胜任"],"src":"§1 两种核心自体","refs":[]},{"id":"k025","sid":"cf00dd633d","cat":"stern","q":"依科胡特，具备什么条件的一类自体可称为核心自体？","a":["当一类自体已具有一定的边界感，并开始发展核心的内聚性、统整性和连续性时，这类自体就是核心自体。"],"k":["一定的边界感","内聚性统整性连续性"],"src":"§1 两种核心自体","refs":[]},{"id":"k026","sid":"32ad1f9302","cat":"stern","q":"科胡特的核心自体在自体发展中处于什么地位？为什么可能不同于斯特恩的核心自体？","a":["核心自体构成了自体未来发展的基础。","科胡特的核心自体可能包含了斯特恩的核心自体和主观自体的主要特征。"],"k":["未来发展的基础","包含两类主要特征"],"src":"§1 两种核心自体","refs":[]},{"id":"k027","sid":"a5e34914db","cat":"stern","q":"基于实证研究的发展心理学，与临床建构的心理经验，在发展时间点上有何差异？","a":["儿童的心理发展时间点普遍早于在临床建构的心理经验中所发现的心理发展时间点。"],"k":["实证早于临床建构"],"src":"§2 发展时间点","refs":[]},{"id":"k028","sid":"0ef2eaab68","cat":"stern","q":"当代自体心理学对发展心理学持什么态度？","a":["不仅仅依靠精神分析本身的发展心理学，也重视以实证研究为基础的发展心理学。"],"k":["精神分析的发展心理学","实证研究为基础"],"src":"§2 发展时间点","refs":[]},{"id":"k029","sid":"5834ed4794","cat":"stern","q":"斯特恩五类自体的正确顺序是什么？","a":["身体自体、显现自体 → 核心自体 → 主观自体 → 叙事自体。"],"k":["身体","显现","核心","主观","叙事"],"src":"§1 五类自体","refs":[]},{"id":"k030","sid":"300b6a0f38","cat":"core","q":"科胡特所阐述的自体源于什么？又延续了谁的理论？","a":["源于临床观察，并延续了弗洛伊德的人格心理学与发展心理学理论。"],"k":["临床观察","弗洛伊德"],"src":"§1 自恋发展","refs":[]},{"id":"k031","sid":"2338b64d21","cat":"core","q":"弗洛伊德式的发展观点认为，个体出生时处于什么状态？","a":["个体出生时，自身被全能性自恋所灌注。"],"k":["全能性自恋","灌注"],"src":"§1 自恋发展","refs":[]},{"id":"k032","sid":"8b6869887d","cat":"core","q":"按这一发展观点，婴幼儿成长中会逐步发展出什么？","a":["会逐步发展出与他人的关系，并在与他人的关系中意识到自己的性别，进而发展出与不同性别的人的关系。"],"k":["与他人的关系","意识到性别","不同性别"],"src":"§1 自恋发展","refs":[]},{"id":"k033","sid":"5b16d70b3b","cat":"core","q":"上述发展过程涉及精神分析中哪两个重要时期？","a":["母婴发展时期和俄狄浦斯情结的发展时期。"],"k":["母婴发展时期","俄狄浦斯情结"],"src":"§1 自恋发展","refs":[]},{"id":"k034","sid":"3cd2e5bf7c","cat":"core","q":"当一个人开始从自恋发展出客体关系的时候，他的自恋会消失吗？","a":["不会；他的自恋并没有消失。"],"k":["自恋没有消失"],"src":"§1 自恋发展","refs":[]},{"id":"k035","sid":"2ac53d805a","cat":"core","q":"个体是怎样渐渐形成「适应性自体结构」的？","a":["个体出生时有全能自恋并提出需求；其后在生活中经历自体客体的回应，这种共鸣回应与「恰到好处的挫折」让他渐渐形成一种适应社会的适应性自体结构。"],"k":["自体客体回应","共鸣回应","恰到好处的挫折","适应社会"],"src":"§1 适应性自体结构","refs":[]},{"id":"k036","sid":"ea9330d160","cat":"core","q":"适应性自体结构成为自体的一部分之后，具有什么功能？","a":["在保持自身活力的同时，也具有良好的、用于调整情绪的统整性功能。"],"k":["保持活力","调整情绪","统整性功能"],"src":"§1 适应性自体结构","refs":[]},{"id":"k037","sid":"4bbe4762f9","cat":"core","q":"从婴儿早期的自体状态到稳定的自体感，中间要经由什么？","a":["从婴儿早期自体分散、感受稀薄的状态，慢慢经由自体客体的镜映的夯实，并通过「恰到好处的挫折」逐步形成稳定的自体感。"],"k":["自体分散感受稀薄","镜映夯实","恰到好处的挫折"],"src":"§1 自体发展路径","refs":[]},{"id":"k038","sid":"f8d8718262","cat":"core","q":"本章描述的自体发展，从最早期到最终成功形成核心自体，依次经历什么？","a":["从早期连身体自体都尚不清晰、缺乏边界的感受开始，慢慢发展出身体自体，并最终成功形成核心自体。"],"k":["身体自体不清晰","身体自体","核心自体"],"src":"§1 自体发展路径","refs":[]},{"id":"k039","sid":"94a9feabc9","cat":"core","q":"自恋实际上存在于哪里？由此可以推出什么？","a":["自恋实际上就是充斥在自体当中的，所以自体也有自恋这一本能能量。"],"k":["充斥在自体中","自恋本能能量"],"src":"§2 自恋的发展主线","refs":[]},{"id":"k040","sid":"3871188390","cat":"core","q":"本章指出理想化父母双亲影像也是什么？","a":["也是自恋的一条发展主线。"],"k":["自恋的发展主线"],"src":"§2 自恋的发展主线","refs":[]},{"id":"k041","sid":"5451c7c71a","cat":"core","q":"在科胡特晚期的观点中，这类自恋需要被称为什么？","a":["自体客体需要。"],"k":["自体客体需要"],"src":"§2 自恋的发展主线","refs":[]},{"id":"k042","sid":"94fba0404d","cat":"core","q":"在理想化父母双亲影像这一自体客体的体验过程中，孩子体验到的内聚感、统整感实则是什么？","a":["实则是从他人身上体会到的自己。"],"k":["从他人身上体会到的自己"],"src":"§2 理想化需要","refs":[]},{"id":"k043","sid":"40b7578804","cat":"core","q":"科胡特的核心自体同时具有哪四项特征？","a":["流动性好、有连续性，还具有内聚性和统整性；属于比较健康、具备一定胜任感的自体。"],"k":["流动性","连续性","内聚性","统整性"],"src":"§1 两种核心自体","refs":[]},{"id":"k044","sid":"17f63ae2c0","cat":"aware","q":"当一个人对连续性的、统整性的自体有自身体验时，会产生什么？","a":["他就会产生对自身存在的意识。"],"k":["对自身存在的意识"],"src":"§2 自我意识","refs":[]},{"id":"k045","sid":"aca207fc70","cat":"aware","q":"原书用什么课堂例子说明「对自身存在的察觉」？","a":["专注听课时可能意识不到自己的存在；但如果回顾一下课堂的状况，会突然意识到自己一直以坐着或站着的姿势在听课，自己的形象被呈现出来。","这种对自身存在的察觉，就是自我意识的呈现。"],"k":["专注听课","回顾课堂","形象被呈现"],"src":"§2 自我意识","refs":[]},{"id":"k046","sid":"76ac76b801","cat":"aware","q":"自我意识大约出现在孩子出生后什么时候？","a":["大约出现在孩子出生后的第 18 个月。"],"k":["第 18 个月"],"src":"§2 自我意识","refs":[]},{"id":"k047","sid":"53d670fcf1","cat":"aware","q":"原书为什么说「一个人如果没有自我意识，实际上和一只蟑螂没什么区别」？","a":["对一只蟑螂来说，人去拍它的时候，它不会恐惧死亡；它要么做出天生的、本能的反应「嗖」一下离开，要么当场被拍死，在这个过程中不会产生自我意识。"],"k":["不恐惧死亡","本能反应","不产生自我意识"],"src":"§2 自我意识","refs":[]},{"id":"k048","sid":"02d8282a49","cat":"aware","q":"自我意识对人类的意义是什么？","a":["让我们认识到自己是一个独立于环境的独特存在；我们和周围的环境是不同的，我们独立于周围环境而存在。"],"k":["独立于环境","独特存在"],"src":"§2 自我意识","refs":[]},{"id":"k049","sid":"13a2246f44","cat":"aware","q":"核心自体是在什么之中开始浮现的？","a":["在自我意识（认识到自己独立于环境而存在）这一意识中开始浮现。"],"k":["自我意识中浮现"],"src":"§2 自我意识","refs":[]},{"id":"k050","sid":"5a5f8f8f4b","cat":"aware","q":"为什么说「人类的进化是有代价的」？","a":["自体在意识中浮现后，也给人们带来了很大的问题：当一个人开始意识到自我的时候，就有一种对自身存在的主体体验和存在感，而存在感必定会带来另一种效果——人会开始思考关于死亡的问题。"],"k":["自体浮现","存在感","思考死亡"],"src":"§2 人的困扰","refs":[]},{"id":"k051","sid":"0d6c918b95","cat":"aware","q":"存在感为什么必定带来对死亡问题的思考？","a":["因为存在一定是和消亡联系在一起的。"],"k":["存在与消亡相联系"],"src":"§2 人的困扰","refs":[]},{"id":"k052","sid":"af591f2938","cat":"aware","q":"儿童发展心理学中关于生死的意识有什么常见现象？","a":["孩子在 18 个月左右开始出现自我意识；到两岁左右语言功能开始形成，他们会不停追问「爸爸妈妈，我会死吗？」或「死是怎样的」等问题；孩子在 2 岁时会增强关于生死的意识。"],"k":["18 个月","2 岁左右","追问生死"],"src":"§2 人的困扰","refs":[]},{"id":"k053","sid":"0817541405","cat":"aware","q":"孩子关于生死的追问后来会怎样？","a":["随着孩子自我意识的整合、叙事自体的丰富化，以及对生死有了更为成熟的认知和理解，这一意识会慢慢消退，但会整合为生命存在意义的一部分。"],"k":["慢慢消退","整合为生命意义"],"src":"§2 人的困扰","refs":[]},{"id":"k054","sid":"e6181bb143","cat":"aware","q":"自我意识产生之后，人对自身存在的感知会怎样？随之出现什么状态？","a":["人对自身存在的感知会更为强烈，个体随之出现科胡特所说的夸大自体的状态。"],"k":["感知更强烈","夸大自体状态"],"src":"§2 人的困扰","refs":[]},{"id":"k055","sid":"973a76ecdf","cat":"aware","q":"本章把自我意识的出现看作哪两件事的起点？","a":["核心自体在这一意识中开始浮现；同时，自我意识带来的存在感引出对死亡与消亡的思考（人的困扰）。"],"k":["核心自体浮现","死亡意识"],"src":"§2 人的困扰","refs":[]},{"id":"k056","sid":"34db08bae9","cat":"tri","q":"科胡特在哪一年、哪本著作中提出二极自体？二极指哪两个面向？","a":["1971 年在《自体的分析》中提出二极自体。","即自体的两个面向：夸大自体（也称自恋自体）和理想化父母双亲影像。"],"k":["1971","《自体的分析》","夸大自体","理想化父母双亲影像"],"src":"§2 二极自体","refs":[]},{"id":"k057","sid":"7dc5add57f","cat":"tri","q":"二极自体的两个面向分别对应什么移情？","a":["夸大自体对应镜映移情，理想化父母双亲影像对应理想化移情。"],"k":["镜映移情","理想化移情"],"src":"§2 二极自体","refs":[]},{"id":"k058","sid":"3da5d12588","cat":"tri","q":"哪一年、在哪本著作中，科胡特把二极自体发展成三极自体？第三极是什么？","a":["在 1977 年出版《自体的重建》时发展成三极自体。","在二极自体的基础上分化出第三极——密友自体（也称孪生自体或另我自体）。"],"k":["1977","《自体的重建》","密友自体"],"src":"§2 三极自体","refs":[]},{"id":"k059","sid":"1a8280a303","cat":"tri","q":"第三极自体对应什么移情？","a":["密友移情。"],"k":["密友移情"],"src":"§2 三极自体","refs":[]},{"id":"k060","sid":"34f9847f4a","cat":"tri","q":"三种自体分别发展出哪三种需要？","a":["镜映自体客体需要、理想化自体客体需要和密友自体客体需要。"],"k":["镜映","理想化","密友自体客体需要"],"src":"§2 三极自体","refs":[]},{"id":"k061","sid":"cdf3b60238","cat":"tri","q":"请把三极自体与三种自体客体需要一一对应起来。","a":["夸大自体 → 镜映自体客体需要；理想化父母双亲影像 → 理想化自体客体需要；密友自体 → 密友自体客体需要。"],"k":["夸大—镜映","理想化—理想化","密友—密友"],"src":"§2 三极自体","refs":[]},{"id":"k062","sid":"e9001b7dfe","cat":"tri","q":"请把三极自体与三种移情一一对应起来。","a":["夸大自体 → 镜映移情；理想化父母双亲影像 → 理想化移情；密友自体 → 密友移情。"],"k":["镜映移情","理想化移情","密友移情"],"src":"§2 三极自体","refs":[]},{"id":"k063","sid":"71bb27588b","cat":"tri","q":"依图 2，夸大自体的镜映需要经由「恰到好处的挫折」形成什么的基础？","a":["抱负与雄心的基础。"],"k":["抱负与雄心"],"src":"§2 图 2","refs":[]},{"id":"k064","sid":"237eedfd09","cat":"tri","q":"依图 2，理想化父母双亲影像的理想化需要经由「恰到好处的挫折」形成什么的基础？","a":["理想的基础。"],"k":["理想"],"src":"§2 图 2","refs":[]},{"id":"k065","sid":"9f4144bca8","cat":"tri","q":"依图 2，密友自体的密友需要经由「恰到好处的挫折」形成什么的基础？","a":["才智与技能的基础。"],"k":["才智与技能"],"src":"§2 图 2","refs":[]},{"id":"k066","sid":"dd6601882b","cat":"tri","q":"依图 2，自体发展的箭头关系是怎样的？","a":["自体早期形态（身体自体）→ 核心自体 → 夸大自体／理想化父母双亲影像 → 密友自体；三极自体各自向上指向对应的「经由恰到好处的挫折……」结果框。"],"k":["身体自体","核心自体","三极","结果框"],"src":"§2 图 2","refs":[]},{"id":"k067","sid":"abdb64ae7c","cat":"tri","q":"依图 2，核心自体被标注为什么？","a":["具有一定内聚性和连续性。"],"k":["内聚性","连续性"],"src":"§2 图 2","refs":[]},{"id":"k068","sid":"c1115aebed","cat":"tri","q":"夸大自体的镜映自体客体需要，后来会怎样变化？","a":["会经由恰到好处的挫折逐渐减弱并整合。"],"k":["恰到好处的挫折","减弱并整合"],"src":"§2 第三极的出现","refs":[]},{"id":"k069","sid":"6d17053388","cat":"tri","q":"第三极自体面向是在什么之后出现的？它的现实感如何？","a":["在理想化父母双亲影像以及由此产生的理想化自体客体需要逐步减弱后出现。","这一自体面向的现实感要优于前两种。"],"k":["理想化需要减弱后","现实感优于前两种"],"src":"§2 第三极的出现","refs":[]},{"id":"k070","sid":"37d18ad899","cat":"tri","q":"三极自体的三种需要有一个共同的转化途径，是什么？","a":["都经由「恰到好处的挫折」而减弱、整合，并分别形成抱负与雄心、理想、才智与技能的基础。"],"k":["恰到好处的挫折","三个基础"],"src":"§2 图 2","refs":[]},{"id":"k071","sid":"39c7ed4600","cat":"tri","q":"密友自体有哪几个名称？","a":["密友自体，也称孪生自体或另我自体。"],"k":["密友自体","孪生自体","另我自体"],"src":"§2 三极自体","refs":[]},{"id":"k072","sid":"dbddc897c3","cat":"grand","q":"什么是夸大自体？它在科胡特早期理论中被称为什么？","a":["在核心自体中，一个人有了自我意识，会慢慢感觉到自己的独立性，感觉到骄傲的自己和自己的夸大部分。","在科胡特的早期理论中，夸大自体称为自恋自体。"],"k":["独立性","骄傲的自己","夸大部分","自恋自体"],"src":"§2 夸大自体","refs":[]},{"id":"k073","sid":"b943f48b96","cat":"grand","q":"在夸大自体中，孩子需要的是什么？","a":["别人注意和肯定他的这种夸大；这是很重要的体验。"],"k":["注意与肯定","被肯定"],"src":"§2 夸大自体","refs":[]},{"id":"k074","sid":"b584b2624f","cat":"grand","q":"夸大自体有什么样的需要？","a":["是镜映的需要，它需要被肯定、被关注。"],"k":["镜映的需要","被肯定被关注"],"src":"§2 夸大自体","refs":[]},{"id":"k075","sid":"0fc487fca2","cat":"grand","q":"孩子独自玩耍时为什么要每隔一会儿叫妈妈或爸爸？父母不回应时会怎样？","a":["因为他需要父母的关注。","如果父母不回应他，他就会紧张或者不开心；但只要父母回应他一下，他就会安心地继续玩。"],"k":["需要关注","紧张不开心","回应即安心"],"src":"案例：反复叫妈妈","refs":["案01"],"ctx":"【案例一 · 独自玩耍时反复叫妈妈】就本例情节提问"},{"id":"k076","sid":"c2b45336a2","cat":"grand","q":"在「反复叫妈妈」的例子中，父母的回应意味着什么？","a":["父母的回应就是他需要得到的关注。"],"k":["回应＝关注"],"src":"案例：反复叫妈妈","refs":["案01"],"ctx":"【案例一 · 独自玩耍时反复叫妈妈】就本例情节提问"},{"id":"k077","sid":"898af16341","cat":"grand","q":"「反复叫妈妈」这一行为属于哪个自体面向？它引出哪一条一般规律？","a":["属于夸大自体的表现；孩子在夸大自体中需要别人注意和肯定他的这种夸大，即镜映的需要（被肯定、被关注）。"],"k":["夸大自体","镜映需要"],"src":"案例：反复叫妈妈","refs":["案01"],"ctx":"【案例一 · 独自玩耍时反复叫妈妈】由本例引出的一般规律／论断"},{"id":"k078","sid":"6fce68d77a","cat":"grand","q":"孩子捏碎小番茄后为什么感到很开心？大人为什么往往要阻止？","a":["此时孩子并没有浪费或节约的概念，他只是在体验夸大的游戏；大人往往会阻止孩子，说这是在浪费食物。"],"k":["没有浪费概念","夸大的游戏"],"src":"案例：夸大的游戏","refs":["案02"],"ctx":"【案例二 · 捏小番茄、抽纸与阅兵式走路】就本例情节提问"},{"id":"k079","sid":"27dd8dec6a","cat":"grand","q":"捏碎小番茄这种体验给孩子带来什么？为什么？","a":["带来胜任感；因为当孩子用手把小番茄捏碎的时候，他感受到的是一种掌控感。"],"k":["胜任感","掌控感"],"src":"案例：夸大的游戏","refs":["案02"],"ctx":"【案例二 · 捏小番茄、抽纸与阅兵式走路】就本例情节提问"},{"id":"k080","sid":"9b3fc6bea0","cat":"grand","q":"大人怎样看待孩子抽纸、撕纸、搬重物、阅兵式抬腿这些行为？孩子自己体验到的又是什么？","a":["大人会觉得孩子是在胡闹（或说他浪费、调皮）。","在孩子的世界里，他充分体验了一种骄傲的、胜任的、夸大的感觉。"],"k":["大人视为胡闹","孩子体验骄傲胜任夸大"],"src":"案例：夸大的游戏","refs":["案02"],"ctx":"【案例二 · 捏小番茄、抽纸与阅兵式走路】就本例情节提问"},{"id":"k081","sid":"b106c3b20c","cat":"grand","q":"科胡特把孩子捏小番茄、撕抽纸这类自体感的表现称为什么？","a":["夸大自体。"],"k":["夸大自体"],"src":"案例：夸大的游戏","refs":["案02"],"ctx":"【案例二 · 捏小番茄、抽纸与阅兵式走路】由本例引出的一般规律／论断"},{"id":"k082","sid":"e9a1b52143","cat":"grand","q":"当孩子捏小番茄或撕抽纸时，应该怎样制止？为什么？","a":["固然要制止，但应避免用否定的方式制止。","比如孩子要撕纸，可以为他提供一种替代物给他撕，而不是直接否定他，或指责他浪费。","因为这些行为是夸大自体的表现，孩子需要的是被注意和肯定，而非被否定。"],"k":["避免否定方式","提供替代物","不指责浪费"],"src":"案例：夸大的游戏","refs":["案02"],"ctx":"【案例二 · 捏小番茄、抽纸与阅兵式走路】由本例引出的一般规律／论断"},{"id":"k083","sid":"dcb74aef78","cat":"grand","q":"孩子反复叫姑姑，最后说出的理由是什么？","a":["「我没有什么事情，我只是想知道你在那里，你回应我，我就安心了。」"],"k":["没有事情","只想知道你在那里"],"src":"案例：反复叫姑姑","refs":["案03"],"ctx":"【案例三 · 反复叫姑姑：「我只是想知道你在那里」】就本例情节提问"},{"id":"k084","sid":"5581c57f24","cat":"grand","q":"在「反复叫姑姑」的过程中，孩子的行为是在寻求什么？被关注时他获得哪些体验？","a":["是在寻求某种关注。","当他觉得被关注的时候，会感受到自身的自体感，也会产生某种稳定性和被关注的良好感觉，进而获得安全感——这对孩子的心理发展十分重要。"],"k":["寻求关注","自体感","稳定性","安全感"],"src":"案例：反复叫姑姑","refs":["案03"],"ctx":"【案例三 · 反复叫姑姑：「我只是想知道你在那里」】就本例情节提问"},{"id":"k085","sid":"0d6ef385c3","cat":"grand","q":"「反复叫姑姑」被原书用来说明什么？","a":["这就是科胡特所说的夸大自体的表现；它说明夸大自体需要的是镜映——被肯定、被关注。"],"k":["夸大自体的表现","镜映需要"],"src":"案例：反复叫姑姑","refs":["案03"],"ctx":"【案例三 · 反复叫姑姑：「我只是想知道你在那里」】由本例引出的一般规律／论断"},{"id":"k086","sid":"f0a6f76beb","cat":"grand","q":"孩子在夸大自体阶段，除了反复叫人，还会用哪些方式寻求关注和肯定？","a":["反复寻求父母的关注和肯定，或希望父母能参与，父母参与进来他会很高兴、觉得自己被肯定；有时也会测试父母、给父母出一些题目。"],"k":["希望父母参与","测试父母","出题"],"src":"§2 夸大自体","refs":[]},{"id":"k087","sid":"a48d5ce223","cat":"ideal","q":"什么是「理想化父母双亲影像」？它何时、以什么为基础发展出来？","a":["在夸大自体出现的同时，也就是核心自体发展之后，存在一个以核心自体为基础、同步发展出来的自体面向。","它意味着孩子希望和一个强有力的人在一起，通过这个过程获取力量，从而维持自身的稳定性。"],"k":["以核心自体为基础","同步发展","与强有力的人在一起","维持稳定"],"src":"§2 理想化父母双亲影像","refs":[]},{"id":"k088","sid":"ef492520d2","cat":"ideal","q":"科胡特认为，孩子在早期发展阶段把什么投射到外在客体上？","a":["把自身的某些自恋部分投射于一些外在的、强有力的客体，以实现自身的某些体验；例如孩子会觉得自己的父母很厉害，是无所不能的。"],"k":["自恋部分","投射","强有力的客体","无所不能"],"src":"§2 理想化父母双亲影像","refs":[]},{"id":"k089","sid":"12d2b51b11","cat":"ideal","q":"成年人如何看待「父母无所不能」？幼小的孩子又有何不同？","a":["成年人都明白父母并非无所不能，面对这个世界会遇到很多困难，也有束手无策的时候；但对于幼小的孩子来说，这些是不可想象的。"],"k":["成年人明白","幼儿不可想象"],"src":"§2 理想化父母双亲影像","refs":[]},{"id":"k090","sid":"3be84005e8","cat":"ideal","q":"在孩子的主观幻想中，父母是怎样的存在？","a":["父母能做世界上所有的事情，想要什么就有什么，还能保护自己，是非常强大的存在。"],"k":["无所不能","想要什么就有什么","保护自己"],"src":"§2 理想化父母双亲影像","refs":[]},{"id":"k091","sid":"99218158a0","cat":"ideal","q":"孩子搬不动「重物」时发生了什么？他随后把什么投注在妈妈身上？","a":["妈妈走过去，只用一只手就轻松地将「重物」拎了起来。","孩子瞬间就会将理想化的影像投注在妈妈身上，认为她有无穷的力量。"],"k":["一只手拎起","投注理想化影像","无穷力量"],"src":"案例：妈妈拎起重物","refs":["案04"],"ctx":"【案例四 · 妈妈一只手拎起「重物」】就本例情节提问"},{"id":"k092","sid":"3114cfdecc","cat":"ideal","q":"「妈妈拎起重物」帮助孩子体验到怎样的自体客体感受？","a":["体验到理想化父母双亲影像的自体客体的感受——「就是因为我和有力量的人在一起，所以我也是有力量的」。"],"k":["我和有力量的人在一起","我也是有力量的"],"src":"案例：妈妈拎起重物","refs":["案04"],"ctx":"【案例四 · 妈妈一只手拎起「重物」】就本例情节提问"},{"id":"k093","sid":"8c016bfb05","cat":"ideal","q":"同样的理想化幻想，出现在成人身上与四五岁学龄前儿童身上，性质有何不同？","a":["如果出现在成人身上（例如「我爸是李刚」），就是一种病理性现象；过度追星等奇特行为实质上是对理想化的追寻，一旦过度便具有病理特点。","而如果出现在四五岁的学龄前儿童身上，就是一种健康、正常的现象。"],"k":["成人为病理性","幼儿为健康正常","过度追星"],"src":"案例：妈妈拎起重物","refs":["案04"],"ctx":"【案例四 · 妈妈一只手拎起「重物」】由本例引出的一般规律／论断"},{"id":"k094","sid":"71b1ea2b77","cat":"ideal","q":"为什么学龄前儿童的理想化父母双亲影像是健康的？它带来什么？","a":["这代表这名儿童的理想化父母双亲影像有助于维护他的自体，他通过这种体验能够获得存在感、意义感和安全感。"],"k":["维护自体","存在感意义感安全感"],"src":"案例：妈妈拎起重物","refs":["案04"],"ctx":"【案例四 · 妈妈一只手拎起「重物」】由本例引出的一般规律／论断"},{"id":"k095","sid":"4d0ebd4018","cat":"ideal","q":"理想化父母双亲影像在自恋的发展中处于什么位置？","a":["它也是自恋的一条发展主线；自恋实际上就是充斥在自体当中的，所以自体也有自恋这一本能能量。"],"k":["自恋的发展主线","本能能量"],"src":"§2 自恋的发展主线","refs":[]},{"id":"k096","sid":"7e085d1b56","cat":"ideal","q":"科胡特晚期用哪个术语统称夸大、理想化这类自恋需要？","a":["自体客体需要。"],"k":["自体客体需要"],"src":"§2 理想化需要","refs":[]},{"id":"k097","sid":"7cdc07bb94","cat":"ideal","q":"在理想化父母双亲影像的体验中，孩子体验到的内聚感、统整感实则是什么？","a":["实则是从他人身上体会到的自己。"],"k":["从他人身上体会到的自己"],"src":"§2 理想化需要","refs":[]},{"id":"k098","sid":"6b769b9ddd","cat":"ideal","q":"理想化自体客体需要后来会怎样变化？之后出现什么？","a":["在理想化父母双亲影像以及由此产生的理想化自体客体需要逐步减弱后，个体还会出现另一个新的发展面向，即第三极自体面向——密友自体。"],"k":["逐步减弱","第三极","密友自体"],"src":"§2 第三极的出现","refs":[]},{"id":"k099","sid":"8dc26112b5","cat":"twin","q":"密友自体发展出的需要叫什么？通常体现在哪些关系中？","a":["密友自体客体需要。","通常体现在个体发展过程中的一些伙伴关系，或与次要养育者的关系中。"],"k":["密友自体客体需要","伙伴关系","次要养育者"],"src":"§2 密友自体","refs":[]},{"id":"k100","sid":"f689c34aac","cat":"twin","q":"密友自体这一面向的现实感与前两种相比如何？","a":["这一自体面向的现实感要优于前两种。"],"k":["现实感优于前两种"],"src":"§2 第三极的出现","refs":[]},{"id":"k101","sid":"c0623d12b2","cat":"twin","q":"圣诞节做糕点时孩子在做什么？他获得了什么情感体验？","a":["长辈们制作节庆糕点时，孩子也会拿一块面团在旁边揉捏；在这个过程中，孩子会获得一种很重要的情感体验，感觉到自己也在参与创造。"],"k":["拿面团揉捏","参与创造"],"src":"案例：节庆糕点","refs":["案05"],"ctx":"【案例五 · 圣诞节的面团与包饺子】就本例情节提问"},{"id":"k102","sid":"13787da3e3","cat":"twin","q":"我国北方与南方家庭中，与节庆糕点类似的活动分别是什么？孩子与谁一同进行？","a":["北方家庭可能让孩子参与包饺子、做馒头，在南方可能变成包馄饨等。","孩子总是十分乐于与爷爷、奶奶、外公、外婆等一同进行这类活动。"],"k":["包饺子做馒头","包馄饨","祖辈"],"src":"案例：节庆糕点","refs":["案05"],"ctx":"【案例五 · 圣诞节的面团与包饺子】就本例情节提问"},{"id":"k103","sid":"493ab7f1c2","cat":"twin","q":"孩子并没有做太多，为什么对包饺子、包馄饨这类活动很热衷、很投入？","a":["因为在做这些事情的时候，孩子能充分感觉到某种信任，会觉得自己正在与他人一起完成某项任务，并因此感到十分开心。"],"k":["感觉到信任","一起完成任务","开心"],"src":"案例：节庆糕点","refs":["案05"],"ctx":"【案例五 · 圣诞节的面团与包饺子】就本例情节提问"},{"id":"k104","sid":"3c1c002612","cat":"twin","q":"节庆糕点、包饺子这类感受被称为什么？科胡特把它看作什么的基础？","a":["称为密友自体客体需要，即与密友自体相关的、孪生的自体客体需要。","科胡特把密友自体客体需要看作才智与技能发展的基础，即一个人在未来成长中的创造力、才智与技能发展的重要心理基础。"],"k":["密友自体客体需要","孪生的","才智与技能的基础"],"src":"案例：节庆糕点","refs":["案05"],"ctx":"【案例五 · 圣诞节的面团与包饺子】由本例引出的一般规律／论断"},{"id":"k105","sid":"4ec9cb6d09","cat":"twin","q":"孩子期盼吃到包有钱币或糖的特殊馅料，恰好吃到时为什么格外开心？","a":["因为这同样让他感受到了自己的参与。"],"k":["特殊馅料","感受到参与"],"src":"案例：节庆糕点","refs":["案05"],"ctx":"【案例五 · 圣诞节的面团与包饺子】就本例情节提问"},{"id":"k106","sid":"f4ed05f6ff","cat":"twin","q":"孩子与小伙伴的人际关系为什么「并不深刻」？","a":["孩子们多是因分享玩具或零食而成为朋友。","例如有的孩子从幼儿园放学后会说他和某个小朋友「结婚」了，这很可能只是代表他和这个小朋友有共同喜爱的玩具。"],"k":["分享玩具或零食","「结婚」","共同喜爱的玩具"],"src":"案例：幼儿园「结婚」","refs":["案06"],"ctx":"【案例六 · 幼儿园里的「结婚」】就本例情节提问"},{"id":"k107","sid":"08788e6279","cat":"twin","q":"与伙伴共处的密友自体客体需要有什么作用？它是通过什么来满足的？","a":["可以帮助个体稳定其在发展过程中的自体感。","密友自体客体需要是通过伙伴关系和共同活动的过程来满足的。"],"k":["稳定自体感","伙伴关系","共同活动"],"src":"案例：幼儿园「结婚」","refs":["案06"],"ctx":"【案例六 · 幼儿园里的「结婚」】由本例引出的一般规律／论断"},{"id":"k108","sid":"a462c3f050","cat":"twin","q":"孩子的小伙伴关系从几岁开始？随年龄怎样变化？","a":["孩子从两三岁起就开始拥有小伙伴，随着年龄增长，伙伴的数量也会逐渐增多；孩子与小伙伴的相处构成了其部分人际关系。"],"k":["两三岁起","数量渐增","部分人际关系"],"src":"案例：幼儿园「结婚」","refs":["案06"],"ctx":"【案例六 · 幼儿园里的「结婚」】就本例情节提问"},{"id":"k109","sid":"eba92277a1","cat":"twin","q":"三极自体分别经由「恰到好处的挫折」形成哪三种基础？其中哪一种对应密友自体？","a":["夸大自体 → 抱负与雄心的基础；理想化父母双亲影像 → 理想的基础；密友自体 → 才智与技能的基础。"],"k":["抱负与雄心","理想","才智与技能"],"src":"§2 图 2","refs":[]},{"id":"k110","sid":"cffe68cbd8","cat":"wean","q":"如果个体在自体三个面向上的需求都能得到良好回应，会发展出什么？","a":["他便能发展出较好的自体感和自体内聚性。"],"k":["较好的自体感","自体内聚性"],"src":"§2 父母撤出","refs":[]},{"id":"k111","sid":"98e502a39f","cat":"wean","q":"与需求被良好回应同时，父母还要做什么？为什么？","a":["父母要在孩子的成长中逐步撤出对孩子的关注。","一般越小的孩子，父母关注得越多，比如对待两岁以前的孩子，通常主张要无条件地满足他。"],"k":["逐步撤出","越小关注越多","两岁前无条件满足"],"src":"§2 父母撤出","refs":[]},{"id":"k112","sid":"69df10c89b","cat":"wean","q":"随着孩子长大，为什么需要逐步撤出关注？其表现是什么？","a":["其需求变得越来越复杂，同时其自主能力也逐渐增强。","父母让孩子做力所能及的事情，比如独立刷牙、上厕所，这正是逐步撤出关注的表现。"],"k":["需求复杂","自主能力增强","独立刷牙上厕所"],"src":"§2 父母撤出","refs":[]},{"id":"k113","sid":"7e423d2b55","cat":"wean","q":"父母撤出关注要遵循什么原则？","a":["撤出要适度，应采用「恰到好处的挫折」的方式逐步完成，而非突然全部撤出。"],"k":["适度","恰到好处的挫折","逐步"],"src":"§2 父母撤出","refs":[]},{"id":"k114","sid":"c289ba62b8","cat":"wean","q":"父母撤出时应怎样做？这给孩子留下什么？","a":["让孩子自己去尝试，耐心地教他怎么做，并静待他慢慢掌握，再慢慢撤出。","这样，孩子便有心理空间去调用以往获得关注以及自体客体需要被满足时的经验来调整自己。"],"k":["自己尝试","耐心教","静待掌握","心理空间"],"src":"§2 父母撤出","refs":[]},{"id":"k115","sid":"53a4775343","cat":"wean","q":"孩子一开始有些紧张，为什么仍能完成力所能及的任务？","a":["他可以凭借已有的稳定性来调整自己的情绪，让自己逐步形成更好的、更稳定的、更具有内聚性的心理过程，去完成一些力所能及的任务。"],"k":["已有的稳定性","调整情绪","更具内聚性"],"src":"§2 父母撤出","refs":[]},{"id":"k116","sid":"b44eebfce8","cat":"wean","q":"与外国人对话时，偶尔有一句听不懂，人会怎样做？","a":["会调用之前大部分听得懂的经验，让自己保持稳定，换种方式继续和对方沟通；比如一个词语对方没听懂，就尝试用另一个词语解释一下。"],"k":["调用听得懂的经验","保持稳定","换词语"],"src":"案例：英语对话","refs":["案07"],"ctx":"【案例七 · 与外国人用英语对话】就本例情节提问"},{"id":"k117","sid":"333e045ac9","cat":"wean","q":"英语对话中「换个词语解释」这种方法来自哪里？","a":["来自你的内部，是通过以往成功经验的拓展而得到的经验。"],"k":["来自内部","以往成功经验的拓展"],"src":"案例：英语对话","refs":["案07"],"ctx":"【案例七 · 与外国人用英语对话】由本例引出的一般规律／论断"},{"id":"k118","sid":"046ba6c288","cat":"wean","q":"调用之前的成功经验再次成功沟通，会带来什么？","a":["你在英语对话方面的自体感会变得更稳定，进而能够更加自如地用英语对话。"],"k":["自体感更稳定","更自如"],"src":"案例：英语对话","refs":["案07"],"ctx":"【案例七 · 与外国人用英语对话】由本例引出的一般规律／论断"},{"id":"k119","sid":"ac63a94d33","cat":"wean","q":"英语对话的例子类比了婴儿的哪一过程？","a":["婴儿在自体客体回应逐步撤出的过程中经历的情况也与之类似。"],"k":["自体客体回应逐步撤出"],"src":"案例：英语对话","refs":["案07"],"ctx":"【案例七 · 与外国人用英语对话】由本例引出的一般规律／论断"},{"id":"k120","sid":"90e72af3cc","cat":"wean","q":"父母表示身体不舒服要休息几天，对孩子来说是什么性质的刺激？他由此发现了什么？","a":["是一个刺激，但并不是创伤性刺激。","孩子会由此发现强大的父母也有虚弱的时候。"],"k":["非创伤性刺激","父母也有虚弱时"],"src":"案例：父母生病","refs":["案08"],"ctx":"【案例八 · 父母生病要休息几天】就本例情节提问"},{"id":"k121","sid":"b89296ec8a","cat":"wean","q":"父母虚弱时，孩子会怎样调整自己？结果如何？","a":["他会在父母虚弱的时候调用此前积聚的内在力量，逐步调整对父母的关注；于是即使在父母生病的时候，孩子感觉到的自己也是稳定的。"],"k":["调用内在力量","调整关注","自己仍稳定"],"src":"案例：父母生病","refs":["案08"],"ctx":"【案例八 · 父母生病要休息几天】就本例情节提问"},{"id":"k122","sid":"5ff1f1a707","cat":"wean","q":"父母生病时孩子感觉到的自己仍然稳定，这是由什么产生的？带来什么变化？","a":["这是由恰到好处的挫折所产生的；孩子会变得更有社会适应力，也变得更独立。"],"k":["恰到好处的挫折","社会适应力","更独立"],"src":"案例：父母生病","refs":["案08"],"ctx":"【案例八 · 父母生病要休息几天】由本例引出的一般规律／论断"},{"id":"k123","sid":"4689874ac6","cat":"wean","q":"科胡特认为，经由恰到好处的挫折实现的蜕变性内化是一项怎样的任务？","a":["是一项终身任务；人生的每个阶段都有其相应的任务，甚至在临终前，一个人仍会有自体客体需要。"],"k":["终身任务","每个阶段","临终前仍有需要"],"src":"§2 蜕变性内化","refs":[]},{"id":"k124","sid":"39ba4061b1","cat":"wean","q":"为什么说人在临终前仍会有自体客体需要？","a":["例如一个人在去世前会回顾他的一生是否有意义，如果他认为生活是有意义的，他的自体感就会比较稳定。"],"k":["回顾一生是否有意义","自体感比较稳定"],"src":"§2 蜕变性内化","refs":[]},{"id":"k125","sid":"e103291261","cat":"wean","q":"科胡特提出，人类的一种基本情感需求是什么？","a":["对于自体客体的共鸣性需要，是人类的一种基本情感需求。"],"k":["共鸣性需要","基本情感需求"],"src":"§2 共鸣性需要","refs":[]},{"id":"k126","sid":"f01753c155","cat":"wean","q":"一个人的自体感越内聚、越统整，会带来什么结果？","a":["自体客体的功能就越好，这个人人际交往的能力就越强、自由度也越大。"],"k":["自体客体功能好","人际能力强","自由度大"],"src":"§2 共鸣性需要","refs":[]},{"id":"k127","sid":"8508275fa3","cat":"wean","q":"边缘型人格障碍者在感情关系出现问题时，有哪些表现？","a":["一旦情感关系出现问题，他就会像失去了主心骨一样；只要能挽回关系，对方让他做什么都可以。"],"k":["失去主心骨","对方让做什么都可以"],"src":"案例：感情失败对比","refs":["案09"],"ctx":"【案例九 · 感情失败时的两种人】就本例情节提问"},{"id":"k128","sid":"4e6e2b9057","cat":"wean","q":"「只要能挽回关系，对方让他做什么都可以」说明什么？","a":["这就是自体感虚弱的表现。"],"k":["自体感虚弱"],"src":"案例：感情失败对比","refs":["案09"],"ctx":"【案例九 · 感情失败时的两种人】由本例引出的一般规律／论断"},{"id":"k129","sid":"ac50eb9721","cat":"wean","q":"一个自体感良好的人，在投入很多的感情最终失败后会怎样？","a":["仍能保持足够的稳定感；可能会经历一时的、短暂的痛苦，但能够比较快地化解痛苦，并以一种比较健康的方式重新寻求一段更适合自己的情感关系。"],"k":["保持稳定感","短暂痛苦","较快化解","健康地重新开始"],"src":"案例：感情失败对比","refs":["案09"],"ctx":"【案例九 · 感情失败时的两种人】就本例情节提问"},{"id":"k130","sid":"0f4a316490","cat":"reso","q":"自体客体的共鸣性对谁而言非常重要？","a":["对自体而言是非常重要的部分；同样地，这种共鸣性对婴儿也很重要。"],"k":["自体","婴儿"],"src":"§3 共鸣","refs":[]},{"id":"k131","sid":"74d8076268","cat":"reso","q":"多项依恋实验表明，8 个月以前的婴儿与母亲之间的情感互动有什么规律？","a":["年龄越小，与母亲之间的情感互动性越高，即母亲露出什么表情，婴儿也会做出类似的表情；如果母亲的表情总体上偏正向，婴儿的表情也会偏正向。"],"k":["8 个月以前","年龄越小互动越高","表情相应"],"src":"§3 依恋实验","refs":[]},{"id":"k132","sid":"47cc8288ba","cat":"reso","q":"根据依恋实验可以推测，婴儿获得的共鸣性越高，后续会怎样？","a":["在后续成长中的安全感通常会越强，且成年后心理问题的发生率可能也越低。"],"k":["安全感越强","心理问题发生率可能越低"],"src":"§3 依恋实验","refs":[]},{"id":"k133","sid":"65e55249c1","cat":"reso","q":"纵向研究发现，婴儿哪个阶段的发展与成年后是否出现心理问题密切相关？","a":["婴儿 0～8 个月的发展情况。"],"k":["0～8 个月","密切相关"],"src":"§3 依恋实验","refs":[]},{"id":"k134","sid":"9ca5262e47","cat":"reso","q":"共鸣性关系为什么有时未能很好地建立？","a":["这往往是因为父母自身存在困难和问题；自体心理学认为，有的问题是在养育过程中出现的。"],"k":["父母自身困难","养育过程中出现"],"src":"§3 两种典型情况","refs":[]},{"id":"k135","sid":"c4375bce3d","cat":"reso","q":"养育过程中常见的两种典型问题情况是什么？","a":["一种是孩子被忽视，此时孩子处于无回应的状态，即孩子完全感觉不到自体客体的回应；另一种是孩子被曲解或者覆盖。"],"k":["被忽视／无回应","被曲解或覆盖"],"src":"§3 两种典型情况","refs":[]},{"id":"k136","sid":"fe3c4dce79","cat":"reso","q":"「无回应的状态」具体指什么？","a":["孩子被忽视，完全感觉不到自体客体的回应。"],"k":["完全感觉不到回应"],"src":"§3 两种典型情况","refs":[]},{"id":"k137","sid":"cb80604b0e","cat":"reso","q":"「覆盖」指什么？","a":["父母以自己的理解代替孩子的理解。"],"k":["以自己的理解代替孩子的理解"],"src":"§3 覆盖","refs":[]},{"id":"k138","sid":"f754dfb0d9","cat":"reso","q":"孩子闻到淡淡臭味告诉妈妈，几周后发生了什么？孩子说了什么？","a":["过了几周，妈妈打扫阳台的时候发现了一只散发着臭味的死老鼠；孩子对妈妈说：「你看，我就说有一股臭味吧，就是这只死老鼠发出来的。」"],"k":["死老鼠","我就说有臭味"],"src":"案例：死老鼠臭味","refs":["案10"],"ctx":"【案例十 · 阳台上的死老鼠】就本例情节提问"},{"id":"k139","sid":"dc9a964292","cat":"reso","q":"妈妈怎样回应孩子的话？这一回应属于什么？","a":["妈妈回应道：「是不是你搞的怪？你吃的东西把老鼠引进来了。」","这一回应属于曲解或覆盖。"],"k":["是不是你搞的怪","曲解或覆盖"],"src":"案例：死老鼠臭味","refs":["案10"],"ctx":"【案例十 · 阳台上的死老鼠】就本例情节提问"},{"id":"k140","sid":"83ac881f51","cat":"reso","q":"孩子原本想证明什么？妈妈的话造成了什么？","a":["孩子原本是想证明自己在妈妈发现老鼠之前闻到臭味的感知是对的，但是妈妈的话曲解了孩子的体验。"],"k":["证明感知是对的","体验被曲解"],"src":"案例：死老鼠臭味","refs":["案10"],"ctx":"【案例十 · 阳台上的死老鼠】就本例情节提问"},{"id":"k141","sid":"7eea327033","cat":"reso","q":"孩子说出自己的体验本意是什么？妈妈为什么会曲解他？","a":["孩子说出自己的体验是希望被认可。","而妈妈为了防御，避免自己丢脸，便指责孩子在搞怪，曲解了孩子的体验。"],"k":["希望被认可","妈妈为防御避免丢脸"],"src":"案例：死老鼠臭味","refs":["案10"],"ctx":"【案例十 · 阳台上的死老鼠】由本例引出的一般规律／论断"},{"id":"k142","sid":"95c6142941","cat":"reso","q":"「曲解」与「覆盖」在死老鼠的例子里有什么共同点？","a":["两者都是父母以自己的理解代替孩子的理解，使孩子希望被认可的体验得不到回应。"],"k":["以父母理解代替孩子理解","体验未被认可"],"src":"§3 覆盖","refs":[]},{"id":"k143","sid":"8a35bc4ae9","cat":"repress","q":"当孩子被妈妈曲解时，他为什么只能压抑自己的感受？","a":["因为他无法辩驳。"],"k":["无法辩驳","压抑感受"],"src":"§4 分裂的形成","refs":[]},{"id":"k144","sid":"169415ae12","cat":"repress","q":"自体心理学认为，被潜抑的感觉会就此消失吗？","a":["并非就此消失，而是进入无意识中，且总有一天会重新浮现。"],"k":["进入无意识","总有一天重新浮现"],"src":"§4 分裂的形成","refs":[]},{"id":"k145","sid":"65ee4445f6","cat":"repress","q":"这些感觉一旦被压抑至无意识中，会面临什么困难？","a":["就难以被整合至意识层面。"],"k":["难以整合至意识层面"],"src":"§4 分裂的形成","refs":[]},{"id":"k146","sid":"1002f1962e","cat":"repress","q":"在什么条件下，被压抑的部分会慢慢被遗忘，从而形成潜抑？","a":["当它们再一次浮现的时候，若家庭氛围不允许其表达，即使争辩也没有用，那么被压抑的部分就会慢慢被遗忘。"],"k":["家庭氛围不允许表达","争辩无用","慢慢遗忘"],"src":"§4 分裂的形成","refs":[]},{"id":"k147","sid":"08b906dbc9","cat":"repress","q":"什么样的被潜抑情绪有可能在青春期或成年期置换为症状？","a":["如果被遗忘的部分活力很强，并且在当时引起了强烈的情绪，这些被潜抑的情绪就有可能在个体的青春期或成年期置换为症状。"],"k":["活力很强","强烈情绪","置换为症状"],"src":"§4 分裂的形成","refs":[]},{"id":"k148","sid":"5d8cd2d315","cat":"repress","q":"被潜抑的情绪为什么只能通过其他方式表现出来？","a":["由于在常规渠道被潜抑，因此它们只能通过其他方式表现出来。"],"k":["常规渠道被潜抑"],"src":"§4 分裂的形成","refs":[]},{"id":"k149","sid":"bdfaa9bc10","cat":"repress","q":"科胡特把这一整个过程称为什么？这一分裂又叫什么？","a":["称为「分裂的形成」；这一分裂称为水平分裂，即潜抑。"],"k":["分裂的形成","水平分裂即潜抑"],"src":"§4 水平分裂","refs":[]},{"id":"k150","sid":"0e2a05e93c","cat":"repress","q":"「潜抑」的定义是什么？","a":["个体的某种感受或者情绪被压抑至无意识层面并被遗忘的过程。"],"k":["压抑至无意识层面","被遗忘"],"src":"§4 水平分裂","refs":[]},{"id":"k151","sid":"93c9a2704d","cat":"repress","q":"在水平分裂的过程中，被潜抑的是什么？","a":["是自体客体需要。"],"k":["自体客体需要"],"src":"§4 水平分裂","refs":[]},{"id":"k152","sid":"facbeb8cb0","cat":"repress","q":"被潜抑的自体客体需要可能是哪三类？","a":["与夸大自体相关的镜映自体客体需要，也可能是理想化自体客体需要，或密友自体客体需要。"],"k":["镜映","理想化","密友自体客体需要"],"src":"§4 水平分裂","refs":[]},{"id":"k153","sid":"01da23e315","cat":"repress","q":"水平分裂为什么叫「水平」分裂？","a":["由于相关内容被潜抑在水平线之下，所以称水平分裂。"],"k":["潜抑在水平线之下"],"src":"§5 两种分裂","refs":[]},{"id":"k154","sid":"1d267c937d","cat":"repress","q":"每个人一生中都有被压抑、潜抑的东西，关键区别在哪里？","a":["关键在于这些压抑、潜抑的东西是经由恰到好处的挫折产生的，还是经由创伤性挫折产生的。"],"k":["恰到好处的挫折","创伤性挫折"],"src":"§5 两种挫折","refs":[]},{"id":"k155","sid":"32ab999e0a","cat":"repress","q":"由过度的挫折或创伤性挫折造成的潜抑，后果如何？","a":["置换为症状的可能性通常更高，致病的可能性也更高。"],"k":["置换为症状","致病可能性高"],"src":"§5 两种挫折","refs":[]},{"id":"k156","sid":"f8cef99e94","cat":"repress","q":"由非创伤性的挫折造成的潜抑，后果如何？","a":["致病的可能性很低，甚至几乎没有。"],"k":["致病可能性很低"],"src":"§5 两种挫折","refs":[]},{"id":"k157","sid":"381ff5a353","cat":"repress","q":"请把潜抑的形成过程按顺序说出来。","a":["孩子被曲解而无法辩驳 → 压抑感受 → 感觉进入无意识 → 再次浮现时家庭氛围不允许表达、争辩无用 → 被压抑部分慢慢被遗忘（潜抑）→ 若活力强且情绪强烈，在青春期或成年期置换为症状。"],"k":["压抑","无意识","不允许表达","遗忘","置换为症状"],"src":"§4 分裂的形成","refs":[]},{"id":"k158","sid":"eb20318012","cat":"vert","q":"除水平分裂外，科胡特还提出了哪种病理过程？","a":["垂直分裂。"],"k":["垂直分裂"],"src":"§5 垂直分裂","refs":[]},{"id":"k159","sid":"b8d8dab325","cat":"vert","q":"「垂直分裂」是如何定义的？","a":["在水平分裂旁边出现了另一个分裂过程。"],"k":["水平分裂旁边","另一个分裂过程"],"src":"§5 垂直分裂","refs":[]},{"id":"k160","sid":"79553a39ac","cat":"vert","q":"一般人在出现前后不一致的表达时会怎样？有的人又怎样？","a":["一般人会感到些许害羞，并表示歉意，承认之前说错了。","有的人会若无其事地说「我之前就是这么说的」，即便所有证据都证明其表达前后不一致。"],"k":["害羞致歉","若无其事否认"],"src":"案例：自相矛盾","refs":["案11"],"ctx":"【案例十一 · 「我之前就是这么说的」】就本例情节提问"},{"id":"k161","sid":"175b4d2732","cat":"vert","q":"明显且反复出现的自相矛盾、自我否认，称为什么？","a":["称为垂直分裂。"],"k":["垂直分裂"],"src":"案例：自相矛盾","refs":["案11"],"ctx":"【案例十一 · 「我之前就是这么说的」】由本例引出的一般规律／论断"},{"id":"k162","sid":"9d347d2a23","cat":"vert","q":"出现垂直分裂病理过程的人，童年往往同时经历了什么？","a":["往往在童年经历潜抑过程的同时还产生了巨大的羞耻感；在这种情况下，他在压抑自身感受的同时也将体验一同隔离了。"],"k":["巨大羞耻感","将体验一同隔离"],"src":"案例：自相矛盾","refs":["案11"],"ctx":"【案例十一 · 「我之前就是这么说的」】由本例引出的一般规律／论断"},{"id":"k163","sid":"40aa88ea39","cat":"vert","q":"垂直分裂的个体在表述时仿佛处于什么状态？","a":["仿佛突然进入了另一个空间，经历的是另一种体验；这与先前的体验没有直接的连贯性。"],"k":["另一个空间","另一种体验","无直接连贯性"],"src":"§5 垂直分裂","refs":[]},{"id":"k164","sid":"50fa21b97e","cat":"vert","q":"垂直分裂的个体怎样对待别人所看到的连贯性？","a":["他拒绝承认别人所看到的连贯性，而只认同自己的部分；当别人摆事实、讲道理的时候，他就会说别人是在胡说八道，并拒绝回答别人的问题。"],"k":["拒绝承认连贯性","只认同自己的部分","拒绝回答"],"src":"§5 垂直分裂","refs":[]},{"id":"k165","sid":"0a6249781e","cat":"vert","q":"A 女士成名致富后做了什么？为什么这件事不合常理？","a":["她竟然去商店里偷了一件千元以下的衣服，将店里的衣服穿在身上，旁若无人地走了出去，并且被店员发现后还拒绝承认。","以她的收入水平，她完全没有必要这样做。"],"k":["偷千元以下衣服","收入完全没必要","拒绝承认"],"src":"案例：A 女士","refs":["案12"],"ctx":"【案例十二 · A 女士偷衣服】就本例情节提问"},{"id":"k166","sid":"ea49bb98f4","cat":"vert","q":"A 女士偷衣服被原书判定为哪种病理过程？","a":["典型的垂直分裂的过程。"],"k":["典型的垂直分裂"],"src":"案例：A 女士","refs":["案12"],"ctx":"【案例十二 · A 女士偷衣服】就本例情节提问"},{"id":"k167","sid":"6bee8b87fb","cat":"vert","q":"A 女士的这一过程与早期生活经历有什么关联？","a":["在贫穷的成长环境中，她沾染了小偷小摸的坏习惯。","这类个体在早期的生活中，遭受过一些巨大的、和羞耻相关的创伤，这使其与自身感受产生了一种隔离，并借此保护自己。"],"k":["贫穷环境","小偷小摸","羞耻相关创伤","隔离并保护自己"],"src":"案例：A 女士","refs":["案12"],"ctx":"【案例十二 · A 女士偷衣服】就本例情节提问"},{"id":"k168","sid":"eae6c92cd5","cat":"vert","q":"「病理性适应」指什么？它改变了什么？","a":["来访者在与环境的冲突中发展出的、不得已的自我保护策略。","在科胡特和伯纳德之后，这一观点极大地改变了自体心理学家观察来访者动机的视角。"],"k":["不得已的自我保护策略","观察动机的视角"],"src":"案例：A 女士","refs":["案12"],"ctx":"【案例十二 · A 女士偷衣服】由本例引出的一般规律／论断"},{"id":"k169","sid":"41234304a7","cat":"vert","q":"咨询师碰到水平分裂与垂直分裂的来访者，工作难度有何不同？","a":["碰到水平分裂的来访者，工作难度通常较低。","碰到垂直分裂的来访者，对方可能会高高在上地俯视或者贬低咨询师，咨询师会感觉自己毫无价值，处理来访者的问题会比较困难。"],"k":["水平分裂难度低","垂直分裂贬低咨询师","毫无价值感"],"src":"§5 临床","refs":[]},{"id":"k170","sid":"b56d6edb7d","cat":"vert","q":"面对垂直分裂的来访者，最初一两年咨询师往往只能做什么？为什么？","a":["往往只是处理基本的关系联结，很难追求和探索更深入的内容。","因为一旦试图深入，马上就会被来访者「弹开」，而这种防御并非有意识的，而是下意识的。"],"k":["处理基本关系联结","被弹开","下意识的防御"],"src":"§5 临床","refs":[]},{"id":"k171","sid":"c0eb3147fa","cat":"vert","q":"遇到垂直分裂的来访者，应当怎样建立联结？","a":["要耐心地与他逐步建立联结；建立联结时应根据来访者的进展节奏自然地推进，这与处理水平分裂的方式差异很大。"],"k":["耐心逐步","按来访者节奏","与水平分裂不同"],"src":"§5 临床","refs":[]},{"id":"k172","sid":"5d3064f310","cat":"vert","q":"垂直分裂与水平分裂在存在关系上是怎样的？","a":["来访者若有垂直分裂的病理表现，则必定存在水平分裂；但反之，若来访者存在水平分裂，却未必代表他存在垂直分裂。"],"k":["有垂直必有水平","有水平未必有垂直"],"src":"§5 临床","refs":[]},{"id":"k173","sid":"fbe3628587","cat":"lookup","q":"速查①：哪个例子说明「孩子需要父母关注，被回应一下就能安心继续玩」？","a":["案例一「独自玩耍时反复叫妈妈」：孩子每隔一会儿叫妈妈／爸爸，不回应就紧张不开心，回应一下就安心；它说明夸大自体的镜映需要（被肯定、被关注）。"],"k":["案例一","镜映需要"],"src":"案例速查 案01","refs":["案01"],"ctx":"【案例速查 · 案01】独自玩耍时反复叫妈妈　｜　反查练习：由情节回推概念；情节详见「案例一」卡"},{"id":"k174","sid":"a9f690ec61","cat":"lookup","q":"速查②：哪个例子说明「孩子体验骄傲、胜任、夸大的感觉」，并引出「不宜用否定方式制止」？","a":["案例二「捏小番茄、抽纸与阅兵式走路」：孩子没有浪费／节约概念，只是在体验夸大的游戏，捏碎时获得掌控感与胜任感；应提供替代物而非直接否定或指责浪费。"],"k":["案例二","夸大游戏","替代物"],"src":"案例速查 案02","refs":["案02"],"ctx":"【案例速查 · 案02】捏小番茄、抽纸与阅兵式走路　｜　反查练习：由情节回推概念；情节详见「案例二」卡"},{"id":"k175","sid":"4806a3781b","cat":"lookup","q":"速查③：哪个例子说明「被关注时获得自体感、稳定性与安全感」？","a":["案例三「反复叫姑姑」：孩子说「我没有什么事情，我只是想知道你在那里，你回应我，我就安心了」；这是夸大自体的表现，被关注带来安全感。"],"k":["案例三","自体感","安全感"],"src":"案例速查 案03","refs":["案03"],"ctx":"【案例速查 · 案03】反复叫姑姑：「我只是想知道你在那里」　｜　反查练习：由情节回推概念；情节详见「案例三」卡"},{"id":"k176","sid":"ed60b9309c","cat":"lookup","q":"速查④：哪个例子说明「把理想化影像投注在强有力的客体上」？","a":["案例四「妈妈一只手拎起重物」：孩子搬不动，妈妈一只手拎起，孩子瞬间认为她有无穷力量，体验到「就是因为我和有力量的人在一起，所以我也是有力量的」。"],"k":["案例四","理想化投注"],"src":"案例速查 案0 ＿＿是一项终身任务。」","a":["蜕变性内化。"],"k":["蜕变性内化"],"src":"§2 蜕变性内化","refs":[]},{"id":"k212","sid":"2d62a3f07f","cat":"cloze","q":"填空：「科胡特提出，对于自体客体的＿＿是人类的一种基本情感需求。」","a":["共鸣性需要。"],"k":["共鸣性需要"],"src":"§2 共鸣性需要","refs":[]},{"id":"k213","sid":"b13c331ef8","cat":"cloze","q":"填空：「覆盖是指父母以＿＿代替孩子的理解。」","a":["自己的理解。"],"k":["自己的理解"],"src":"§3 覆盖","refs":[]},{"id":"k214","sid":"2d53ea1cbc","cat":"cloze","q":"填空：「所谓潜抑，就是个体的某种感受或者情绪被压抑至＿＿层面并被遗忘的过程。」","a":["无意识。"],"k":["无意识"],"src":"§4 水平分裂","refs":[]},{"id":"k215","sid":"b63cc0369b","cat":"cloze","q":"填空：「在这一过程中，被潜抑的是什么呢？是＿＿。」","a":["自体客体需要。"],"k":["自体客体需要"],"src":"§4 水平分裂","refs":[]},{"id":"k216","sid":"2f2e6d61e4","cat":"cloze","q":"填空：「来访者若有垂直分裂的病理表现，则必定存在＿＿。」","a":["水平分裂。"],"k":["水平分裂"],"src":"§5 临床","refs":[]},{"id":"案01","sid":"95e433d15a","cat":"grand","q":"案例一 · 独自玩耍时反复叫妈妈｜先读情节","a":["有的孩子需要父母的关注，当他独自玩耍时，他每隔一会儿就会叫妈妈或者叫爸爸。","如果父母不回应他，他就会紧张或者不开心；但只要父母回应他一下，他就会安心地继续玩。","父母的回应就是他需要得到的关注。"],"k":["独自玩耍","每隔一会儿叫妈妈","回应一下就安心"],"src":"案例：反复叫妈妈","refs":["案01"],"intro":1,"case":"一","follow":"后面几张卡问：这一行为属于哪个自体面向、孩子要的到底是什么，以及被回应带来什么。"},{"id":"案02","sid":"c30b10a870","cat":"grand","q":"案例二 · 捏小番茄、抽纸与阅兵式走路｜先读情节","a":["孩子在 2～4 岁阶段，有时候会用手捏碎小番茄，然后扔掉它们，并对此感到很开心；大人往往阻止他，说这是在浪费食物。","当大人短暂离开时，孩子可能将整盒抽纸全部抽出来，扔得满地都是，甚至把它们全部撕成一条一条的。","有时候孩子会搬一些很重的东西，或者像参加阅兵的战士一样把腿抬得很高走路；大人觉得他在胡闹，他却充分体验了一种骄傲的、胜任的、夸大的感觉。"],"k":["捏碎小番茄","抽纸撕成条","阅兵式抬腿","胜任感"],"src":"案例：夸大的游戏","refs":["案02"],"intro":1,"case":"二","follow":"后面几张卡问：孩子为何开心、大人该怎样制止，以及科胡特如何命名这种自体感。"},{"id":"案03","sid":"38650c0287","cat":"grand","q":"案例三 · 反复叫姑姑：「我只是想知道你在那里」｜先读情节","a":["一个孩子在房间里叫姑姑，姑姑回应他说：「哎！我在这里。」孩子就放松了。过一会儿他又叫姑姑，姑姑又回答：「我在。」","这样重复了很多次之后，姑姑对他说：「你有什么事情吗？如果没有什么事，不要反复叫我。」","孩子说：「我没有什么事情，我只是想知道你在那里，你回应我，我就安心了。」"],"k":["反复叫姑姑","没有事情","你回应我我就安心了"],"src":"案例：反复叫姑姑","refs":["案03"],"intro":1,"case":"三","follow":"后面几张卡问：孩子的行为在寻求什么，以及被关注带来哪些体验。"},{"id":"案04","sid":"7989779393","cat":"ideal","q":"案例四 · 妈妈一只手拎起「重物」｜先读情节","a":["孩子尝试搬「重物」，但试半天也搬不动；这时候妈妈走过去，只用一只手就轻松地将「重物」拎了起来。","孩子瞬间就会将理想化的影像投注在妈妈身上，认为她有无穷的力量。","他由此体验到：「就是因为我和有力量的人在一起，所以我也是有力量的。」"],"k":["搬不动","一只手拎起","投注理想化影像","我也是有力量的"],"src":"案例：妈妈拎起重物","refs":["案04"],"intro":1,"case":"四","follow":"后面几张卡问：这一投注属于哪个自体面向，以及成人身上的类似幻想为何是病理性的。"},{"id":"案05","sid":"3f3c289191","cat":"twin","q":"案例五 · 圣诞节的面团与包饺子｜先读情节","a":["在欧美国家的圣诞节期间，当长辈们制作节庆糕点时，孩子也会拿一块面团在旁边揉捏，感觉到自己也在参与创造。","在我国，北方家庭可能让孩子参与包饺子、做馒头，在南方可能变成包馄饨；孩子十分乐于与爷爷、奶奶、外公、外婆等一同进行这类活动。","孩子虽然并没有做太多，却很热衷、很投入；有时还会期盼吃到包有钱币或糖的特殊馅料，恰好吃到了便格外开心。"],"k":["面团揉捏","包饺子／包馄饨","一起完成任务","特殊馅料"],"src":"案例：节庆糕点","refs":["案05"],"intro":1,"case":"五","follow":"后面几张卡问：这种感受叫什么，以及它在未来发展中被看作什么的基础。"},{"id":"案06","sid":"eb2ae222c1","cat":"twin","q":"案例六 · 幼儿园里的「结婚」｜先读情节","a":["孩子从两三岁起就开始拥有小伙伴，随着年龄增长，伙伴的数量也会逐渐增多；孩子与小伙伴的相处构成了其部分人际关系。","这类人际关系并不深刻，孩子们多是因分享玩具或零食而成为朋友。","例如有的孩子从幼儿园放学后会说他和某个小朋友「结婚」了，这很可能只是代表他和这个小朋友有共同喜爱的玩具。"],"k":["两三岁起","分享玩具或零食","「结婚」","共同喜爱的玩具"],"src":"案例：幼儿园「结婚」","refs":["案06"],"intro":1,"case":"六","follow":"后面几张卡问：这类伙伴关系对应哪种需要，以及它怎样被满足。"},{"id":"案07","sid":"d61abe0cdb","cat":"wean","q":"案例七 · 与外国人用英语对话｜先读情节","a":["很多人虽然学了英语，但是与外国人对话时，在表达上总有些不确定的地方，这个时候就会感到心虚；第一次见到外国人、或第一次去国外旅行要用英语交流时，多数人是会紧张的。","如果互相能够听懂，你们在语言上就处于同频状态；这时偶尔有一句听不懂，就会调用之前大部分听得懂的经验，让自己保持稳定，换种方式继续和对方沟通。","比如你说的一个词语对方没听懂，那就尝试用另一个词语解释一下，对方可能就懂了。"],"k":["听不懂一句","调用听得懂的经验","换个词语解释","同频"],"src":"案例：英语对话","refs":["案07"],"intro":1,"case":"七","follow":"后面几张卡问：这种方法来自哪里、带来什么变化，以及它类比了婴儿的哪一过程。"},{"id":"案08","sid":"d45de065da","cat":"wean","q":"案例八 · 父母生病要休息几天｜先读情节","a":["一个孩子原本觉得父母无所不能，但突然有一天，父母表示身体不舒服，要休息几天。","这对孩子来说是一个刺激，但并不是创伤性刺激；孩子会由此发现强大的父母也有虚弱的时候。","他便会在父母虚弱的时候调用此前积聚的内在力量，逐步调整对父母的关注；即使在父母生病的时候，孩子感觉到的自己也是稳定的。"],"k":["父母不舒服","不是创伤性刺激","调用内在力量","自己仍是稳定的"],"src":"案例：父母生病","refs":["案08"],"intro":1,"case":"八","follow":"后面几张卡问：这份稳定由什么产生，以及孩子由此发生什么变化。"},{"id":"案09","sid":"6a4c8e1a0c","cat":"wean","q":"案例九 · 感情失败时的两种人｜先读情节","a":["如果一个人有边缘型人格障碍，那么他很容易投入一段感情，但这段感情出问题的概率很高；一旦这种情感关系出现问题，他就会像失去了主心骨一样；只要能挽回关系，对方让他做什么都可以。","而一个自体感良好的人，即使在一段投入很多的感情中最终失败了，他仍能保持足够的稳定感。","他可能会经历一时的、短暂的痛苦，但能够比较快地化解痛苦，并以一种比较健康的方式重新寻求一段更适合自己的情感关系。"],"k":["边缘型人格障碍","失去主心骨","自体感良好","较快化解痛苦"],"src":"案例：感情失败对比","refs":["案09"],"intro":1,"case":"九","follow":"后面几张卡问：前一种表现说明什么，以及良好自体感的人如何复原。"},{"id":"案10","sid":"b30faee9ff","cat":"reso","q":"案例十 · 阳台上的死老鼠｜先读情节","a":["有个孩子在家中闻到了一股淡淡的臭味，他告诉了妈妈，但是妈妈没有闻到。","过了几周，妈妈打扫阳台的时候发现了一只散发着臭味的死老鼠；这时候孩子对妈妈说：「你看，我就说有一股臭味吧，就是这只死老鼠发出来的。」","妈妈回应道：「是不是你搞的怪？你吃的东西把老鼠引进来了。」"],"k":["淡淡的臭味","死老鼠","是不是你搞的怪"],"src":"案例：死老鼠臭味","refs":["案10"],"intro":1,"case":"十","follow":"后面几张卡问：妈妈的回应属于哪类问题、孩子原本想证明什么，以及妈妈为何这样回应。"},{"id":"案11","sid":"9a6c5cb94d","cat":"vert","q":"案例十一 · 「我之前就是这么说的」｜先读情节","a":["一个人前后说的话不一致，会让人明显感觉到他是自相矛盾、不连贯的。","一般人在出现这种不一致的表达时，会感到些许害羞，并表示歉意，承认之前说错了。","但是有的人会若无其事地说「我之前就是这么说的」，即便所有证据都证明其表达前后不一致。"],"k":["前后不一致","一般人会害羞致歉","若无其事否认"],"src":"案例：自相矛盾","refs":["案11"],"intro":1,"case":"十一","follow":"后面几张卡问：这一表现叫什么、背后与哪种童年体验相关，以及这类个体如何对待别人的连贯性。"},{"id":"案12","sid":"25665c0000","cat":"vert","q":"案例十二 · A 女士偷衣服｜先读情节","a":["A 女士成名致富后，竟然去商店里偷了一件千元以下的衣服；以她的收入水平，她完全没有必要这样做。","但事情真实发生了：她将店里的衣服穿在身上，旁若无人地走了出去，并且被店员发现后还拒绝承认。","这一过程与她早期的生活经历有关：在贫穷的成长环境中，她沾染了小偷小摸的坏习惯。"],"k":["成名致富","千元以下","穿在身上走出去","拒绝承认","贫穷成长环境"],"src":"案例：A 女士","refs":["案12"],"intro":1,"case":"十二","follow":"后面几张卡问：这是哪种病理过程、从个体角度如何理解，以及临床上相应难度。"}];

const HUB_CH = 4;
Hub.init();
Hub.applyToChapter(CARDS, CATS, HUB_CH);
let HUB_EDIT_V = Hub.editVersion();
const CATMAP = {}; CATS.forEach(c=>CATMAP[c.k]=c);
const CATIDX = {}; CATS.forEach((c,i)=>CATIDX[c.k]=i);
const KEY = 'xj_ch4_knowledge_cards_v1';
/* 复习记录按卡片 sid（题干指纹）保存，与显示编号 k001… 解耦：
   以后增删卡片、重排编号都不会让自评张冠李戴。 */

/* ============ 状态 ============ */
let saved={status:{},settings:{}};
try{const t=Hub.chapterLoad(HUB_CH, KEY);if(t){const o=JSON.parse(t);saved.status=o.status||{};saved.settings=o.settings||{};}}catch(e){}
function persist(){try{Hub.chapterPersist(HUB_CH, KEY, saved);}catch(e){}}
const $=id=>document.getElementById(id);
function settings(){return {cat:$('fCat').value,order:$('fOrder').value,weak:$('fWeak').checked,recite:$('fRecite').checked,reverse:$('fReverse').checked};}
function saveSettings(){const s=settings();
  /* 「案例情节」是一次性查看，不写进默认设置：下次打开仍回到按案例穿插的正常复习流 */
  if(s.cat==='__intro__')s.cat='all';
  saved.settings=s;persist();}

let deck=[],pos=0,flipped=false,mineText='';

/* ============ 初始化控件 ============ */
CATS.forEach(c=>{
  const o=document.createElement('option');o.value=c.k;o.textContent=c.label+'（'+CARDS.filter(x=>x.cat===c.k).length+'）';
  $('fCat').appendChild(o);
});
const introOpt=document.createElement('option');
introOpt.value='__intro__';introOpt.textContent='案例情节（'+CARDS.filter(x=>x.intro).length+'）';
$('fCat').appendChild(introOpt);
const s0=saved.settings;
/* 兼容旧记录：曾保存过集中视图的，回到正常复习流 */
if(s0&&s0.cat==='__intro__'){s0.cat='all';persist();}
if(s0&&Object.keys(s0).length){
  if(s0.cat&&[...$('fCat').options].some(o=>o.value===s0.cat))$('fCat').value=s0.cat;
  if(s0.order&&[...$('fOrder').options].some(o=>o.value===s0.order))$('fOrder').value=s0.order;
  $('fWeak').checked=!!s0.weak;$('fRecite').checked=!!s0.recite;$('fReverse').checked=!!s0.reverse;
}
function renderChips(){
  const box=$('chips');box.innerHTML='';
  const all=document.createElement('span');
  all.className='chip'+($('fCat').value==='all'?' on':'');
  if($('fCat').value==='all')all.style.background='#2f4f6f';
  all.textContent='全部 '+CARDS.length;
  all.onclick=()=>{$('fCat').value='all';saveSettings();buildDeck();};
  box.appendChild(all);
  const iN=CARDS.filter(x=>x.intro).length;
  const ic=document.createElement('span');
  ic.className='chip'+($('fCat').value==='__intro__'?' on':'');
  if($('fCat').value==='__intro__')ic.style.background='#8a6a3e';
  ic.textContent='案例情节 '+iN;
  ic.title='集中浏览全部案例情节介绍卡（正常复习时介绍卡会自动插在对应案例题卡之前）';
  ic.onclick=()=>{$('fCat').value='__intro__';saveSettings();buildDeck();};
  box.appendChild(ic);
  CATS.forEach(c=>{
    const n=CARDS.filter(x=>x.cat===c.k).length;
    const el=document.createElement('span');
    el.className='chip'+($('fCat').value===c.k?' on':'');
    if($('fCat').value===c.k)el.style.background=c.color;
    el.title=c.note;
    el.innerHTML=c.label+'<i>'+n+'</i>';
    el.onclick=()=>{$('fCat').value=c.k;saveSettings();buildDeck();};
    box.appendChild(el);
  });
}

/* ============ 卡组 ============ */
function stat(v){return v===3?'✓ 记得':v===2?'· 模糊':'○ 未评';}
/* 情节卡不参与排序：在案例题卡「首次呈现」之前插入对应介绍。
   perSegment=true（知识模块顺序）：同一案例的题卡分成不同区段时，每段前都插一次
   （案例速查是反查练习，离原案例很远，需要重新给情节）。
   perSegment=false（弱项/随机/掌握度）：每个案例全局只插一次，避免介绍卡淹没题卡。 */
function anchorIntros(body, perSegment){
  const intros={}; CARDS.forEach(c=>{if(c.intro)intros[c.id]=c;});
  const out=[], seenKeys=new Set(), seenCards=new Set(); let last='';
  body.forEach(c=>{
    const refs=(c.refs||[]).filter(r=>intros[r]);
    const key=refs.join('|');
    const need=refs.length&&(perSegment?(key!==last):!seenKeys.has(key));
    if(need){
      if(perSegment){
        refs.forEach(r=>out.push(intros[r]));
      }else{
        /* 打散排序下按「单张情节卡」去重：案例速查⑦ 同时指向案10/案11，
           若这两个案例在别处已介绍过，就不再重复插入 */
        refs.forEach(r=>{if(!seenCards.has(r)){out.push(intros[r]);seenCards.add(r);}});
      }
      seenKeys.add(key);
    }
    last=refs.length?key:'';
    out.push(c);
  });
  return out;
}
function buildDeck(keep){
  const s=settings();
  const introOnly=(s.cat==='__intro__');
  deck=CARDS.filter(c=>{
    if(introOnly){if(!c.intro)return false;}
    else{if(c.intro)return false;if(s.cat!=='all'&&c.cat!==s.cat)return false;}
    if(s.weak&&(saved.status[c.sid]||0)>=3)return false;
    return true;
  });
  if(s.order==='seq')deck.sort((a,b)=>CATIDX[a.cat]-CATIDX[b.cat]||CARDS.indexOf(a)-CARDS.indexOf(b));
  if(s.order==='status')deck.sort((a,b)=>(saved.status[a.sid]||0)-(saved.status[b.sid]||0));
  if(s.order==='weak'){const wk=sid=>{const v=saved.status[sid]||0;return v===0?1.5:v;};deck.sort((a,b)=>wk(a.sid)-wk(b.sid)||Math.random()-.5);}
  if(s.order==='rand')deck=deck.slice().sort(()=>Math.random()-.5);
  /* 排序完成后再锚定情节卡：与所选顺序无关，保证介绍总在该案例题卡之前 */
  if(!introOnly)deck=anchorIntros(deck,s.order==='seq');
  if(keep&&pos<deck.length){}else{pos=0;}
  if(pos>=deck.length)pos=0;
  renderChips();updateStats();show();
}

function updateStats(){
  const s=settings();
  const introOnly=(s.cat==='__intro__');
  const pool=introOnly?CARDS.filter(c=>c.intro)
    :(s.cat==='all'?CARDS:CARDS.filter(c=>c.cat===s.cat)).filter(c=>!c.intro);
  const done=pool.filter(c=>(saved.status[c.sid]||0)>0).length;
  const got=pool.filter(c=>(saved.status[c.sid]||0)===3).length;
  const nIntro=deck.filter(c=>c.intro).length;
  $('statText').textContent=(introOnly?'案例情节 '+pool.length+' 张':'本模块 '+pool.length+' 张题卡')
    +' ｜ 已评 '+done+' ｜ 记得 '+got+' ｜ 当前卡组 '+deck.length+' 张'
    +(introOnly?'':'（含情节卡 '+nIntro+'）');
  $('progText').textContent=done+'/'+pool.length;
  $('bar').style.width=(pool.length?done/pool.length*100:0)+'%';
  $('countHint').textContent=deck.length?(pos+1)+' / '+deck.length:'当前筛选无卡片';
}

/* ============ 渲染 ============ */
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function show(){
  const box=$('cardArea');
  const oldEmpty=box.querySelector('.empty');if(oldEmpty)oldEmpty.remove();
  if(!deck.length){
    $('front').innerHTML='<div class="empty">当前筛选下没有卡片。<br>试着取消「只看未掌握」，或换一个模块。</div>';
    $('back').innerHTML='';$('card').classList.remove('flipped');
    updateStats();return;
  }
  const c=deck[pos],col=CATMAP[c.cat].color,st=saved.status[c.sid]||0;
  const s=settings();
  flipped=false;$('card').classList.remove('flipped');mineText='';
  $('card').style.setProperty('--cc',col);
  const badge=c.intro?'案例情节 · 先读':CATMAP[c.cat].label;
  const head='<div class="top"><span class="badge'+(c.intro?' introBadge':'')+'" style="background:'+col+'">'+badge+'　·　'+stat(st)+'</span><span class="idx">'+c.id+'　'+(pos+1)+'/'+deck.length+'</span></div>';
  const foot='<div class="src">所在小节：'+esc(c.src)+'　｜　徐钧《自体心理学入门》第四章</div>';

  /* 案例情节卡：正面直接印出情节，不用翻面就能读到背景；背面给记忆抓手。
     不进入默写／反向提问（它不是问答题）。 */
  if(c.intro){
    const body='<div class="introBody">'+c.a.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>';
    $('front').innerHTML=head+'<div class="q">'+esc(c.q)+'</div>'+body+
      '<div class="introHint">'+esc(c.follow||'')+'　·　无需翻面，读完直接进入后面的提问卡。</div>'+foot;
    $('back').innerHTML=head+'<div class="q">'+esc(c.q)+' · 记忆抓手</div>'+
      '<div class="kw">合上卡片试着自己复述情节，再核对关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>'+
      '<div class="introHint">'+esc(c.follow||'')+'</div>'+foot;
    $('flip').textContent='翻面看记忆抓手（空格）';
    updateStats();return;
  }

  let q=c.q, a=c.a;
  if(s.reverse){ q=c.a.join('　／　'); a=[c.q]; }
  const big=q.length>95?' big':'';

  const ctxHtml=c.ctx?'<div class="ctx">'+esc(c.ctx)+'</div>':'';
  if(s.recite&&!s.reverse){
    $('front').innerHTML=head+ctxHtml+'<div class="q'+big+'">'+esc(q)+'</div>'+
      '<textarea id="mine" placeholder="先在这里写下你的答案／背诵要点，再点「核对并翻面」…"></textarea>'+foot;
    const ta=$('mine');
    if(ta){ta.onclick=e=>e.stopPropagation();ta.oninput=()=>{mineText=ta.value;};ta.value='';}
  }else{
    $('front').innerHTML=head+ctxHtml+'<div class="q'+big+'">'+esc(q)+'</div>'+foot;
  }

  let back=head+(s.reverse?'':ctxHtml)+'<ul class="aList">'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(s.recite&&!s.reverse&&mineText.trim()){
    back+='<div class="mine"><b>你的默写</b>'+esc(mineText.trim())+'</div>';
    const hits=c.k.filter(w=>mineText.indexOf(w)>=0);
    back+='<div class="hit">关键词命中 '+hits.length+' / '+c.k.length+(hits.length?'：'+esc(hits.join('、')):'　— 建议对照全文再背一遍')+'</div>';
  }
  if(!s.reverse&&c.k.length){
    back+='<div class="kw">关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>';
  }
  back+=foot;
  $('back').innerHTML=back;
  $('flip').textContent=s.recite&&!s.reverse?'核对并翻面（空格）':'翻面看答案（空格）';
  updateStats();
}
function flip(){
  if(!deck.length)return;
  const s=settings();
  if(s.recite&&!s.reverse&&!flipped){const ta=$('mine');if(ta)mineText=ta.value;}
  if(!flipped&&s.recite&&!s.reverse&&!deck[pos].intro){showKeepMine();}
  flipped=!flipped;$('card').classList.toggle('flipped',flipped);
  $('flip').textContent=flipped?'返回正面（空格）':(deck[pos].intro?'翻面看记忆抓手（空格）':(s.recite&&!s.reverse?'核对并翻面（空格）':'翻面看答案（空格）'));
}
/* 翻面前把默写内容写进背面（不重置卡片状态） */
function showKeepMine(){
  const c=deck[pos],col=CATMAP[c.cat].color,st=saved.status[c.sid]||0,s=settings();
  const head='<div class="top"><span class="badge" style="background:'+col+'">'+CATMAP[c.cat].label+'　·　'+stat(st)+'</span><span class="idx">'+c.id+'　'+(pos+1)+'/'+deck.length+'</span></div>';
  const foot='<div class="src">所在小节：'+esc(c.src)+'　｜　徐钧《自体心理学入门》第四章</div>';
  let back=head+'<ul class="aList">'+c.a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(mineText.trim()){
    back+='<div class="mine"><b>你的默写</b>'+esc(mineText.trim())+'</div>';
    const hits=c.k.filter(w=>mineText.indexOf(w)>=0);
    back+='<div class="hit">关键词命中 '+hits.length+' / '+c.k.length+(hits.length?'：'+esc(hits.join('、')):'　— 建议对照全文再背一遍')+'</div>';
  }
  back+='<div class="kw">关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>'+foot;
  $('back').innerHTML=back;
}
function go(d){if(!deck.length)return;pos=(pos+d+deck.length)%deck.length;show();}
function rate(v){if(!deck.length)return;saved.status[deck[pos].sid]=v;persist();go(1);}

/* ============ 导出 ============ */
function download(name,text,type){
  const blob=new Blob(['\ufeff'+text],{type:type||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},200);
}
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}
$('btnCSV').onclick=()=>{
  const rows=[['编号','模块','语境','问题 / 情节标题','答案 / 情节正文','关键词','所在小节']];
  CARDS.forEach(c=>rows.push([c.id,c.intro?'案例情节':CATMAP[c.cat].label,c.ctx||'',c.q,c.a.join(' / '),c.k.join(' / '),c.src]));
  download('第4章_知识闪卡.csv',rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');
};
$('btnMD').onclick=()=>{
  let t='# 第四章 人格发展及病理 · 知识闪卡\n\n> 依据：徐钧《自体心理学入门》pp.066–082 修复稿。纯知识卡，重点为人格发展、三极自体与两种分裂。\n\n';
  CATS.forEach(c=>{
    const list=CARDS.filter(x=>x.cat===c.k);if(!list.length)return;
    t+='## '+c.label+'（'+list.length+' 张）\n\n';
    list.forEach(x=>{t+='**'+x.id+'｜'+(x.intro?'【案例情节】':'')+x.q+'**\n\n';if(x.ctx)t+='> 语境：'+x.ctx+'\n\n';x.a.forEach(a=>t+='- '+a+'\n');t+='\n> 关键词：'+x.k.join('、')+'　｜　所在小节：'+x.src+(x.intro&&x.follow?'\n> 后续：'+x.follow:'')+'\n\n';});
  });
  download('第4章_知识闪卡.md',t,'text/markdown;charset=utf-8');
};
$('btnPrint').onclick=()=>{
  let h='<h2>徐钧《自体心理学入门》· 第四章知识闪卡</h2><div class="meta">依据 pp.066–082 修复稿 ｜ 共 '+CARDS.length+' 张 ｜ 打印日期：'+new Date().toLocaleDateString('zh-CN')+'</div>';
  CATS.forEach(c=>{
    const list=CARDS.filter(x=>x.cat===c.k);if(!list.length)return;
    h+='<h3>'+c.label+'（'+list.length+' 张）</h3>';
    list.forEach(x=>{h+='<div class="item"><div class="qq">'+x.id+'　'+(x.intro?'【案例情节】':'')+esc(x.q)+'</div>'+(x.ctx?'<div class="ss">语境：'+esc(x.ctx)+'</div>':'')+'<div class="aa">'+x.a.map(esc).join('　／　')+'</div><div class="ss">所在小节：'+esc(x.src)+'</div></div>';});
  });
  $('printArea').innerHTML=h;
  setTimeout(()=>window.print(),60);
};

/* ============ 事件 ============ */
['fCat','fOrder'].forEach(id=>$(id).onchange=()=>{saveSettings();buildDeck();});
['fWeak','fRecite','fReverse'].forEach(id=>$(id).onchange=()=>{saveSettings();buildDeck();});
$('fReset').onclick=()=>{if(confirm('清除本章闪卡的全部自评记录？\n（会同步到闪卡空间；不影响其它章节）')){saved.status={};persist();buildDeck();}};
$('flip').onclick=e=>{e.stopPropagation();flip();};
$('prev').onclick=()=>go(-1);
$('next').onclick=()=>go(1);
document.querySelectorAll('.rate').forEach(b=>b.onclick=()=>rate(+b.dataset.r));
$('card').onclick=e=>{if(e.target.id==='mine')return;flip();};
document.addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='TEXTAREA'||tag==='INPUT'||tag==='SELECT')return;
  const k=e.key.toLowerCase();
  if(e.code==='Space'||k===' '){e.preventDefault();flip();}
  else if(k==='arrowleft'){e.preventDefault();go(-1);}
  else if(k==='arrowright'){e.preventDefault();go(1);}
  else if(k==='1'||k==='2'||k==='3')rate(+k);
  else if(k==='r'){$('fOrder').value='rand';saveSettings();buildDeck();}
  else if(k==='m'){$('fRecite').checked=! $('fRecite').checked;saveSettings();buildDeck();}
  else if(k==='f'){$('fWeak').checked=! $('fWeak').checked;saveSettings();buildDeck();}
});

buildDeck();
