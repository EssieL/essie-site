</div>
<div class="np-stage"><img id="slide" alt="第四章知识图"></div>
<div class="np-bar">
  <button id="prev">‹ 上一张</button><span class="meta" id="meta"></span>
  <button id="play">▶ 播放</button><button id="next">下一张 ›</button>
</div>
<div class="np-thumbs" id="thumbs"></div>
<script>
const data = [
  {
    "f": "full/n19.jpg",
    "s": "thumb/t19.jpg",
    "t": "【第四章】01 · 从虚弱的自体开始长大"
  },
  {
    "f": "full/n20.jpg",
    "s": "thumb/t20.jpg",
    "t": "【第四章】02 · 核心自体：我意识到“我”了"
  },
  {
    "f": "full/n21.jpg",
    "s": "thumb/t21.jpg",
    "t": "【第四章】03 · 三极自体：自体发展图"
  },
  {
    "f": "full/n22.jpg",
    "s": "thumb/t22.jpg",
    "t": "【第四章】04 · 夸大自体：孩子需要被看见"
  },
  {
    "f": "full/n23.jpg",
    "s": "thumb/t23.jpg",
    "t": "【第四章】05 · 另外两极：理想化与密友"
  },
  {
    "f": "full/n24.jpg",
    "s": "thumb/t24.jpg",
    "t": "【第四章】06 · 撤出有方法，自体才稳定"
  },
  {
    "f": "full/n25.jpg",
    "s": "thumb/t25.jpg",
    "t": "【第四章】07 · 当共鸣没有发生"
  },
  {
    "f": "full/n26.jpg",
    "s": "thumb/t26.jpg",
    "t": "【第四章】08 · 水平分裂 vs 垂直分裂"
  }
];
let i = 0, timer = null;
const slide = document.getElementById('slide');
const meta = document.getElementById('meta');
const thumbs = document.getElementById('thumbs');
const playBtn = document.getElementById('play');
data.forEach((d, idx) => {
  const im = new Image();
  im.src = encodeURI(d.s || d.f);
  im.loading = 'lazy'; im.decoding = 'async'; im.title = d.t;
  im.onclick = () => show(idx);
  thumbs.appendChild(im);
});
function show(n) {
  i = (n + data.length) % data.length;
  slide.src = encodeURI(data[i].f);
  meta.textContent = (i + 1) + " / " + data.length + "　" + data[i].t;
  Array.prototype.forEach.call(thumbs.children, (c, k) => c.classList.toggle('active', k === i));
}
document.getElementById('prev').onclick = () => show(i - 1);
document.getElementById('next').onclick = () => show(i + 1);
playBtn.onclick = () => {
  if (timer) { clearInterval(timer); timer = null; playBtn.textContent = "▶ 播放"; }
  else { playBtn.textContent = "⏸ 暂停"; timer = setInterval(() => show(i + 1), 4000); }
};
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') show(i - 1);
  if (e.key === 'ArrowRight') show(i + 1);
  if (e.key === ' ') { e.preventDefault(); playBtn.onclick(); }
});
show(0);
</script>
