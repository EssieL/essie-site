<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>徐钧《自体心理学入门》· 第五章 知识闪卡</title>
<style>
  :root{
    --bg:#f6f5f1; --ink:#2c2c2a; --muted:#888780; --line:#e3e1d8; --card:#fff;
    --blue:#3b6ea5; --amber:#b07b23; --red:#b4493f; --green:#2f7d6b; --brown:#9a6b3f;
    --shadow:0 2px 16px rgba(0,0,0,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{min-height:58px;padding:8px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:#fff;flex-wrap:wrap}
  header h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
  header .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:430px}
  header .right{margin-left:auto;display:flex;gap:6px;align-items:center}
  button.b{font-size:12px;padding:6px 11px;border:1px solid #d6d4ca;background:#fff;border-radius:7px;cursor:pointer;color:var(--ink);white-space:nowrap}
  button.b:hover{background:#f0eee6}
  button.b.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .fbar{padding:9px 16px;border-bottom:1px solid var(--line);background:#fbfaf7;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .fbar label{font-size:12px;color:var(--muted)}
  select{font-size:12px;padding:6px 8px;border:1px solid #d6d4ca;border-radius:7px;background:#fff;color:var(--ink)}
  .chk{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;background:#fff;border:1px solid #d6d4ca;border-radius:7px;padding:6px 9px;white-space:nowrap}
  .chk input{margin:0}
  .chips{display:flex;gap:5px;padding:8px 16px 2px;flex-wrap:wrap;max-height:74px;overflow:auto}
  .chip{font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:#b9b5a7}
  .chip.on{color:#fff;border-color:transparent;font-weight:600}
  .chip i{font-style:normal;opacity:.75;margin-left:4px}
  .stats{padding:8px 18px 2px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .track{flex:1;min-width:120px;height:7px;border-radius:5px;background:#e7e5dc;overflow:hidden}
  .track i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
  .cardArea{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 18px 4px;min-height:0}
  .card{width:100%;max-width:780px;height:100%;max-height:440px;min-height:280px;perspective:1400px;cursor:pointer}
  .inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:20px 26px;display:flex;flex-direction:column;overflow:auto}
  .face.back{transform:rotateY(180deg)}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{font-size:11px;padding:4px 10px;border-radius:20px;color:#fff;background:var(--cc,#3b6ea5);letter-spacing:.3px}
  .idx{font-size:11px;color:var(--muted);margin-left:auto}
  .q{font-size:19px;line-height:1.65;font-weight:600;margin:18px 0 8px;white-space:pre-wrap}
  .q.big{font-size:16px;font-weight:500;line-height:1.8}
  .ctx{font-size:11.5px;line-height:1.6;color:#7a5a34;background:#f8f2e7;border:1px solid #ecdfc6;border-radius:7px;padding:5px 10px;margin:14px 0 -4px}
  .introBody{background:#faf8f2;border:1px solid #eae5d7;border-radius:10px;padding:12px 16px;margin:10px 0 8px;font-size:14px;line-height:1.85;overflow:auto;max-height:230px}
  .introBody p{margin:0 0 8px}
  .introBody p:last-child{margin-bottom:0}
  .introHint{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:4px}
  .badge.introBadge{background:#8a6a3e}
  .src{font-size:11px;color:var(--muted);margin-top:auto;padding-top:12px;border-top:1px dashed var(--line)}
  textarea{width:100%;min-height:96px;flex:1;border:1px dashed #cfccc1;border-radius:9px;background:#fbfaf7;padding:11px 13px;font-size:14px;line-height:1.7;font-family:inherit;color:var(--ink);resize:none;outline:none}
  textarea:focus{border-color:var(--blue);background:#fff}
  .aList{font-size:14.5px;line-height:1.85;margin:12px 0 4px;padding-left:0;list-style:none;white-space:pre-wrap}
  .aList li{margin-bottom:8px;padding-left:16px;position:relative}
  .aList li:before{content:"";position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--cc,#3b6ea5)}
  .mine{background:#f7f5ef;border:1px dashed #d6d4ca;border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;margin-top:8px;max-height:110px;overflow:auto}
  .mine b{color:var(--muted);font-weight:500;font-size:11px;display:block;margin-bottom:4px}
  .hit{font-size:12px;color:var(--green);margin-top:6px}
  .kw{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.6}
  .kw span{display:inline-block;background:#f1efe8;border-radius:5px;padding:1px 7px;margin:2px 4px 0 0}
  .controls{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px 12px;flex-wrap:wrap}
  .controls .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
  .controls .rate{font-size:12px;padding:7px 13px;border-radius:8px;border:1px solid #d6d4ca;background:#fff;cursor:pointer;color:var(--ink)}
  .controls .rate:hover{background:#f0eee6}
  .controls .rate.r1{border-color:#e2b6b1;color:var(--red)}
  .controls .rate.r2{border-color:#e1cf9f;color:var(--amber)}
  .controls .rate.r3{border-color:#aed3c8;color:var(--green)}
  .foot{font-size:11px;color:var(--muted);text-align:center;padding:0 16px 9px}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}
  #printArea{display:none}
  @media print{
    html,body{height:auto;overflow:visible;background:#fff}
    body>*:not(#printArea){display:none !important}
    #printArea{display:block !important;padding:0}
    #printArea h2{font-size:16px;margin:0 0 6px}
    #printArea .meta{font-size:11px;color:#666;margin-bottom:14px}
    #printArea .item{border-bottom:1px solid #ddd;padding:8px 0;page-break-inside:avoid}
    #printArea .item .qq{font-size:13px;font-weight:600}
    #printArea .item .aa{font-size:12px;line-height:1.6;color:#333;margin-top:3px}
    #printArea .item .ss{font-size:10px;color:#888;margin-top:3px}
  }
  @media (max-width:640px){
    header .sub{display:none}
    .q{font-size:17px}
    .face{padding:16px 18px}
    .card{max-height:none}
  }

/* === 个人学习分站 · 顶部返回条（部署时注入，打印时隐藏） === */
.xjLearnBar{background:#115e59;color:#fff;padding:7px 16px;display:flex;gap:7px;
  flex-wrap:wrap;align-items:center;font:12.5px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  position:relative;z-index:99}
.xjLearnBar a{color:#d9f4ee;text-decoration:none;white-space:nowrap}
.xjLearnBar a:hover{text-decoration:underline}
.xjLearnBar .xjSep{opacity:.55}
.xjLearnBar .xjHere{opacity:.8;white-space:nowrap}
@media print{.xjLearnBar{display:none!important}}

</style>

<script>
/* ============ 数据（单一数据源，与《第5章_知识闪卡_卡表.md》同源） ============ */

const CARDS = [{"id":"k001","sid":"76c960850a","cat":"assess","q":"在国内学习经典自体心理学时，可以把对来访者的评估定义为哪三层结构？","a":["第一层是变态心理学心理评估，也称症状评估。","第二层是人格评估，或称性格评估。","第三层是移情评估，即自体客体移情评估。"],"k":["症状评估","人格评估","移情评估"],"src":"导言 三层评估","refs":[]},{"id":"k002","sid":"2c96b272a0","cat":"assess","q":"第一层「症状评估」类似于哪些评估标准？","a":["类似于国际上比较流行的精神障碍诊断标准，如《精神障碍诊断与统计手册》（第五版；DSM-5）及《中国精神障碍分类与诊断标准》（第三版；CCMD-3）等。"],"k":["DSM-5","CCMD-3","精神障碍诊断标准"],"src":"导言 三层评估","refs":[]},{"id":"k003","sid":"f2ac8a34c3","cat":"assess","q":"症状评估在临床上为什么十分重要？","a":["面对具有某些症状的来访者，咨询师可以开展工作；而对具有另一些症状的来访者，则应建议其前往医院接受精神科治疗。"],"k":["可开展工作","建议精神科治疗","分流"],"src":"导言 三层评估","refs":[]},{"id":"k004","sid":"ae0b52c3c5","cat":"assess","q":"第二层人格评估与什么相关，旨在评估什么？","a":["与人格结构相关，旨在评估来访者的人格水平（或人格结构）。"],"k":["人格结构","人格水平"],"src":"导言 三层评估","refs":[]},{"id":"k005","sid":"3e751231e3","cat":"assess","q":"第三层移情评估在自体心理学中与什么紧密联系？","a":["与个案概念化及临床实践紧密联系在一起。"],"k":["个案概念化","临床实践"],"src":"导言 三层评估","refs":[]},{"id":"k006","sid":"863c7a0ffa","cat":"assess","q":"所谓人格评估，是指什么？","a":["观察一个人的人格功能和体验的各个面向，以理解其人格的发展水平。"],"k":["人格功能与体验的各面向","发展水平"],"src":"导言 人格评估","refs":[]},{"id":"k007","sid":"3b75050891","cat":"assess","q":"科胡特沿袭弗洛伊德的分类方法，把人格水平分成哪三大类？","a":["神经症水平、自体疾患水平（包括自恋神经症、自恋疾患等）和精神病性水平。"],"k":["神经症水平","自体疾患水平","精神病性水平"],"src":"导言 三大类","refs":[]},{"id":"k008","sid":"36f0b11e48","cat":"assess","q":"自体心理学主张治疗的「自恋人格障碍」，相当于弗洛伊德当年所说的什么？","a":["自恋神经症。"],"k":["自恋神经症","自恋人格障碍"],"src":"导言 三大类","refs":[]},{"id":"k009","sid":"e5f32c776a","cat":"assess","q":"弗洛伊德最早把可分析的神经症患者的问题归结为什么？","a":["与俄狄浦斯冲突有关的问题。"],"k":["俄狄浦斯冲突","可分析的神经症"],"src":"导言 三大类","refs":[]},{"id":"k010","sid":"dd54f32bce","cat":"assess","q":"弗洛伊德为什么会另外分出「自恋神经症」一类？","a":["他在临床中发现有一类来访者依从性很差，不愿意与咨询师配合，而且往往喜欢贬低或挑战咨询师，咨询师很难与之工作。"],"k":["依从性差","贬低或挑战咨询师","难以工作"],"src":"导言 三大类","refs":[]},{"id":"k011","sid":"ed61fff9a1","cat":"assess","q":"自恋神经症患者的注意力有什么特点，为什么难以治疗？","a":["注意力仅集中于自身，对旁人的存在毫不在意，咨询师因而难以对其开展治疗。"],"k":["注意力仅集中于自身","不在意旁人"],"src":"导言 三大类","refs":[]},{"id":"k012","sid":"fec2c4bb63","cat":"assess","q":"弗洛伊德把「完全沉浸于自己的幻想、与外部世界的交流封闭」的患者归为哪一类？","a":["精神病性障碍。"],"k":["与现实世界交流封闭","精神病性障碍"],"src":"导言 三大类","refs":[]},{"id":"k013","sid":"77b7d24106","cat":"assess","q":"为什么「与外部世界交流封闭」的患者不能再归入自恋神经症？","a":["因为其心理健康水平远低于自恋神经症患者。"],"k":["心理健康水平远低于","无法与现实交流"],"src":"导言 三大类","refs":[]},{"id":"k014","sid":"3c6f57f7f2","cat":"assess","q":"自恋神经症又被称为什么，两者关系如何？","a":["也有人称之为「性倒错」，两者实际上存在许多重叠的部分。"],"k":["性倒错","许多重叠"],"src":"导言 三大类","refs":[]},{"id":"k015","sid":"305eff2318","cat":"history","q":"初期精神分析史中有没有人格评估这一概念？弗洛伊德早期如何讨论治疗工作？","a":["没有。弗洛伊德早期只是就症状和症状起源的因果关系来讨论精神分析的治疗工作。"],"k":["早期无人格评估","症状与起源的因果关系"],"src":"导言 性格分析","refs":[]},{"id":"k016","sid":"a320fe7237","cat":"history","q":"精神分析性格分析由谁发展出来？依据是什么？","a":["亚伯拉罕、威廉·赖希二人加入精神分析学派后，根据弗洛伊德的若干人格理论发展出精神分析性格分析。"],"k":["亚伯拉罕","威廉·赖希","弗洛伊德人格理论"],"src":"导言 性格分析","refs":[]},{"id":"k017","sid":"65abaf11b2","cat":"history","q":"精神分析性格分析的做法是什么？","a":["对接受分析和治疗的来访者的人格进行评估，进而对其人格开展较为整体的分析治疗。"],"k":["评估人格","整体分析治疗"],"src":"导言 性格分析","refs":[]},{"id":"k018","sid":"ab262e4820","cat":"history","q":"性格分析的发展给精神分析工作带来了哪两个变化？","a":["推动了精神分析工作的转变，并使工作变得更长程；咨询师也倾向于在开始接触来访者时就对其整体人格进行评估。"],"k":["工作变长程","接触之初评估整体人格"],"src":"导言 性格分析","refs":[]},{"id":"k019","sid":"10ef847507","cat":"history","q":"人格评估后来在精神分析工作中处于什么地位？","a":["成为精神分析工作的核心评估和工作思路之一。"],"k":["核心评估","工作思路之一"],"src":"导言 性格分析","refs":[]},{"id":"k020","sid":"5d0319ec02","cat":"history","q":"近年来哪些变化促使精神分析家反思人格评估的意义？","a":["关系性精神分析等学派的兴起，以及临床工作情境更倾向于低频分析（如每周一次）。"],"k":["关系性精神分析兴起","低频分析"],"src":"导言 当代反思","refs":[]},{"id":"k021","sid":"faff728bb8","cat":"history","q":"反思者对人格评估的意义持什么观点？","a":["认为人格评估虽然有一定的指导作用，但可能并没有以往认为的那么重要。"],"k":["有一定指导作用","可能没那么重要"],"src":"导言 当代反思","refs":[]},{"id":"k022","sid":"8d1173797d","cat":"history","q":"尽管有反思，人格评估在各精神分析学派中的地位如何？","a":["依然具有不容忽视的地位。"],"k":["不容忽视的地位"],"src":"导言 当代反思","refs":[]},{"id":"k023","sid":"7fb2649e3b","cat":"neuro","q":"在自体心理学中，神经症的主要冲突是关于什么的？","a":["并非关于自体的缺陷，而是与俄狄浦斯情结和厄勒克特拉情结（女性性心理情结）相关。"],"k":["非自体缺陷","俄狄浦斯情结","厄勒克特拉情结"],"src":"§1 神经症水平","refs":[]},{"id":"k024","sid":"62eeeaedca","cat":"neuro","q":"神经症冲突的轻重两端分别是什么？","a":["较严重者属于俄狄浦斯早期的自恋竞争冲突；较轻者属于俄狄浦斯晚期与罪疚感相关的冲突。"],"k":["自恋竞争冲突","罪疚感相关冲突"],"src":"§1 神经症水平","refs":[]},{"id":"k025","sid":"fa06661263","cat":"neuro","q":"弗洛伊德为什么说每个相对健康的人格都具有神经症结构？","a":["因为健康的人也是存在冲突的，神经症结构实际上是一种基本健康或者接近健康的人格结构。"],"k":["健康的人也有冲突","基本健康或接近健康"],"src":"§1 神经症结构","refs":[]},{"id":"k026","sid":"d1483480fe","cat":"neuro","q":"弗洛伊德在《超越快乐原则》中指出，人类所有冲突的本质是什么？","a":["深入到人类生死本能的冲突。"],"k":["生死本能的冲突"],"src":"§1 神经症结构","refs":[]},{"id":"k027","sid":"2bbe8eba4b","cat":"neuro","q":"生死本能的冲突如何表现为生活中的各种具体冲突？","a":["这种冲突扩展至我们的生活中即表现为各种具体的冲突，只是一般人把这种冲突管理得较好，不至于产生疾病。"],"k":["扩展为具体冲突","管理得较好","不至于致病"],"src":"§1 神经症结构","refs":[]},{"id":"k028","sid":"5f788a35c1","cat":"neuro","q":"冲突可分为哪三类？","a":["现实性冲突、道德性冲突和神经症性冲突。"],"k":["现实性","道德性","神经症性"],"src":"§1 冲突与置换","refs":[]},{"id":"k029","sid":"73758066e3","cat":"neuro","q":"什么样的冲突会置换成神经症？","a":["如果冲突过大，个体抑制不住想要表达出来，而自己又拼命压抑，就容易置换成神经症。"],"k":["冲突过大","抑制不住又拼命压抑"],"src":"§1 冲突与置换","refs":[]},{"id":"k030","sid":"b91f9c43c8","cat":"neuro","q":"当冲突过于强烈时，冲突的能量会怎样？举出常见的症状。","a":["冲突的部分能量便会置换为症状，如焦虑症、恐惧症；常见的恐惧症包括恐高症、恐狗症等。"],"k":["部分能量置换为症状","焦虑症","恐惧症"],"src":"§1 冲突与置换","refs":[]},{"id":"k031","sid":"532e581296","cat":"neuro","q":"恐惧症的发生往往是由于什么？","a":["某个随机的事件与个体内心冲突形成了类似经典条件反射的联结。"],"k":["随机事件","内心冲突","经典条件反射式联结"],"src":"§1 恐惧症","refs":[]},{"id":"k032","sid":"92aceaf46f","cat":"neuro","q":"科胡特举的蜂鸣恐惧症例子中，这个人当时正在经历什么？","a":["正在调整内部某种强烈冲突的时候，不巧被飞过的蜜蜂惊吓到。"],"k":["调整强烈冲突","被飞过的蜜蜂惊吓"],"src":"案例：蜂鸣恐惧症","refs":["案01"],"ctx":"【案例一 · 蜜蜂与蜂鸣恐惧症】就本例情节提问"},{"id":"k033","sid":"6b07e3d113","cat":"neuro","q":"被蜜蜂惊吓之后，这个人出现了什么症状？","a":["由此患上蜂鸣恐惧症，此后一听到蜂鸣或类似的声音便会很惊恐、很焦虑。"],"k":["蜂鸣恐惧症","类似声音也惊恐"],"src":"案例：蜂鸣恐惧症","refs":["案01"],"ctx":"【案例一 · 蜜蜂与蜂鸣恐惧症】就本例情节提问"},{"id":"k034","sid":"d89d8ede36","cat":"neuro","q":"蜂鸣恐惧症这一例子说明了恐惧症形成的什么机制？","a":["随机事件（蜜蜂惊吓）与个体内心冲突形成类似经典条件反射的联结，冲突的部分能量由此置换为症状。"],"k":["随机事件与冲突联结","条件反射","置换为症状"],"src":"案例：蜂鸣恐惧症","refs":["案01"],"ctx":"【案例一 · 蜜蜂与蜂鸣恐惧症】由本例引出的一般规律／论断"},{"id":"k035","sid":"e5371b0665","cat":"neuro","q":"哪些较轻的症状属于神经症人格水平范畴？","a":["轻度至中轻度的强迫症，以及社交恐惧等较轻的恐惧症类型，在经典自体心理学视角下均称为神经症。"],"k":["轻中度强迫症","社交恐惧","较轻恐惧症"],"src":"§1 神经症范围","refs":[]},{"id":"k036","sid":"0e323df75d","cat":"neuro","q":"神经症患者在人际关系中的冲突有什么特点？","a":["往往在人际关系中存在冲突，但这种冲突是有边界的。"],"k":["人际冲突","有边界"],"src":"§1 神经症范围","refs":[]},{"id":"k037","sid":"46264c57c8","cat":"neuro","q":"神经症结构在人际与婚恋中常见哪些表现？","a":["表现得比较刻板，处理人际问题时活力不够，或在婚恋中经常有许多中轻度矛盾。"],"k":["刻板","活力不够","中轻度矛盾"],"src":"§1 神经症范围","refs":[]},{"id":"k038","sid":"d1d5ede396","cat":"neuro","q":"当代临床实践中，约有多少来访者可能属于神经症？","a":["约有一半；针对这类来访者的工作相对容易。"],"k":["约一半","相对容易"],"src":"§1 神经症范围","refs":[]},{"id":"k039","sid":"c0d6ddd5a6","cat":"neuro","q":"科胡特如何看待用弗洛伊德经典理论治疗神经症？","a":["运用弗洛伊德的经典精神分析理论来治疗神经症已绰绰有余。"],"k":["经典精神分析理论","绰绰有余"],"src":"§1 神经症范围","refs":[]},{"id":"k040","sid":"fdacdd645f","cat":"neuro","q":"「想去看电影，但又不想错过同一时间段的培训」这一例子说明什么？","a":["生活在世界上的人都会存在各式各样的基本冲突；一般冲突不至于真正置换为症状性问题。"],"k":["基本冲突人人都有","不至于置换为症状"],"src":"§1 冲突与置换","refs":[]},{"id":"k041","sid":"213c4d26e7","cat":"selfdis","q":"为什么说自体疾患比神经症更为严重？","a":["自体疾患比神经症更为严重；科胡特所说的自恋人格障碍，即属于一类十分广泛的自体疾患。"],"k":["比神经症更严重","十分广泛的自体疾患"],"src":"§2 自体疾患","refs":[]},{"id":"k042","sid":"35558cd92d","cat":"selfdis","q":"DSM-5 中的自恋人格障碍与自体心理学的自体疾患是什么关系？","a":["二者有重大区别；DSM-5 中的自恋人格障碍只占自体心理学中自体疾患的一小部分。"],"k":["有重大区别","只占一小部分"],"src":"§2 自体疾患","refs":[]},{"id":"k043","sid":"6f4e920116","cat":"selfdis","q":"科胡特所说的自体疾患指什么？","a":["很大一类症状群，指个体在自体和自体感方面存在不稳定、不统整、不连续的问题，表现形式多样。"],"k":["不稳定","不统整","不连续","表现形式多样"],"src":"§2 自体疾患","refs":[]},{"id":"k044","sid":"1b409f0adc","cat":"selfdis","q":"自体疾患的形成往往与什么有关？","a":["个体在发展过程中，在与自体客体需要相关的位置，受到了与羞耻、误解、曲解等相关的不恰当回应或者创伤。"],"k":["自体客体需要位置","羞耻误解曲解","不恰当回应或创伤"],"src":"§2 形成","refs":[]},{"id":"k045","sid":"f575786b2e","cat":"selfdis","q":"相较于神经症的形成过程，自体疾患所受的打击有哪三个特点？","a":["遭受的打击通常更大，受冲击的连续时间更长，创伤发生的时间也更早。"],"k":["打击更大","持续更长","发生更早"],"src":"§2 形成","refs":[]},{"id":"k046","sid":"2a93bd6538","cat":"selfdis","q":"创伤或挫折产生时，个体的自体感会出现什么？","a":["会出现某种断裂，但这种断裂、不连续、不内聚、不统整的程度尚未达到精神病性水平。"],"k":["自体感断裂","尚未达到精神病性水平"],"src":"§2 断裂程度","refs":[]},{"id":"k047","sid":"74122580be","cat":"selfdis","q":"精神病性创伤与自体疾患在体验连续性上的区别是什么？","a":["在精神病性创伤中，体验的连续性出现严重断裂；而在自体疾患中，体验的连续性仅出现轻微断裂。"],"k":["严重断裂","轻微断裂"],"src":"§2 断裂程度","refs":[]},{"id":"k048","sid":"43d9bb6f83","cat":"selfdis","q":"自体疾患的基本结构主体是否稳定？会被什么侵扰？","a":["基本结构主体虽然是稳定的，但是会不时受到某些感觉的侵扰，且这种侵扰很严重；诸如空虚、无意义、乏味、无聊感。"],"k":["主体稳定","空虚无意义乏味无聊","侵扰严重"],"src":"§2 断裂程度","refs":[]},{"id":"k049","sid":"848ed208b1","cat":"selfdis","q":"这类来访者可能出现怎样的「外在良好、内在空洞」的反差？","a":["可能在工作方面表现良好，但同时又体验到很深的空虚感。"],"k":["工作表现良好","很深的空虚感"],"src":"§2 断裂程度","refs":[]},{"id":"k050","sid":"0ca7531bd7","cat":"selfdis","q":"咨询师应特别重视自体疾患来访者的哪些位置？","a":["其自体的连续性和统整性通常存在缺陷，这些有缺陷的位置应引起咨询师的重视。"],"k":["连续性与统整性缺陷","有缺陷的位置"],"src":"§2 断裂程度","refs":[]},{"id":"k051","sid":"829c41edaa","cat":"selfdis","q":"科胡特把自体疾患分为哪两类？各有何别称？","a":["第一类称为自恋人格障碍，也称自恋人格疾患；第二类称为自恋行为障碍，也称自恋行为疾患。"],"k":["自恋人格障碍／疾患","自恋行为障碍／疾患"],"src":"§2 两类分法","refs":[]},{"id":"k052","sid":"75f8dfd0f4","cat":"two","q":"两位施虐／受虐行为爱好者在线上交流时，表现出什么？","a":["交流很投机，并感到很兴奋，两人的需求看起来是一致的。"],"k":["线上投机","很兴奋","需求看似一致"],"src":"案例：两类自恋疾患见面","refs":["案02"],"ctx":"【案例二 · 施虐／受虐爱好者见面】就本例情节提问"},{"id":"k053","sid":"238b659f48","cat":"two","q":"两人见面后，有自恋人格疾患的人的偏好停留在哪里？","a":["停留在言语和幻想层面，仅通过言说和想象即可满足，并没有采取实际行为的需要。"],"k":["言语和幻想层面","言说与想象即可满足"],"src":"案例：两类自恋疾患见面","refs":["案02"],"ctx":"【案例二 · 施虐／受虐爱好者见面】就本例情节提问"},{"id":"k054","sid":"94c0e2c49d","cat":"two","q":"有自恋行为疾患的人为什么必须要付诸行动？","a":["他可能需要借助工具实施虐待行为才能够获得满足。"],"k":["必须付诸行动","借助工具实施虐待"],"src":"案例：两类自恋疾患见面","refs":["案02"],"ctx":"【案例二 · 施虐／受虐爱好者见面】就本例情节提问"},{"id":"k055","sid":"cd61bf3595","cat":"two","q":"自恋人格疾患与自恋行为疾患在严重程度上有什么区别？","a":["有自恋人格疾患的人的问题相对较轻；有自恋行为疾患的人的问题更严重，因为他们可能会将想法付诸行动，其危险性也更高，治疗难度更大。"],"k":["前者较轻","后者更严重","危险性更高","治疗难度更大"],"src":"案例：两类自恋疾患见面","refs":["案02"],"ctx":"【案例二 · 施虐／受虐爱好者见面】由本例引出的一般规律／论断"},{"id":"k056","sid":"20c543814d","cat":"two","q":"两类自体疾患者各用什么方式应对内在感受？","a":["有自恋人格疾患的人通过幻想来抵抗自己的抑郁感和虚弱感；有自恋行为疾患的人则通过实际行动让自己获得存在感。"],"k":["幻想抵抗抑郁与虚弱","行动获得存在感"],"src":"案例：两类自恋疾患见面","refs":["案02"],"ctx":"【案例二 · 施虐／受虐爱好者见面】由本例引出的一般规律／论断"},{"id":"k057","sid":"3e5f67f611","cat":"two","q":"临床上如何区分这两种自体疾患？","a":["可以通过患者的具体症状表现来区分：偏好停留在幻想与言说，还是已经付诸行动。"],"k":["具体症状表现","幻想还是行动"],"src":"§2 两类之辨","refs":[]},{"id":"k058","sid":"6b50075881","cat":"two","q":"科胡特把癔症归到哪一类？理由是什么？","a":["归到自恋人格疾患的症状里；他认为癔症患者的人格状态和自体感都很松散，因此癔症更类似于与自恋相关的自体缺陷问题。"],"k":["癔症","人格状态与自体感松散","自体缺陷问题"],"src":"§2 癔症归属","refs":[]},{"id":"k059","sid":"28e941d698","cat":"two","q":"关于癔症是否属于神经症，书中提到哪两种看法？","a":["癔症在弗洛伊德的观点中被视为神经症的一种，但也有人认为癔症不属于神经症。"],"k":["弗洛伊德视为神经症","也有人认为不是"],"src":"§2 癔症归属","refs":[]},{"id":"k060","sid":"ed46227f50","cat":"two","q":"相对常见的中度和重度抑郁症，可能属于什么范畴？需要澄清什么？","a":["可能属于自恋人格障碍的范畴；这里所说的并非 DSM-5 中所定义的自恋人格障碍。"],"k":["中重度抑郁","自恋人格障碍","非 DSM-5 定义"],"src":"§2 抑郁","refs":[]},{"id":"k061","sid":"4bbc128d7f","cat":"two","q":"「空心病」是谁提出的？作者如何看它的归属？","a":["由我国的徐凯文老师提出；作者认为它其实是自恋人格障碍的一个亚型。"],"k":["徐凯文","自恋人格障碍的亚型"],"src":"§2 空心病","refs":[]},{"id":"k062","sid":"9b99a8f604","cat":"two","q":"「空心病」在国外被称为什么，出现在什么时候？","a":["美国在 20 世纪六七十年代就有许多类似案例，当时的美国存在主义心理学家将其称为「存在性神经症」。"],"k":["20 世纪六七十年代","美国存在主义心理学家","存在性神经症"],"src":"§2 空心病","refs":[]},{"id":"k063","sid":"3ecdd3989d","cat":"two","q":"「空心病」患者的主观体验与适应功能有什么特点？","a":["患者觉得生活空洞、没有意义，但在生活方面他们都能较好地适应。"],"k":["生活空洞没有意义","生活适应较好"],"src":"§2 空心病","refs":[]},{"id":"k064","sid":"79e5b92fe8","cat":"high","q":"什么是高功能自恋人格疾患个体？书中举了哪些身份？","a":["社会功能特别高的一类来访者，可能是成功的企业家、大学教授、音乐家或某领域的专家。"],"k":["社会功能特别高","企业家／教授／音乐家／专家"],"src":"§2 高功能","refs":[]},{"id":"k065","sid":"bcf33f4e2c","cat":"high","q":"高功能自恋人格疾患个体的成功与什么相关？用什么方法逃避内心空虚？","a":["其成功与自身的自恋追求相关；逃避内心空虚的方法就是追求卓越的成就。"],"k":["自恋追求","追求卓越成就"],"src":"§2 高功能","refs":[]},{"id":"k066","sid":"2e7ae25e05","cat":"high","q":"高功能自恋人格疾患个体的困难在哪里？","a":["在获得了自己所期望的成就之后，他们很难享受这种成就。"],"k":["获得成就后难以享受"],"src":"§2 高功能","refs":[]},{"id":"k067","sid":"b5199838eb","cat":"high","q":"企业家在努力推进项目的过程中，体验到什么？","a":["十分投入，并因此获得了清晰的存在感，自体的统整性也很高。"],"k":["十分投入","清晰的存在感","统整性高"],"src":"案例：成功后的空虚","refs":["案03"],"ctx":"【案例三 · 企业家成功之后】就本例情节提问"},{"id":"k068","sid":"06bdb976dc","cat":"high","q":"目标即将实现时，这位企业家感受到的是什么？","a":["并非一般人体验到的喜悦和充实，而是一种莫名的无聊感和无意义感——「成功了又怎么样？」"],"k":["无聊感","无意义感","成功了又怎么样"],"src":"案例：成功后的空虚","refs":["案03"],"ctx":"【案例三 · 企业家成功之后】就本例情节提问"},{"id":"k069","sid":"8ecb6799fb","cat":"high","q":"「成功了又怎么样？」之后，他的自体状态发生了什么变化？","a":["霎时间自体的统整性功能也随之瓦解；他突然觉得很孤独，仿佛没人能够与他联结，并对之前热衷的事业产生巨大的幻灭感，成功后的获利在他看来并没什么价值。"],"k":["统整性瓦解","孤独","幻灭感","获利无价值"],"src":"案例：成功后的空虚","refs":["案03"],"ctx":"【案例三 · 企业家成功之后】就本例情节提问"},{"id":"k070","sid":"6323dbda56","cat":"high","q":"这类来访者往往怎样逃避成功后的心理困境？","a":["往往是设定一个更高的目标。"],"k":["设定更高的目标"],"src":"案例：成功后的空虚","refs":["案03"],"ctx":"【案例三 · 企业家成功之后】由本例引出的一般规律／论断"},{"id":"k071","sid":"496f089683","cat":"high","q":"由企业家一例可见，高功能自恋人格疾患者的成就与内心体验是什么关系？","a":["一个人在现实世界中的成功不一定与他的内心世界相匹配；自恋人格疾患可能带来许多创造性成就，但这些成就往往与他内心的体验不匹配，二者是断裂的。"],"k":["现实成功不必匹配内心","成就与体验断裂"],"src":"案例：成功后的空虚","refs":["案03"],"ctx":"【案例三 · 企业家成功之后】由本例引出的一般规律／论断"},{"id":"k072","sid":"7063dd8d14","cat":"high","q":"高功能自恋人格疾患来访者还有一个什么特点？","a":["亲密关系或者婚姻往往存在很大的问题。"],"k":["亲密关系","婚姻问题"],"src":"§2 高功能","refs":[]},{"id":"k073","sid":"eb7b1f4fe1","cat":"high","q":"为什么给这类高成就来访者做治疗难度较高？","a":["因为许多高成就的现象会掩盖当代社会的许多问题：好像一个人一旦拥有财富或取得某些社会认定的成功，所有的问题就都消失了。"],"k":["高成就掩盖问题","治疗难度高"],"src":"§2 高功能","refs":[]},{"id":"k074","sid":"d591b6575e","cat":"behav","q":"自恋行为疾患的核心特点是什么？","a":["付诸行动：患者不仅会幻想一些事情，还会把幻想的内容直接做出来；其所做之事的社会认可度往往较低。"],"k":["付诸行动","把幻想做出来","社会认可度低"],"src":"§2 自恋行为疾患","refs":[]},{"id":"k075","sid":"f3721f6995","cat":"behav","q":"书中列出哪些表现属于自恋行为疾患？","a":["性倒错、露阴癖、窥阴癖、癔症型人格障碍、强迫型人格障碍、反社会型人格障碍。"],"k":["性倒错","露阴癖","窥阴癖","癔症型／强迫型／反社会型人格障碍"],"src":"§2 自恋行为疾患","refs":[]},{"id":"k076","sid":"a81895fd5c","cat":"behav","q":"癔症型人格障碍又称什么？它与「癔症」有什么关系？","a":["又称表演型人格障碍；它和与自恋人格疾患相关的癔症完全不同。"],"k":["表演型人格障碍","与癔症完全不同"],"src":"§2 癔症型人格障碍","refs":[]},{"id":"k077","sid":"625defd2d3","cat":"behav","q":"癔症与癔症型人格障碍在表现上有什么区别？","a":["癔症通常表现为发作性的歇斯底里、意识解离或者戏剧化行为；癔症型人格障碍的表现则是在生活中把幻想当作真实。"],"k":["发作性歇斯底里／意识解离／戏剧化","把幻想当真实"],"src":"§2 癔症型人格障碍","refs":[]},{"id":"k078","sid":"3a5830ad5c","cat":"behav","q":"癔症型人格障碍者「把幻想当作真实」可以表现为怎样的行为？","a":["若他爱上某一个人并多次表达爱意无果，依旧会死缠烂打；而且会像表演一样做一些事情，比如哭、闹等，并且这种行为是长期的。"],"k":["死缠烂打","像表演一样哭闹","长期"],"src":"§2 癔症型人格障碍","refs":[]},{"id":"k079","sid":"10de8fb236","cat":"behav","q":"癔症型人格障碍来访者的治疗难度如何？","a":["治疗起来也会相对复杂。"],"k":["相对复杂"],"src":"§2 癔症型人格障碍","refs":[]},{"id":"k080","sid":"73dd848e5c","cat":"behav","q":"到强迫型人格障碍来访者家拜访，进门时他会要求什么？","a":["让你把鞋脱下来，并且把你的鞋底擦干净。"],"k":["脱鞋","擦净鞋底"],"src":"案例：强迫型人格障碍","refs":["案04"],"ctx":"【案例四 · 擦鞋底与消毒杯子】就本例情节提问"},{"id":"k081","sid":"1fe4fc7e8a","cat":"behav","q":"当客人坐到床上、以及倒水之前，主人分别做了什么？","a":["马上请你坐沙发并立即在床上喷洒酒精；倒水之前用酒精将每一个杯子消毒，并说「我都消过毒了，水是很干净的」。"],"k":["请坐沙发","床上喷酒精","每个杯子消毒"],"src":"案例：强迫型人格障碍","refs":["案04"],"ctx":"【案例四 · 擦鞋底与消毒杯子】就本例情节提问"},{"id":"k082","sid":"24e5dee115","cat":"behav","q":"擦鞋底与消毒杯子这一例子是被当作什么提出来的？","a":["强迫型人格障碍的典型行为表现；而强迫型人格障碍属于自恋行为疾患的表现。"],"k":["强迫型人格障碍典型行为","自恋行为疾患"],"src":"案例：强迫型人格障碍","refs":["案04"],"ctx":"【案例四 · 擦鞋底与消毒杯子】由本例引出的一般规律／论断"},{"id":"k083","sid":"f005616117","cat":"behav","q":"反社会型人格障碍在哪些人群中很常见？其思路有什么特点？","a":["在服刑人员中很常见；其思路和常人不一样。"],"k":["服刑人员","思路与常人不同"],"src":"§2 反社会型人格障碍","refs":[]},{"id":"k084","sid":"46a9cf6b37","cat":"behav","q":"面对「为什么要骗别人的钱」，电信诈骗犯给出了哪两类理由？","a":["有的人表示他是为了社会才牺牲自己去当坏人，因为有了坏人才有好人；还有人表示自己是为了让别人从中学到一些社会经验。"],"k":["牺牲自己当坏人","让别人学到社会经验"],"src":"案例：反社会人格障碍","refs":["案05"],"ctx":"【案例五 · 电信诈骗犯的理由】就本例情节提问"},{"id":"k085","sid":"61330c3531","cat":"behav","q":"警察认为诈骗犯在说谎，他们自己怎么看待这些说法？","a":["有反社会人格障碍的人不觉得自己在说谎，他们自己对此深信不疑，没有说谎的感觉，而是认为自己真的在为社会做好事。"],"k":["不觉得说谎","深信不疑","认为在做好事"],"src":"案例：反社会人格障碍","refs":["案05"],"ctx":"【案例五 · 电信诈骗犯的理由】就本例情节提问"},{"id":"k086","sid":"7fe0be890f","cat":"behav","q":"诈骗犯怎样解释受害者被骗这件事，甚至如何看待自己？","a":["他们认为受害者被骗了之后这辈子就不会再被骗了，如果这次没被骗以后会被别人骗得更多；他们甚至还觉得自己无辜。"],"k":["受害者不会再被骗","觉得自己无辜"],"src":"案例：反社会人格障碍","refs":["案05"],"ctx":"【案例五 · 电信诈骗犯的理由】就本例情节提问"},{"id":"k087","sid":"285689c5f8","cat":"behav","q":"这一过程体现出自恋的什么特点？对临床工作有何影响？","a":["注意力完全集中在自己身上，完全不顾及别人的感受；咨询师在临床上遇到这类反社会人格障碍的患者时，工作也很难开展。"],"k":["注意力全在自己","不顾别人感受","工作难开展"],"src":"案例：反社会人格障碍","refs":["案05"],"ctx":"【案例五 · 电信诈骗犯的理由】由本例引出的一般规律／论断"},{"id":"k088","sid":"57851882f7","cat":"behav","q":"近年来哪些饮食障碍可以考虑归入自恋行为疾患？理由是什么？","a":["厌食症、暴食症等饮食障碍中严重的类型；其症状往往与控制感有关，但这种控制常超出正常范围。"],"k":["厌食症／暴食症严重类型","控制感超出正常范围"],"src":"§2 饮食障碍","refs":[]},{"id":"k089","sid":"a5fa75b8d5","cat":"behav","q":"暴食症女孩一顿饭吃下了什么，吃完之后怎样？","a":["两份套餐、五个茶叶蛋、一碗红烧肉、五根香蕉，并喝完两瓶水和两瓶碳酸饮料；肚子胀到整个人动弹不得，只能躺下，等食物逐渐消化后才能动。"],"k":["两份套餐","五个茶叶蛋","动弹不得只能躺下"],"src":"案例：暴食与厌食","refs":["案06"],"ctx":"【案例六 · 暴食症女孩与厌食症】就本例情节提问"},{"id":"k090","sid":"4944dfb2db","cat":"behav","q":"暴食症为什么会转变为厌食症？","a":["为了控制体重而节食，长期如此身体健康会出现问题、身体系统濒临崩溃，暴食症可能就会转变为厌食症；若内脏系统崩溃进而衰竭，就会危及生命。"],"k":["节食控制体重","身体系统濒临崩溃","内脏衰竭危及生命"],"src":"案例：暴食与厌食","refs":["案06"],"ctx":"【案例六 · 暴食症女孩与厌食症】就本例情节提问"},{"id":"k091","sid":"5e20433ee0","cat":"behav","q":"暴食症与厌食症在致死风险上有什么不同？","a":["暴食症通常不会直接致命，而厌食症却有较高的致死风险。"],"k":["暴食症不直接致命","厌食症致死风险较高"],"src":"案例：暴食与厌食","refs":["案06"],"ctx":"【案例六 · 暴食症女孩与厌食症】由本例引出的一般规律／论断"},{"id":"k092","sid":"7115b631db","cat":"psy","q":"在精神病结构的分类上，科胡特较弗洛伊德做了什么？","a":["做了更完整的划分，把精神病结构分为三类：两类阴性结构和一类阳性结构。"],"k":["两类阴性","一类阳性","更完整的划分"],"src":"§3 精神病结构","refs":[]},{"id":"k093","sid":"11998776eb","cat":"psy","q":"阴性结构与阳性结构分别指什么？","a":["阴性结构是指表面上没有明显的精神病发作的表现；阳性结构是指表面上已经有精神病发作的表现。"],"k":["无明显发作表现","已有发作表现"],"src":"§3 精神病结构","refs":[]},{"id":"k094","sid":"4751121a71","cat":"psy","q":"精神病结构患者的自体连续性与统整性有什么特点？","a":["往往十分混乱和破碎，即使偶尔在某些事情上表现良好，整体表现也仍然存在不足。"],"k":["混乱破碎","偶尔良好但整体不足"],"src":"§3 精神病结构","refs":[]},{"id":"k095","sid":"fc112b7903","cat":"psy","q":"精神病患者也可能表现出自恋，这种自恋有什么特点？","a":["他的自恋结构性很弱，且缺乏连续性。"],"k":["结构性很弱","缺乏连续性"],"src":"§3 精神病结构","refs":[]},{"id":"k096","sid":"e3a0774071","cat":"psy","q":"阳性结构常见的症状有哪些？","a":["就是一般的精神病，常见的症状包括幻听、幻视、幻触等幻觉。"],"k":["幻听","幻视","幻触"],"src":"§3 阳性结构","refs":[]},{"id":"k097","sid":"907b9591b3","cat":"psy","q":"为什么说精神病的谱系十分广泛，并非发作时出现幻觉才算？","a":["有些偏执狂也属于典型的精神病——他们没有幻听、幻视等表现，但是说话时逻辑断裂、思维飘逸；这种状态同样属于精神病阳性发作的实际症状。"],"k":["偏执狂无幻觉","逻辑断裂","思维飘逸"],"src":"§3 阳性结构","refs":[]},{"id":"k098","sid":"71578bc6f2","cat":"psy","q":"没有精神科实习背景的心理学家容易对哪一点认识不足？","a":["容易认识不到没有幻听幻视、但逻辑断裂与思维飘逸的偏执狂同样属于精神病阳性发作。"],"k":["无幻觉也属阳性发作","逻辑断裂与思维飘逸"],"src":"§3 阳性结构","refs":[]},{"id":"k099","sid":"b055134883","cat":"psy","q":"科胡特认为出现精神病阳性症状的来访者只能怎么处理？","a":["只能去医院进行住院治疗，这类情况需要药物干预，而无法通过精神分析真正疗愈。"],"k":["住院治疗","药物干预","精神分析无法真正疗愈"],"src":"§3 阳性结构与治疗","refs":[]},{"id":"k100","sid":"c9dbf2ba28","cat":"psy","q":"为什么对精神病阳性症状的来访者进行过多内省反而有害？","a":["因为这类来访者如果内省过多，反而会诱发精神病。"],"k":["内省过多","诱发精神病"],"src":"§3 阳性结构与治疗","refs":[]},{"id":"k101","sid":"855815940c","cat":"psy","q":"遇到具有精神病阳性症状表现的患者，最好不要怎么做？","a":["最好不要给他做精神分析治疗。"],"k":["不做精神分析治疗"],"src":"§3 阳性结构与治疗","refs":[]},{"id":"k102","sid":"b8f00e272a","cat":"psy","q":"如果一定要为阳性症状患者做心理治疗，应采用什么方式？","a":["只能做类似于认知行为疗法的心理治疗，帮助他适应社会，增强具有适应性的自我功能。"],"k":["类认知行为疗法","适应社会","增强适应性自我功能"],"src":"§3 阳性结构与治疗","refs":[]},{"id":"k103","sid":"27043e5760","cat":"psy","q":"以精神科药物治疗为主、辅以精神分析工作时，对诠释有什么要求？","a":["不能强调退行，而应强调较为浅层的诠释。"],"k":["不强调退行","较为浅层的诠释"],"src":"§3 阳性结构与治疗","refs":[]},{"id":"k104","sid":"3ab73477af","cat":"psy","q":"科胡特提出的精神病阴性分类包括哪两类？","a":["边缘型人格障碍和偏执-分裂型人格障碍两类。"],"k":["边缘型","偏执-分裂型"],"src":"§3 阴性结构","refs":[]},{"id":"k105","sid":"39623fcb9d","cat":"border","q":"边缘型人格障碍来访者的基本人格结构是什么？","a":["是精神病结构。"],"k":["精神病结构"],"src":"§3 边缘型","refs":[]},{"id":"k106","sid":"b1ea1774cd","cat":"border","q":"科胡特所说的边缘型人格障碍通常指哪一类？","a":["通常是指带有严重自伤自残行为、自我功能显著受损的类型。"],"k":["严重自伤自残","自我功能显著受损"],"src":"§3 边缘型","refs":[]},{"id":"k107","sid":"37e230dbbd","cat":"border","q":"科胡特的边缘型人格障碍分类与哪个学派的通行分类不同？","a":["与当下比较流行的、以科恩伯格为代表的精神分析自我心理学派的边缘型人格障碍分类不同。"],"k":["科恩伯格","自我心理学派","定义不同"],"src":"§3 边缘型","refs":[]},{"id":"k108","sid":"6f3d629fac","cat":"border","q":"科胡特所定义的边缘型人格障碍患者会出现哪些极端情绪？","a":["他认为你对他好时，就会非常认可、崇拜你；在亲密关系中察觉到危险信号，就会很害怕被抛弃；当你要结束关系时，会用歇斯底里的方式要挟你，比如割腕、自杀、自残等。"],"k":["认可崇拜","怕被抛弃","割腕自杀自残要挟"],"src":"§3 边缘型","refs":[]},{"id":"k109","sid":"dbbad41ead","cat":"border","q":"那位严重低功能的边缘型来访者为什么用极端自伤方式？","a":["用来分散内心的痛苦。"],"k":["极端自伤","分散内心痛苦"],"src":"案例：点燃发胶","refs":["案07"],"ctx":"【案例七 · 点燃定型发胶的手】就本例情节提问"},{"id":"k110","sid":"de1b7f46cd","cat":"border","q":"听到男友说「我们分手了，我不会再回来了」之后，她做了什么？","a":["马上把定型发胶喷在自己手上并点燃，用灼烧的疼痛感来降低内心的痛苦，并借此给自己「找事做」——去医院治疗手伤。"],"k":["定型发胶喷手点燃","灼烧止痛","给自己找事做"],"src":"案例：点燃发胶","refs":["案07"],"ctx":"【案例七 · 点燃定型发胶的手】就本例情节提问"},{"id":"k111","sid":"5d401f64de","cat":"border","q":"由点燃发胶一例可见，这类来访者的自体结构在正常状态与断裂时有何不同？","a":["这类来访者在正常状态下与常人无异，自体的结构是连续的；但当他的自体结构断裂时，他就像完全变了一个人。"],"k":["正常时与常人无异","断裂时像变一个人"],"src":"案例：点燃发胶","refs":["案07"],"ctx":"【案例七 · 点燃定型发胶的手】由本例引出的一般规律／论断"},{"id":"k112","sid":"52e10f72ef","cat":"border","q":"面对「对自己好的人在一件小事上对自己不好」，正常人与边缘型来访者反应有何不同？","a":["正常人可能只是有些不开心，或问问对方为什么，真的失望最多疏远对方，不至于有过激行为；边缘型人格障碍患者则会用很激烈的方式来表达。"],"k":["正常人不至过激","边缘型激烈表达"],"src":"§3 边缘型","refs":[]},{"id":"k113","sid":"da58565d51","cat":"border","q":"边缘型来访者虽行为激烈，却缺少哪些表现？其后果是什么？","a":["没有思维飘逸、逻辑断裂等影响社会正常功能的表现，但其行为让其社会关系变得很混乱，并与现实世界脱节。"],"k":["无思维飘逸逻辑断裂","社会关系混乱","与现实脱节"],"src":"§3 边缘型","refs":[]},{"id":"k114","sid":"5bfb8376d9","cat":"border","q":"偏执-分裂型来访者的症状群包含哪三种人格障碍？","a":["偏执型人格障碍、分裂样人格障碍和分裂型人格障碍。"],"k":["偏执型","分裂样","分裂型"],"src":"§3 偏执-分裂型","refs":[]},{"id":"k115","sid":"4c1fc3ea41","cat":"border","q":"偏执型来访者的偏执想法有哪些特点？","a":["往往有很多偏执的想法，而且这种想法不是一闪而过，而是持续存在的。"],"k":["很多偏执想法","持续存在","不是一闪而过"],"src":"§3 偏执-分裂型","refs":[]},{"id":"k116","sid":"68ec05ae86","cat":"border","q":"路上有人回头看了他一眼，偏执型来访者会怎么想？","a":["就会怀疑对方对自己有恶意，而且这种想法不是一闪而过，而是持续存在的。"],"k":["回头看一眼","怀疑恶意","持续存在"],"src":"案例：偏执想法","refs":["案08"],"ctx":"【案例八 · 回头看一眼与同学散开】就本例情节提问"},{"id":"k117","sid":"f0dd8c945a","cat":"border","q":"同学们说「今天就说到这里」然后散开，他会立刻想到什么？","a":["他立刻就会想到这些同学在背后说他的坏话。"],"k":["同学散开","背后说坏话"],"src":"案例：偏执想法","refs":["案08"],"ctx":"【案例八 · 回头看一眼与同学散开】就本例情节提问"},{"id":"k118","sid":"77f89b838f","cat":"border","q":"产生猜忌之后，他会怎样处理这些想法？","a":["把这些想法投射到他人身上，认为他们对自己不好，或者要对自己做出不好的事情，从而纠结于自己要不要报复。"],"k":["投射到他人","认为要对自己不利","纠结要不要报复"],"src":"案例：偏执想法","refs":["案08"],"ctx":"【案例八 · 回头看一眼与同学散开】就本例情节提问"},{"id":"k119","sid":"3ea735173e","cat":"border","q":"这类充满猜忌的想法是什么的表现？","a":["正是偏执型人格障碍的表现。"],"k":["偏执型人格障碍"],"src":"案例：偏执想法","refs":["案08"],"ctx":"【案例八 · 回头看一眼与同学散开】由本例引出的一般规律／论断"},{"id":"k120","sid":"22ebf9d6a6","cat":"border","q":"分裂类型人格障碍来访者在社会交往上有什么特点？","a":["往往表现出一定程度的社会交往隔离，在关系中表现得十分疏离。"],"k":["社会交往隔离","关系疏离"],"src":"§3 分裂类型","refs":[]},{"id":"k121","sid":"2fb27502fa","cat":"border","q":"偏执型与分裂类型人格障碍的偏执想法，在表达上有什么不同？","a":["偏执型的偏执想法是外投的，会直接实施或表达出来；分裂类型如果有偏执的想法，通常不会说出来。"],"k":["偏执型外投","分裂类型不说出来"],"src":"案例：分裂类型的疏离","refs":["案09"],"ctx":"【案例九 · 怀疑之后就疏远】就本例情节提问"},{"id":"k122","sid":"0f9022d576","cat":"border","q":"分裂类型来访者怀疑你对他不好时，会怎么做？","a":["就会和你保持距离，避免和你接触。"],"k":["保持距离","避免接触"],"src":"案例：分裂类型的疏离","refs":["案09"],"ctx":"【案例九 · 怀疑之后就疏远】就本例情节提问"},{"id":"k123","sid":"5a84f0b917","cat":"border","q":"若怀疑有人在背后说自己坏话，分裂类型来访者会怎样？","a":["就不会再与此人交流，并远离其所在的环境；在关系中表现得十分疏离是这类人的特点。"],"k":["不再交流","远离环境","关系疏离"],"src":"案例：分裂类型的疏离","refs":["案09"],"ctx":"【案例九 · 怀疑之后就疏远】由本例引出的一般规律／论断"},{"id":"k124","sid":"23802e13b0","cat":"border","q":"情况严重时，具有这两类阴性结构的来访者有什么风险？","a":["转换成精神分裂症的可能性较大。"],"k":["转换成精神分裂症","可能性较大"],"src":"§3 阴性结构","refs":[]},{"id":"k125","sid":"01d16c5638","cat":"border","q":"临床上，边缘型结构与偏执-分裂型结构在性别分布上有什么差异？","a":["在边缘型结构来访者中，女性占比较高；而在偏执-分裂型结构来访者中，男性更为常见。"],"k":["边缘型女性较多","偏执-分裂型男性更常见"],"src":"§3 阴性结构","refs":[]},{"id":"k126","sid":"c11a0bc584","cat":"work","q":"人格评估的准确性对咨询师的工作为什么意义重大？","a":["它可以帮助咨询师确定应采用何种系统方法对来访者开展工作。"],"k":["确定系统方法","评估准确性"],"src":"§4 评估的意义","refs":[]},{"id":"k127","sid":"6dd84e80ba","cat":"work","q":"基于人格水平评估发现来访者属于精神病结构时，首先要明确什么？","a":["要明确区分其精神病结构是阳性还是阴性。"],"k":["区分阳性与阴性"],"src":"§4 评估的意义","refs":[]},{"id":"k128","sid":"8ba38f073a","cat":"work","q":"对阳性精神病结构的来访者，咨询师可以进行什么工作？有哪些前提？","a":["只能进行辅助治疗，而且必须是在患者康复期，即在精神病症状消失之后，并且是在患者遵循医嘱服药的情况下。"],"k":["只能辅助治疗","康复期症状消失","遵循医嘱服药"],"src":"§4 评估的意义","refs":[]},{"id":"k129","sid":"69cfa5f19e","cat":"work","q":"对阴性精神病结构的来访者，咨询师通常要采用什么方式？","a":["通常要采用以支持性为主的方式。"],"k":["支持性为主"],"src":"§4 评估的意义","refs":[]},{"id":"k130","sid":"c220587e9c","cat":"work","q":"对有精神病结构的来访者工作时，座位安排有什么禁忌？为什么？","a":["要和他面对面坐，而绝对不能使用躺椅；因为躺椅可能诱发精神分裂症或者退行表现。"],"k":["面对面坐","绝对不用躺椅","诱发精神分裂或退行"],"src":"§4 工作方式","refs":[]},{"id":"k131","sid":"7275468b63","cat":"work","q":"边缘型或偏执-分裂型结构的来访者，一旦被诱发什么状态可能非常危险？","a":["一旦被诱发出偏执或者严重退行的状态，可能会引发非常危险的情况。"],"k":["诱发偏执","严重退行","危险"],"src":"§4 工作方式","refs":[]},{"id":"k132","sid":"146c1c63a0","cat":"work","q":"已经开始与有精神病结构的来访者工作时，咨询师为什么要做自我评估？","a":["因为你面对的是一位为你带来极大压力的来访者；如果压力过大，你可能会无力胜任。"],"k":["带来极大压力","压力过大无力胜任"],"src":"§4 工作方式","refs":[]},{"id":"k133","sid":"2d2ffdcad9","cat":"work","q":"面对有精神病结构的来访者，自我评估要问自己什么？","a":["我是否要接第二个有精神病结构的来访者？或者第三个？"],"k":["是否接第二个","第三个"],"src":"§4 工作方式","refs":[]},{"id":"k134","sid":"9840b17c7a","cat":"work","q":"面对神经症和自体疾患的来访者，工作难度如何？","a":["工作相对容易开展。"],"k":["相对容易"],"src":"§4 工作方式","refs":[]},{"id":"k135","sid":"f6219fc977","cat":"work","q":"神经症结构的来访者为什么更适合使用躺椅？","a":["因为这类来访者通常能非常好地完成自由联想的部分。"],"k":["躺椅","自由联想完成得好"],"src":"§4 工作方式","refs":[]},{"id":"k136","sid":"f00ab4b265","cat":"work","q":"面对有自体疾患的来访者，咨询师在方法上要怎样把握？","a":["要视具体情况而定，不同来访者适用的回应方式并不相同。"],"k":["视具体情况而定","不一律"],"src":"§4 自体疾患的回应","refs":[]},{"id":"k137","sid":"f54c8a65fd","cat":"work","q":"对某些有自体疾患的来访者，咨询师过于沉默会带来什么？","a":["他们会有一种被忽视感，认为咨询师不关注他们、不认真倾听他们，或一点儿都不理解他们。"],"k":["被忽视感","不关注不倾听不理解"],"src":"§4 自体疾患的回应","refs":[]},{"id":"k138","sid":"3ce9f17b59","cat":"work","q":"长期用语言贬低咨询师的自体疾患来访者，在临床上会带来什么？","a":["其临床表现多为用语言直接贬低咨询师，且长期反复如此，使咨询师陷入被动，每次咨询结束后都会有挫败感。"],"k":["直接贬低","长期反复","咨询师挫败感"],"src":"§4 自体疾患的回应","refs":[]},{"id":"k139","sid":"ef731cc688","cat":"work","q":"面对反复贬低咨询师的自体疾患来访者，应选用怎样的回应方式？","a":["选用有效的回应方式，如复述他的语言、尝试表浅的理解，逐步协助其解决内心深处的问题，而非直接使用躺椅。"],"k":["复述语言","表浅理解","逐步协助","不直接用躺椅"],"src":"§4 自体疾患的回应","refs":[]},{"id":"k140","sid":"428d52e225","cat":"work","q":"为什么对另一些有自体疾患的来访者不宜采用复述或小结式回应？","a":["因为这类回应会让来访者感到被贬低，甚至被激怒。"],"k":["感到被贬低","甚至被激怒"],"src":"§4 自体疾患的回应","refs":[]},{"id":"k141","sid":"615e4827c3","cat":"work","q":"对不宜复述与小结的来访者，咨询师应如何安排临床过程？","a":["先相对沉默地倾听，在关系性过程变得更适合交流的时候，再逐步过渡到互动性临床过程。"],"k":["先相对沉默倾听","关系性过程","逐步过渡到互动性"],"src":"§4 自体疾患的回应","refs":[]},{"id":"k142","sid":"169d545656","cat":"level","q":"人格水平和症状是什么关系？","a":["不是同一件事情。"],"k":["不是同一件事"],"src":"§4 人格水平与症状","refs":[]},{"id":"k143","sid":"6b0f755c8d","cat":"level","q":"「人格水平」指的是什么？这是一种什么层面的理解？","a":["指当事人目前发展的人格结构类型，而非其外显行为；这是一种病理学层面的理解。"],"k":["人格结构类型","非外显行为","病理学层面"],"src":"§4 人格水平与症状","refs":[]},{"id":"k144","sid":"e9b77c67ea","cat":"level","q":"第一种强迫思维的人与自己辩论什么？还伴随哪些较单一的行为？","a":["他总是担心自己会跳楼，一边想着「我是不会跳楼的」，一边又想着「谁能保证我不会跳楼？」，随后陷入惊恐，直到头昏脑胀才停下来；较单一的强迫行为还包括反复洗手、清洁等。"],"k":["担心跳楼","谁能保证","反复洗手清洁"],"src":"案例：三种强迫","refs":["案10"],"ctx":"【案例十 · 三种强迫思维】就本例情节提问"},{"id":"k145","sid":"d0af8d315d","cat":"level","q":"第二种强迫思维的人反复就医时，怀疑是怎样不断转移的？","a":["怀疑患肝癌却仅有轻度脂肪肝，又觉得脂肪肝会癌变；接下来觉得胃痛担心胃癌、小便不适担心膀胱癌，不断检查都没有问题，仍怀疑医生疏忽大意，甚至担心检查过程本身导致他患病。"],"k":["疑肝癌","脂肪肝癌变","胃癌与膀胱癌","怀疑医生与检查"],"src":"案例：三种强迫","refs":["案10"],"ctx":"【案例十 · 三种强迫思维】就本例情节提问"},{"id":"k146","sid":"ea55691d78","cat":"level","q":"第三种强迫思维的人对坐便器上的一滴液体有哪些担心？","a":["怀疑它是别人的尿液，并担心它会透过皮肤侵入自己的身体，或担心在使用坐便器时细菌会渗透皮肤使自己感染病菌；这类想法挥之不去。"],"k":["一滴液体","透过皮肤侵入","细菌渗透感染"],"src":"案例：三种强迫","refs":["案10"],"ctx":"【案例十 · 三种强迫思维】就本例情节提问"},{"id":"k147","sid":"49f042da8f","cat":"level","q":"上述三种强迫思维分别对应哪个人格水平？","a":["第一种（担心跳楼、反复洗手）更多显示神经症的特点，属神经症水平的强迫症；第二种（过度关注躯体健康）属自体缺陷水平的强迫症；第三种（担心病毒入侵）是精神病性水平强迫症的典型表现。"],"k":["神经症水平","自体缺陷水平","精神病性水平"],"src":"案例：三种强迫","refs":["案10"],"ctx":"【案例十 · 三种强迫思维】由本例引出的一般规律／论断"},{"id":"k148","sid":"ea282ce717","cat":"level","q":"为什么诊断强迫思维时不能只停留在症状学层面？","a":["三种情况均存在强迫思维的表现，但其具体内容与所属的人格结构完全不同；强迫仅属于表象性的症状学诊断，并不等同于人格层面的诊断。"],"k":["内容相同结构不同","表象性症状学诊断","不等同人格诊断"],"src":"案例：三种强迫","refs":["案10"],"ctx":"【案例十 · 三种强迫思维】由本例引出的一般规律／论断"},{"id":"k149","sid":"8022dd5092","cat":"level","q":"听到来访者有侵入性的想法时，为什么即使暂无阳性症状也要十分警惕？","a":["因为他有可能具有精神病结构，或处于精神病的前兆阶段。"],"k":["侵入性想法","精神病结构","前兆阶段"],"src":"案例：三种强迫","refs":["案10"],"ctx":"【案例十 · 三种强迫思维】由本例引出的一般规律／论断"},{"id":"k150","sid":"ebb16e3743","cat":"level","q":"第二种强迫思维在书中被称为什么？","a":["体现出一种疑病症的强迫思维。"],"k":["疑病症的强迫思维"],"src":"§4 三种强迫","refs":[]},{"id":"k151","sid":"f542d29e1e","cat":"level","q":"督导案例中，咨询师报告的来访者担心什么？","a":["表达出对如厕污染的担忧，并担心厕所中的病菌侵入自己的身体。"],"k":["如厕污染","病菌侵入身体"],"src":"案例：督导转介","refs":["案11"],"ctx":"【案例十一 · 督导：如厕污染的担忧】就本例情节提问"},{"id":"k152","sid":"5e2e43dac5","cat":"level","q":"听到这一报告后，督导给出了什么提示？咨询师最初的反应是什么？","a":["提示咨询师这位来访者可能存在精神病性问题；一开始咨询师不太相信。"],"k":["可能存在精神病性问题","起初不信"],"src":"案例：督导转介","refs":["案11"],"ctx":"【案例十一 · 督导：如厕污染的担忧】就本例情节提问"},{"id":"k153","sid":"e3d9d0f403","cat":"level","q":"一个月后这一案例的走向与结果是什么？","a":["来访者的情况变得越来越严重，咨询师想起提示后立即将其转介到医院；医院诊断的结果是妄想型精神分裂症。"],"k":["一个月后加重","立即转介","妄想型精神分裂症"],"src":"案例：督导转介","refs":["案11"],"ctx":"【案例十一 · 督导：如厕污染的担忧】就本例情节提问"},{"id":"k154","sid":"1604ecef9a","cat":"level","q":"这类疾病在有征兆后多久被发现、并遵医嘱服药，预后通常较好？","a":["在有征兆后的 2～3 个月内被发现，并且患者遵医嘱服药，那么预后通常会比较好。"],"k":["2～3 个月","遵医嘱服药","预后较好"],"src":"案例：督导转介","refs":["案11"],"ctx":"【案例十一 · 督导：如厕污染的担忧】由本例引出的一般规律／论断"},{"id":"k155","sid":"75724c8038","cat":"level","q":"若延误到半年、一年甚至两三年、中间经历多次复发才服药，后果如何？","a":["这时其人格可能已经转为难治型精神病，康复的可能性很低，甚至会慢慢退行至木僵状态。"],"k":["难治型精神病","康复可能性很低","退行至木僵"],"src":"§4 预后","refs":[]},{"id":"k156","sid":"f90c9b1ad5","cat":"level","q":"从来访者的白日梦中也可以区分出什么？","a":["可以区分出不同的人格水平。"],"k":["白日梦","区分人格水平"],"src":"§4 白日梦","refs":[]},{"id":"k157","sid":"deebcae4a3","cat":"level","q":"遇到挫折时，第一种人的白日梦表现是什么？","a":["想问问朋友，听听朋友的意见。"],"k":["问朋友","听意见"],"src":"案例：三种幻想水平","refs":["案12"],"ctx":"【案例十二 · 三种白日梦】就本例情节提问"},{"id":"k158","sid":"ab24d3525a","cat":"level","q":"第二种人的白日梦里，幻想自己变成什么、被谁环绕？","a":["幻想自己突然变身，比如变成美少女战士或秘密特工；或想象特种部队突然从一架直升机上降下来，环绕着他，并且在他的指挥下突破困境。"],"k":["美少女战士／秘密特工","特种部队","受他指挥"],"src":"案例：三种幻想水平","refs":["案12"],"ctx":"【案例十二 · 三种白日梦】就本例情节提问"},{"id":"k159","sid":"5b789794bf","cat":"level","q":"第三种人对「有人在背后算计他」持什么态度？","a":["坚信有人在背后算计他，因而产生一种恐惧感，并确信其猜测十有八九是真的。"],"k":["坚信被算计","恐惧感","确信猜测是真的"],"src":"案例：三种幻想水平","refs":["案12"],"ctx":"【案例十二 · 三种白日梦】就本例情节提问"},{"id":"k160","sid":"3d41e42530","cat":"level","q":"三种幻想水平分别代表哪种人格水平？会衍生出什么？","a":["第一种只是寻求朋友的建议，属于神经症；第二种具有超级幻想、以戏剧化形式呈现，更像是自体疾患的表现；第三种更符合精神病性结构。三种不同的幻想水平代表三种不同的人格水平，并会衍生出对应的症状。"],"k":["神经症","自体疾患","精神病性结构","衍生对应症状"],"src":"案例：三种幻想水平","refs":["案12"],"ctx":"【案例十二 · 三种白日梦】由本例引出的一般规律／论断"},{"id":"k161","sid":"45c34454b5","cat":"level","q":"目前自体心理学约有多少种人格分类方法？差异来自哪里？","a":["约有 4～5 种；这些分类方法的差异并不在于患者本身的不同，而在于分类方式或对心理结构的理解方法不同。"],"k":["4～5 种","分类方式","对心理结构的理解"],"src":"§4 分类方法","refs":[]},{"id":"k162","sid":"d3b6f6a7d0","cat":"school","q":"科恩伯格发展的当代自我心理学把人格结构分为哪三种类型？","a":["神经症性、边缘性及精神病性。"],"k":["神经症性","边缘性","精神病性"],"src":"§5 自我心理学","refs":[]},{"id":"k163","sid":"290298ba53","cat":"school","q":"使用科恩伯格的「边缘性结构」这一名称时要注意什么？","a":["此处边缘性结构的定义与自体心理学中的边缘性结构存在很大区别。"],"k":["定义差异","同名不同义"],"src":"§5 自我心理学","refs":[]},{"id":"k164","sid":"02681585e6","cat":"school","q":"自我心理学中的许多高功能边缘性来访者，在自体心理学中被归为哪一类？","a":["被归类为有自体疾患的来访者。"],"k":["高功能边缘性","归为自体疾患"],"src":"§5 分类对照","refs":[]},{"id":"k165","sid":"9a6f28829a","cat":"school","q":"科胡特所说的严重边缘型或偏执-分裂型人格障碍，在科恩伯格体系中归到哪一级？","a":["被归类为边缘型障碍水平。"],"k":["边缘型障碍水平","科恩伯格"],"src":"§5 分类对照","refs":[]},{"id":"k166","sid":"8edb21732e","cat":"school","q":"这些人格分类上的不同是由什么造成的？","a":["由学派的差异造成，即分类方式与对心理结构的基本观点不同。"],"k":["学派差异"],"src":"§5 分类对照","refs":[]},{"id":"k167","sid":"c04a8456e1","cat":"school","q":"当代客体关系理论中的依恋理论把依恋类型分为哪四种？","a":["安全型、焦虑型、回避型和混乱型。"],"k":["安全型","焦虑型","回避型","混乱型"],"src":"§5 依恋理论","refs":[]},{"id":"k168","sid":"e7c7a7e33e","cat":"school","q":"欧洲的法国经典精神分析学派与拉康派分析家沿用了怎样的分类？","a":["延续弗洛伊德的一套分类方法，把所有症状都划分为癔症（或神经症）、精神病、性倒错三类。"],"k":["癔症或神经症","精神病","性倒错"],"src":"§5 法国与拉康派","refs":[]},{"id":"k169","sid":"d8150d755b","cat":"school","q":"有些法国分析家遇到科恩伯格所认为的边缘型人格障碍时，会将其视为什么？","a":["会将其视为癔症。"],"k":["视为癔症"],"src":"§5 法国与拉康派","refs":[]},{"id":"k170","sid":"1266320f46","cat":"school","q":"学生的评估为什么被审核老师认为是错误的？","a":["她以自体心理学的分类方法进行人格评估，而审核老师属于另外一个学派，不了解自体心理学。"],"k":["自体心理学分类","审核老师属另一学派"],"src":"案例：学派之间的评估","refs":["案13"],"ctx":"【案例十三 · 学生的评估被判错】就本例情节提问"},{"id":"k171","sid":"70bdc37f82","cat":"school","q":"由这一例子可见，应当怎样看待不同评估方式之间的结论差异？","a":["这些评估使用的名称可能有差异，但其内容并不一定不同；评估结论之间的差异并不必然意味着某一方理解不足或存在知识上的欠缺，而可能源于不同学派在一些基本观点上的差异。这一点在学习过程和未来的专业发展中都需要加以注意。"],"k":["名称有差异内容不一定不同","不必然理解不足","源于学派基本观点差异"],"src":"案例：学派之间的评估","refs":["案13"],"ctx":"【案例十三 · 学生的评估被判错】由本例引出的一般规律／论断"},{"id":"k172","sid":"4f3c5bf164","cat":"lookup","q":"哪个案例说明「随机事件与内心冲突形成条件反射式联结，冲突能量置换为恐惧症」？","a":["情节详见案01：正在调整强烈冲突时被飞过的蜜蜂惊吓，此后听到蜂鸣或类似声音就惊恐焦虑的蜂鸣恐惧症。"],"k":["案01","蜂鸣恐惧症","置换"],"src":"案例速查","refs":["案01"]},{"id":"k173","sid":"81d83a3ca2","cat":"lookup","q":"哪个案例用「线上需求看似一致、见面后一个停在幻想一个必须行动」区分两类自体疾患？","a":["情节详见案02：两位施虐／受虐行为爱好者的线上交流与见面之别。"],"k":["案02","自恋人格疾患","自恋行为疾患"],"src":"案例速查","refs":["案02"]},{"id":"k174","sid":"565eef5ab7","cat":"lookup","q":"哪个案例说明高功能来访者在目标即将实现时体验到无聊、孤独与幻灭？","a":["情节详见案03：推进项目时统整性很高、成功后却问「成功了又怎么样」的企业家。"],"k":["案03","高功能","成功后空虚"],"src":"案例速查","refs":["案03"]},{"id":"k175","sid":"7aa27ddbe6","cat":"lookup","q":"哪个案例用擦鞋底、床上喷酒精、消毒杯子说明强迫型人格障碍的典型行为？","a":["情节详见案04：到访者家做客时主人一系列的清洁要求。"],"k":["案04","强迫型人格障碍","典型行为"],"src":"案例速查","refs":["案04"]},{"id":"k176","sid":"0029abf502","cat":"lookup","q":"哪个案例里诈骗犯深信自己在为社会做好事，甚至觉得自己无辜？","a":["情节详见案05：警察审讯电信诈骗犯时得到的两类理由。"],"k":["案05","反社会型人格障碍","注意力全在自己"],"src":"案例速查","refs":["案05"]},{"id":"k177","sid":"08d3613979","cat":"lookup","q":"哪个案例里一顿饭吃下两份套餐与五个茶叶蛋，后来可能因节食转为厌食症？","a":["情节详见案06：暴食症女孩的食量、控制体重与身体系统濒临崩溃。"],"k":["案06","暴食症","厌食症","控制感"],"src":"案例速查","refs":["案06"]},{"id":"k178","sid":"20283df0e3","cat":"lookup","q":"哪个案例用点燃定型发胶的灼烧疼痛来分散内心痛苦？","a":["情节详见案07：男友拒绝回心转意后，严重低功能边缘型来访者的自伤。"],"k":["案07","边缘型","极端自伤"],"src":"案例速查","refs":["案07"]},{"id":"k179","sid":"b1951edc4b","cat":"lookup","q":"哪个案例里「回头看一眼」与「今天就说到这里」引发持续的猜忌与报复纠结？","a":["情节详见案08：偏执型来访者的两个日常场景。"],"k":["案08","偏执型","投射"],"src":"案例速查","refs":["案08"]},{"id":"k180","sid":"9264379ca7","cat":"lookup","q":"哪个案例里来访者怀疑之后并不说出来，而是保持距离、远离其所在环境？","a":["情节详见案09：分裂类型人格障碍者的疏离。"],"k":["案09","分裂类型","不外投"],"src":"案例速查","refs":["案09"]},{"id":"k181","sid":"7c75f12e00","cat":"lookup","q":"哪个案例并列了担心 {"id":"k223","sid":"30783de4d5","cat":"cloze","q":"填空：「这类疾病若在有征兆后的＿＿内被发现，并且患者遵医嘱服药，那么预后通常会比较好。」","a":["2～3 个月。"],"k":["2～3 个月"],"src":"§4 预后","refs":[]},{"id":"k224","sid":"19e4cc1e7c","cat":"cloze","q":"填空：「在科恩伯格发展的当代自我心理学的人格评估中，人格结构被分为三种类型，即＿＿、＿＿及＿＿。」","a":["神经症性","边缘性","精神病性"],"k":["神经症性","边缘性","精神病性"],"src":"§5 自我心理学","refs":[]},{"id":"k225","sid":"ddd2e2bb7f","cat":"cloze","q":"填空：「依恋类型分为＿＿、＿＿、＿＿和＿＿。」","a":["安全型","焦虑型","回避型","混乱型"],"k":["安全型","焦虑型","回避型","混乱型"],"src":"§5 依恋理论","refs":[]},{"id":"k226","sid":"5eaf100eff","cat":"cloze","q":"填空：「评估结论之间的差异，并不必然意味着某一方理解不足，而可能源于＿＿。」","a":["不同学派在一些基本观点上的差异。"],"k":["不同学派基本观点的差异"],"src":"§5 学派差异","refs":[]},{"id":"案01","sid":"b8843be929","cat":"neuro","q":"案例一 · 蜜蜂与蜂鸣恐惧症｜先读情节","a":["当一个人正在调整内部某种强烈冲突的时候，不巧被飞过的蜜蜂惊吓到。","这个人就可能由此患上蜂鸣恐惧症，此后一听到蜂鸣或类似的声音便会很惊恐、很焦虑。"],"k":["调整强烈冲突","被蜜蜂惊吓","蜂鸣恐惧症","听到类似声音就惊恐"],"src":"案例：蜂鸣恐惧症","refs":["案01"],"intro":1,"case":"一","follow":"后面几张卡问：恐惧症怎样形成、冲突的能量去了哪里，以及哪类冲突会置换为症状。"},{"id":"案02","sid":"522775e466","cat":"two","q":"案例二 · 施虐／受虐爱好者见面｜先读情节","a":["一个有自恋人格疾患的人是施虐／受虐行为爱好者，他与另一位有自恋行为疾患的施虐／受虐行为爱好者在线上的交流很投机，并感到很兴奋。两人的需求看起来是一致的。","但是，两人见面时，差别便显现出来：有自恋人格疾患的人的偏好停留在言语和幻想层面，仅通过言说和想象即可满足，并没有采取实际行为的需要。","而有自恋行为疾患的人必须要付诸行动，他可能需要借助工具实施虐待行为才能够获得满足。"],"k":["线上投机兴奋","停留在言语和幻想","必须付诸行动"],"src":"案例：两类自恋疾患见面","refs":["案02"],"intro":1,"case":"二","follow":"后面几张卡问：两者的区别、相对严重程度与治疗难度，以及各自用什么方式应对内在感受。"},{"id":"案03","sid":"5443c91aa4","cat":"high","q":"案例三 · 企业家成功之后｜先读情节","a":["一位有自恋人格疾患的企业家，在努力推进某个项目的过程中十分投入，并因此获得了清晰的存在感，自体的统整性也很高。","然而，当目标即将实现的时候，他感受到的并非一般人体验到的喜悦和充实，而是一种莫名的无聊感和无意义感——「成功了又怎么样？」霎时间，自体的统整性功能也随之瓦解。","在他的感受中，他突然觉得很孤独，仿佛没人能够与他联结，于是他突然对之前热衷的事业产生巨大的幻灭感；成功后的获利在他看来并没什么价值。"],"k":["推进项目时投入","成功了又怎么样","统整性瓦解","孤独与幻灭"],"src":"案例：成功后的空虚","refs":["案03"],"intro":1,"case":"三","follow":"后面几张卡问：这属于哪类来访者、逃避这种困境的方法，以及成就与内心体验的关系。"},{"id":"案04","sid":"81749f61e0","cat":"behav","q":"案例四 · 擦鞋底与消毒杯子｜先读情节","a":["你到一位强迫型人格障碍来访者家拜访，进门时他就会让你把鞋脱下来，并且把你的鞋底擦干净。","如果你进入房间后坐在他的床上，他马上会说：「不好意思，你坐沙发上吧！不要坐床上。」接着他会立即在床上喷洒酒精，喷洒后再来招待你。","在倒水之前，他会用酒精将每一个杯子消毒，就像有洁癖一样，并且对你说：「我都消过毒了，水是很干净的。」"],"k":["脱鞋擦鞋底","不要坐床上","喷酒精","每个杯子消毒"],"src":"案例：强迫型人格障碍","refs":["案04"],"intro":1,"case":"四","follow":"后面几张卡问：这是哪一型人格障碍、属于哪一类自体疾患，以及这类疾患的核心特点。"},{"id":"案05","sid":"fc671bc343","cat":"behav","q":"案例五 · 电信诈骗犯的理由｜先读情节","a":["当警察审讯一些电信诈骗犯，问他们为什么要骗别人的钱时，有的人表示他是为了社会才牺牲自己去当坏人，因为有了坏人才有好人；还有人表示自己是为了让别人从中学到一些社会经验，所以才去做坏事。","警察认为他们在说谎，但是有反社会人格障碍的人不觉得自己在说谎，他们自己对此深信不疑，认为自己真的在为社会做好事。","他们认为，受害者被骗了之后，这辈子就不会再被骗了；如果这次没被骗，以后会被别人骗得更多。他们甚至还觉得自己无辜。"],"k":["牺牲自己当坏人","让别人学到社会经验","不觉得自己在说谎","觉得自己无辜"],"src":"案例：反社会人格障碍","refs":["案05"],"intro":1,"case":"五","follow":"后面几张卡问：属于哪种人格障碍、表现出怎样的自恋特点，以及临床工作为何难开展。"},{"id":"案06","sid":"b07cc88ae0","cat":"behav","q":"案例六 · 暴食症女孩与厌食症｜先读情节","a":["我曾见过一个患有暴食症的女孩，身高 1.6 米，体形瘦小，一顿饭能吃下两份套餐、五个茶叶蛋、一碗红烧肉、五根香蕉，并能喝完两瓶水和两瓶碳酸饮料。全部吃完之后，她的肚子胀到整个人动弹不得，只能躺下。","为了控制体重而节食（她的体重可能只有 35 千克），长期如此，身体健康会出现问题，身体系统濒临崩溃。","暴食症可能就会转变为厌食症；若内脏系统崩溃，进而衰竭，就会危及生命。"],"k":["1.6 米","两份套餐与五个茶叶蛋","控制体重而节食","转为厌食症"],"src":"案例：暴食与厌食","refs":["案06"],"intro":1,"case":"六","follow":"后面几张卡问：症状与控制感的关系、为何可归入自恋行为疾患，以及两者的致死风险之别。"},{"id":"案07","sid":"a5148713ff","cat":"border","q":"案例七 · 点燃定型发胶的手｜先读情节","a":["曾经有一位严重低功能的边缘型人格障碍来访者，她会用极端的自伤方式来分散内心的痛苦。","当她要求男朋友回心转意的时候，她男朋友说：「我们分手了，我不会再回来了。」她听到后马上把定型发胶喷在自己手上并点燃。","她用灼烧的疼痛感来降低内心的痛苦，并借此给自己「找事做」——去医院治疗手伤。"],"k":["极端自伤","要求回心转意","喷定型发胶并点燃","用疼痛降低内心痛苦"],"src":"案例：点燃发胶","refs":["案07"],"intro":1,"case":"七","follow":"后面几张卡问：属于哪种人格结构、极端情绪的表现，以及自体结构断裂时会怎样。"},{"id":"案08","sid":"3e20491b56","cat":"border","q":"案例八 · 回头看一眼与同学散开｜先读情节","a":["偏执型来访者走在路上看到有人回头看了他一眼，就会怀疑对方对自己有恶意，而且这种想法不是一闪而过，而是持续存在的。","再如，同学们正在交谈，看到他走过来便说「今天就说到这里」，然后散开了，他立刻就会想到这些同学在背后说他的坏话。","接下来，他就会把这些想法投射到他人身上，认为他们对自己不好，或者要对自己做出不好的事情，从而纠结于自己要不要报复。"],"k":["回头看一眼","不是一闪而过","同学散开说「今天就说到这里」","投射与要不要报复"],"src":"案例：偏执想法","refs":["案08"],"intro":1,"case":"八","follow":"后面几张卡问：属于哪一类阴性结构、偏执想法的特点，以及与分裂类型的差别。"},{"id":"案09","sid":"99ad5e1810","cat":"border","q":"案例九 · 怀疑之后就疏远｜先读情节","a":["分裂类型（分裂样和分裂型）人格障碍的来访者往往表现出一定程度的社会交往隔离。","偏执型人格障碍的来访者的偏执想法是外投的，他们会直接实施或表达出来；而分裂类型人格障碍的来访者如果有偏执的想法，通常不会说出来。","如果他们怀疑你对他们不好，他们就会和你保持距离，避免和你接触；如果怀疑有人在背后说自己的坏话，他们就不会再与此人交流，并远离其所在的环境。"],"k":["社会交往隔离","偏执想法不外投","保持距离避免接触","关系疏离"],"src":"案例：分裂类型的疏离","refs":["案09"],"intro":1,"case":"九","follow":"后面几张卡问：与偏执型的差别、关系上的特点，以及情况严重时的转归。"},{"id":"案10","sid":"b2ac05b35d","cat":"level","q":"案例十 · 三种强迫思维｜先读情节","a":["第一位来访者总是担心自己会跳楼，每次产生这个念头时，他心里一边想着「我是不会跳楼的」，一边又想着「谁能保证我不会跳楼？」，随后便陷入惊恐；他用这样的强迫思维和自己辩论，直到头昏脑胀才停下来。较为单一的强迫行为还包括反复洗手、清洁等。","第二位来访者怀疑自己患有某种疾病，经常去医院检查，查来查去没有任何异常，但依旧担心脂肪肝会癌变、胃痛是胃癌、小便不适是膀胱癌，甚至怀疑医生疏忽大意、担心检查过程本身导致他患病。","第三位来访者使用公共厕所的坐便器后，突然发现坐便器上有一滴液体，便开始怀疑它是别人的尿液，并担心它会透过皮肤侵入自己的身体，或担心细菌会渗透皮肤使自己感染病菌；这类想法在他的脑海中挥之不去。"],"k":["担心跳楼与反复洗手","反复查病疑癌","坐便器上一滴液体","担心病菌侵入"],"src":"案例：三种强迫","refs":["案10"],"intro":1,"case":"十","follow":"后面几张卡问：三种分别对应哪个人格水平、诊断强迫时应注意什么，以及侵入性想法为何要警惕。"},{"id":"案11","sid":"8fd7acdd41","cat":"level","q":"案例十一 · 督导：如厕污染的担忧｜先读情节","a":["在许多年前的某次督导中，一位咨询师报告其来访者表达出对如厕污染的担忧，并担心厕所中的病菌侵入自己的身体。","我提示咨询师，这位来访者可能存在精神病性问题，一开始咨询师不太相信。","一个月后，来访者的情况变得越来越严重，咨询师这时想起我的话，立即将其转介到医院；医院诊断的结果是，这位来访者患有妄想型精神分裂症。"],"k":["如厕污染与病菌侵入","提示可能存在精神病性问题","一个月后加重","妄想型精神分裂症"],"src":"案例：督导转介","refs":["案11"],"intro":1,"case":"十一","follow":"后面几张卡问：这一提示依据什么、早期发现与预后的关系，以及延误治疗的后果。"},{"id":"案12","sid":"d3270b501b","cat":"level","q":"案例十二 · 三种白日梦｜先读情节","a":["一些人在遇到挫折时，想问问朋友，听听朋友的意见。","另一些人的内心表现可能是幻想自己突然变身，比如变成美少女战士或秘密特工，或想象特种部队突然从一架直升机上降下来，环绕着他，并且在他的指挥下突破困境。","还有一种人则坚信有人在背后算计他，因而产生一种恐惧感，并确信其猜测十有八九是真的。"],"k":["问问朋友的意见","变身与超级幻想","特种部队受我指挥","坚信有人背后算计"],"src":"案例：三种幻想水平","refs":["案12"],"intro":1,"case":"十二","follow":"后面几张卡问：三种幻想分别代表哪个人格水平，以及幻想水平与症状的关系。"},{"id":"案13","sid":"34248c79a1","cat":"school","q":"案例十三 · 学生的评估被判错｜先读情节","a":["我的一个学生以自体心理学的分类方法进行人格评估的时候，由于审核老师属于另外一个学派，不了解自体心理学，所以认为她的评估是错误的。"],"k":["自体心理学分类方法","审核老师属另一学派","被认为评估错误"],"src":"案例：学派之间的评估","refs":["案13"],"intro":1,"case":"十三","follow":"后面几张卡问：评估结论的差异说明什么，以及学习过程中要注意什么。"}];

if(s0&&s0.cat==='__intro__'){s0.cat='all';persist();}
if(s0&&Object.keys(s0).length){
  if(s0.cat&&[...$('fCat').options].some(o=>o.value===s0.cat))$('fCat').value=s0.cat;
  if(s0.order&&[...$('fOrder').options].some(o=>o.value===s0.order))$('fOrder').value=s0.order;
  $('fWeak').checked=!!s0.weak;$('fRecite').checked=!!s0.recite;$('fReverse').checked=!!s0.reverse;
}
function renderChips(){
  const box=$('chips');box.innerHTML='';
  const all=document.createElement('span');
  all.className='chip'+($('fCat').value==='all'?' on':'');
  if($('fCat').value==='all')all.style.background='#2f4f6f';
  all.textContent='全部 '+CARDS.length;
  all.onclick=()=>{$('fCat').value='all';saveSettings();buildDeck();};
  box.appendChild(all);
  const iN=CARDS.filter(x=>x.intro).length;
  const ic=document.createElement('span');
  ic.className='chip'+($('fCat').value==='__intro__'?' on':'');
  if($('fCat').value==='__intro__')ic.style.background='#8a6a3e';
  ic.textContent='案例情节 '+iN;
  ic.title='集中浏览全部案例情节介绍卡（正常复习时介绍卡会自动插在对应案例题卡之前）';
  ic.onclick=()=>{$('fCat').value='__intro__';saveSettings();buildDeck();};
  box.appendChild(ic);
  CATS.forEach(c=>{
    const n=CARDS.filter(x=>x.cat===c.k).length;
    const el=document.createElement('span');
    el.className='chip'+($('fCat').value===c.k?' on':'');
    if($('fCat').value===c.k)el.style.background=c.color;
    el.title=c.note;
    el.innerHTML=c.label+'<i>'+n+'</i>';
    el.onclick=()=>{$('fCat').value=c.k;saveSettings();buildDeck();};
    box.appendChild(el);
  });
}

/* ============ 卡组 ============ */
function stat(v){return v===3?'✓ 记得':v===2?'· 模糊':'○ 未评';}
/* 情节卡不参与排序：在案例题卡「首次呈现」之前插入对应介绍。
   perSegment=true（知识模块顺序）：同一案例的题卡分成不同区段时，每段前都插一次
   （案例速查是反查练习，离原案例很远，需要重新给情节）。
   perSegment=false（弱项/随机/掌握度）：每个案例全局只插一次，避免介绍卡淹没题卡。 */
function anchorIntros(body, perSegment){
  const intros={}; CARDS.forEach(c=>{if(c.intro)intros[c.id]=c;});
  const out=[], seenKeys=new Set(), seenCards=new Set(); let last='';
  body.forEach(c=>{
    const refs=(c.refs||[]).filter(r=>intros[r]);
    const key=refs.join('|');
    const need=refs.length&&(perSegment?(key!==last):!seenKeys.has(key));
    if(need){
      if(perSegment){
        refs.forEach(r=>out.push(intros[r]));
      }else{
        /* 打散排序下按「单张情节卡」去重：案例速查⑦ 同时指向案10/案11，
           若这两个案例在别处已介绍过，就不再重复插入 */
        refs.forEach(r=>{if(!seenCards.has(r)){out.push(intros[r]);seenCards.add(r);}});
      }
      seenKeys.add(key);
    }
    last=refs.length?key:'';
    out.push(c);
  });
  return out;
}
function buildDeck(keep){
  const s=settings();
  const introOnly=(s.cat==='__intro__');
  deck=CARDS.filter(c=>{
    if(introOnly){if(!c.intro)return false;}
    else{if(c.intro)return false;if(s.cat!=='all'&&c.cat!==s.cat)return false;}
    if(s.weak&&(saved.status[c.sid]||0)>=3)return false;
    return true;
  });
  if(s.order==='seq')deck.sort((a,b)=>CATIDX[a.cat]-CATIDX[b.cat]||CARDS.indexOf(a)-CARDS.indexOf(b));
  if(s.order==='status')deck.sort((a,b)=>(saved.status[a.sid]||0)-(saved.status[b.sid]||0));
  if(s.order==='weak'){const wk=sid=>{const v=saved.status[sid]||0;return v===0?1.5:v;};deck.sort((a,b)=>wk(a.sid)-wk(b.sid)||Math.random()-.5);}
  if(s.order==='rand')deck=deck.slice().sort(()=>Math.random()-.5);
  /* 排序完成后再锚定情节卡：与所选顺序无关，保证介绍总在该案例题卡之前 */
  if(!introOnly)deck=anchorIntros(deck,s.order==='seq');
  if(keep&&pos<deck.length){}else{pos=0;}
  if(pos>=deck.length)pos=0;
  renderChips();updateStats();show();
}

function updateStats(){
  const s=settings();
  const introOnly=(s.cat==='__intro__');
  const pool=introOnly?CARDS.filter(c=>c.intro)
    :(s.cat==='all'?CARDS:CARDS.filter(c=>c.cat===s.cat)).filter(c=>!c.intro);
  const done=pool.filter(c=>(saved.status[c.sid]||0)>0).length;
  const got=pool.filter(c=>(saved.status[c.sid]||0)===3).length;
  const nIntro=deck.filter(c=>c.intro).length;
  $('statText').textContent=(introOnly?'案例情节 '+pool.length+' 张':'本模块 '+pool.length+' 张题卡')
    +' ｜ 已评 '+done+' ｜ 记得 '+got+' ｜ 当前卡组 '+deck.length+' 张'
    +(introOnly?'':'（含情节卡 '+nIntro+'）');
  $('progText').textContent=done+'/'+pool.length;
  $('bar').style.width=(pool.length?done/pool.length*100:0)+'%';
  $('countHint').textContent=deck.length?(pos+1)+' / '+deck.length:'当前筛选无卡片';
}

/* ============ 渲染 ============ */
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function show(){
  const box=$('cardArea');
  const oldEmpty=box.querySelector('.empty');if(oldEmpty)oldEmpty.remove();
  if(!deck.length){
    $('front').innerHTML='<div class="empty">当前筛选下没有卡片。<br>试着取消「只看未掌握」，或换一个模块。</div>';
    $('back').innerHTML='';$('card').classList.remove('flipped');
    updateStats();return;
  }
  const c=deck[pos],col=CATMAP[c.cat].color,st=saved.status[c.sid]||0;
  const s=settings();
  flipped=false;$('card').classList.remove('flipped');mineText='';
  $('card').style.setProperty('--cc',col);
  const badge=c.intro?'案例情节 · 先读':CATMAP[c.cat].label;
  const head='<div class="top"><span class="badge'+(c.intro?' introBadge':'')+'" style="background:'+col+'">'+badge+'　·　'+stat(st)+'</span><span class="idx">'+c.id+'　'+(pos+1)+'/'+deck.length+'</span></div>';
  const foot='<div class="src">所在小节：'+esc(c.src)+'　｜　徐钧《自体心理学入门》第五章</div>';

  /* 案例情节卡：正面直接印出情节，不用翻面就能读到背景；背面给记忆抓手。
     不进入默写／反向提问（它不是问答题）。 */
  if(c.intro){
    const body='<div class="introBody">'+c.a.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>';
    $('front').innerHTML=head+'<div class="q">'+esc(c.q)+'</div>'+body+
      '<div class="introHint">'+esc(c.follow||'')+'　·　无需翻面，读完直接进入后面的提问卡。</div>'+foot;
    $('back').innerHTML=head+'<div class="q">'+esc(c.q)+' · 记忆抓手</div>'+
      '<div class="kw">合上卡片试着自己复述情节，再核对关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>'+
      '<div class="introHint">'+esc(c.follow||'')+'</div>'+foot;
    $('flip').textContent='翻面看记忆抓手（空格）';
    updateStats();return;
  }

  let q=c.q, a=c.a;
  if(s.reverse){ q=c.a.join('　／　'); a=[c.q]; }
  const big=q.length>95?' big':'';

  const ctxHtml=c.ctx?'<div class="ctx">'+esc(c.ctx)+'</div>':'';
  if(s.recite&&!s.reverse){
    $('front').innerHTML=head+ctxHtml+'<div class="q'+big+'">'+esc(q)+'</div>'+
      '<textarea id="mine" placeholder="先在这里写下你的答案／背诵要点，再点「核对并翻面」…"></textarea>'+foot;
    const ta=$('mine');
    if(ta){ta.onclick=e=>e.stopPropagation();ta.oninput=()=>{mineText=ta.value;};ta.value='';}
  }else{
    $('front').innerHTML=head+ctxHtml+'<div class="q'+big+'">'+esc(q)+'</div>'+foot;
  }

  let back=head+(s.reverse?'':ctxHtml)+'<ul class="aList">'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(s.recite&&!s.reverse&&mineText.trim()){
    back+='<div class="mine"><b>你的默写</b>'+esc(mineText.trim())+'</div>';
    const hits=c.k.filter(w=>mineText.indexOf(w)>=0);
    back+='<div class="hit">关键词命中 '+hits.length+' / '+c.k.length+(hits.length?'：'+esc(hits.join('、')):'　— 建议对照全文再背一遍')+'</div>';
  }
  if(!s.reverse&&c.k.length){
    back+='<div class="kw">关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>';
  }
  back+=foot;
  $('back').innerHTML=back;
  $('flip').textContent=s.recite&&!s.reverse?'核对并翻面（空格）':'翻面看答案（空格）';
  updateStats();
}
function flip(){
  if(!deck.length)return;
  const s=settings();
  if(s.recite&&!s.reverse&&!flipped){const ta=$('mine');if(ta)mineText=ta.value;}
  if(!flipped&&s.recite&&!s.reverse&&!deck[pos].intro){showKeepMine();}
  flipped=!flipped;$('card').classList.toggle('flipped',flipped);
  $('flip').textContent=flipped?'返回正面（空格）':(deck[pos].intro?'翻面看记忆抓手（空格）':(s.recite&&!s.reverse?'核对并翻面（空格）':'翻面看答案（空格）'));
}
/* 翻面前把默写内容写进背面（不重置卡片状态） */
function showKeepMine(){
  const c=deck[pos],col=CATMAP[c.cat].color,st=saved.status[c.sid]||0,s=settings();
  const head='<div class="top"><span class="badge" style="background:'+col+'">'+CATMAP[c.cat].label+'　·　'+stat(st)+'</span><span class="idx">'+c.id+'　'+(pos+1)+'/'+deck.length+'</span></div>';
  const foot='<div class="src">所在小节：'+esc(c.src)+'　｜　徐钧《自体心理学入门》第五章</div>';
  let back=head+'<ul class="aList">'+c.a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(mineText.trim()){
    back+='<div class="mine"><b>你的默写</b>'+esc(mineText.trim())+'</div>';
    const hits=c.k.filter(w=>mineText.indexOf(w)>=0);
    back+='<div class="hit">关键词命中 '+hits.length+' / '+c.k.length+(hits.length?'：'+esc(hits.join('、')):'　— 建议对照全文再背一遍')+'</div>';
  }
  back+='<div class="kw">关键词：'+c.k.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>'+foot;
  $('back').innerHTML=back;
}
function go(d){if(!deck.length)return;pos=(pos+d+deck.length)%deck.length;show();}
function rate(v){if(!deck.length)return;saved.status[deck[pos].sid]=v;persist();go(1);}

/* ============ 导出 ============ */
function download(name,text,type){
  const blob=new Blob(['\ufeff'+text],{type:type||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},200);
}
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}
$('btnCSV').onclick=()=>{
  const rows=[['编号','模块','语境','问题 / 情节标题','答案 / 情节正文','关键词','所在小节']];
  CARDS.forEach(c=>rows.push([c.id,c.intro?'案例情节':CATMAP[c.cat].label,c.ctx||'',c.q,c.a.join(' / '),c.k.join(' / '),c.src]));
  download('第5章_知识闪卡.csv',rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');
};
$('btnMD').onclick=()=>{
  let t='# 第五章 人格水平评估 · 知识闪卡\n\n> 依据：徐钧《自体心理学入门》pp.085–102 修复稿。纯知识卡，重点为三层评估、三类人格水平与人格水平／症状之辨。\n\n';
  CATS.forEach(c=>{
    const list=CARDS.filter(x=>x.cat===c.k);if(!list.length)return;
    t+='## '+c.label+'（'+list.length+' 张）\n\n';
    list.forEach(x=>{t+='**'+x.id+'｜'+(x.intro?'【案例情节】':'')+x.q+'**\n\n';if(x.ctx)t+='> 语境：'+x.ctx+'\n\n';x.a.forEach(a=>t+='- '+a+'\n');t+='\n> 关键词：'+x.k.join('、')+'　｜　所在小节：'+x.src+(x.intro&&x.follow?'\n> 后续：'+x.follow:'')+'\n\n';});
  });
  download('第5章_知识闪卡.md',t,'text/markdown;charset=utf-8');
};
$('btnPrint').onclick=()=>{
  let h='<h2>徐钧《自体心理学入门》· 第五章知识闪卡</h2><div class="meta">依据 pp.085–102 修复稿 ｜ 共 '+CARDS.length+' 张 ｜ 打印日期：'+new Date().toLocaleDateString('zh-CN')+'</div>';
  CATS.forEach(c=>{
    const list=CARDS.filter(x=>x.cat===c.k);if(!list.length)return;
    h+='<h3>'+c.label+'（'+list.length+' 张）</h3>';
    list.forEach(x=>{h+='<div class="item"><div class="qq">'+x.id+'　'+(x.intro?'【案例情节】':'')+esc(x.q)+'</div>'+(x.ctx?'<div class="ss">语境：'+esc(x.ctx)+'</div>':'')+'<div class="aa">'+x.a.map(esc).join('　／　')+'</div><div class="ss">所在小节：'+esc(x.src)+'</div></div>';});
  });
  $('printArea').innerHTML=h;
  setTimeout(()=>window.print(),60);
};

/* ============ 事件 ============ */
['fCat','fOrder'].forEach(id=>$(id).onchange=()=>{saveSettings();buildDeck();});
['fWeak','fRecite','fReverse'].forEach(id=>$(id).onchange=()=>{saveSettings();buildDeck();});
$('fReset').onclick=()=>{if(confirm('清除本章闪卡的全部自评记录？\n（会同步到闪卡空间；不影响其它章节）')){saved.status={};persist();buildDeck();}};
$('flip').onclick=e=>{e.stopPropagation();flip();};
$('prev').onclick=()=>go(-1);
$('next').onclick=()=>go(1);
document.querySelectorAll('.rate').forEach(b=>b.onclick=()=>rate(+b.dataset.r));
$('card').onclick=e=>{if(e.target.id==='mine')return;flip();};
document.addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='TEXTAREA'||tag==='INPUT'||tag==='SELECT')return;
  const k=e.key.toLowerCase();
  if(e.code==='Space'||k===' '){e.preventDefault();flip();}
  else if(k==='arrowleft'){e.preventDefault();go(-1);}
  else if(k==='arrowright'){e.preventDefault();go(1);}
  else if(k==='1'||k==='2'||k==='3')rate(+k);
  else if(k==='r'){$('fOrder').value='rand';saveSettings();buildDeck();}
  else if(k==='m'){$('fRecite').checked=! $('fRecite').checked;saveSettings();buildDeck();}
  else if(k==='f'){$('fWeak').checked=! $('fWeak').checked;saveSettings();buildDeck();}
});

buildDeck();

    tip.textContent='\u95ea\u5361\u7a7a\u95f4\u6709\u7f16\u8f91\u53d8\u52a8\uff0c\u70b9\u6b64\u5237\u65b0\u540c\u6b65';
